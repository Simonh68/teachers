<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>חומרי הוראה — English for Noar</title>
<meta name="description" content="חומרי הוראה מסודרים לפי כיתה">
<style>
:root{--ink:#101716;--paper:#f6f6f3;--lime:#dfff5b;--olive:#5d7800;--muted:#66706c;--line:#dfe2dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}header{background:var(--ink);color:#fff;border-bottom:1px solid #27302e}.bar{max-width:1380px;margin:auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:12px}.brand h1{margin:0;font-size:19px}.brand p{margin:3px 0 0;color:#ffffff77;font-size:12px;font-weight:700}.private{border:1px solid #ffffff2a;border-radius:999px;padding:7px 12px;color:#ffffff99;font-size:12px;font-weight:700}.shell{max-width:1380px;margin:auto;padding:28px;display:grid;grid-template-columns:170px 1fr;gap:28px}.aside-title{font-size:12px;font-weight:900;color:#747d79;margin:0 4px 10px}.grades{display:grid;gap:8px}.grade{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:48px;padding:0 16px;text-align:right;font-weight:900;cursor:pointer}.grade.active{background:var(--ink);color:#fff;border-color:var(--ink)}.headline{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}.eyebrow{color:var(--olive);font-size:14px;font-weight:900}.headline h2{font-size:clamp(36px,5vw,56px);letter-spacing:-2px;margin:5px 0 0}.headline p{color:#747d79;font-size:14px;font-weight:700}.section{margin:0 0 32px}.section-title{display:flex;gap:12px;align-items:baseline;margin-bottom:12px}.num{color:#91ad1e;font-size:12px;font-weight:900}.section h3{margin:0;font-size:21px}.section-title p{margin:3px 0 0;color:#747d79;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{min-height:198px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;text-decoration:none;color:inherit;display:flex;flex-direction:column;box-shadow:0 8px 30px #10171609;transition:.18s}.card:hover{transform:translateY(-4px);border-color:#91ad1e;box-shadow:0 16px 38px #10171617}.meta{display:flex;justify-content:space-between;align-items:center}.kind{background:#eff5d8;color:var(--olive);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900}.year{font-size:11px;color:#929a96;font-weight:800}.card h4{font-size:19px;margin:20px 0 8px}.card p{font-size:14px;line-height:1.65;color:#5f6965;margin:0;flex:1}.open{border-top:1px solid #e9ebe6;padding-top:14px;margin-top:18px;font-size:12px;font-weight:900;display:flex;justify-content:space-between}.empty{display:none;min-height:420px;background:#fff;border:1px dashed #cfd3cd;border-radius:18px;place-items:center;text-align:center}.empty h2{margin:8px 0}.empty p{color:#747d79;font-weight:800}.content.hidden{display:none}.empty.visible{display:grid}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.shell{grid-template-columns:1fr;padding:18px}.grades{grid-template-columns:repeat(3,1fr)}.grade{text-align:center;padding:0 8px}.headline{display:block}.headline p{margin-top:12px}.cards{grid-template-columns:1fr}.bar{padding:14px 18px}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><span class="logo">EN</span><div><h1>חומרי הוראה</h1><p>English for Noar · צוות</p></div></div><span class="private">מאגר צוות</span></div></header>
<main class="shell"><aside><p class="aside-title">בחרו כיתה</p><nav class="grades" aria-label="בחירת כיתה">
<button class="grade active" data-grade="ז׳">כיתה ז׳</button><button class="grade" data-grade="ח׳">כיתה ח׳</button><button class="grade" data-grade="ט׳">כיתה ט׳</button><button class="grade" data-grade="י׳">כיתה י׳</button><button class="grade" data-grade="י״א">כיתה י״א</button><button class="grade" data-grade="י״ב">כיתה י״ב</button>
</nav></aside><div>
<div id="grade7" class="content"><div class="headline"><div><div class="eyebrow">כיתה ז׳</div><h2>חומרים לשבוע הראשון</h2></div><p>חומרים קיימים מהדרייב · מסודרים לפי שימוש</p></div>
<div id="groups"></div></div><div id="empty" class="empty"><div><p id="emptyGrade">כיתה ח׳</p><h2>טרם נוספו חומרים</h2></div></div>
</div></main>
<script>
const groups=[
{title:"פתיחת השבוע",sub:"כניסה לנושא והצגת שכבת הגיל",items:[
["תמונה","בגיל 12","תשפ״ד","https://drive.google.com/file/d/1Ik9X0R8Ztxjm3ctrmG_K5PDv7bG7wCjV/view","תמונת פתיחה לדיון קצר על גיל 12 והמעבר לכיתה ז׳."],
["תמונה","גיל 12","תשפ״ד","https://drive.google.com/file/d/1ImXHxwOpHG_C-ZAutgRn_hdX-SbC6aoN/view","תמונה חלופית לפתיחה או להשוואה מול התמונה הראשונה."],
["מסמך","מחברת כיתה ז׳","תשפ״ו","https://docs.google.com/document/d/11S_FzpnIyXJebdkhF9uVcrjYH1CxV1kQ0-WMa18JoL8/edit","מקור מסודר לחומרי הבסיס: To Be, כינויי גוף ומילות שאלה."]]},
{title:"חומרי יסוד",sub:"חומרים מוכנים להצגה ולעבודה",items:[
["מצגת","Vocabulary Practice · Part 7","תשפ״ו","https://docs.google.com/presentation/d/1OviGZF4hfnEMD-bPTVF9WRomH3i1qJEW/edit","מילה, משפט בעברית ולאחריו המשפט באנגלית. מתאים להצגה ולבדיקת הבנה."],
["מצגת","Vocabulary Builder · Part 7","תשפ״ו","https://docs.google.com/presentation/d/1d1Wu_QjbHdz2PZh_-DfR1Fna_lc5_qdN/edit","חזרה נקייה על מילים וחלקי דיבר, להגייה ולשליפה מהירה."],
["מסמך","מחברת כיתה ז׳ — מאגר קודם","תשפ״א","https://docs.google.com/document/d/1X0-htrN4dZsn1s0AVnv7J592jn6pHkYn8AiGRcdM0Wg/edit","מאגר ותיק של הסברים, דוגמאות וקישורים לבחירת תרגול נוסף."]]},
{title:"תרגול דיגיטלי",sub:"פתיחה ישירה על הלוח או במכשירי תלמידים",items:[
["אתר","Word Forge","פעיל","https://englishfornoar.co.il/word-forge/","תרגול בניית מילים וקריאה ברמות הבסיס."],
["אתר","English Basic","פעיל","https://simonh68.github.io/English-Basic/","כרטיסיות ותרגול יסודות באנגלית למיפוי ולחיזוק."],
["אתר","Band II · Core I","פעיל","https://simonh68.github.io/E-Vocab-Band-II/groups/group-01.html","תרגול אוצר מילים לחטיבת הביניים, החל מקבוצת Core I הראשונה."]]},
{title:"מאגר המשך",sub:"חומרים מוכנים לשילוב לפי הקצב",items:[
["מצגת","Vocabulary Practice · 7A2","תשפ״ו","https://docs.google.com/presentation/d/1k1825ygVk-pn9S6TWE2jo5Qw3S_MPHpo/edit","גרסת המשך של תרגול אוצר המילים עם משפטי הקשר דו־לשוניים."],
["מצגת","Vocabulary Practice · 77","תשפ״ו","https://docs.google.com/presentation/d/1IvIaScMq0IXYT52cFJZGYYJdhBnrnB-F/edit","מצגת אוצר מילים מורחבת לקצב מתקדם."],
["דף עבודה","Vocabulary Matching","תשפ״ו","https://docs.google.com/document/d/1lcUYxKLTszVDTNDeGHTR8-KSstCNGTo5/edit","התאמת מילים להגדרות לעבודה עצמאית או לבדיקה קצרה."],
["דף עבודה","Vocabulary Matching · גרסאות","תשפ״ו","https://docs.google.com/document/d/1T6ZtWO693EDACbNLZTIU9qo8qxsTzPbk/edit","אותה משימת התאמה בכמה סדרים לחלוקה מקבילה בכיתה."]]}];
document.querySelector("#groups").innerHTML=groups.map((g,i)=>`<section class="section"><div class="section-title"><span class="num">0${i+1}</span><div><h3>${g.title}</h3><p>${g.sub}</p></div></div><div class="cards">${g.items.map(x=>`<a class="card" href="${x[3]}" target="_blank" rel="noreferrer"><div class="meta"><span class="kind">${x[0]}</span><span class="year">${x[2]}</span></div><h4>${x[1]}</h4><p>${x[4]}</p><div class="open"><span>פתיחת החומר</span><span>↗</span></div></a>`).join("")}</div></section>`).join("");
document.querySelectorAll(".grade").forEach(b=>b.onclick=()=>{document.querySelectorAll(".grade").forEach(x=>x.classList.remove("active"));b.classList.add("active");const seven=b.dataset.grade==="ז׳";document.querySelector("#grade7").classList.toggle("hidden",!seven);document.querySelector("#empty").classList.toggle("visible",!seven);document.querySelector("#emptyGrade").textContent="כיתה "+b.dataset.grade});
</script>
</body></html>
