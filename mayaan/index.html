<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8efe8"><title>מעיין · קוראים באנגלית</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#2d2530;background:#fffaf7}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fff8f2,#f6eef9)}
main{max-width:900px;margin:auto;padding:32px 18px 50px}.hero{text-align:center;padding:26px 12px 20px}
h1{font-size:clamp(42px,10vw,72px);margin:0;color:#7f4f67}.subtitle{font-size:20px;margin:8px 0 0;color:#6b5a66}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:28px}
.card{display:block;text-decoration:none;color:inherit;background:white;border-radius:24px;padding:24px;min-height:190px;box-shadow:0 8px 30px #6e526020;border:2px solid #eadde5;transition:.15s}
.card:hover,.card:focus{transform:translateY(-3px);box-shadow:0 12px 34px #6e52602e;outline:none;border-color:#c984a6}
.icon{font-size:42px}.card h2{font-size:28px;margin:12px 0 8px}.card p{margin:0;color:#715f6c;line-height:1.5}
.note{text-align:center;margin-top:28px;color:#786a73;font-size:14px}
</style></head>
<body><main>
<section class="hero"><div style="font-size:44px">🌸</div><h1>מעיין</h1><p class="subtitle">קוראים אנגלית יחד</p></section>
<section class="cards" aria-label="מצגות קריאה">
<a class="card" href="./lee-birron/"><div class="icon">🎤</div><h2>לי בירון</h2><p>כ־120 מילים · Read Along</p></a>

<a class="card" href="./mekif-milano/"><div class="icon">🎬</div><h2>מקיף מילאנו</h2><p>כ־120 מילים · Read Along</p></a>
</section><p class="note">דף הקריאה של מעיין</p>
</main></body></html>
