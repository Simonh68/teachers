<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seminar</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1523;color:#f2f5fc;font-family:Arial,sans-serif;direction:ltr}main{height:100dvh;display:flex;flex-direction:column;padding:3vh 5vw 20vh}header{display:flex;justify-content:space-between;color:#9baecc;font-size:14px}h1{font-size:clamp(30px,4vw,65px);margin:4vh 0}#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:1vh 0 2vh}.chat{width:min(1080px,100%);display:flex;flex-direction:column;gap:30px}.user{align-self:flex-end;background:#27374d;border-radius:23px;padding:23px;max-width:84%;font-size:clamp(19px,2.2vw,31px);line-height:1.4;text-align:left}.ai{font-size:clamp(20px,2.2vw,32px);line-height:1.45;display:flex;align-items:flex-start;gap:17px;text-align:left}.symbol{background:#167a57;border-radius:50%;padding:7px}.think{color:#a6b3c6;font-size:23px}.think:after{content:"...";animation:fade 1s infinite}@keyframes fade{50%{opacity:.15}}.panel{background:#17273e;border:1px solid #537191;border-radius:22px;padding:35px;max-width:1050px;width:100%;text-align:center;font-size:clamp(22px,2.6vw,40px)}.panels{width:100%;max-width:1080px;display:grid;grid-template-columns:1fr 1fr;gap:25px}.tile{background:#1c2c42;border:1px solid #547397;border-radius:18px;padding:30px;text-align:center;font-size:27px}.tile small{display:block;font-size:16px;color:#9db8d4;margin-bottom:25px}.buttons{display:flex;justify-content:center;gap:16px;margin-top:35px;flex-wrap:wrap}.buttons button{border:1px solid #7691ad;background:#2a3a52;color:white;border-radius:10px;padding:12px 20px;font-size:20px;cursor:pointer}.buttons button.active{background:#2563eb}.subs{position:fixed;bottom:clamp(24px,5vh,70px);left:50%;transform:translateX(-50%);width:min(88vw,1050px);text-align:left;font-size:clamp(19px,1.8vw,29px);line-height:1.12;color:#fff;text-shadow:0 2px 7px #000,0 0 12px #000;opacity:0;pointer-events:none;z-index:5}.subs.on{opacity:1}.subs div{margin:0;white-space:nowrap;overflow:hidden;text-overflow:clip}.nav{position:fixed;top:4px;right:7px;opacity:.15}.nav:hover{opacity:1}.nav button{background:#22334b;color:white;border:1px solid #718398;border-radius:5px;padding:9px}.hand{display:inline-block;font-size:48px;animation:tap 2s 3}@keyframes tap{0%,100%{opacity:0;transform:translate(30px,20px)}45%{opacity:1;transform:translate(0,0)}}a{color:#9ac8ff}@media(max-width:700px){.panels{grid-template-columns:1fr}.user,.ai{font-size:20px}.subs{font-size:clamp(18px,4.3vw,25px);width:88vw;bottom:7vh}}.phrase{display:inline-block;cursor:pointer;color:#fef08a;border-bottom:2px dashed #eab308;padding:0 2px}.phrase.swapping{animation:phraseSwap .4s ease}@keyframes phraseSwap{0%{opacity:.25;transform:translateY(-4px)}100%{opacity:1;transform:translateY(0)}}#demoHand{position:absolute;z-index:3;pointer-events:none;opacity:0;font-size:48px;transform:translate(-20px,-14px) rotate(-22deg)}#demoHand.tapOnce{animation:touch 1.5s ease}@keyframes touch{0%{opacity:0;transform:translate(20px,12px) rotate(-22deg)}20%{opacity:1}45%{opacity:1;transform:translate(-20px,-14px) rotate(-22deg)}72%{opacity:1;transform:translate(-20px,-14px) rotate(-22deg)}100%{opacity:0;transform:translate(20px,12px) rotate(-22deg)}}.chatgptMark{display:flex;justify-content:center;align-items:center;animation:logoEntrance 1.5s ease both}@keyframes logoEntrance{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}} </style></head><body><main><header>SEMINAR · AI FOR ENGLISH TEACHERS <span id="counter"></span></header><h1 id="title"></h1><div id="stage"></div></main><div id="subtitle" class="subs"></div><div class="nav"><button onclick="go(-1)">◀</button><button onclick="go(1)">▶</button><button id="voiceSwitch" onclick="toggleVoice()" aria-label="Turn narration off" title="Voice on">🔊</button></div><script>const turns=[["I want a little app to help students write better sentences. Don't build it yet. What do you think I mean?","You want to show a sentence in a few different ways. Should students type their own, or just tap a button?"],["Before we go on, tell me what you think I want. Keep it simple.","You want a small app. Students tap a button to see a better way to say the same idea. No typing yet. Did I get that right?"],["Yes, almost. I want three levels: Basic, Better, and Advanced. Tell me the plan again.","Got it. One idea, three versions, three buttons. We start small and make sure each version means the same thing."],["What else could we add?","Maybe a login, scores, AI feedback, and a teacher page."],["Whoa, that's a lot! Let's keep it easy. One sentence. Three buttons.","Sounds good. Let's start small."],["What goes in? What comes out? What will it look like?","We put in three sentences. The student taps a button and sees one of them. That's it."],["Can you show me two pictures of the screen? No code yet.","mock"],["Let me check. Tell me what the screen will look like before you make it.","One big sentence at the top, three buttons below it. Students tap one button and the sentence changes. Nothing else."],["I like A. Make the words bigger. Move the buttons down. Make the chosen button blue.","revised"],["Tell me what you changed. Is this what I asked for?","Yes. The sentence is bigger. The buttons are lower and in one row. The selected button is blue. Is this better now?"],["Can we really make this? What might go wrong?","Yes, this is small enough. We should check the wording and test it on a phone."],["Can I send it on WhatsApp as a file? Will it work without the internet?","Yes. Some students may need to save the file first, then open it in a browser."],["Great. Write one clear prompt for a new chat. Keep it short.","Build one HTML file called Sentence Transformer. Show one sentence and three buttons: Basic, Better, Advanced. Make the words big. Make it work offline on phones. No login. Check the buttons."],["Here's the prompt. Please make the app.","The first version is ready. Let's try it out."]],scenes=[{"kind":"start","caption":["I teach English and have a technical background.","I will show you several applications I created for my students."]},{"kind":"tools","caption":["Here are some applications I created for my students.","Animated essays, class materials and Bagrut traps."]},{"kind":"animated","caption":["Click the sentence to change the wording.","The full essay is available on my website."]},{"kind":"website","caption":["My site has materials for each English class.","Now let's create a small app together."]},{"kind":"login","caption":["Now I open ChatGPT to plan the application.","First, I will explain my idea in simple English."]},{"kind":"question","i":0,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":0,"caption":[]},{"kind":"question","i":1,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":1,"caption":[]},{"kind":"question","i":2,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":2,"caption":[]},{"kind":"question","i":3,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":3,"caption":[]},{"kind":"question","i":4,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":4,"caption":[]},{"kind":"question","i":5,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":5,"caption":[]},{"kind":"question","i":6,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":6,"caption":[]},{"kind":"question","i":7,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":7,"caption":[]},{"kind":"question","i":8,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":8,"caption":[]},{"kind":"question","i":9,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":9,"caption":[]},{"kind":"app","caption":["Now we can test the small application.","This is only the first version."]},{"kind":"share","caption":["Send the HTML file as a WhatsApp document.","Some students must download it, then open in Chrome."]},{"kind":"end","caption":["You can use Hebrew instead of English prompts.","Think big, start small, and improve slowly."]}];let page=0,timer=null,ctimer=null,level=0,word=0;const originalScenes=scenes.slice();
const stories={
start:[
["I teach English, and I like trying new things.","I also have a background in tech."],
["AI helps me a lot, at school and at home.","I use a paid plan, and it's been worth it."],
["I want to show you some things I made.","Then we'll try making a small app together."],
["Nothing fancy to start with.","We'll take it one step at a time."]
],
tools:[
["Here are three things I've made with AI.","I'll keep this part very short."],
["First, my animated essays.","Next, my class website."],
["And finally, questions with tricky answers.","They use ideas from PISA and past Bagrut exams."],
["You don't need to build all this today.","I just want to show what's possible."]
],
animated:[
["Watch this sentence for a moment.","The hand points to one part."],
["That part changes, but the rest stays put.","Then the hand moves to a new part."],
["Students can also tap the words themselves.","It's a simple idea, but it's fun to use."],
["Want to see the full essay?","There's a link right here."]
],
website:[
["Here's my website for my English classes.","Each class has its own page."],
["I keep lessons and activities in one place.","That makes them easy to find."],
["You can build a little at a time.","You don't need to make it all in one day."],
["Now let's go back to the start.","How do you build a tiny app like this?"]
],
login:[
["Let's open ChatGPT.","We start with a new chat."],
["I won't ask it to build anything yet.","First, I'll just talk through my idea."],
["You can do this in English or Hebrew.","Use whatever feels easy to you."],
["The trick is not fancy words.","The trick is being clear."]
],
question:[
["See how short my message is?","I'm just saying what I want."],
["I don't need to sound like a programmer.","I can talk the way I normally talk."],
["I want AI to think with me first.","So I don't waste time fixing a big mistake."],
["Once I'm happy with the plan, we move on.","There's no need to rush."]
],
answer:[
["Now let's read what AI says.","Does it sound like what I asked for?"],
["If not, I can say no and change it.","It's a chat, not a test."],
["I don't have to take every idea it gives me.","I can keep the good parts and drop the rest."],
["When the plan looks right, we go ahead.","One small step at a time."]
],
app:[
["Here it is. Let's press the first button.","Now let's try the next one."],
["The words change as we click.","That's the whole first version."],
["It isn't a huge app, and that's good.","It's easy to test and easy to fix."],
["Later, we can add more sentences.","We can keep building when we want to."]
],
share:[
["Now we need to send the file to students.","We can send it as a WhatsApp document."],
["Some phones will open it right away.","Others may need one extra step."],
["Save the file, then open it in Chrome.","Let's check this on a real phone first."],
["No website is needed for this small app.","But phone support may vary."]
],
end:[
["So here's my main point.","Start small and talk to AI like a person."],
["Ask it what it understood.","Ask to see the screen before it builds."],
["If the job looks too big, make it smaller.","Then test what you get."],
["You can say all of this in Hebrew, too.","The goal is the same: make something useful."]
]
};
const expanded=[];
originalScenes.forEach((s,i)=>{
const base={...s,baseIndex:i};
const segments=stories[s.kind]||stories.answer;
segments.forEach(caption=>expanded.push({...base,caption}));
});
scenes.splice(0,scenes.length,...expanded);
let voiceEnabled=true;
function toggleVoice(){voiceEnabled=!voiceEnabled;const b=el('voiceSwitch');b.textContent=voiceEnabled?'🔊':'🔇';b.title=voiceEnabled?'Voice on':'Voice off';b.setAttribute('aria-label',voiceEnabled?'Turn narration off':'Turn narration on');if(!voiceEnabled&&'speechSynthesis'in window)window.speechSynthesis.cancel()}
function sayCaption(lines){if(!voiceEnabled||!('speechSynthesis'in window)||!lines.length)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lines.join(' '));u.lang='en-US';u.rate=.91;u.pitch=.85;const voices=window.speechSynthesis.getVoices();const male=voices.find(v=>/male|david|guy|daniel|aaron|mark|george|ryan|thomas|james|christopher/i.test(v.name)&&v.lang.toLowerCase().startsWith('en'));if(!male){console.info('No English male voice is installed on this device.');return;}u.voice=male;window.speechSynthesis.speak(u)}
const sentences=["Students use smartphones.","Many students use smartphones every day.","Students frequently use smartphones in their daily lives."];const parts=[["I believe","I think","In my opinion"],["volunteering","helping others","volunteer work"],["helps young people.","benefits teenagers.","makes a difference for students."]];let partIndexes=[0,0,0],demoPart=0,demoTimer=null;function partHTML(){return parts.map((group,i)=>'<span class="phrase" id="part'+i+'" onclick="rotatePart('+i+')" style="position:relative">'+group[partIndexes[i]]+'</span>').join(' ')}function rotatePart(i){partIndexes[i]=(partIndexes[i]+1)%parts[i].length;const e=el('part'+i);if(!e)return;e.classList.remove('swapping');void e.offsetWidth;e.textContent=parts[i][partIndexes[i]];e.classList.add('swapping')}function touchPart(i){const target=el('part'+i),hand=el('demoHand');if(!target||!hand)return;const parent=el('demoArea').getBoundingClientRect(),r=target.getBoundingClientRect();hand.style.left=(r.left-parent.left+r.width*.48)+'px';hand.style.top=(r.top-parent.top+r.height*.70)+'px';hand.classList.remove('tapOnce');void hand.offsetWidth;hand.classList.add('tapOnce');setTimeout(()=>rotatePart(i),650)}function runDemo(){clearInterval(demoTimer);demoPart=0;setTimeout(()=>{if(scenes[page].kind==='animated')touchPart(0)},750);demoTimer=setInterval(()=>{if(scenes[page].kind!=='animated'){clearInterval(demoTimer);return}demoPart=(demoPart+1)%3;touchPart(demoPart)},4500)}const el=id=>document.getElementById(id);const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;');function buttons(){return '<div class="buttons">'+['Basic','Better','Advanced'].map((v,i)=>'<button class="'+(i===level?'active':'')+'" onclick="select('+i+')">'+v+'</button>').join('')+'</div>'}function select(n){level=n;el('sentence').textContent=sentences[n];document.querySelectorAll('.buttons button').forEach((b,i)=>b.classList.toggle('active',i===n))}function change(){rotatePart(0)}function mock(revised){return revised?'<div class="panel"><div style="color:#9ac8ff;font-size:17px">REVISED MOCKUP</div><p>Students use smartphones.</p>'+['Basic','Better','Advanced'].map((s,i)=>'<button style="margin:8px;background:'+(i===0?'#2563eb':'#33465e')+';color:white;padding:15px 22px;border:0;border-radius:8px">'+s+'</button>').join('')+'</div>':'<div class="panels"><div class="tile"><small>OPTION A</small>Students use smartphones.<div class="buttons"><button>Basic</button><button>Better</button><button>Advanced</button></div></div><div class="tile"><small>OPTION B</small>Basic sentence<hr>Better sentence<hr>Advanced sentence</div></div>'}function render(keepStage=false){clearInterval(timer);clearTimeout(ctimer);if('speechSynthesis'in window)window.speechSynthesis.cancel();clearInterval(demoTimer);const s=scenes[page],stage=el('stage');el('subtitle').classList.remove('on');el('subtitle').innerHTML='';el('counter').textContent=(page+1)+' / '+scenes.length;el('title').textContent=({start:'From Idea to App',tools:'Three AI Projects',animated:'Animated Essays',website:'Class Website',question:'Planning Chat',answer:'AI Response',app:'Sentence Transformer',share:'Send the HTML File',end:'Start Small. Build Step by Step.',login:'Opening ChatGPT'})[s.kind];if(keepStage){}else if(s.kind==='question'){stage.innerHTML='<div class="chat"><div class="user" id="typing"></div><div class="think" id="thinking" style="visibility:hidden">Thinking</div></div>';let n=0,txt=turns[s.i][0];timer=setInterval(()=>{n+=3;el('typing').textContent=txt.slice(0,n);if(n>=txt.length){clearInterval(timer);el('thinking').style.visibility='visible'}},22)}else if(s.kind==='answer'){const a=turns[s.i][1];stage.innerHTML=(a==='mock'||a==='revised')?mock(a==='revised'):'<div class="chat"><div class="user">'+esc(turns[s.i][0])+'</div><div class="ai"><span class="symbol">✳</span><span>'+esc(a)+'</span></div></div>'}else if(s.kind==='animated'){stage.innerHTML='<div class="panel"><div id="demoArea" style="position:relative;padding:65px 12px 30px"><p style="font-size:clamp(27px,3vw,48px);line-height:1.6">'+partHTML()+'</p><span id="demoHand" aria-hidden="true">👆</span></div><p style="font-size:20px"><a href="https://simonh68.github.io/teachers/grade11/school-volunteering-essay/#slide-23" target="_blank">Open the original animated essay</a></p></div>';runDemo()}else if(s.kind==='login'){stage.innerHTML='<div class="panel" style="background:#101826;border-color:#30445c;max-width:800px"><div class="chatgptMark" aria-label="ChatGPT logo"><svg viewBox="0 0 100 100" width="112" height="112" role="img" aria-label="ChatGPT"><g fill="none" stroke="#f8fafc" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"><path d="M49 16C62 5 84 14 84 31c15 7 18 26 5 37 2 18-18 30-33 20-15 10-34 0-34-17C7 65 7 44 22 37c0-18 16-29 27-21z"/><path d="M50 16v25l-24 14m58-24L61 46l6 28m22-6L63 56 38 72m18 16V63L31 48M22 37l24 12 25-15M22 71l22-12 26 10"/></g></svg></div><div style="margin:25px 0 12px;font-size:45px">ChatGPT</div><div id="loginStatus" style="font-size:24px;color:#9db8d4">Opening ChatGPT<span class="dots"></span></div></div>';setTimeout(()=>{const x=el('loginStatus');if(x)x.textContent='New chat · Ready'},1800)}else if(s.kind==='website')stage.innerHTML='<div class="panel"><a href="https://simonh68.github.io/teachers/" target="_blank">Open English classes</a></div>';else if(s.kind==='app')stage.innerHTML='<div class="panel"><div id="sentence">'+sentences[level]+'</div>'+buttons()+'</div>';else if(s.kind==='share')stage.innerHTML='<div class="panels"><div class="tile">STEP 1<br>📎 WhatsApp document<br>⬇ Download HTML</div><div class="tile">STEP 2<br>📂 Downloads<br>Open with Chrome</div></div>';else if(s.kind==='tools')stage.innerHTML='<div class="panel">Animated Essays<br>English Class Website<br>Bagrut Trap Killer<br><small style="font-size:20px">Based on PISA and past Bagrut exams</small></div>';else stage.innerHTML='<div class="panel">Think → Reflect → Sketch → Approve → Build → Share</div>';ctimer=setTimeout(()=>{const lines=(s.caption||[]).slice(0,2);el('subtitle').innerHTML=lines.map(x=>'<div>'+esc(x)+'</div>').join('');el('subtitle').classList.add('on');sayCaption(lines)},4000)}function go(n){const old=scenes[page];page=Math.max(0,Math.min(scenes.length-1,page+n));render(Boolean(old&&scenes[page].baseIndex===old.baseIndex))}let swipeX=0,swipeY=0,swipeStarted=0;
document.addEventListener('touchstart',e=>{
 if(e.touches.length!==1)return;
 swipeX=e.touches[0].clientX;swipeY=e.touches[0].clientY;swipeStarted=Date.now();
},{passive:true});
document.addEventListener('touchend',e=>{
 if(!swipeStarted||e.changedTouches.length!==1)return;
 const dx=e.changedTouches[0].clientX-swipeX,dy=e.changedTouches[0].clientY-swipeY;
 const duration=Date.now()-swipeStarted;swipeStarted=0;
 if(duration>1200||Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.4)return;
 go(dx<0?1:-1);
},{passive:true});
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}});render();</script></body></html>
