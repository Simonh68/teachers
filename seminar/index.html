<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seminar</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1523;color:#f2f5fc;font-family:Arial,sans-serif;direction:ltr}main{height:100dvh;display:flex;flex-direction:column;padding:4vh 5vw 8vh}header{display:flex;justify-content:space-between;color:#9baecc;font-size:14px}h1{font-size:clamp(30px,4vw,65px);margin:4vh 0}#stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto}.chat{width:min(1080px,100%);display:flex;flex-direction:column;gap:30px}.user{align-self:flex-end;background:#27374d;border-radius:23px;padding:23px;max-width:84%;font-size:clamp(19px,2.2vw,31px);line-height:1.4;text-align:left}.ai{font-size:clamp(20px,2.2vw,32px);line-height:1.45;display:flex;align-items:flex-start;gap:17px;text-align:left}.symbol{background:#167a57;border-radius:50%;padding:7px}.think{color:#a6b3c6;font-size:23px}.think:after{content:"...";animation:fade 1s infinite}@keyframes fade{50%{opacity:.15}}.panel{background:#17273e;border:1px solid #537191;border-radius:22px;padding:35px;max-width:1050px;width:100%;text-align:center;font-size:clamp(22px,2.6vw,40px)}.panels{width:100%;max-width:1080px;display:grid;grid-template-columns:1fr 1fr;gap:25px}.tile{background:#1c2c42;border:1px solid #547397;border-radius:18px;padding:30px;text-align:center;font-size:27px}.tile small{display:block;font-size:16px;color:#9db8d4;margin-bottom:25px}.buttons{display:flex;justify-content:center;gap:16px;margin-top:35px;flex-wrap:wrap}.buttons button{border:1px solid #7691ad;background:#2a3a52;color:white;border-radius:10px;padding:12px 20px;font-size:20px;cursor:pointer}.buttons button.active{background:#2563eb}.subs{position:fixed;bottom:5px;left:2%;text-align:left;font-size:clamp(13px,1.2vw,20px);line-height:1.07;white-space:nowrap;color:#fff;text-shadow:0 2px 5px black;opacity:0}.subs.on{opacity:1}.subs div{margin:0}.nav{position:fixed;top:4px;right:7px;opacity:.15}.nav:hover{opacity:1}.nav button{background:#22334b;color:white;border:1px solid #718398;border-radius:5px;padding:9px}.hand{display:inline-block;font-size:48px;animation:tap 2s 3}@keyframes tap{0%,100%{opacity:0;transform:translate(30px,20px)}45%{opacity:1;transform:translate(0,0)}}a{color:#9ac8ff}@media(max-width:700px){.panels{grid-template-columns:1fr}.user,.ai{font-size:20px}.subs{font-size:12px}}</style></head><body><main><header>SEMINAR · AI FOR ENGLISH TEACHERS <span id="counter"></span></header><h1 id="title"></h1><div id="stage"></div></main><div id="subtitle" class="subs"></div><div class="nav"><button onclick="go(-1)">◀</button><button onclick="go(1)">▶</button></div><script>const turns=[["I want a small app for better English sentences. Don't code yet. What did you understand?","Students will see three versions of one sentence."],["What features do you suggest?","We could add accounts, an AI tutor, progress reports, and a database."],["That's too much. I'm not building another Google! One sentence and three buttons.","Great. Let's start with Basic, Better and Advanced."],["What are the input, output and interface?","Input: three sentences. Output: selected sentence. Interface: large text and three buttons."],["Show me two visual mockups. Don't code yet.","mock"],["I like option A. Bigger sentence, buttons at the bottom, selected button in blue.","revised"],["Is this realistic? What could go wrong?","Yes. It is a small project. Test buttons, meaning and phone display."],["I will send the HTML file on WhatsApp. Will it work offline?","Yes. Some phones need to download the HTML file and then open it with a browser."],["Write a full building prompt for a NEW chat. Keep it simple.","Build a single-file HTML Sentence Transformer, three prepared sentences and buttons, no external services, offline, mobile-friendly. Test all buttons."],["Build the app using this prompt.","Your first version is ready for testing."]],scenes=[{"kind":"start","caption":["I teach English and have a technical background.","Today I'll show how a small app begins."]},{"kind":"tools","caption":["These are three tools I built with AI.","Animated essays, class materials and Bagrut traps."]},{"kind":"animated","caption":["Click the sentence to change the wording.","The full essay is available on my website."]},{"kind":"website","caption":["My site has materials for each English class.","Now let's create a small app together."]},{"kind":"question","i":0,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":0,"caption":[]},{"kind":"question","i":1,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":1,"caption":[]},{"kind":"question","i":2,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":2,"caption":[]},{"kind":"question","i":3,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":3,"caption":[]},{"kind":"question","i":4,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":4,"caption":[]},{"kind":"question","i":5,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":5,"caption":[]},{"kind":"question","i":6,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":6,"caption":[]},{"kind":"question","i":7,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":7,"caption":[]},{"kind":"question","i":8,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":8,"caption":[]},{"kind":"question","i":9,"caption":["First, we plan before we build.","I use short, simple prompts."]},{"kind":"answer","i":9,"caption":[]},{"kind":"app","caption":["Now we can test the small application.","This is only the first version."]},{"kind":"share","caption":["Send the HTML file as a WhatsApp document.","Some students must download it, then open in Chrome."]},{"kind":"end","caption":["You can use Hebrew instead of English prompts.","Think big, start small, and improve slowly."]}];let page=0,timer=null,ctimer=null,level=0,word=0;const sentences=["Students use smartphones.","Many students use smartphones every day.","Students frequently use smartphones in their daily lives."];const alternatives=["I believe volunteering helps young people.","I think volunteer work is useful for teenagers.","In my view, students benefit from volunteering."];const el=id=>document.getElementById(id);const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;');function buttons(){return '<div class="buttons">'+['Basic','Better','Advanced'].map((v,i)=>'<button class="'+(i===level?'active':'')+'" onclick="select('+i+')">'+v+'</button>').join('')+'</div>'}function select(n){level=n;el('sentence').textContent=sentences[n];document.querySelectorAll('.buttons button').forEach((b,i)=>b.classList.toggle('active',i===n))}function change(){word=(word+1)%3;el('word').textContent=alternatives[word]}function mock(revised){return revised?'<div class="panel"><div style="color:#9ac8ff;font-size:17px">REVISED MOCKUP</div><p>Students use smartphones.</p>'+['Basic','Better','Advanced'].map((s,i)=>'<button style="margin:8px;background:'+(i===0?'#2563eb':'#33465e')+';color:white;padding:15px 22px;border:0;border-radius:8px">'+s+'</button>').join('')+'</div>':'<div class="panels"><div class="tile"><small>OPTION A</small>Students use smartphones.<div class="buttons"><button>Basic</button><button>Better</button><button>Advanced</button></div></div><div class="tile"><small>OPTION B</small>Basic sentence<hr>Better sentence<hr>Advanced sentence</div></div>'}function render(){clearInterval(timer);clearTimeout(ctimer);const s=scenes[page],stage=el('stage');el('subtitle').classList.remove('on');el('subtitle').innerHTML='';el('counter').textContent=(page+1)+' / '+scenes.length;el('title').textContent=({start:'From Idea to App',tools:'Three AI Projects',animated:'Animated Essays',website:'Class Website',question:'Planning Chat',answer:'AI Response',app:'Sentence Transformer',share:'Send the HTML File',end:'Start Small. Build Step by Step.'})[s.kind];if(s.kind==='question'){stage.innerHTML='<div class="chat"><div class="user" id="typing"></div><div class="think" id="thinking" style="visibility:hidden">Thinking</div></div>';let n=0,txt=turns[s.i][0];timer=setInterval(()=>{n+=3;el('typing').textContent=txt.slice(0,n);if(n>=txt.length){clearInterval(timer);el('thinking').style.visibility='visible'}},22)}else if(s.kind==='answer'){const a=turns[s.i][1];stage.innerHTML=(a==='mock'||a==='revised')?mock(a==='revised'):'<div class="chat"><div class="user">'+esc(turns[s.i][0])+'</div><div class="ai"><span class="symbol">✳</span><span>'+esc(a)+'</span></div></div>'}else if(s.kind==='animated')stage.innerHTML='<div class="panel"><p id="word" onclick="change()" style="color:#facc15;cursor:pointer">'+alternatives[word]+'</p><span class="hand">👆</span><p style="font-size:20px"><a href="https://simonh68.github.io/teachers/#grade11" target="_blank">Open original class materials</a></p></div>';else if(s.kind==='website')stage.innerHTML='<div class="panel"><a href="https://simonh68.github.io/teachers/" target="_blank">Open English classes</a></div>';else if(s.kind==='app')stage.innerHTML='<div class="panel"><div id="sentence">'+sentences[level]+'</div>'+buttons()+'</div>';else if(s.kind==='share')stage.innerHTML='<div class="panels"><div class="tile">STEP 1<br>📎 WhatsApp document<br>⬇ Download HTML</div><div class="tile">STEP 2<br>📂 Downloads<br>Open with Chrome</div></div>';else if(s.kind==='tools')stage.innerHTML='<div class="panel">Animated Essays<br>English Class Website<br>Bagrut Trap Killer<br><small style="font-size:20px">Based on PISA and past Bagrut exams</small></div>';else stage.innerHTML='<div class="panel">Think → Reflect → Sketch → Approve → Build → Share</div>';ctimer=setTimeout(()=>{el('subtitle').innerHTML=(s.caption||[]).slice(0,2).map(x=>'<div>'+esc(x)+'</div>').join('');el('subtitle').classList.add('on')},4000)}function go(n){page=Math.max(0,Math.min(scenes.length-1,page+n));render()}document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}});render();</script></body></html>
