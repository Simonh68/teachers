<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentence Transformer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0e1728;color:#f8fafc;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.app{max-width:850px;width:100%;padding:clamp(24px,5vw,55px);background:#192a45;border:1px solid #466386;border-radius:24px;text-align:center}h1{font-size:clamp(28px,4.5vw,48px)}p{color:#b4c5dd}#sentence{min-height:140px;display:grid;place-items:center;font-size:clamp(28px,4.5vw,50px);line-height:1.25;margin:35px 0}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{font-size:clamp(18px,2.5vw,27px);background:#344764;color:white;padding:14px 25px;border:1px solid #7188a6;border-radius:13px;cursor:pointer}button.active{background:#2563eb;border-color:#93c5fd}button:focus-visible{outline:3px solid #facc15;outline-offset:3px}</style></head><body><main class="app"><h1>Sentence Transformer</h1><p>Choose a level to change the sentence.</p><div id="sentence" aria-live="polite">Students use smartphones.</div><div class="buttons"><button class="active" onclick="choose(0)">Basic</button><button onclick="choose(1)">Better</button><button onclick="choose(2)">Advanced</button></div></main><script>const versions=['Students use smartphones.','Many students use smartphones every day.','Students frequently use smartphones in their daily lives.'];function choose(n){document.getElementById('sentence').textContent=versions[n];document.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===n))}</script></body></html>
