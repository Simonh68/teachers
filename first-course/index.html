<!doctype html>

<head>

<title>מנה ראשונה — כיתה ז׳</title>
<meta name="description" content="פעילויות המנה הראשונה לכיתה ז׳">
<style>
:root{--ink:#101716;--paper:#f6f6f3;--lime:#dfff5b;--cyan:#4ee5ff;--muted:#66706c;--line:#dfe2dc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#dfff5b33,transparent 28%),var(--paper);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}
header{background:var(--ink);color:#fff}.bar{max-width:1120px;margin:auto;padding:17px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:900}.back{color:#fff;text-decoration:none;border:1px solid #ffffff2a;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800}
main{max-width:1120px;margin:auto;padding:clamp(34px,7vw,76px) 24px}.eyebrow{color:#5d7800;font-weight:900;font-size:14px}.hero{border-bottom:1px solid var(--line);padding-bottom:28px}.hero h1{font-size:clamp(46px,8vw,82px);letter-spacing:-3px;line-height:1;margin:8px 0 12px}.hero p{margin:0;color:var(--muted);font-size:18px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:30px}.card{position:relative;min-height:290px;padding:30px;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:24px;color:inherit;text-decoration:none;box-shadow:0 18px 46px #1017160d;transition:.18s}.card:hover{transform:translateY(-5px);border-color:#91ad1e;box-shadow:0 24px 60px #10171618}.num{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--lime);font-size:18px;font-weight:900}.card:nth-child(2) .num{background:var(--cyan)}.card h2{font-size:32px;margin:26px 0 10px}.card p{margin:0;color:var(--muted);line-height:1.6;font-weight:700}.open{margin-top:auto;padding-top:24px;font-weight:900}
@media(max-width:700px){.cards{grid-template-columns:1fr}.card{min-height:235px}.bar{padding:14px 18px}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand">כיתה ז׳ · חומרי הוראה</div><a class="back" href="../">חזרה לתפריט הכיתות</a></div></header>
<main>
<section class="hero"><div class="eyebrow">שבוע ראשון</div><h1>מנה ראשונה</h1><p>שתי פעילויות לפתיחה ישירה בכיתה.</p></section>
<section class="cards" aria-label="פעילויות המנה הראשונה">

</section>
