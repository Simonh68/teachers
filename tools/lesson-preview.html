<!doctype html><html lang="en"><meta charset="utf-8"><title>Teacher lesson verification</title><style>body{margin:14px;background:#e9edf1;color:#142538;font:14px Arial}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}button,select{padding:8px;font:inherit}iframe{border:0;display:block;background:#07111f}pre{white-space:pre-wrap;max-width:1100px}</style><header><label>Lesson <select id="lesson"><option value="../grade8/a-place-on-the-team/?v=20260910d">Grade 8</option><option value="../grade10/group-a/the-road-not-taken-review/?v=20260910d">Grade 10</option></select></label><label>Viewport <select id="viewport"><option value="1024,640">1024 × 640</option><option value="390,844">390 × 844</option><option value="844,390">844 × 390</option><option value="320,568">320 × 568</option></select></label><label>Slide <select id="slide"></select></label><button id="run">Check layouts</button><button id="navigation">Check navigation</button><span id="status">Ready</span></header><iframe id="preview" title="Lesson preview" src="../grade8/a-place-on-the-team/?v=20260910d"></iframe><pre id="result"></pre><pre id="nav-result"></pre><script>
const frame=document.querySelector('#preview'),viewport=document.querySelector('#viewport'),slide=document.querySelector('#slide'),lesson=document.querySelector('#lesson'),status=document.querySelector('#status');
function size(){const [w,h]=viewport.value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px'}
size();viewport.addEventListener('change',size);lesson.addEventListener('change',()=>{frame.src=lesson.value});frame.addEventListener('load',()=>{slide.replaceChildren();for(let i=1;i<=frame.contentDocument.querySelectorAll('.slide').length;i++)slide.add(new Option(String(i),String(i)))});slide.addEventListener('change',()=>{frame.contentWindow.location.hash='slide-'+slide.value});
async function settle(){await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));await frame.contentDocument.fonts.ready}
document.querySelector('#run').addEventListener('click',async()=>{
 const button=document.querySelector('#run');button.disabled=true;const failures=[],pairs={},tested=[];
 for(const dim of ['1024,640','390,844','844,390','320,568']){viewport.value=dim;size();await settle();const [w,h]=dim.split(',').map(Number);
 for(let i=1;i<=frame.contentDocument.querySelectorAll('.slide').length;i++){slide.value=String(i);frame.contentWindow.location.hash='slide-'+i;await settle();const doc=frame.contentDocument,s=doc.querySelector('.slide.active'),f=s.querySelector('.frame'),r=f.getBoundingClientRect(),style=frame.contentWindow.getComputedStyle(s),top=parseFloat(style.paddingTop),bottom=h-parseFloat(style.paddingBottom),issues=[];
 if(s.id!=='slide-'+i)issues.push('wrong slide');if(s.scrollWidth>w+1)issues.push('horizontal overflow');if(r.top<top-1||r.bottom>bottom+1)issues.push('vertical overflow');
 for(const e of doc.querySelectorAll('.nav button,.progress,.home,.section-nav button')){const b=e.getBoundingClientRect();if(b.left<0||b.top<0||b.right>w+1||b.bottom>h+1)issues.push('navigation outside viewport')}
 const home=doc.querySelector('.home').getBoundingClientRect(),sections=doc.querySelector('.section-nav').getBoundingClientRect();if(home.right>sections.left-2)issues.push('top navigation overlaps home');
 for(const e of s.querySelectorAll('.word,.example,.meaning,.translation,.question,.possible-answer,.story-sentence,.part-title,.cover-title,.poem-lines')){const b=e.getBoundingClientRect();if(e.scrollWidth>e.clientWidth+1)issues.push('text width: '+e.className);if(b.left<0||b.right>w+1)issues.push('text outside viewport')}
 if(s.dataset.pair){const k=dim+':'+s.dataset.pair,el=s.querySelector('.word,.question-area'),b=el.getBoundingClientRect();if(s.dataset.reveal==='false')pairs[k]={x:b.x,y:b.y,width:b.width,height:b.height};else{const a=pairs[k];if(a&&Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y),Math.abs(a.width-b.width),Math.abs(a.height-b.height))>1)issues.push('pair changed position')}}
 if(issues.length)failures.push({size:dim,slide:i,issues:[...new Set(issues)],frame:{top:r.top,bottom:r.bottom},available:{top,bottom}});tested.push(i);status.textContent='Checking '+tested.length;
 }}document.querySelector('#result').textContent=JSON.stringify({lesson:lesson.value,tested:tested.length,failures},null,2);status.textContent=failures.length?'Issues found':'PASS';button.disabled=false;
});
document.querySelector('#navigation').addEventListener('click',async()=>{
 const w=frame.contentWindow,d=frame.contentDocument,stage=d.querySelector('.stage'),checks=[];viewport.value='1024,640';size();w.location.hash='slide-5';await settle();
 function record(kind,want){checks.push({kind,want,actual:d.querySelector('.slide.active').id,pass:d.querySelector('.slide.active').id==='slide-'+want})}
 for(const [key,want] of [['ArrowRight',6],['ArrowDown',7],['ArrowLeft',6],['ArrowUp',5]]){stage.dispatchEvent(new w.KeyboardEvent('keydown',{key,bubbles:true}));await settle();record(key,want)}
 for(const [dx,dy,want] of [[-130,0,6],[130,0,5],[0,-130,6],[0,130,5]]){const start=new w.Touch({identifier:1,target:stage,clientX:200,clientY:200}),end=new w.Touch({identifier:1,target:stage,clientX:200+dx,clientY:200+dy});stage.dispatchEvent(new w.TouchEvent('touchstart',{touches:[start],changedTouches:[start],bubbles:true}));stage.dispatchEvent(new w.TouchEvent('touchend',{touches:[],changedTouches:[end],bubbles:true}));await settle();record('swipe '+dx+','+dy,want)}
 for(const [delta,want] of [[120,6],[-120,5]]){await new Promise(r=>setTimeout(r,420));stage.dispatchEvent(new w.WheelEvent('wheel',{deltaY:delta,bubbles:true,cancelable:true}));await settle();record('wheel '+delta,want)}
 for(const [idx,want] of [[0,4],[1,3],[2,4],[3,5]]){d.querySelectorAll('[data-step]')[idx].click();await settle();record('button '+idx,want)}
 document.querySelector('#nav-result').textContent=JSON.stringify({mode:'DOM event checks; physical key and wheel separately',checks},null,2);
});
</script></html>
