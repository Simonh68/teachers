all">תחילה קוראים ומנסים להסיק; התרגום בשקף הבא.</p>`}}else if(view==='practice'){const q=deck[pos],key='answer-'+(meeting??'all')+'-'+q.type+q.number;html=`<p class="small">${q.type==='q'?'הבנת הנקרא · פסקה '+esc(q.evidence):'תרגום מעברית לאנגלית'} · ${pos+1}/${deck.length}</p><p class="question ${q.type==='q'?'en':''}">${esc(q.type==='q'?q.en:q.he)}</p>${q.type==='q'?`<details><summary>פירוש השאלה</summary><p>${esc(q.he)}</p></details>`:`<details><summary>רמז</summary><p class="en">${esc(q.hint||'')}</p></details>`}<label for="response">כתבו תשובה לפני פתיחת הדוגמה:</label><textarea id="response" dir="ltr" lang="en" data-answer="${key}">${esc(state.answers[key]||'')}</textarea><button id="checkAnswer" class="primary">השוואה לתשובה לדוגמה</button><div id="modelAnswer" class="model" hidden><p class="en">${esc(q.type==='q'?q.answer:q.en)}</p>${q.answerHe?`<p>${esc(q.answerHe)}</p>`:''}<p>זו תשובה אפשרית, לא הנוסח היחיד. בדקו: האם התוכן נכון? האם המשפט שלם? תקנו נקודה אחת.</p></div>`;}else if(view==='grammar'){const g=deck[pos];html=`<p class="small">שפה בהקשר · תרגול תומך, לא הרחבת חומר המבחן</p><h2>${g.t}</h2>${g.rule?`<p class="rule">${g.rule}</p><p class="reading-text en" style="white-space:pre-line">${esc(g.ex)}</p>`:`<p class="question en">${esc(g.q)}</p>${g.options?`<div class="options" dir="ltr">${g.options.map(x=>`<button data-option="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:''}<div class="model ${g.reveal?'':'concealed'}" style="${g.reveal?'':'visibility:hidden'}"><p class="en">${esc(g.a)}</p><p>${esc(g.why)}</p></div><p class="small">בחרו או נסחו תשובה. הפתרון בשקף הבא.</p>`}`;}else if(view==='teacher'){const t=deck[pos];html=`<p class="eyebrow">מדריך למורה · מצגת HTML</p><h2>${t.title}</h2><p class="question">${t.body}</p>${t.meeting!==undefined?`<div class="rule"><p><strong>מיומנויות:</strong> ${M[t.meeting].skills}</p><p><strong>שפה:</strong> ${M[t.meeting].language}</p><p><strong>תוצר:</strong> ${M[t.meeting].output}</p><p><strong>בית:</strong> ${M[t.meeting].home.join(' ')}</p></div>`:''}`;}else if(view==='workbook'){let m=meeting===null?null:M[meeting],questions=D.questions.filter(q=>!m||m.questions.includes(q.number)),translations=D.translations.filter(t=>!m||m.translations.includes(t.number));html=`<h1 lang="en">The Monkey Festival · Part One</h1><p>דף עבודה · קבוצה 01 בלבד · מבחן 22.10.2026</p><button onclick="window.print()">הדפסת דף העבודה</button><h2>קוראים ומאתרים ראיה</h2>${questions.map(q=>`<section class="panel"><p class="en">${q.number}. ${esc(q.en)}</p><p class="small">Paragraph ${esc(q.evidence)}</p><div class="print-lines"></div><div class="print-lines"></div></section>`).join('')}${meeting===1?'<p class="en">Where are the monkeys? What are they doing? What does them refer to?</p><div class="print-lines"></div><div class="print-lines"></div>':''}<h2>מתרגמים לאנגלית</h2>${translations.map(t=>`<p>${t.number}. ${esc(t.he)}</p><div class="print-lines"></div>`).join('')}<h2>בודקים את עצמנו</h2><p>בחרו תשובה אחת. ציינו את הראיה בטקסט ותקנו בה נקודה אחת.</p><div class="print-lines"></div><div class="print-lines"></div>`;}else if(view==='rehearsal'){html=`<h1>בדיקת מוכנות · 19.10.2026</h1><p>36 דקות עבודה עצמאית. זהו תרגול, לא נוסח המבחן ולא חלוקת ציונים חדשה.</p><button id="startTimer">התחלת 36 דקות</button> <strong id="timer" class="timer">36:00</strong><h2>א. אוצר מילים</h2><p>כתבו פירוש בעברית לכל ערך; בחרו שניים וכתבו משפט באנגלית לכל אחד.</p><p class="question en">${[0,8,15,22,30,38,45,53].map(i=>esc(D.words[i].en)).join(' · ')}</p><textarea aria-label="תשובות אוצר מילים"></textarea><h2>ב. הבנת הנקרא</h2><details><summary>פתיחת טקסט Part One ללא תרגום</summary>${D.story.map(s=>`<p class="en">${esc(s.plain)}</p>`).join('')}</details>${[0,2,5,6].map(i=>`<p class="en">${esc(D.questions[i].en)}</p><textarea dir="ltr" aria-label="תשובה לשאלת קריאה"></textarea>`).join('')}<h2>ג. תרגום</h2>${[1,4].map(i=>`<p>${esc(D.translations[i].he)}</p><textarea dir="ltr" aria-label="תרגום לאנגלית"></textarea>`).join('')}<details class="answer"><summary>משוב עצמי — לפתוח רק לאחר ההשלמה</summary><p>השוו לדוגמאות בתרגול, לא רק לניסוח המדויק. בחרו שתי נקודות לחיזוק ותקנו תשובה אחת.</p>${link('practice','פתיחת התשובות לדוגמה')}</details>`;}
$('#stage').innerHTML=html;remember();if(view==='sentences'){const version=epoch;delay=setTimeout(()=>{if(version===epoch&&!document.hidden)playSentence(sentenceIndex)},2000)}if(view==='practice')$('#checkAnswer').onclick=()=>{if(!$('#response').value.trim()){$('#audioStatus').textContent='כתבו קודם ניסיון תשובה — גם משפט קצר מספיק.';$('#response').focus();return}$('#modelAnswer').hidden=false};if(view==='rehearsal')$('#startTimer').onclick=()=>{if(window.unitTimer)clearInterval(window.unitTimer);let end=Date.now()+36*60000;$('#startTimer').disabled=true;window.unitTimer=setInterval(()=>{let t=Math.max(0,Math.ceil((end-Date.now())/1000));$('#timer').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(!t)clearInterval(window.unitTimer)},500)};}
function move(delta){let total=view==='chunks'?D.pages.length:view==='sentences'?36:deck.length;if(pos+delta<0||pos+delta>=total)return;pos+=delta;render()}
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#tabs').onclick=e=>{let b=e.target.closest('[data-page]');if(b){pos=Number(b.dataset.page);render()}};
$('#play').onclick=()=>{clearTimeout(delay);if(!audio.paused){stop();return}if(view==='vocab'){playVocab();return}if(view==='chunks')chain=true;const desired=D.story[sentenceIndex].audio;const same=audio.src===new URL(desired,location.href).href;if(same&&audio.currentTime>0&&!audio.ended){audio.playbackRate=speed;audio.play().then(()=>{$('#play').textContent='❚❚ השהיה';highlight()}).catch(()=>{$('#audioStatus').textContent='לחצו שוב להפעלה.'})}else playSentence(sentenceIndex)};
$('#repeat').onclick=()=>{if(view==='vocab')playVocab();else{if(view==='chunks')chain=true;playSentence(sentenceIndex)}};
$('#speed').onchange=()=>{speed=Number($('#speed').value);audio.playbackRate=speed;audio.preservesPitch=true;try{localStorage.setItem(SPEED,String(speed))}catch(e){storageOK=false;save()}};
$('#seek').oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number($('#seek').value)/100*audio.duration};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);window.addEventListener('blur',()=>{if(document.hidden)stop()});window.addEventListener('resize',hideTip);$('#stage').addEventListener('scroll',hideTip);
document.addEventListener('change',e=>{if(e.target.matches('[data-tick]')){state.ticks[e.target.dataset.tick]=e.target.checked;save();if(e.target.dataset.tick.endsWith('-done')){let open=$$('.meeting[open]').map(x=>x.id);home();open.forEach(id=>{let el=document.getElementById(id);if(el)el.open=true})}}});
document.addEventListener('input',e=>{if(e.target.matches('[data-answer]')){state.answers[e.target.dataset.answer]=e.target.value;save()}});
document.addEventListener('click',async e=>{let word=e.target.closest('.word');if(word){showTip(word);return}if(!e.target.closest('#tip'))hideTip();let a=e.target.closest('.tracked');if(a){state.opened[a.dataset.id]=true;save()}let c=e.target.closest('[data-copy]');if(c){try{await navigator.clipboard.writeText(c.dataset.copy);$('#saveStatus').textContent='הקישור הועתק'}catch(error){$('#saveStatus').innerHTML='העתקה אוטומטית נחסמה. בחרו והעתיקו: <input dir="ltr" style="width:100%" readonly value="'+esc(c.dataset.copy)+'">';$('#saveStatus input').select()}}let opt=e.target.closest('[data-option]');if(opt){$$('[data-option]').forEach(b=>b.classList.remove('primary'));opt.classList.add('primary');$('#audioStatus').textContent='הבחירה סומנה. עברו לשקף הבא להשוואה.'}});
document.addEventListener('pointerover',e=>{let w=e.target.closest('.word');if(w&&e.pointerType!=='touch')showTip(w)});document.addEventListener('focusin',e=>{let w=e.target.closest('.word');if(w)showTip(w)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideTip();stop();return}if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('word')){e.preventDefault();showTip(e.target);return}if(view==='home')return;if(e.key==='ArrowLeft'||e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();move(1)}if(e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();move(-1)}});
const stage=$('#stage');stage.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY,top:stage.scrollTop,at:Date.now()};else touch=null},{passive:true});stage.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const t=touch;touch=null;let dx=e.changedTouches[0].clientX-t.x,dy=e.changedTouches[0].clientY-t.y;if(Math.max(Math.abs(dx),Math.abs(dy))<45)return;let horizontal=Math.abs(dx)>Math.abs(dy),canScroll=dy<0?stage.scrollHeight-stage.clientHeight-t.top>4:t.top>4;if(!horizontal&&canScroll)return;ignoreClickUntil=Date.now()+450;hideTip();move((horizontal?dx:dy)<0?1:-1)},{passive:true});let wheelAt=0;stage.addEventListener('wheel',e=>{if(e.ctrlKey||Math.abs(e.deltaY)<20)return;let can=e.deltaY>0?stage.scrollTop+stage.clientHeight<stage.scrollHeight-4:stage.scrollTop>4;if(can)return;if(Date.now()-wheelAt<500){e.preventDefault();return}wheelAt=Date.now();e.preventDefault();move(e.deltaY>0?1:-1)},{passive:false});
if(view==='home'){home();if(location.hash){const el=document.querySelector(location.hash);if(el){el.open=true;el.scrollIntoView()}}}else{document.body.classList.add('study');makeDeck();render()}save();
</script></body></html>
