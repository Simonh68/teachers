<script>if(location.protocol==='https:')document.querySelector('a[download]').href='./Hanukkah-Worksheet.pdf';const slides=[{"k": "A letter from Daniel · Grade 8", "t": "Hanukkah at the Beach", "cover": true}, {"k": "Vocabulary ahead", "t": "accurate", "n": 0, "he": null}, {"k": "Vocabulary ahead", "t": "accurate", "n": 0, "he": "מדויק"}, {"k": "Vocabulary ahead", "t": "previous", "n": 1, "he": null}, {"k": "Vocabulary ahead", "t": "previous", "n": 1, "he": "קודם"}, {"k": "Vocabulary ahead", "t": "sunlight", "n": 2, "he": null}, {"k": "Vocabulary ahead", "t": "sunlight", "n": 2, "he": "אור שמש"}, {"k": "Vocabulary ahead", "t": "watch", "n": 3, "he": null}, {"k": "Vocabulary ahead", "t": "watch", "n": 3, "he": "שעון יד"}, {"k": "Two clocks", "t": "Hi everyone,", "n": 4, "he": null}, {"k": "Two clocks", "t": "Hi everyone,", "n": 4, "he": "שלום לכולם,"}, {"k": "Two clocks", "t": "On my first morning in Brisbane, sunlight woke me up.", "n": 5, "he": null}, {"k": "Two clocks", "t": "On my first morning in Brisbane, sunlight woke me up.", "n": 5, "he": "בבוקר הראשון שלי בבריזבן, אור השמש העיר אותי."}, {"k": "Two clocks", "t": "The clock on the wall said 5:00.", "n": 6, "he": null}, {"k": "Two clocks", "t": "The clock on the wall said 5:00.", "n": 6, "he": "השעון שעל הקיר הראה חמש."}, {"k": "Two clocks", "t": "I looked at my watch.", "n": 7, "he": null}, {"k": "Two clocks", "t": "I looked at my watch.", "n": 7, "he": "הסתכלתי בשעון היד שלי."}, {"k": "Two clocks", "t": "It said 9:00 p.m.", "n": 8, "he": null}, {"k": "Two clocks", "t": "It said 9:00 p.m.", "n": 8, "he": "הוא הראה תשע בערב."}, {"k": "Two clocks", "t": "I looked out of the window.", "n": 9, "he": null}, {"k": "Two clocks", "t": "I looked out of the window.", "n": 9, "he": "הסתכלתי מבעד לחלון."}, {"k": "Two clocks", "t": "The sun was up, and I could hear birds in the garden.", "n": 10, "he": null}, {"k": "Two clocks", "t": "The sun was up, and I could hear birds in the garden.", "n": 10, "he": "השמש כבר זרחה, ויכולתי לשמוע ציפורים בגינה."}, {"k": "Reading question", "t": "What woke Daniel up?", "n": 11, "he": null}, {"k": "Possible answer", "t": "Sunlight woke him up.", "n": 12, "he": null}, {"k": "Two clocks", "t": "I went into the kitchen.", "n": 13, "he": null}, {"k": "Two clocks", "t": "I went into the kitchen.", "n": 13, "he": "נכנסתי למטבח."}, {"k": "Two clocks", "t": "My uncle was making coffee.", "n": 14, "he": null}, {"k": "Two clocks", "t": "My uncle was making coffee.", "n": 14, "he": "דוד שלי הכין קפה."}, {"k": "Two clocks", "t": "“Is the clock on the wall right?” I asked.", "n": 15, "he": null}, {"k": "Two clocks", "t": "“Is the clock on the wall right?” I asked.", "n": 15, "he": "״השעון שעל הקיר מדויק?״ שאלתי."}, {"k": "Two clocks", "t": "“Yes,” he said.", "n": 16, "he": null}, {"k": "Two clocks", "t": "“Yes,” he said.", "n": 16, "he": "״כן,״ הוא אמר."}, {"k": "Two clocks", "t": "Then he looked at my watch.", "n": 17, "he": null}, {"k": "Two clocks", "t": "Then he looked at my watch.", "n": 17, "he": "ואז הוא הסתכל בשעון היד שלי."}, {"k": "Two clocks", "t": "“Did you change the time when you landed?”", "n": 18, "he": null}, {"k": "Two clocks", "t": "“Did you change the time when you landed?”", "n": 18, "he": "״כיוונת את השעון כשנחתת?״"}, {"k": "Two clocks", "t": "I shook my head.", "n": 19, "he": null}, {"k": "Two clocks", "t": "I shook my head.", "n": 19, "he": "הנדתי בראשי לשלילה."}, {"k": "Two clocks", "t": "My watch still showed the time in Ramat Gan.", "n": 20, "he": null}, {"k": "Two clocks", "t": "My watch still showed the time in Ramat Gan.", "n": 20, "he": "שעון היד שלי עדיין הראה את השעה ברמת גן."}, {"k": "Two clocks", "t": "Here in Australia, it was already morning.", "n": 21, "he": null}, {"k": "Two clocks", "t": "Here in Australia, it was already morning.", "n": 21, "he": "כאן באוסטרליה כבר היה בוקר."}, {"k": "Two clocks", "t": "Back home, you still had a whole night ahead of you.", "n": 22, "he": null}, {"k": "Two clocks", "t": "Back home, you still had a whole night ahead of you.", "n": 22, "he": "בבית, ברמת גן, עוד היה לכם לילה שלם לפניכם."}, {"k": "Two clocks", "t": "I left my watch on Israeli time.", "n": 23, "he": null}, {"k": "Two clocks", "t": "I left my watch on Israeli time.", "n": 23, "he": "השארתי את שעון היד שלי מכוון לשעון ישראל."}, {"k": "Two clocks", "t": "I like knowing what the time is at home and not in Australia.", "n": 24, "he": null}, {"k": "Two clocks", "t": "I like knowing what the time is at home and not in Australia.", "n": 24, "he": "אני אוהב לדעת מה השעה בבית ולא באוסטרליה."}, {"k": "Reading question", "t": "How can both clocks be accurate?", "n": 25, "he": null}, {"k": "Possible answer", "t": "They show the time in different places.", "n": 26, "he": null}, {"k": "Vocabulary ahead", "t": "experience", "n": 27, "he": null}, {"k": "Vocabulary ahead", "t": "experience", "n": 27, "he": "לחוות"}, {"k": "Vocabulary ahead", "t": "cheerful", "n": 28, "he": null}, {"k": "Vocabulary ahead", "t": "cheerful", "n": 28, "he": "עליז"}, {"k": "Vocabulary ahead", "t": "summer vacation", "n": 29, "he": null}, {"k": "Vocabulary ahead", "t": "summer vacation", "n": 29, "he": "חופשת הקיץ"}, {"k": "Summer in December", "t": "After breakfast, my cousin Ben handed me a beach towel.", "n": 30, "he": null}, {"k": "Summer in December", "t": "After breakfast, my cousin Ben handed me a beach towel.", "n": 30, "he": "אחרי ארוחת הבוקר, בן הדוד שלי בן הושיט לי מגבת חוף."}, {"k": "Summer in December", "t": "“Don’t you have school today?” I asked.", "n": 31, "he": null}, {"k": "Summer in December", "t": "“Don’t you have school today?” I asked.", "n": 31, "he": "״אין לכם לימודים היום?״ שאלתי."}, {"k": "Summer in December", "t": "“School’s over,” he said.", "n": 32, "he": null}, {"k": "Summer in December", "t": "“School’s over,” he said.", "n": 32, "he": "״הלימודים הסתיימו,״ הוא אמר."}, {"k": "Summer in December", "t": "“It’s our summer vacation.”", "n": 33, "he": null}, {"k": "Summer in December", "t": "“It’s our summer vacation.”", "n": 33, "he": "״זאת חופשת הקיץ שלנו.״"}, {"k": "Summer in December", "t": "“Come on!”", "n": 34, "he": null}, {"k": "Summer in December", "t": "“Come on!”", "n": 34, "he": "״בוא כבר!״"}, {"k": "Summer in December", "t": "“Everyone’s going to the beach.”", "n": 35, "he": null}, {"k": "Summer in December", "t": "“Everyone’s going to the beach.”", "n": 35, "he": "״כולם הולכים לים.״"}, {"k": "Summer in December", "t": "I tried to picture myself going to the beach in December.", "n": 36, "he": null}, {"k": "Summer in December", "t": "I tried to picture myself going to the beach in December.", "n": 36, "he": "ניסיתי לדמיין את עצמי הולך לים בדצמבר."}, {"k": "Summer in December", "t": "All I could see was the wet coat I had worn to the airport.", "n": 37, "he": null}, {"k": "Summer in December", "t": "All I could see was the wet coat I had worn to the airport.", "n": 37, "he": "כל מה שהצלחתי לדמיין היה המעיל הרטוב שלבשתי בדרך לנמל התעופה."}, {"k": "Summer in December", "t": "But an hour later, I was in the sea with Ben.", "n": 38, "he": null}, {"k": "Summer in December", "t": "But an hour later, I was in the sea with Ben.", "n": 38, "he": "אבל כעבור שעה כבר הייתי בים עם בן."}, {"k": "Reading question", "t": "Why was the beach a surprise for Daniel?", "n": 39, "he": null}, {"k": "Possible answer", "t": "He remembered wearing a wet coat in Israel in December.", "n": 40, "he": null}, {"k": "Vocabulary ahead", "t": "beneath", "n": 41, "he": null}, {"k": "Vocabulary ahead", "t": "beneath", "n": 41, "he": "מתחת ל־"}, {"k": "Vocabulary ahead", "t": "communicate", "n": 42, "he": null}, {"k": "Vocabulary ahead", "t": "communicate", "n": 42, "he": "לתקשר"}, {"k": "Vocabulary ahead", "t": "in detail", "n": 43, "he": null}, {"k": "Vocabulary ahead", "t": "in detail", "n": 43, "he": "בפירוט"}, {"k": "Vocabulary ahead", "t": "translate", "n": 44, "he": null}, {"k": "Vocabulary ahead", "t": "translate", "n": 44, "he": "לתרגם"}, {"k": "Candles by the window", "t": "That evening, when we got home, my aunt put the Hanukkah candles by the window.", "n": 45, "he": null}, {"k": "Candles by the window", "t": "That evening, when we got home, my aunt put the Hanukkah candles by the window.", "n": 45, "he": "באותו ערב, כשחזרנו הביתה, דודה שלי הניחה את נרות החנוכה ליד החלון."}, {"k": "Candles by the window", "t": "I stopped in the doorway.", "n": 46, "he": null}, {"k": "Candles by the window", "t": "I stopped in the doorway.", "n": 46, "he": "נעצרתי בפתח."}, {"k": "Candles by the window", "t": "I still had sand on my feet.", "n": 47, "he": null}, {"k": "Candles by the window", "t": "I still had sand on my feet.", "n": 47, "he": "עדיין היה לי חול על כפות הרגליים."}, {"k": "Candles by the window", "t": "“How can it be Hanukkah in the middle of summer vacation?” I asked Ben.", "n": 48, "he": null}, {"k": "Candles by the window", "t": "“How can it be Hanukkah in the middle of summer vacation?” I asked Ben.", "n": 48, "he": "״איך יכול להיות שחנוכה חל באמצע חופשת הקיץ?״ שאלתי את בן."}, {"k": "Candles by the window", "t": "He looked just as surprised as I was.", "n": 49, "he": null}, {"k": "Candles by the window", "t": "He looked just as surprised as I was.", "n": 49, "he": "הוא נראה מופתע בדיוק כמוני."}, {"k": "Candles by the window", "t": "“Do you mean you wear a winter coat on Hanukkah?”", "n": 50, "he": null}, {"k": "Candles by the window", "t": "“Do you mean you wear a winter coat on Hanukkah?”", "n": 50, "he": "״אתה מתכוון שאתה לובש מעיל חורף בחנוכה?״"}, {"k": "Reading question", "t": "What surprises Ben about Hanukkah in Israel?", "n": 51, "he": null}, {"k": "Possible answer", "t": "Daniel wears a winter coat during the holiday.", "n": 52, "he": null}, {"k": "Candles by the window", "t": "We lit the candles.", "n": 53, "he": null}, {"k": "Candles by the window", "t": "We lit the candles.", "n": 53, "he": "הדלקנו את הנרות."}, {"k": "Candles by the window", "t": "Then I took a picture for you.", "n": 54, "he": null}, {"k": "Candles by the window", "t": "Then I took a picture for you.", "n": 54, "he": "ואז צילמתי תמונה בשבילכם."}, {"k": "Candles by the window", "t": "You can see the flames in the window and, just below them, two beach towels hanging up to dry.", "n": 55, "he": null}, {"k": "Candles by the window", "t": "You can see the flames in the window and, just below them, two beach towels hanging up to dry.", "n": 55, "he": "אתם יכולים לראות את הלהבות בחלון, וממש מתחתיהן שתי מגבות חוף תלויות לייבוש."}, {"k": "Candles by the window", "t": "Happy Hanukkah from Brisbane!", "n": 56, "he": null}, {"k": "Candles by the window", "t": "Happy Hanukkah from Brisbane!", "n": 56, "he": "חנוכה שמח מבריזבן!"}, {"k": "Candles by the window", "t": "Daniel", "n": 57, "he": null}, {"k": "Candles by the window", "t": "Daniel", "n": 57, "he": "דניאל"}, {"k": "Reading question", "t": "What two details would you point out in Daniel’s photo, and why?", "n": 58, "he": null}, {"k": "Possible answer", "t": "The candles show Hanukkah, and the towels show that the boys went swimming.", "n": 59, "he": null}],quiz=false,$=id=>document.getElementById(id);let i=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1))||1)-1)),timer,player,frame,voice,epoch=0;

function wordFallback(s,id){if(epoch!==id)return;voice=null;player=new Audio("data:audio/mpeg;base64,"+wordAudio[s.t]);player.playbackRate=Number($('rate').value);player.onended=()=>{if(epoch===id)stop()};player.play().catch(()=>{if(epoch===id)stop()})}
function play(){clearTimeout(timer);if(player){if(player.paused){player.play().catch(stop);$('sound').textContent='Ⅱ'}else{player.pause();$('sound').textContent='▶'}return}
if(voice){if(speechSynthesis.paused){speechSynthesis.resume();$('sound').textContent='Ⅱ'}else{speechSynthesis.pause();$('sound').textContent='▶'}return}
const s=slides[i],id=epoch;if(s.cover)return;$('sound').textContent='Ⅱ';const synth=window.speechSynthesis;
if(s.k==='Vocabulary ahead' && (!synth || !englishVoices().length)){wordFallback(s,id);return}if(!synth){$('sound').textContent='Audio unavailable';return}
voice=new SpeechSynthesisUtterance(s.t);
const list=englishVoices();
voice.voice=list.find(v=>v.voiceURI===$('voices').value)||list[0]||null;
voice.lang=voice.voice?.lang||'en-US';voice.rate=Number($('rate').value);
voice.pitch=s.t.includes('?')?1.04:1;
voice.onboundary=e=>{if(id===epoch && e.name==='word')highlight(s.t.slice(0,e.charIndex).trim().split(/\s+/).filter(Boolean).length)};
voice.onend=()=>{if(id===epoch)stop()};
voice.onerror=()=>{if(id===epoch && s.k==='Vocabulary ahead'){wordFallback(s,id);return}if(id===epoch){stop();$('sound').textContent='Retry ▶'}};
synth.speak(voice)}
function englishVoices(){
 const rank=v=>(/natural|neural|premium|enhanced/i.test(v.name)?30:0)+(/Google|Samantha|Aria|Jenny/i.test(v.name)?10:0)+(v.lang==='en-AU'?3:0);
 return (window.speechSynthesis?.getVoices()||[]).filter(v=>/^en/i.test(v.lang)).sort((a,b)=>rank(b)-rank(a));
}
function loadVoices(){const previous=$('voices').value;
 $('voices').replaceChildren(new Option('English voice',''),...englishVoices().map(v=>new Option(v.name,v.voiceURI)));
 if([...$('voices').options].some(o=>o.value===previous))$('voices').value=previous}
loadVoices();window.speechSynthesis?.addEventListener('voiceschanged',loadVoices);
$('voices').onchange=()=>{stop();if(!slides[i].cover)play()};
function render(){stop();const s=slides[i];$('pron').hidden=s.k!=='Vocabulary ahead';$('scene').hidden=!(s.t.startsWith("You can see the flames")||s.t==="We lit the candles.");$('line').replaceChildren(...s.t.split(/\s+/).map(w=>{let el=document.createElement('span');el.textContent=w+' ';return el}));$('he').textContent=s.he||'';$('he').hidden=quiz;$('kind').textContent=s.k;$('star').hidden=!s.h;$('tip').hidden=true;$('tip').textContent=s.h||'';$('count').textContent=(i+1)+' / '+slides.length;$('prev').disabled=!i;$('next').disabled=i===slides.length-1;$('sound').disabled=!!s.cover;history.replaceState(null,'','#'+(i+1));if(!s.cover)timer=setTimeout(play,4000)}
$('pron').onclick=()=>{stop();play()};
function move(n){let j=Math.min(slides.length-1,Math.max(0,i+n));if(i!==j){i=j;render()}}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('sound').onclick=play;$('rate').onchange=()=>{if(player)player.playbackRate=Number($('rate').value)};$('star').onclick=()=>$('tip').hidden=!$('tip').hidden;
onkeydown=e=>{if(e.target.tagName==='SELECT')return;if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();move(['ArrowRight','ArrowDown'].includes(e.key)?1:-1)}};
let x,y;addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{let dy=e.changedTouches[0].clientY-y,dx=e.changedTouches[0].clientX-x;if(Math.abs(dy)>45&&Math.abs(dy)>1.3*Math.abs(dx))move(dy<0?1:-1)},{passive:true});render()</script></html>
