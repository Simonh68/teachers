*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#081529;color:#f5fbff;font-family:Arial,system-ui,sans-serif;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:15px 24px;background:#10253c}.top a{color:#cffaf0;text-decoration:none}.shell{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(1120px,96%);margin:auto;gap:12px}.tag{color:#6ee6c3;letter-spacing:.08em;font-weight:bold}.counter{color:#b4cfe0}.prompt{font-size:clamp(23px,4vw,46px);font-weight:800;text-align:center;margin:5px 0 15px}.answers{display:grid;grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:15px;width:min(980px,100%);height:min(43vh,360px);direction:ltr}.answer{min-height:0;border:2px solid #45617e;background:#182d47;color:#fff;border-radius:22px;padding:20px;font-size:clamp(21px,2.75vw,35px);line-height:1.25;font-weight:700;cursor:pointer}.answer.correct{border-color:#5be1a9;background:#164a39}.answer.wrong{border-color:#ff6d83;background:#51243a}.answer:focus-visible{outline:3px solid #f7d478;outline-offset:3px}.feedback{height:76px;display:flex;align-items:center;justify-content:center;padding:0 18px;font-size:clamp(17px,2.1vw,24px);text-align:center}.controls{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;background:#10253c;flex-wrap:wrap}.controls button{border:1px solid #54718a;border-radius:12px;padding:12px 22px;background:#21415c;color:#fff;font-weight:700;font-size:17px;cursor:pointer}.controls button:disabled{opacity:.4}.progress{height:5px;background:#72e4bf;position:fixed;bottom:0;right:0;transition:width .2s}.score{font-size:19px;color:#b8e8d8}.end{font-size:clamp(25px,4vw,50px);text-align:center} @media(max-width:650px){.answers{grid-template-columns:1fr;height:min(41vh,310px)}.answer{min-height:0;padding:13px}.shell{gap:10px}.top{padding:12px}.controls{padding:8px}.feedback{min-height:48px}}</style></head><body>

function shuffle(){order.sort(()=>Math.random()-.5)}
function show(){const done=index>=order.length;$('counter').textContent=done?'40 / 40':(index+1)+' / '+order.length;$('prev').disabled=index===0;$('next').disabled=!done&&results[order[index]]!==true;$('progress').style.width=Math.min(100,100*index/order.length)+'%';
const n=Object.values(results).filter(x=>x===true).length;$('score').textContent='תשובות נכונות: '+n+' / 40';
if(done){$('phase').textContent='CHALLENGE COMPLETE';$('prompt').className='end';$('prompt').textContent='כל הכבוד! סיימתם את כל 40 התרגילים.';$('answers').innerHTML='';$('feedback').textContent='לחצו התחלה מחדש כדי לתרגל שוב.';return}
const q=data[order[index]];$('phase').textContent='בחרו את המשפט הנכון מבחינה דקדוקית';$('prompt').className='prompt';$('prompt').textContent=q[0];$('answers').innerHTML=[1,2].map((k,i)=>'<button class="answer" data-choice="'+i+'">'+(i===0?'A · ':'B · ')+q[k]+'</button>').join('');$('feedback').textContent=results[order[index]]===true?'✅ נכון מאוד! אפשר לעבור לשקף הבא.':'';document.querySelectorAll('.answer').forEach(btn=>{if(results[order[index]]===true){btn.disabled=true;if(Number(btn.dataset.choice)===q[3])btn.classList.add('correct')}else btn.onclick=()=>choose(Number(btn.dataset.choice))})}
function choose(choice){const q=data[order[index]],correct=choice===q[3];if(correct){results[order[index]]=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(Number(b.dataset.choice)===choice)b.classList.add('correct')});$('feedback').textContent='✅ נכון מאוד! זה המשפט המתאים לזמן ולמשמעות.';$('next').disabled=false;$('score').textContent='תשובות נכונות: '+Object.values(results).filter(Boolean).length+' / 40'}else{const btn=document.querySelector('.answer[data-choice="'+choice+'"]');btn.classList.add('wrong');$('feedback').textContent='❌ לא מדויק — נסו את המשפט השני.'}}
function move(delta){index=Math.max(0,Math.min(order.length,index+delta));show()}
$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('reset').onclick=()=>{index=0;results={};shuffle();show()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key===' '){e.preventDefault();if(!$('next').disabled)move(1)}if(e.key==='ArrowUp'){e.preventDefault();move(-1)}if((e.key==='1'||e.key.toLowerCase()==='a')&&index<40&&results[order[index]]===undefined)choose(0);if((e.key==='2'||e.key.toLowerCase()==='b')&&index<40&&results[order[index]]===undefined)choose(1)});
let y=null;document.addEventListener('touchstart',e=>{y=e.touches[0]?.clientY??null},{passive:true});document.addEventListener('touchend',e=>{if(y===null)return;const d=e.changedTouches[0].clientY-y;if(d< -55&&!$('next').disabled)move(1);if(d>55)move(-1);y=null},{passive:true});shuffle();show();
