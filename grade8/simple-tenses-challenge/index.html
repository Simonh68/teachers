<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grade 8 | Simple Tenses Challenge</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#081529;color:#f5fbff;font-family:Arial,system-ui,sans-serif;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:15px 24px;background:#10253c}.top a{color:#cffaf0;text-decoration:none}.shell{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(1120px,96%);margin:auto;gap:12px}.tag{color:#6ee6c3;letter-spacing:.08em;font-weight:bold}.counter{color:#b4cfe0}.prompt{font-size:clamp(23px,4vw,46px);font-weight:800;text-align:center;margin:5px 0 15px}.answers{display:grid;grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:15px;width:min(980px,100%);height:min(43vh,360px);direction:ltr}.answer{min-height:0;border:2px solid #45617e;background:#182d47;color:#fff;border-radius:22px;padding:20px;font-size:clamp(21px,2.75vw,35px);line-height:1.25;font-weight:700;cursor:pointer}.answer.correct{border-color:#5be1a9;background:#164a39}.answer.wrong{border-color:#ff6d83;background:#51243a}.answer:focus-visible{outline:3px solid #f7d478;outline-offset:3px}.feedback{height:76px;display:flex;align-items:center;justify-content:center;padding:0 18px;font-size:clamp(17px,2.1vw,24px);text-align:center}.controls{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;background:#10253c;flex-wrap:wrap}.controls button{border:1px solid #54718a;border-radius:12px;padding:12px 22px;background:#21415c;color:#fff;font-weight:700;font-size:17px;cursor:pointer}.controls button:disabled{opacity:.4}.progress{height:5px;background:#72e4bf;position:fixed;bottom:0;right:0;transition:width .2s}.score{font-size:19px;color:#b8e8d8}.end{font-size:clamp(25px,4vw,50px);text-align:center} @media(max-width:650px){.answers{grid-template-columns:1fr;height:min(41vh,310px)}.answer{min-height:0;padding:13px}.shell{gap:10px}.top{padding:12px}.controls{padding:8px}.feedback{min-height:48px}}</style></head><body>
<header class="top"><a href="../../#grade8">⌂ כיתה ח׳</a><span class="tag">SIMPLE TENSES · A2−</span><span class="counter" id="counter"></span></header>
<main class="shell"><div class="tag" id="phase">CLASS CHALLENGE</div><div class="prompt" id="prompt"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="score" id="score"></div></main>
<footer class="controls"><button id="prev">↑ הקודם</button><button id="next">↓ הבא</button><button id="reset">↻ התחלה מחדש</button></footer><div class="progress" id="progress"></div>
<script>
const data=[["דניאל משחק כדורגל בכל יום.","Daniel plays football every day.","Daniel played football yesterday.",0],["ג׳ון ביקר את סבא שלו אתמול.","John visits his grandfather every week.","John visited his grandfather yesterday.",1],["דיוויד ילמד אנגלית מחר.","David will study English tomorrow.","David studied English yesterday.",0],["דניאל לא אוהב קפה.","Daniel didn't like coffee yesterday.","Daniel doesn't like coffee.",1],["ג׳ון לא הלך לבית הספר אתמול.","John doesn't go to school on Fridays.","John didn't go to school yesterday.",1],["דיוויד לא יעבוד מחר.","David won't work tomorrow.","David doesn't work on Saturdays.",0],["האם דניאל גר בחיפה?","Did Daniel live in Haifa last year?","Does Daniel live in Haifa?",1],["האם ג׳ון אכל פיצה אתמול?","Did John eat pizza yesterday?","Does John eat pizza every Friday?",0],["האם דיוויד יבוא מחר?","Does David come every day?","Will David come tomorrow?",1],["אנחנו הולכים לבית הספר בכל בוקר.","We went to school yesterday morning.","We go to school every morning.",1],["הם ראו סרט בשבוע שעבר.","They saw a movie last week.","They will see a movie next week.",0],["הם ישחקו מחר אחרי הלימודים.","They play after school every day.","They will play after school tomorrow.",1],["איפה דניאל עובד?","Where does Daniel work?","Where did Daniel work last year?",0],["מתי ג׳ון הגיע אתמול?","When will John arrive tomorrow?","When did John arrive yesterday?",1],["מה דיוויד יקנה מחר?","What will David buy tomorrow?","What did David buy yesterday?",0],["אחותו של דניאל קוראת ספרים בכל ערב.","Daniel's sister reads books every evening.","Daniel's sister read books last night.",0],["ג׳ון לא שיחק כדורסל ביום ראשון.","John won't play basketball next Sunday.","John didn't play basketball on Sunday.",1],["אנחנו לא נצפה בטלוויזיה הערב.","We won't watch TV tonight.","We didn't watch TV last night.",0],["האם הם לומדים אנגלית בכל יום?","Do they study English every day?","Did they study English yesterday?",0],["דניאל יעזור לחבר שלו בשבוע הבא.","Daniel helped his friend last week.","Daniel will help his friend next week.",1],["ג׳ון שותה מים בכל בוקר.","John drinks water every morning.","John drank water yesterday.",0],["דיוויד נסע באוטובוס אתמול.","David takes the bus every day.","David took the bus yesterday.",1],["דניאל יבשל ארוחת ערב מחר.","Daniel will cook dinner tomorrow.","Daniel cooked dinner yesterday.",0],["הם לא משחקים טניס בימי שישי.","They didn't play tennis last Friday.","They don't play tennis on Fridays.",1],["ג׳ון לא ראה את הסרט בשבוע שעבר.","John didn't see the movie last week.","John doesn't see movies on weekdays.",0],["אנחנו נבקר בירושלים בשבוע הבא.","We visited Jerusalem last week.","We will visit Jerusalem next week.",1],["האם דיוויד מנגן בגיטרה?","Does David play the guitar?","Did David play the guitar yesterday?",0],["האם הילדים סיימו את העבודה אתמול?","Do the children finish their work every day?","Did the children finish their work yesterday?",1],["האם הם יגיעו בזמן מחר?","Will they arrive on time tomorrow?","Did they arrive on time yesterday?",0],["דניאל עושה שיעורי בית אחרי בית הספר בכל יום.","Daniel did his homework yesterday.","Daniel does his homework after school every day.",1],["ג׳ון כתב הודעה אתמול בערב.","John wrote a message last night.","John will write a message tonight.",0],["דיוויד יקנה נעליים חדשות בשבוע הבא.","David bought new shoes last week.","David will buy new shoes next week.",1],["איפה ג׳ון לומד?","Where does John study?","Where did John study last year?",0],["למה דניאל איחר אתמול?","Why will Daniel be late tomorrow?","Why was Daniel late yesterday?",1],["מתי הם יתחילו את המשחק מחר?","When will they start the game tomorrow?","When did they start the game yesterday?",0],["אמא של דיוויד עובדת בבית חולים.","David's mother worked at a hospital last year.","David's mother works at a hospital.",1],["ג׳ון לא קנה את הספר אתמול.","John didn't buy the book yesterday.","John doesn't buy books on Mondays.",0],["הם לא יישארו בבית מחר.","They didn't stay home yesterday.","They won't stay home tomorrow.",1],["האם ג׳ון אוכל ארוחת בוקר בכל יום?","Does John eat breakfast every day?","Did John eat breakfast yesterday?",0],["דניאל ישלח את האימייל הערב.","Daniel sent the email last night.","Daniel will send the email tonight.",1]];let order=[...data.keys()],index=0,results={};const $=id=>document.getElementById(id);
function shuffle(){order.sort(()=>Math.random()-.5)}
function show(){const done=index>=order.length;$('counter').textContent=done?'40 / 40':(index+1)+' / '+order.length;$('prev').disabled=index===0;$('next').disabled=!done&&results[order[index]]!==true;$('progress').style.width=Math.min(100,100*index/order.length)+'%';
const n=Object.values(results).filter(x=>x===true).length;$('score').textContent='תשובות נכונות: '+n+' / 40';
if(done){$('phase').textContent='CHALLENGE COMPLETE';$('prompt').className='end';$('prompt').textContent='כל הכבוד! סיימתם את כל 40 התרגילים.';$('answers').innerHTML='';$('feedback').textContent='לחצו התחלה מחדש כדי לתרגל שוב.';return}
const q=data[order[index]];$('phase').textContent='בחרו את המשפט המתאים באנגלית';$('prompt').className='prompt';$('prompt').textContent=q[0];$('answers').innerHTML=[1,2].map((k,i)=>'<button class="answer" data-choice="'+i+'">'+(i===0?'A · ':'B · ')+q[k]+'</button>').join('');$('feedback').textContent=results[order[index]]===true?'✅ נכון מאוד! אפשר לעבור לשקף הבא.':'';document.querySelectorAll('.answer').forEach(btn=>{if(results[order[index]]===true){btn.disabled=true;if(Number(btn.dataset.choice)===q[3])btn.classList.add('correct')}else btn.onclick=()=>choose(Number(btn.dataset.choice))})}
function choose(choice){const q=data[order[index]],correct=choice===q[3];if(correct){results[order[index]]=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(Number(b.dataset.choice)===choice)b.classList.add('correct')});$('feedback').textContent='✅ נכון מאוד! זה המשפט המתאים לזמן ולמשמעות.';$('next').disabled=false;$('score').textContent='תשובות נכונות: '+Object.values(results).filter(Boolean).length+' / 40'}else{const btn=document.querySelector('.answer[data-choice="'+choice+'"]');btn.classList.add('wrong');$('feedback').textContent='❌ לא מדויק — נסו את המשפט השני.'}}
function move(delta){index=Math.max(0,Math.min(order.length,index+delta));show()}
$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('reset').onclick=()=>{index=0;results={};shuffle();show()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key===' '){e.preventDefault();if(!$('next').disabled)move(1)}if(e.key==='ArrowUp'){e.preventDefault();move(-1)}if((e.key==='1'||e.key.toLowerCase()==='a')&&index<40&&results[order[index]]===undefined)choose(0);if((e.key==='2'||e.key.toLowerCase()==='b')&&index<40&&results[order[index]]===undefined)choose(1)});
let y=null;document.addEventListener('touchstart',e=>{y=e.touches[0]?.clientY??null},{passive:true});document.addEventListener('touchend',e=>{if(y===null)return;const d=e.changedTouches[0].clientY-y;if(d< -55&&!$('next').disabled)move(1);if(d>55)move(-1);y=null},{passive:true});shuffle();show();
</script></body></html>
