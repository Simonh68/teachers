<script>const slides=[["Life in Different Places","Australia · Coober Pedy · Israel"],["חיים במקומות שונים","אוסטרליה · קובר פדי · ישראל"],["Where is Coober Pedy?","What is special about its homes?"],["קובר פדי באוסטרליה","חלק מהבתים נמצאים מתחת לאדמה"],["Translate","חם מאוד בחוץ. אנשים גרים מתחת לאדמה."],["Answers","It is very hot outside. People live underground."],["underground","Some people live underground. under + ground"],["מתחת לאדמה","under = מתחת · ground = אדמה"],["desert","A desert is a very dry place."],["מדבר","מקום יבש מאוד"],["comfortable","This room is comfortable."],["נוח","החדר הזה נוח"],["different","Life in Israel is different from life in Coober Pedy."],["שונה","החיים בישראל שונים מהחיים בקובר פדי"],["temperature","The temperature outside is high."],["טמפרטורה","הטמפרטורה בחוץ גבוהה"],["Present Simple","People live in different places."],["הווה פשוט","אנשים גרים במקומות שונים"],["He / She","He lives in Australia. She works in a shop."],["הוספת s","He lives · She works"],["hot → hotter","The desert is hotter than the classroom."],["חם יותר","than = מאשר"],["big → bigger","Australia is bigger than Israel."],["גדול יותר","מכפילים את האות g"],["small → smaller","Coober Pedy is smaller than Tel Aviv."],["קטן יותר","קובר פדי קטנה יותר מתל אביב"],["comfortable","This room is more comfortable than that room."],["נוח יותר","more comfortable than"],["Choose","The desert is ___ than the city. hot / hotter / hottest"],["Answer","hotter"],["Correct","Australia is more big than Israel."],["Answer","Australia is bigger than Israel."],["Translate","קובר פדי קטנה יותר מתל אביב."],["Answer","Coober Pedy is smaller than Tel Aviv."],["Translate","חם יותר בחוץ מאשר מתחת לאדמה."],["Answer","It is hotter outside than underground."],["Translate","חלק מהאנשים גרים מתחת לאדמה כי חם בחוץ."],["Answer","Some people live underground because it is hot outside."],["Translate","החיים באוסטרליה שונים מהחיים בישראל."],["Answer","Life in Australia is different from life in Israel."],["Build a sentence","more comfortable / is / this home / than / that home"],["Answer","This home is more comfortable than that home."],["Ask WHERE","He lives in Coober Pedy."],["Answer","Where does he live?"],["Discuss","Would you like to live underground? Why?"],["דברו בזוגות","האם הייתם רוצים לגור מתחת לאדמה? מדוע?"],["Write","Compare your town with Coober Pedy. Write three sentences."],["כתיבה","כתבו שלושה משפטי השוואה"],["Exit Ticket","Australia is ___ than Israel. Some people ___ underground."],["Answers","bigger · live"],["Today I can","Describe · compare · translate · explain"],["כל הכבוד","לתאר · להשוות · לתרגם · להסביר"]];let index=0;let utterance=null;const $=id=>document.getElementById(id);
const images={0:["https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=1100","Sydney, Australia"],8:["https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1100","Dry landscape"],22:["https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?w=1100","City skyline"]};
function stop(){if('speechSynthesis' in window)window.speechSynthesis.cancel();utterance=null}
function render(n){index=Math.max(0,Math.min(slides.length-1,n));stop();const s=slides[index],he=index%2===1;$('inner').classList.toggle('he',he);$('heading').textContent=s[0];$('heading').dir=he?'rtl':'ltr';const content=$('body');content.replaceChildren();const raw=String(s[1]);const segments=raw.split(/\\n|\n|\s*[·•]\s*|(?<=[.!?])\s+(?=[A-Zא-ת])/u).map(x=>x.trim()).filter(Boolean);for(const segment of segments){const line=document.createElement('div');line.className='line';const isHebrew=/[\u0590-\u05ff]/.test(segment);line.dir=isHebrew?'rtl':'ltr';line.lang=isHebrew?'he':'en';line.textContent=segment;content.append(line)}$('lang').textContent=he?'עברית · הסבר / פתרון':'ENGLISH · DISCOVER';$('eyebrow').textContent=he?'בדקו את התשובה':'Read · Think · Say it aloud';$('count').textContent=(index+1)+' / '+slides.length;$('bar').style.width=(index+1)/slides.length*100+'%';const img=$('visual'),v=images[index];img.hidden=!v;if(v){img.src=v[0];img.alt=v[1];img.onerror=()=>img.hidden=true;}history.replaceState(null,'','#slide-'+(index+1));}
function next(){render(index+1)}function prev(){render(index-1)}window.next=next;window.prev=prev;
function listen(){if(!('speechSynthesis' in window)){alert('Audio is unavailable on this browser');return}stop();utterance=new SpeechSynthesisUtterance(slides[index].join('. '));utterance.lang=index%2?'he-IL':'en-US';utterance.rate=Number($('speed').value);speechSynthesis.speak(utterance)}
$('next').onclick=next;$('back').onclick=prev;$('listen').onclick=listen;$('pause').onclick=()=>{if(!('speechSynthesis' in window))return;if(speechSynthesis.paused)speechSynthesis.resume();else speechSynthesis.pause()};
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()}});
/* Whole-slide swipe: up/left = next, down/right = previous. Pointer and touch fallbacks. */
let gesture=null,lastSwipe=0;
function gestureStart(x,y){gesture={x,y,time:Date.now()}}
function gestureEnd(x,y){if(!gesture)return;const dx=x-gesture.x,dy=y-gesture.y;gesture=null;const primary=Math.abs(dy)>=Math.abs(dx)?dy:dx;if(Math.abs(primary)<42||Date.now()-lastSwipe<220)return;lastSwipe=Date.now();primary<0?next():prev()}
const surface=$('slide');
surface.addEventListener('touchstart',e=>{if(e.touches.length===1)gestureStart(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
surface.addEventListener('touchmove',e=>{if(gesture&&e.cancelable)e.preventDefault()},{passive:false});
surface.addEventListener('touchend',e=>{if(e.changedTouches.length)gestureEnd(e.changedTouches[0].clientX,e.changedTouches[0].clientY)},{passive:true});
surface.addEventListener('touchcancel',()=>gesture=null);
surface.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;gestureStart(e.clientX,e.clientY)},{passive:true});
surface.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;gestureEnd(e.clientX,e.clientY)},{passive:true});
window.addEventListener('hashchange',()=>{const n=Number(location.hash.match(/slide-(\d+)/)?.[1]);if(n&&n!==index+1)render(n-1)});render(Number(location.hash.match(/slide-(\d+)/)?.[1]||1)-1);
