const byId=id=>document.getElementById(id);
let cur=0,scale=1,revealed=new Set(),ans=new Map(),menuOpen=false;
function actionLink(url,label,cls="primary"){return '<a class="linkbtn '+cls+'" href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(label)+'</a>';}
function blockAnswer(s){return '<button class="revealbtn" data-reveal="answer">'+(revealed.has(cur+":answer")?"הסתר תשובה":"חשפו דוגמה / הסבר")+'</button>'+(revealed.has(cur+":answer")?'<div class="hiddenAnswer">'+(s.answer?'<p class="en" style="white-space:pre-line">'+esc(s.answer)+'</p>':'')+(s.why?'<div>'+esc(s.why)+'</div>':'')+'</div>':'');}
function build(s){
 let h='<div class="kicker">GRADE 8 · UNIT 2 · '+esc(s.name)+'</div>';
 if(s.type==="cover"||s.type==="section"||s.type==="outro")return h+'<h1 lang="en" dir="ltr" style="text-align:left">'+esc(s.title)+'</h1><p class="lead en">'+esc(s.sub||'')+'</p><div class="callout">'+esc(s.foot||'')+'</div>';
 if(s.type==="agenda")return h+'<h2>'+esc(s.title)+'</h2><div class="slidelist">'+s.items.map((x,i)=>'<div>'+(i+1)+'. '+esc(x)+'</div>').join('')+'</div>';
 if(s.type==="earth")return h+'<h2>'+esc(s.title)+'</h2><div class="earthrow"><div class="hem"><div class="season"><strong>ישראל</strong><div class="en-center">January = Winter</div></div><div class="season"><strong>אוסטרליה</strong><div class="en-center">January = Summer</div></div></div><div class="earth"><div class="equator"></div></div></div><div class="callout">אוסטרליה נמצאת <strong>מדרום</strong> לקו המשווה. ציר כדור הארץ נטוי; לכן עונות השנה בחצי הכדור הדרומי והצפוני הפוכות.</div>';
 if(s.type==="table"){let head=s.rows[0];return h+'<h2 class="en">'+esc(s.title)+'</h2><table class="table"><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+s.rows.slice(1).map(row=>'<tr>'+row.map(x=>'<td><span class="'+(/^[A-Za-z /–-]+$/.test(x)?"en":"")+'">'+esc(x)+'</span></td>').join('')+'</tr>').join('')+'</tbody></table><p class="muted" style="margin-top:12px">'+esc(s.bottom||'')+'</p>';}
 if(s.type==="map")return h+'<h2>'+esc(s.title)+'</h2><div class="two"><div><img class="climate-map" src="https://www.bom.gov.au/sites/default/files/styles/1536/public/2023-07/climate-across-australia-climate-zones_0.png.webp?itok=JxpTwWnJ" alt="מפת אזורי האקלים של אוסטרליה, השירות המטאורולוגי האוסטרלי"><div class="muted" style="font-size:13px">© Bureau of Meteorology · שימוש חינוכי · קישור למקור הרשמי</div></div><div><p class="lead">'+esc(s.sub)+'</p><div class="callout">Tropical NORTH • Desert INTERIOR • Cooler SOUTH</div>'+actionLink(LINK.maps,"הגדלת המפה באתר הרשמי")+'</div></div>';
 if(s.type==="vocab")return h+'<h2 class="en">'+esc(s.title)+'</h2><div class="cardgrid">'+s.items.map((w,j)=>{const visible=revealed.has(cur+":"+j);return '<article class="vocab"><div class="emoji">'+w.icon+'</div><div class="word">'+esc(w.en)+'</div><div class="sentence">'+esc(w.ex)+'</div><div class="translation">'+(visible?esc(w.he):"________________")+'</div><button data-vocab="'+j+'">'+(visible?"הסתר פירוש":"גלו פירוש")+'</button></article>';}).join('')+'</div>';
 if(s.type==="quiz"){const pick=ans.get(cur);return h+'<h2>'+esc(s.title)+'</h2><p class="prompt en">'+esc(s.prompt)+'</p><div class="choices">'+s.choices.map((choice,i)=>{const mark=pick!==undefined&&(i===s.correct?" good":i===pick?" bad":"");return '<button class="choice'+mark+'" data-choice="'+i+'">'+esc(choice)+'</button>';}).join('')+'</div>'+(pick!==undefined?'<div class="feedback">'+(pick===s.correct?"✓ נכון! ":"נסו שוב. ")+esc(pick===s.correct?s.explain:"חפשו את מילת המפתח בטקסט או במפה.")+'</div>':'<p class="muted">בחרו תשובה. כל אחד יכול לנסות שוב עד להצלחה.</p>');}
 if(s.type==="reading")return h+'<h2 class="en">'+esc(s.title)+'</h2><p class="muted en">'+esc(s.sub)+'</p><ol class="list">'+s.instructions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><div class="buttons">'+actionLink(s.link,s.text)+actionLink(LINK.unit,"דף היחידה והמפות","secondary")+'</div><div class="callout">ההקלטה מתחילה בלחיצה בתוך חלון ה־Read-Along. לחצו על חזור/הציגו חלון זה לאחר האזנה.</div>';
 if(s.type==="maptown")return h+'<h2 class="en">'+esc(s.title)+'</h2><iframe class="map" loading="lazy" title="OpenStreetMap Coober Pedy" src="https://www.openstreetmap.org/export/embed.html?bbox=132.9%2C-30.9%2C136.6%2C-27.1&amp;layer=mapnik&amp;marker=-29.012%2C134.755"></iframe><div class="buttons">'+actionLink("https://www.openstreetmap.org/?mlat=-29.012&mlon=134.755#map=7/-29.012/134.755","פתיחת המפה המלאה")+'</div>';
 if(s.type==="intro")return h+'<h2 class="en">'+esc(s.title)+'</h2><p class="lead en">'+esc(s.sub)+'</p><div class="slidelist">'+s.lines.map(x=>'<div class="en">'+esc(x)+'</div>').join('')+'</div><div class="buttons">'+actionLink("https://www.cooberpedy.com/fayes-historic-underground-home/","צפו בבית אמיתי מתחת לאדמה")+'</div>';
 if(s.type==="grammar")return h+'<h2 class="en">'+esc(s.title)+'</h2><div class="grammar">'+s.parts.map(([word,kind])=>'<div class="chunk '+kind+'">'+esc(word)+'</div>').join('')+'</div><div class="slidelist">'+s.notes.map(x=>'<div>'+esc(x)+'</div>').join('')+'</div>';
 if(s.type==="preps")return h+'<h2 class="en">'+esc(s.title)+'</h2><div class="preps"><div><b class="en">under</b><p>מתחת למשהו</p><p class="en">under the ground</p><div class="study-icon">⬇️</div></div><div><b class="en">inside</b><p>בתוך משהו</p><p class="en">inside the rock</p><div class="study-icon">📥</div></div><div><b class="en">above</b><p>מעל משהו</p><p class="en">above the desert</p><div class="study-icon">⬆️</div></div></div>';
 if(s.type==="worksheet")return h+'<h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.text)+'</p><div class="buttons">'+actionLink(LINK.worksheet,"דף העבודה · שני עמודים")+actionLink(LINK.pdf,"PDF להדפסה","secondary")+'</div><div class="callout">מומלץ לבצע בכיתה סעיפים א, ב, ג, ד, ז; את שאלות ההבנה שנותרו אפשר להשלים בבית.</div>';
 if(s.type==="reveal")return h+'<h2 class="en">'+esc(s.title)+'</h2><p class="prompt en" style="white-space:pre-line">'+esc(s.q)+'</p>'+blockAnswer(s);
 return h+'<h2>'+esc(s.title)+'</h2>';
}
function render(){
 const s=S[cur];byId('stage').innerHTML=build(s);byId('counter').textContent=(cur+1)+' / '+S.length;byId('minute').textContent=s.time||'';byId('focus').textContent=s.name;byId('progress').style.width=((cur+1)/S.length*100)+'%';
 byId('prev').disabled=cur===0;byId('next').disabled=cur===S.length-1;
 byId('stage').querySelectorAll('[data-vocab]').forEach(el=>el.addEventListener('click',()=>{const key=cur+':'+el.dataset.vocab;if(revealed.has(key))revealed.delete(key);else revealed.add(key);render()}));
 byId('stage').querySelectorAll('[data-reveal]').forEach(el=>el.addEventListener('click',()=>{const key=cur+':answer';if(revealed.has(key))revealed.delete(key);else revealed.add(key);render()}));
 byId('stage').querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{ans.set(cur,Number(el.dataset.choice));render()}));
}
function go(n){cur=Math.max(0,Math.min(S.length-1,n));render();}
byId('next').onclick=()=>go(cur+1);byId('prev').onclick=()=>go(cur-1);
byId('font-larger').onclick=()=>{scale=Math.min(1.35,scale+.08);document.documentElement.style.setProperty('--font-scale',scale)};
byId('font-smaller').onclick=()=>{scale=Math.max(.8,scale-.08);document.documentElement.style.setProperty('--font-scale',scale)};
byId('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
const dialog=byId('contents');
byId('menu').onclick=()=>{byId('toc').innerHTML=S.map((s,i)=>'<button class="ctl" data-jump="'+i+'" style="text-align:right">'+(i+1)+'. '+esc(s.name)+' · '+esc(s.time||'')+'</button>').join('');byId('toc').querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{go(+el.dataset.jump);dialog.close()});dialog.showModal()};
byId('close').onclick=()=>dialog.close();
document.addEventListener('keydown',e=>{if(dialog.open||e.target.matches("button,input,textarea,select"))return;if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){e.preventDefault();go(cur+1)}else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}});
let touch=null;byId('stage').addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
byId('stage').addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>75)go(cur+(Math.abs(dx)>Math.abs(dy)?(dx<0?1:-1):(dy<0?1:-1)));touch=null},{passive:true});
render();
</script></body></html>
