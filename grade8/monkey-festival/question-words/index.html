<script>
const S=[{"type":"cover","k":"THE MONKEY FESTIVAL · PART ONE A–F","t":"18 sentences · Read Along + Questions","s":"לכל משפט: אנגלית Read Along → עברית Read Along → שאלה → תשובה והסבר → מבנה → תרגול"},{"type":"readEn","n":1,"sec":"A","text":"I am at one of the most unusual festivals in the world – the Monkey Festival in Lopburi, Thailand."},{"type":"readHe","n":1,"sec":"A","en":"I am at one of the most unusual festivals in the world – the Monkey Festival in Lopburi, Thailand.","he":"אני נמצא באחד הפסטיבלים הכי יוצאי דופן בעולם – פסטיבל הקופים בלופבורי, תאילנד."},{"type":"question","n":1,"q":"Where is the writer?"},{"type":"answer","n":1,"q":"Where is the writer?","a":"He is at the Monkey Festival in Lopburi, Thailand.","why":"Where asks about a place. Here the sentence uses am/is/are, so we do not need do or does."},{"type":"grammar","n":1,"formula":"Where + is + the writer?","why":"Where asks about a place. Here the sentence uses am/is/are, so we do not need do or does."},{"type":"practice","n":1,"ex":"Where is the Monkey Festival?","pq":"Where ___ the writer?","choices":["is","does"],"good":"is"},{"type":"readEn","n":2,"sec":"A","text":"People are getting ready for the festival, so I finally have some time to write about my adventures."},{"type":"readHe","n":2,"sec":"A","en":"People are getting ready for the festival, so I finally have some time to write about my adventures.","he":"אנשים מתכוננים לפסטיבל, ולכן סוף סוף יש לי קצת זמן לכתוב על ההרפתקאות שלי."},{"type":"question","n":2,"q":"What are people getting ready for?"},{"type":"answer","n":2,"q":"What are people getting ready for?","a":"They are getting ready for the festival.","why":"What asks about a thing or idea. The sentence uses are getting, so the question keeps the verb be before the subject."},{"type":"grammar","n":2,"formula":"What + are + people + getting ready for?","why":"What asks about a thing or idea. The sentence uses are getting, so the question keeps the verb be before the subject."},{"type":"practice","n":2,"ex":"What are the people preparing for?","pq":"What ___ people getting ready for?","choices":["are","do"],"good":"are"},{"type":"readEn","n":3,"sec":"B","text":"Everybody in town gets together and the entire town goes a little crazy on this day!"},{"type":"readHe","n":3,"sec":"B","en":"Everybody in town gets together and the entire town goes a little crazy on this day!","he":"כל האנשים בעיר מתאספים, וכל העיר קצת משתגעת ביום הזה!"},{"type":"question","n":3,"q":"Who gets together in town?"},{"type":"answer","n":3,"q":"Who gets together in town?","a":"Everybody in town gets together.","why":"Who can be the subject of the question. When who is the subject, we usually do not add do or does."},{"type":"grammar","n":3,"formula":"Who + gets together + in town?","why":"Who can be the subject of the question. When who is the subject, we usually do not add do or does."},{"type":"practice","n":3,"ex":"Who goes a little crazy on this day?","pq":"Who ___ together in town?","choices":["gets","does get"],"good":"gets"},{"type":"readEn","n":4,"sec":"B","text":"Many people are dressed like monkeys, and the festival has live performances and dances."},{"type":"readHe","n":4,"sec":"B","en":"Many people are dressed like monkeys, and the festival has live performances and dances.","he":"אנשים רבים לבושים כמו קופים, ובפסטיבל יש הופעות חיות וריקודים."},{"type":"question","n":4,"q":"What does the festival have?"},{"type":"answer","n":4,"q":"What does the festival have?","a":"It has live performances and dances.","why":"In the Present Simple, use does with he/she/it. After does, the main verb returns to its base form: have, not has."},{"type":"grammar","n":4,"formula":"What + does + the festival + have?","why":"In the Present Simple, use does with he/she/it. After does, the main verb returns to its base form: have, not has."},{"type":"practice","n":4,"ex":"What do people wear at the festival?","pq":"What does the festival ___?","choices":["have","has"],"good":"have"},{"type":"readEn","n":5,"sec":"C","text":"The first thing you notice when you look around town are the monkeys."},{"type":"readHe","n":5,"sec":"C","en":"The first thing you notice when you look around town are the monkeys.","he":"הדבר הראשון שמבחינים בו כשמסתכלים ברחבי העיר הוא הקופים."},{"type":"question","n":5,"q":"What do you notice first?"},{"type":"answer","n":5,"q":"What do you notice first?","a":"The monkeys.","why":"With you/we/they and plural subjects, use do in Present Simple questions."},{"type":"grammar","n":5,"formula":"What + do + you + notice + first?","why":"With you/we/they and plural subjects, use do in Present Simple questions."},{"type":"practice","n":5,"ex":"What do visitors notice around town?","pq":"What ___ you notice first?","choices":["do","does"],"good":"do"},{"type":"readEn","n":6,"sec":"C","text":"They are everywhere!"},{"type":"readHe","n":6,"sec":"C","en":"They are everywhere!","he":"הם בכל מקום!"},{"type":"question","n":6,"q":"Where are the monkeys?"},{"type":"answer","n":6,"q":"Where are the monkeys?","a":"They are everywhere.","why":"With the verb be, move are before the subject. Do not add do."},{"type":"grammar","n":6,"formula":"Where + are + the monkeys?","why":"With the verb be, move are before the subject. Do not add do."},{"type":"practice","n":6,"ex":"Where are they now?","pq":"Where ___ the monkeys?","choices":["are","do"],"good":"are"},{"type":"readEn","n":7,"sec":"C","text":"I can see a few of them right now."},{"type":"readHe","n":7,"sec":"C","en":"I can see a few of them right now.","he":"אני יכול לראות כמה מהם ממש עכשיו."},{"type":"question","n":7,"q":"How many monkeys can the writer see right now?"},{"type":"answer","n":7,"q":"How many monkeys can the writer see right now?","a":"He can see a few of them.","why":"How many asks about a countable number. With can, the modal itself comes before the subject."},{"type":"grammar","n":7,"formula":"How many + monkeys + can + the writer + see?","why":"How many asks about a countable number. With can, the modal itself comes before the subject."},{"type":"practice","n":7,"ex":"How many can he see right now?","pq":"How many monkeys ___ the writer see?","choices":["can","does can"],"good":"can"},{"type":"readEn","n":8,"sec":"C","text":"They are gathered together on the street corner, playing with each other and making loud noises."},{"type":"readHe","n":8,"sec":"C","en":"They are gathered together on the street corner, playing with each other and making loud noises.","he":"הם מתאספים יחד בפינת הרחוב, משחקים זה עם זה ומשמיעים קולות חזקים."},{"type":"question","n":8,"q":"What are the monkeys doing?"},{"type":"answer","n":8,"q":"What are the monkeys doing?","a":"They are playing with each other and making loud noises.","why":"This asks about an action happening now, so the question uses are + subject + verb-ing."},{"type":"grammar","n":8,"formula":"What + are + the monkeys + doing?","why":"This asks about an action happening now, so the question uses are + subject + verb-ing."},{"type":"practice","n":8,"ex":"Where are they playing?","pq":"What ___ the monkeys doing?","choices":["are","do"],"good":"are"},{"type":"readEn","n":9,"sec":"D","text":"They may look cute, but you have to be careful."},{"type":"readHe","n":9,"sec":"D","en":"They may look cute, but you have to be careful.","he":"הם אולי נראים חמודים, אבל צריך להיזהר."},{"type":"question","n":9,"q":"What do the monkeys look like?"},{"type":"answer","n":9,"q":"What do the monkeys look like?","a":"They look cute.","why":"What ... like? asks for a description. It does not mean 'what do they like?'"},{"type":"grammar","n":9,"formula":"What + do + the monkeys + look like?","why":"What ... like? asks for a description. It does not mean 'what do they like?'"},{"type":"practice","n":9,"ex":"What is the festival like?","pq":"What do the monkeys ___ like?","choices":["look","looks"],"good":"look"},{"type":"readEn","n":10,"sec":"D","text":"These monkeys can cause major trouble."},{"type":"readHe","n":10,"sec":"D","en":"These monkeys can cause major trouble.","he":"הקופים האלה יכולים לגרום לצרות גדולות."},{"type":"question","n":10,"q":"How dangerous can these monkeys be?"},{"type":"answer","n":10,"q":"How dangerous can these monkeys be?","a":"They can cause major trouble.","why":"How + adjective asks about degree: how dangerous, how difficult, how good, how noisy."},{"type":"grammar","n":10,"formula":"How + dangerous + can + these monkeys + be?","why":"How + adjective asks about degree: how dangerous, how difficult, how good, how noisy."},{"type":"practice","n":10,"ex":"How difficult is it to control them?","pq":"How ___ can the monkeys be?","choices":["dangerous","danger"],"good":"dangerous"},{"type":"readEn","n":11,"sec":"D","text":"They like to take things from people, especially food and drinks, and even valuable things, like handbags and sunglasses."},{"type":"readHe","n":11,"sec":"D","en":"They like to take things from people, especially food and drinks, and even valuable things, like handbags and sunglasses.","he":"הם אוהבים לקחת דברים מאנשים, במיוחד אוכל ומשקאות, ואפילו דברים יקרי ערך, כמו תיקים ומשקפי שמש."},{"type":"question","n":11,"q":"What do the monkeys like to take from people?"},{"type":"answer","n":11,"q":"What do the monkeys like to take from people?","a":"Food, drinks and valuable things such as handbags and sunglasses.","why":"What asks about the object of the action. With plural monkeys, use do + base verb."},{"type":"grammar","n":11,"formula":"What + do + the monkeys + like to take?","why":"What asks about the object of the action. With plural monkeys, use do + base verb."},{"type":"practice","n":11,"ex":"Which valuable things are mentioned?","pq":"What ___ the monkeys like to take?","choices":["do","does"],"good":"do"},{"type":"readEn","n":12,"sec":"E","text":"This is an annual festival, and people look forward to it all year."},{"type":"readHe","n":12,"sec":"E","en":"This is an annual festival, and people look forward to it all year.","he":"זהו פסטיבל שנתי, ואנשים מחכים לו כל השנה."},{"type":"question","n":12,"q":"How often does the festival happen?"},{"type":"answer","n":12,"q":"How often does the festival happen?","a":"Once a year. It is annual.","why":"How often asks about frequency. With singular festival, use does, and the main verb is happen."},{"type":"grammar","n":12,"formula":"How often + does + the festival + happen?","why":"How often asks about frequency. With singular festival, use does, and the main verb is happen."},{"type":"practice","n":12,"ex":"When does the festival happen?","pq":"How often does the festival ___?","choices":["happen","happens"],"good":"happen"},{"type":"readEn","n":13,"sec":"E","text":"Early in the morning, people prepare huge plates of fruit and put them on long tables."},{"type":"readHe","n":13,"sec":"E","en":"Early in the morning, people prepare huge plates of fruit and put them on long tables.","he":"מוקדם בבוקר, אנשים מכינים צלחות ענקיות של פירות ומניחים אותן על שולחנות ארוכים."},{"type":"question","n":13,"q":"When do people prepare the fruit?"},{"type":"answer","n":13,"q":"When do people prepare the fruit?","a":"Early in the morning.","why":"When asks about time. With plural people, use do + base verb."},{"type":"grammar","n":13,"formula":"When + do + people + prepare + the fruit?","why":"When asks about time. With plural people, use do + base verb."},{"type":"practice","n":13,"ex":"How much fruit do people prepare?","pq":"When ___ people prepare the fruit?","choices":["do","does"],"good":"do"},{"type":"readEn","n":14,"sec":"E","text":"The tables look beautiful, but they aren’t going to stay that way."},{"type":"readHe","n":14,"sec":"E","en":"The tables look beautiful, but they aren’t going to stay that way.","he":"השולחנות נראים יפים, אבל הם לא יישארו כך."},{"type":"question","n":14,"q":"What do the tables look like?"},{"type":"answer","n":14,"q":"What do the tables look like?","a":"They look beautiful.","why":"What ... look like? asks for appearance or description. It is different from What do they like?"},{"type":"grammar","n":14,"formula":"What + do + the tables + look like?","why":"What ... look like? asks for appearance or description. It is different from What do they like?"},{"type":"practice","n":14,"ex":"What is the town like during the festival?","pq":"What do the tables ___ like?","choices":["look","looks"],"good":"look"},{"type":"readEn","n":15,"sec":"F","text":"The best part of the festival is when thousands of excited monkeys jump on the tables and eat as much fruit as they possibly can."},{"type":"readHe","n":15,"sec":"F","en":"The best part of the festival is when thousands of excited monkeys jump on the tables and eat as much fruit as they possibly can.","he":"החלק הטוב ביותר של הפסטיבל הוא כאשר אלפי קופים נרגשים קופצים על השולחנות ואוכלים כמה שיותר פירות."},{"type":"question","n":15,"q":"When do thousands of monkeys jump on the tables?"},{"type":"answer","n":15,"q":"When do thousands of monkeys jump on the tables?","a":"During the best part of the festival.","why":"When asks at what time something happens. The subject is plural, so use do."},{"type":"grammar","n":15,"formula":"When + do + thousands of monkeys + jump?","why":"When asks at what time something happens. The subject is plural, so use do."},{"type":"practice","n":15,"ex":"How many monkeys jump on the tables?","pq":"When ___ the monkeys jump?","choices":["do","does"],"good":"do"},{"type":"readEn","n":16,"sec":"F","text":"I heard that sometimes the monkeys even have food fights!"},{"type":"readHe","n":16,"sec":"F","en":"I heard that sometimes the monkeys even have food fights!","he":"שמעתי שלפעמים הקופים אפילו עורכים מלחמות אוכל!"},{"type":"question","n":16,"q":"How often do the monkeys have food fights?"},{"type":"answer","n":16,"q":"How often do the monkeys have food fights?","a":"Sometimes.","why":"How often asks about frequency: always, often, sometimes, rarely, never."},{"type":"grammar","n":16,"formula":"How often + do + the monkeys + have + food fights?","why":"How often asks about frequency: always, often, sometimes, rarely, never."},{"type":"practice","n":16,"ex":"What do they sometimes have?","pq":"How often ___ the monkeys have food fights?","choices":["do","does"],"good":"do"},{"type":"readEn","n":17,"sec":"F","text":"I hope they have one today."},{"type":"readHe","n":17,"sec":"F","en":"I hope they have one today.","he":"אני מקווה שתהיה אחת היום."},{"type":"question","n":17,"q":"What does the writer hope will happen today?"},{"type":"answer","n":17,"q":"What does the writer hope will happen today?","a":"He hopes the monkeys will have a food fight.","why":"With the singular subject the writer, use does. The main verb stays hope, not hopes."},{"type":"grammar","n":17,"formula":"What + does + the writer + hope?","why":"With the singular subject the writer, use does. The main verb stays hope, not hopes."},{"type":"practice","n":17,"ex":"What does he hope they have today?","pq":"What does the writer ___?","choices":["hope","hopes"],"good":"hope"},{"type":"readEn","n":18,"sec":"F","text":"What a crazy festival!"},{"type":"readHe","n":18,"sec":"F","en":"What a crazy festival!","he":"איזה פסטיבל משוגע!"},{"type":"question","n":18,"q":"What is the festival like?"},{"type":"answer","n":18,"q":"What is the festival like?","a":"It is crazy, unusual and exciting.","why":"What is ... like? asks for a description. You can answer with adjectives."},{"type":"grammar","n":18,"formula":"What + is + the festival + like?","why":"What is ... like? asks for a description. You can answer with adjectives."},{"type":"practice","n":18,"ex":"How crazy is the festival?","pq":"What ___ the festival like?","choices":["is","does"],"good":"is"},{"type":"summary","t":"Question Toolbox","body":"Present Simple: WH + do / does + subject + V1?\nBE: WH + am / is / are + subject?\nModal: WH + can + subject + V1?\nPresent Continuous: WH + am / is / are + subject + V-ing?\n\nHow many = countable number\nHow much = uncountable amount / price\nHow long = duration\nHow often = frequency\nHow + adjective = degree\nWhat ... like? = description\nWhere ... from? = origin"}];let i=0,activeToken=-1;const stage=document.getElementById("stage"),counter=document.getElementById("counter"),bar=document.getElementById("bar"),audio=document.getElementById("audio");const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const unitBase=new URL("../../unit-1/",location.href),readBase=new URL("../../read-along/",location.href);
const D=window.UNIT_DATA,A=window.GRADE8_ALIGNMENT,STANDARD=window.TEACHERS_READALONG_STANDARD;
const records=JSON.parse(JSON.stringify(window.GRADE8_PHRASES.sentences.slice(0,18)));
records.forEach(r=>r.parts.forEach(p=>p.src=new URL(p.src,readBase).href));
let currentStory=null,currentAlignment=null,currentReveal=false,currentSentenceIndex=0,lastEn=null,lastHe=null;
function isRead(s){return s&&["readEn","readHe"].includes(s.type)}
function clearMarker(){lastEn?.classList.remove("marker");lastHe?.classList.remove("marker");lastEn=null;lastHe=null}
function stopAudio(){narrator?.stop();clearMarker();document.getElementById("play").setAttribute("aria-pressed","false");document.getElementById("play").textContent="▶ הקראה";document.getElementById("readerProgress").style.width="0%"}
function buildEnglish(st){let out="",cur=0;st.tokens.forEach((t,j)=>{out+=E(st.plain.slice(cur,t.startChar))+'<span data-en="'+j+'">'+E(st.plain.slice(t.startChar,t.endChar))+'</span>';cur=t.endChar});out+=E(st.plain.slice(cur));return out}
function buildHebrew(st,a){let out="",cur=0;a.units.forEach((u,j)=>{out+=E(st.he.slice(cur,u.start))+'<span data-he="'+j+'">'+E(st.he.slice(u.start,u.end))+'</span>';cur=u.end});out+=E(st.he.slice(cur));return out}
function renderReader(s){
 document.body.classList.add("readerMode");stopAudio();currentSentenceIndex=s.n-1;currentStory=D.story[currentSentenceIndex];currentAlignment=A[String(s.n)];currentReveal=s.type==="readHe";
 const sheet=document.getElementById("sheet");sheet.classList.toggle("with-translation",currentReveal);document.getElementById("translationSlot").setAttribute("aria-hidden",String(!currentReveal));
 document.getElementById("english").innerHTML=buildEnglish(currentStory);document.getElementById("hebrew").innerHTML=buildHebrew(currentStory,currentAlignment);
 document.getElementById("readerLocation").textContent="A–F · משפט "+s.n+" / 18";document.getElementById("stepLabel").textContent=currentReveal?"אנגלית + עברית":"אנגלית";
 document.getElementById("readerHint").textContent=currentReveal?"התרגום נשאר גלוי לאורך כל ההקראה.":"בשקופית הבאה מתווסף התרגום.";
 document.getElementById("readerCounter").textContent=(i+1)+" / "+S.length;document.getElementById("readerProgress").style.width="0%";
 document.getElementById("readerStatus").textContent=currentReveal?"לחצו על הקראה לעקיבה בשתי השפות.":"ההפסקות בשמע בלבד — 1.5 שניות.";
 narrator.sentence=currentSentenceIndex;narrator.part=0;narrator.offset=0;narrator.queue=[currentSentenceIndex];
 records[currentSentenceIndex].parts.forEach((_,p)=>narrator.prepare(currentSentenceIndex,p).catch(()=>{}));
}
function markToken(idx){
 const en=document.querySelector('[data-en="'+idx+'"]'),h=currentAlignment.map[idx],he=document.querySelector('[data-he="'+h+'"]');
 if(en!==lastEn){lastEn?.classList.remove("marker");en?.classList.add("marker");lastEn=en}
 if(currentReveal&&he!==lastHe){lastHe?.classList.remove("marker");he?.classList.add("marker");lastHe=he}
}
function paint(p){
 const play=document.getElementById("play");play.setAttribute("aria-pressed",String(p.isActive));
 play.textContent=p.isActive?"❚❚ השהיה":(["paused","pausedGap"].includes(p.phase)?"▶ המשך":"▶ הקראה");
 if(p.phase==="idle"){clearMarker();document.getElementById("readerProgress").style.width="0%";return}
 if(p.phase==="loading"){document.getElementById("readerStatus").textContent="טוען הקלטה…";return}
 if(p.phase==="error"){clearMarker();document.getElementById("readerStatus").textContent="ההקלטה לא נטענה. לחצו על הקראה לניסיון נוסף.";return}
 const st=D.story[p.sentence],part=p.segment,time=p.sourceTime;let idx=-1;
 if(["gap","pausedGap","ended"].includes(p.phase))idx=part.lastToken;
 else{
  idx=st.tokens.findIndex((t,n)=>n>=part.firstToken&&n<=part.lastToken&&time>=t.start&&time<t.end);
  if(idx<0)for(let n=part.firstToken;n<=part.lastToken;n++)if(time>=st.tokens[n].start)idx=n;
 }
 if(idx>=0)markToken(idx);
 document.getElementById("readerProgress").style.width=Math.min(100,time/records[p.sentence].duration*100)+"%";
 document.getElementById("readerStatus").textContent=
  p.phase==="gap"?"הפסקה של 1.5 שניות…":
  ["paused","pausedGap"].includes(p.phase)?"ההקראה מושהית — לחצו על המשך.":
  p.phase==="ended"?"סוף המשפט. ממשיכים כשמוכנים.":
  currentReveal?"המרקר עוקב באנגלית ובעברית.":"הקראה באנגלית.";
}
const narrator=new TeacherPhrasePlayer(records,{pauseMs:STANDARD.pauseMs,onUpdate:paint,onComplete:()=>{}});
let rate=STANDARD.defaultSpeed;try{const saved=Number(localStorage.getItem(STANDARD.speedStore));if(STANDARD.speeds.includes(saved))rate=saved}catch(_){}
document.getElementById("speed").value=String(rate);narrator.setRate(rate);
function play(restart=false){
 if(!currentStory)return;
 if(restart)narrator.playFrom(currentSentenceIndex,0,[currentSentenceIndex]);
 else if(narrator.isActive)narrator.pause();
 else if(["paused","pausedGap"].includes(narrator.phase))narrator.resume();
 else narrator.playFrom(currentSentenceIndex,0,[currentSentenceIndex]);
}
document.getElementById("play").onclick=()=>play(false);
document.getElementById("replay").onclick=()=>play(true);
document.getElementById("speed").onchange=()=>{
 rate=Number(document.getElementById("speed").value);narrator.setRate(rate);
 try{localStorage.setItem(STANDARD.speedStore,String(rate))}catch(_){}
};
function renderRegular(s){document.body.classList.remove("readerMode");stopAudio();let h="";if(s.type==="cover")h='<section class="slide"><div class="k">'+E(s.k)+'</div><h1 class="title">'+E(s.t)+'</h1><p class="sub">'+E(s.s)+'</p></section>';if(s.type==="question")h='<section class="slide"><div class="k">SENTENCE '+s.n+' · COMPREHENSION</div><h1 class="title">שאלה על המשפט</h1><p class="q">'+E(s.q)+'</p></section>';if(s.type==="answer")h='<section class="slide"><div class="k">SENTENCE '+s.n+' · ANSWER + WHY</div><p class="q">'+E(s.q)+'</p><div class="card"><p class="a">'+E(s.a)+'</p><p class="note">'+E(s.why)+'</p></div></section>';if(s.type==="grammar")h='<section class="slide"><div class="k">SENTENCE '+s.n+' · QUESTION STRUCTURE</div><h1 class="title">איך בנינו את השאלה?</h1><div class="formula">'+E(s.formula)+'</div><p class="note">'+E(s.why)+'</p></section>';if(s.type==="practice")h='<section class="slide"><div class="k">SENTENCE '+s.n+' · EXAMPLE + PRACTICE</div><div class="example">'+E(s.ex)+'</div><p class="q">'+E(s.pq)+'</p><div class="choices">'+s.choices.map(x=>'<button>'+E(x)+'</button>').join("")+'</div><p id="fb" class="note" hidden>התשובה: <b>'+E(s.good)+'</b></p></section>';if(s.type==="summary")h='<section class="slide"><div class="k">SUMMARY</div><h1 class="title">'+E(s.t)+'</h1><div class="card"><p class="note" style="white-space:pre-line">'+E(s.body)+'</p></div></section>';stage.innerHTML=h;counter.textContent=(i+1)+" / "+S.length;bar.style.width=((i+1)/S.length*100)+"%";if(s.type==="practice"){[...stage.querySelectorAll(".choices button")].forEach(b=>b.onclick=()=>{b.classList.add(b.textContent===s.good?"good":"bad");document.getElementById("fb").hidden=false})}}
function render(){const s=S[i];if(isRead(s))renderReader(s);else renderRegular(s)}
function go(d){stopAudio();const n=i+d;if(n<0||n>=S.length)return;i=n;render()}
document.getElementById("next").onclick=()=>go(1);document.getElementById("prev").onclick=()=>go(-1);document.getElementById("rnext").onclick=()=>go(1);document.getElementById("rdown").onclick=()=>go(1);document.getElementById("rprev").onclick=()=>go(-1);document.getElementById("rup").onclick=()=>go(-1);
document.addEventListener("keydown",e=>{if(e.target.closest("select,input,textarea"))return;if(["ArrowDown","ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(1)}else if(["ArrowUp","ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(-1)}});
let y=null;document.addEventListener("touchstart",e=>{if(e.target.closest("button,a,select"))return;y=e.touches[0].clientY},{passive:true});document.addEventListener("touchend",e=>{if(y==null)return;const d=e.changedTouches[0].clientY-y;if(Math.abs(d)>55)go(d<0?1:-1);y=null},{passive:true});render();
</script></body></html>
