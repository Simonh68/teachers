<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Question Words · The Monkey Festival · כיתה ח׳</title>
<meta name="description" content="מצגת מחזורית: קטע מהסיפור The Monkey Festival, שאלת הבנה, ופירוק דקדוקי של מילות שאלה ומבנה שאלה בהווה ובעבר פשוט.">
<meta name="theme-color" content="#050b14">
<style>
@import url("https://fonts.googleapis.com/css2?family=Heebo:wght@500;600;700;800;900&family=Nunito:wght@700;800;900&display=swap");
:root{--bg:#050b14;--panel:#0c1a2b;--panel2:#122641;--ink:#f4f8ff;--muted:#aac0d8;--cyan:#58e6ff;--lime:#dfff5b;--orange:#ffb45b;--pink:#ff78c8;--line:#2d4968;--good:#7cf2a8;--bad:#ff8181}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:radial-gradient(circle at 85% 12%,#0aa7c834,transparent 35%),radial-gradient(circle at 8% 88%,#dfff5b1e,transparent 29%),var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif}.en,[lang=en]{direction:ltr;text-align:left;font-family:Nunito,Arial,sans-serif;unicode-bidi:plaintext}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:1280px;margin:auto;padding:10px clamp(10px,2vw,20px)}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.dot{width:11px;height:11px;border-radius:50%;background:var(--cyan);box-shadow:0 0 22px var(--cyan)}.home{color:#d9e8f7;text-decoration:none;border:1px solid #ffffff22;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px}.counter{color:var(--muted);font-size:13px;font-weight:800;direction:ltr}.progress{height:4px;background:#ffffff12;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:.25s}.deck{min-height:0;position:relative}.slide{display:none;height:100%;min-height:0;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#0c1c31ee,#07111fee);box-shadow:0 30px 90px #0008,inset 0 1px #ffffff10;padding:clamp(18px,3.2vw,48px);overflow:auto}.slide.active{display:grid}.slide.center{place-content:center;text-align:center}.kicker{color:var(--cyan);font:900 13px Nunito,Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;direction:ltr}.title{font-size:clamp(34px,6vw,78px);line-height:1.02;margin:.15em 0 .25em;font-weight:900;letter-spacing:-1.5px}.subtitle{font-size:clamp(18px,2.4vw,28px);color:var(--muted);font-weight:700;max-width:950px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(14px,2.4vw,28px);align-items:stretch}.card{background:#0f2137;border:1px solid var(--line);border-radius:20px;padding:clamp(16px,2.2vw,28px)}.story{font-size:clamp(23px,3.1vw,42px);line-height:1.55}.story .focus{background:linear-gradient(transparent 56%,#dfff5b66 0);color:#fff}.he{color:#b9fff3;font-size:clamp(17px,2vw,25px);line-height:1.6;margin-top:16px}.question{font-size:clamp(28px,4vw,54px);line-height:1.25;font-weight:900}.answer{font-size:clamp(18px,2.2vw,30px);color:var(--lime);font-weight:900;margin-top:20px}.rule{font-size:clamp(25px,4vw,58px);font-weight:900;line-height:1.25}.formula{direction:ltr;text-align:center;font-family:Nunito,Arial,sans-serif;font-size:clamp(25px,4vw,52px);font-weight:900;background:#06101d;border:1px solid #ffffff18;border-radius:18px;padding:18px;margin:18px 0}.parts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.part{direction:ltr;font-family:Nunito,Arial,sans-serif;font-weight:900;border:1px solid #ffffff22;background:#142944;border-radius:14px;padding:10px 14px;font-size:clamp(18px,2.2vw,30px)}.wh{color:var(--cyan)}.aux{color:var(--lime)}.subj{color:var(--orange)}.verb{color:var(--pink)}.rest{color:#d8e7f6}.note{font-size:clamp(18px,2.2vw,28px);line-height:1.55;color:var(--muted);font-weight:750}.mini{font-size:clamp(17px,1.9vw,24px);color:var(--muted);line-height:1.6}.biglist{display:grid;gap:12px;margin-top:14px}.ex{direction:ltr;text-align:left;font-family:Nunito,Arial,sans-serif;font-size:clamp(20px,2.5vw,34px);font-weight:900;padding:14px 18px;border-radius:16px;background:#081524;border:1px solid #ffffff17}.bad{color:var(--bad)}.good{color:var(--good)}.table{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.pill{display:inline-block;border:1px solid #ffffff22;border-radius:999px;padding:5px 12px;margin:3px;color:#e8f3ff;background:#ffffff08;font-weight:800}.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.choice button{border:1px solid var(--line);border-radius:18px;background:#0f2137;color:var(--ink);padding:18px;min-height:80px;font-size:clamp(20px,2.5vw,32px);font-weight:900;cursor:pointer}.choice button:hover{border-color:var(--cyan)}.choice button.ok{background:#123d2b;border-color:var(--good)}.choice button.no{background:#421d28;border-color:var(--bad)}.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0}.controls button{min-height:44px;border:1px solid var(--line);border-radius:13px;background:#0e2036;color:var(--ink);font-weight:900;padding:8px 14px;cursor:pointer}.controls button.primary{background:#114b57;border-color:var(--cyan)}.hint{font-size:13px;color:var(--muted);font-weight:700}.speaker{border:1px solid var(--cyan);background:#0c3440;color:white;border-radius:999px;padding:8px 14px;font-weight:900;cursor:pointer}.slideTag{position:sticky;top:0;margin:-8px -8px 16px auto;width:max-content;background:#06101ddd;border:1px solid #ffffff14;border-radius:999px;padding:5px 10px;color:var(--muted);font-size:12px}.rtl-title{text-align:right}.cycle{color:var(--lime)}@media(max-width:760px){.grid,.table,.choice{grid-template-columns:1fr}.slide{border-radius:18px}.home{font-size:12px;padding:6px 9px}.brand{font-size:14px}.hint{display:none}.story{font-size:24px}.question{font-size:31px}.formula{font-size:25px}.controls button{padding:7px 10px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="home" href="../">⌂ The Monkey Festival</a>
    <div class="brand"><span class="dot"></span><span>כיתה ח׳ · Question Words</span></div>
    <div class="counter" id="counter">1 / 1</div>
  </header>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <main class="deck" id="deck" aria-live="polite"></main>
  <footer class="controls">
    <button id="prev">→ הקודם</button>
    <span class="hint">החלקה למעלה/למטה או חיצים · Enter לתשובה</span>
    <button class="primary" id="next">הבא ←</button>
  </footer>
</div>
<script>
const slides=[
{type:'cover',k:'THE MONKEY FESTIVAL',t:'מילות שאלה ומבנה שאלה',s:'מהלך חוזר: קטע קצר מהסיפור → שאלת הבנה → פירוק דקדוקי → תרגול.'},
{type:'rule',tag:'מפת השיעור',title:'כל מחזור בנוי אותו דבר',body:'1. קוראים קטע קצר בשיטת Read Along.\n2. עונים על שאלה אחת על הסיפור.\n3. מפרקים את השאלה: מילת שאלה, פועל עזר, נושא, פועל.\n4. בונים שאלה חדשה באותו דגם.'},
{type:'story',cycle:'מחזור 1 · WHERE',story:'I am at one of the most <span class="focus">unusual festivals</span> in the world – the Monkey Festival in Lopburi, Thailand.',he:'אני נמצא באחד הפסטיבלים הכי יוצאי דופן בעולם — פסטיבל הקופים בלופבורי, תאילנד.',q:'Where is the Monkey Festival?',a:'It is in Lopburi, Thailand.'},
{type:'grammar',tag:'WHERE · מקום',title:'Where = איפה?',formula:['Where','is','the Monkey Festival?'],labels:['Question word','be','subject'],note:'כאשר המשפט משתמש ב־am / is / are, לא מוסיפים do או does. הפועל be עצמו עובר לפני הנושא.'},
{type:'examples',tag:'WHERE',title:'עוד שאלות מקום מהסיפור',items:['Where do the monkeys live?','Where does the festival take place?','Where did the visitors stand?','Where are the monkeys now?']},
{type:'choice',tag:'תרגול WHERE',q:'בחרו את השאלה התקינה:',choices:['Where do the festival is?','Where is the festival?'],ok:1,explain:'עם is לא משתמשים ב־do. אומרים: Where is…'},
{type:'story',cycle:'מחזור 2 · WHAT',story:'Many people are dressed like monkeys, and the festival has live performances and dances.',he:'אנשים רבים לבושים כמו קופים, ובפסטיבל יש הופעות חיות וריקודים.',q:'What does the festival have?',a:'It has live performances and dances.'},
{type:'grammar',tag:'WHAT · הווה פשוט',title:'What + does + subject + V1?',formula:['What','does','the festival','have?'],labels:['Question word','helper','subject','base verb'],note:'אחרי does הפועל חוזר לצורת הבסיס: have, לא has.'},
{type:'examples',tag:'DO / DOES',title:'איך בוחרים do או does?',items:['Do + I / you / we / they / the monkeys','Does + he / she / it / one monkey / the festival','What do the monkeys eat?','What does the festival have?']},
{type:'choice',tag:'תרגול WHAT',q:'מה נכון?',choices:['What does the monkey eats?','What does the monkey eat?'],ok:1,explain:'אחרי does משתמשים בפועל בסיס: eat.'},
{type:'story',cycle:'מחזור 3 · HOW MANY / HOW MUCH',story:'Early in the morning, people <span class="focus">prepare</span> huge plates of fruit and put them on long tables.',he:'מוקדם בבוקר, אנשים מכינים צלחות ענקיות של פירות ומניחים אותן על שולחנות ארוכים.',q:'How many plates of fruit do people prepare?',a:'They prepare huge plates of fruit.'},
{type:'grammar',tag:'HOW MANY',title:'How many = כמה? לדברים שסופרים',formula:['How many','plates','do','people','prepare?'],labels:['amount','countable noun','helper','subject','base verb'],note:'plates אפשר לספור: one plate, two plates. לכן משתמשים ב־How many.'},
{type:'examples',tag:'HOW MUCH',title:'How much = כמה? לכמות לא נספרת או מחיר',items:['How much fruit do the monkeys eat?','How much food did they prepare?','How much water do the monkeys drink?','How much did the food cost?']},
{type:'choice',tag:'תרגול MANY / MUCH',q:'בחרו את השאלה הנכונה:',choices:['How many food did they prepare?','How much food did they prepare?'],ok:1,explain:'food ככמות כללית אינה נספרת, לכן How much.'},
{type:'story',cycle:'מחזור 4 · HOW + adjective',story:'They may look cute, but you have to be <span class="focus">careful</span>. These monkeys can cause major trouble.',he:'הם אולי נראים חמודים, אבל צריך להיזהר. הקופים האלה יכולים לגרום לצרות גדולות.',q:'How dangerous are the monkeys?',a:'They are quite dangerous because they can cause trouble.'},
{type:'grammar',tag:'HOW + adjective',title:'How dangerous? לא רק Yes / No',formula:['How','dangerous','are','the monkeys?'],labels:['question word','adjective','be','subject'],note:'השאלה לא שואלת רק האם הם מסוכנים. היא שואלת עד כמה הם מסוכנים.'},
{type:'examples',tag:'HOW + adjective',title:'אפשר לבנות הרבה שאלות עם How',items:['How long does the festival last?','How good is the food?','How difficult is it to organize the festival?','How dangerous are the monkeys?','How popular is the festival?','How crowded does the town become?']},
{type:'choice',tag:'תרגול HOW',q:'איזו שאלה מבקשת רמה ולא כן/לא?',choices:['Are the monkeys dangerous?','How dangerous are the monkeys?'],ok:1,explain:'How dangerous מבקש דרגה: a little / quite / very / extremely.'},
{type:'story',cycle:'מחזור 5 · WHY + PAST',story:'I asked my friend Aroon. He explained that the people of Lopburi admire the monkeys because of a famous story that happened many centuries ago.',he:'שאלתי את חברי ארון. הוא הסביר שאנשי לופבורי מעריצים את הקופים בגלל סיפור מפורסם שקרה לפני מאות שנים.',q:'Why do the people of Lopburi admire the monkeys?',a:'Because of a famous story that happened many centuries ago.'},
{type:'grammar',tag:'WHY',title:'Why = למה? התשובה בדרך כלל מתחילה ב־because',formula:['Why','do','people','admire','the monkeys?'],labels:['Question word','helper','subject','base verb','rest'],note:'Why מבקש סיבה. בתשובה נחפש because / because of / for this reason.'},
{type:'grammar',tag:'PAST SIMPLE',title:'בעבר פשוט משתמשים ב־did',formula:['What','did','Aroon','explain?'],labels:['Question word','helper in past','subject','base verb'],note:'אחרי did הפועל חוזר לצורת הבסיס: explain, לא explained.'},
{type:'examples',tag:'PAST vs PRESENT',title:'אותו רעיון — זמן אחר',items:['Present: Why do people admire the monkeys?','Past: Why did people start this tradition?','Present: What do the monkeys eat?','Past: What did the monkeys eat during the festival?']},
{type:'story',cycle:'מחזור 6 · WHAT … LIKE / WHERE … FROM',story:'Everybody in town gets together and the entire town goes a little crazy on this day!',he:'כל האנשים בעיר מתאספים, וכל העיר קצת משתגעת ביום הזה!',q:'What is the festival like?',a:'It is noisy, crowded, unusual and exciting.'},
{type:'grammar',tag:'WHAT … LIKE?',title:'What is it like? = איך זה? / איזה זה?',formula:['What','is','the festival','like?'],labels:['Question word','be','subject','like'],note:'זה לא “מה הוא אוהב”. זו שאלה על תיאור: noisy, crowded, exciting, unusual.'},
{type:'examples',tag:'WHERE … FROM?',title:'Where … from? = מאיפה?',items:['Where is Aroon from?','Where are the visitors from?','Where is the story from?','Where did the tradition come from?']},
{type:'rule',tag:'סיכום',title:'הנוסחה הגדולה',body:'Present Simple:\nWH + do / does + subject + V1?\n\nPast Simple:\nWH + did + subject + V1?\n\nעם be:\nWH + am / is / are / was / were + subject?\n\nזכרו: אחרי do / does / did — הפועל בצורת בסיס.'},
{type:'examples',tag:'בנק שאלות לכיתה',title:'שאלות שהתלמידים בונים לבד',items:['Where does the festival take place?','What do people prepare?','How much fruit do the monkeys eat?','How dangerous are the monkeys?','How long does the festival last?','Why do people admire the monkeys?','What is the festival like?','Where are the visitors from?','What did Aroon explain?','Why did the tradition begin?']},
{type:'cover',k:'EXIT TASK',t:'בנו 3 שאלות על הסיפור',s:'1 שאלת Where / What · 1 שאלת How · 1 שאלת Why בעבר או בהווה. אחרי כל שאלה כתבו תשובה קצרה.'}
];
const deck=document.getElementById('deck'),counter=document.getElementById('counter'),bar=document.getElementById('bar');let i=0;
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function speak(txt){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/<[^>]+>/g,''));u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function renderSlide(sl,idx){let tag=`<div class="slideTag">${idx+1} / ${slides.length}${sl.tag?' · '+sl.tag:''}</div>`;if(sl.type==='cover')return `<section class="slide center"><div><div class="kicker">${sl.k}</div><h1 class="title">${sl.t}</h1><p class="subtitle">${sl.s}</p></div></section>`;if(sl.type==='rule')return `<section class="slide"><div>${tag}<div class="kicker">${sl.tag}</div><h1 class="title">${sl.title}</h1><div class="card"><p class="rule" style="white-space:pre-line">${sl.body}</p></div></div></section>`;if(sl.type==='story')return `<section class="slide"><div>${tag}<div class="kicker cycle">${sl.cycle}</div><div class="grid"><div class="card"><button class="speaker" onclick="speak(\`${sl.story.replace(/`/g,'')}\`)">▶ Read Along</button><p class="story en">${sl.story}</p><p class="he">${sl.he}</p></div><div class="card"><div class="kicker">Question</div><p class="question en">${sl.q}</p><details><summary class="answer">Show answer</summary><p class="answer en">${sl.a}</p></details></div></div></div></section>`;if(sl.type==='grammar')return `<section class="slide"><div>${tag}<div class="kicker">${sl.tag}</div><h1 class="title rtl-title">${sl.title}</h1><div class="formula">${sl.formula.join(' ')}</div><div class="parts">${sl.formula.map((p,j)=>`<span class="part ${['wh','aux','subj','verb','rest'][j]||'rest'}">${p}<br><small>${sl.labels[j]||''}</small></span>`).join('')}</div><p class="note">${sl.note}</p></div></section>`;if(sl.type==='examples')return `<section class="slide"><div>${tag}<div class="kicker">${sl.tag}</div><h1 class="title rtl-title">${sl.title}</h1><div class="biglist">${sl.items.map(x=>`<div class="ex">${esc(x)}</div>`).join('')}</div></div></section>`;if(sl.type==='choice')return `<section class="slide"><div>${tag}<div class="kicker">${sl.tag}</div><h1 class="title rtl-title">${sl.q}</h1><div class="choice">${sl.choices.map((c,j)=>`<button class="en" onclick="this.classList.add(${j===sl.ok?'\'ok\'':'\'no\''});document.getElementById('fb${idx}').hidden=false">${esc(c)}</button>`).join('')}</div><p id="fb${idx}" class="answer" hidden>${sl.explain}</p></div></section>`}
}
function render(){deck.innerHTML=slides.map(renderSlide).join('');show(0)}
function show(n){const all=[...document.querySelectorAll('.slide')];i=(n+slides.length)%slides.length;all.forEach((s,k)=>s.classList.toggle('active',k===i));counter.textContent=`${i+1} / ${slides.length}`;bar.style.width=`${((i+1)/slides.length)*100}%`;document.querySelector('.slide.active')?.focus?.()}
document.getElementById('next').onclick=()=>show(i+1);document.getElementById('prev').onclick=()=>show(i-1);document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowLeft','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)} if(['ArrowUp','ArrowRight','PageUp'].includes(e.key)){e.preventDefault();show(i-1)} if(e.key==='Home')show(0); if(e.key==='End')show(slides.length-1)});let y=null;deck.addEventListener('touchstart',e=>{y=e.touches[0].clientY},{passive:true});deck.addEventListener('touchend',e=>{if(y==null)return;let d=e.changedTouches[0].clientY-y;if(Math.abs(d)>45)show(i+(d<0?1:-1));y=null},{passive:true});render();
</script>
</body>
</html>
