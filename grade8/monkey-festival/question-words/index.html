<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מצגת 8 באוקטובר · Question Words · The Monkey Festival</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Nunito:wght@700;800;900&display=swap");
:root{--bg:#050b14;--p:#0d1d31;--p2:#122842;--ink:#f5f9ff;--mut:#abc1d9;--cyan:#58e6ff;--lime:#dfff5b;--line:#2d4968}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;overflow:hidden}
.app{height:100dvh;max-width:1280px;margin:auto;display:grid;grid-template-rows:auto 4px 1fr auto;padding:10px 14px}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:10px}.home{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 11px}.brand{font-weight:900}.progress{background:#ffffff16;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));width:0}
main{min-height:0;padding:8px 0}.slide{height:100%;overflow:auto;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,48px);background:linear-gradient(145deg,#0d1d31,#07101d);display:grid;align-content:center}
.k{font:900 13px Nunito,Arial,sans-serif;color:var(--cyan);letter-spacing:.15em}.title{font-size:clamp(36px,6vw,76px);line-height:1.05;margin:.18em 0}.sub{font-size:clamp(19px,2.5vw,30px);color:var(--mut);font-weight:700}.story{direction:ltr;text-align:left;font:800 clamp(25px,3.2vw,42px)/1.55 Nunito,Arial,sans-serif}.he{color:#b7fff2;font-size:clamp(18px,2vw,25px)}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.card{background:var(--p2);border:1px solid var(--line);border-radius:20px;padding:22px}.q{direction:ltr;text-align:left;font:900 clamp(27px,3.6vw,48px)/1.25 Nunito,Arial,sans-serif}.ans{direction:ltr;text-align:left;color:var(--lime);font:900 clamp(20px,2.4vw,30px) Nunito,Arial,sans-serif}.formula{direction:ltr;text-align:center;font:900 clamp(25px,4vw,50px) Nunito,Arial,sans-serif;background:#06101d;padding:18px;border-radius:18px;margin:20px 0}.note{font-size:clamp(19px,2.2vw,28px);color:var(--mut);font-weight:700}.examples{display:grid;gap:12px}.ex{direction:ltr;text-align:left;font:900 clamp(20px,2.5vw,32px) Nunito,Arial,sans-serif;background:#081524;border:1px solid #ffffff16;padding:14px 18px;border-radius:14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choices button,footer button,.speak{background:#10253d;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:900;font-size:18px}.choices button.good{border-color:#7cf2a8;background:#123d2b}.choices button.bad{border-color:#ff8181;background:#421d28}.speak{border-color:var(--cyan);cursor:pointer;margin-bottom:14px}.counter{direction:ltr;color:var(--mut);font-weight:800}
@media(max-width:760px){.grid,.choices{grid-template-columns:1fr}.slide{border-radius:18px;padding:18px}.story{font-size:24px}.title{font-size:40px}}
</style></head><body><div class="app">
<header><a class="home" href="../">⌂ Monkey Festival</a><div class="brand">כיתה ח׳ · מצגת 8 באוקטובר</div><div class="counter" id="counter"></div></header>
<div class="progress"><div class="bar" id="bar"></div></div><main id="stage"></main>
<footer><button id="prev">→ הקודם</button><span>החלקה / חיצים</span><button id="next">הבא ←</button></footer>
</div><script>
const S=[["cover","THE MONKEY FESTIVAL · 8 OCTOBER","מילות שאלה ומבנה שאלה","קטע מהסיפור → שאלת הבנה → דקדוק → תרגול"],["story","WHERE","I am at one of the most unusual festivals in the world – the Monkey Festival in Lopburi, Thailand.","אני נמצא באחד הפסטיבלים הכי יוצאי דופן בעולם – פסטיבל הקופים בלופבורי, תאילנד.","Where is the Monkey Festival?","It is in Lopburi, Thailand."],["grammar","WHERE + BE","Where is the Monkey Festival?","כאשר יש am / is / are, הפועל be עצמו בא לפני הנושא. לא משתמשים ב־do/does.","Where + is + the Monkey Festival?"],["practice","WHERE","Where ___ the festival?","is|does","is","עם be לא מוסיפים do/does."],["story","WHAT","Many people are dressed like monkeys, and the festival has live performances and dances.","אנשים רבים לבושים כמו קופים, ובפסטיבל יש הופעות חיות וריקודים.","What does the festival have?","It has live performances and dances."],["grammar","WHAT + DOES","What does the festival have?","אחרי does משתמשים בפועל בצורת הבסיס: have, לא has.","What + does + the festival + have?"],["practice","DO / DOES","What ___ the monkeys eat?","do|does","do","the monkeys = they, לכן do."],["story","HOW MANY","Early in the morning, people prepare huge plates of fruit and put them on long tables.","מוקדם בבוקר, אנשים מכינים צלחות ענקיות של פירות ומניחים אותן על שולחנות ארוכים.","How many plates of fruit do people prepare?","They prepare huge plates of fruit."],["grammar","HOW MANY","How many plates do people prepare?","How many בא לפני שם עצם שאפשר לספור: plates, monkeys, visitors.","How many + noun + do/does + subject + V1?"],["grammar","HOW MUCH","How much fruit do the monkeys eat?","How much משמש לכמות שאינה נספרת, וגם למחיר.","How much + noun + do/does/did + subject + V1?"],["practice","MANY / MUCH","___ food did they prepare?","How many|How much","How much","food ככמות כללית אינו נספר."],["story","HOW + ADJECTIVE","They may look cute, but you have to be careful. These monkeys can cause major trouble.","הם אולי נראים חמודים, אבל צריך להיזהר. הקופים האלה יכולים לגרום לצרות גדולות.","How dangerous are the monkeys?","They can be quite dangerous."],["grammar","HOW + adjective","How dangerous are the monkeys?","How + adjective שואל על דרגה, לא רק כן או לא.","How + dangerous / difficult / good / popular / crowded + ...?"],["examples","HOW","עוד שאלות עם HOW","How long does the festival last?|How good is the food?|How difficult is it to organize the festival?|How dangerous are the monkeys?|How popular is the festival?|How crowded does the town become?"],["story","WHY","He explained that the people of Lopburi admire the monkeys because of a famous story that happened many centuries ago.","הוא הסביר שאנשי לופבורי מעריצים את הקופים בגלל סיפור מפורסם שהתרחש לפני מאות שנים.","Why do the people of Lopburi admire the monkeys?","Because of a famous story."],["grammar","WHY","Why do people admire the monkeys?","Why מבקש סיבה. בתשובה נחפש because / because of.","Why + do/does + subject + V1?"],["story","PAST SIMPLE","I asked my friend Aroon, who owns a small business in the center of town.","שאלתי את חברי ארון, שבבעלותו עסק קטן במרכז העיר.","Who did the writer ask?","He asked his friend Aroon."],["grammar","PAST SIMPLE","What did Aroon explain?","בעבר פשוט משתמשים ב־did. אחרי did הפועל חוזר לצורת הבסיס.","WH + did + subject + V1?"],["practice","PAST","Why did the monkeys ___?","came|come","come","אחרי did תמיד V1: come."],["story","WHAT ... LIKE?","Everybody in town gets together and the entire town goes a little crazy on this day!","כל האנשים בעיר מתאספים, וכל העיר קצת משתגעת ביום הזה!","What is the festival like?","It is noisy, crowded, unusual and exciting."],["grammar","WHAT ... LIKE?","What is the festival like?","What ... like? פירושו: איך הוא? איזה הוא? לא 'מה הוא אוהב'.","What + is/are/was/were + subject + like?"],["examples","WHERE ... FROM?","מאיפה?","Where is Aroon from?|Where are the visitors from?|Where is the story from?|Where did the tradition come from?"],["grammar","WHO","Who came to the festival?","כאשר who הוא הנושא, בדרך כלל אין do/does/did.","Who + verb ...?"],["examples","QUESTION BANK","בנק שאלות מהסיפור","Where does the festival take place?|What do people prepare?|How much fruit do the monkeys eat?|How dangerous are the monkeys?|How long does the festival last?|Why do people admire the monkeys?|What is the festival like?|Where are the visitors from?|What did Aroon explain?"],["summary","סיכום","שלוש נוסחאות","Present: WH + do/does + subject + V1?\nPast: WH + did + subject + V1?\nBE: WH + am/is/are/was/were + subject?\n\nאחרי do / does / did — תמיד פועל בצורת בסיס."],["cover","EXIT TASK","בנו 3 שאלות על הסיפור","1 Where/What · 1 How · 1 Why בעבר או בהווה"]]; let i=0; const stage=document.getElementById("stage"), counter=document.getElementById("counter"), bar=document.getElementById("bar");
const E=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}
function render(){
 const s=S[i],t=s[0]; let h="";
 if(t==="cover")h='<section class="slide"><div class="k">'+E(s[1])+'</div><h1 class="title">'+E(s[2])+'</h1><p class="sub">'+E(s[3])+'</p></section>';
 if(t==="story")h='<section class="slide"><div class="k">READ ALONG · '+E(s[1])+'</div><div class="grid"><div class="card"><button class="speak" id="sp">▶ Read Along</button><div class="story">'+E(s[2])+'</div><p class="he">'+E(s[3])+'</p></div><div class="card"><div class="k">QUESTION</div><p class="q">'+E(s[4])+'</p><details><summary>הצג תשובה</summary><p class="ans">'+E(s[5])+'</p></details></div></div></section>';
 if(t==="grammar")h='<section class="slide"><div class="k">'+E(s[1])+'</div><h1 class="title">'+E(s[2])+'</h1><div class="formula">'+E(s[4])+'</div><p class="note">'+E(s[3])+'</p></section>';
 if(t==="examples")h='<section class="slide"><div class="k">'+E(s[1])+'</div><h1 class="title">'+E(s[2])+'</h1><div class="examples">'+s[3].split("|").map(x=>'<div class="ex">'+E(x)+'</div>').join("")+'</div></section>';
 if(t==="practice")h='<section class="slide"><div class="k">תרגול · '+E(s[1])+'</div><h1 class="title">'+E(s[2])+'</h1><div class="choices">'+s[3].split("|").map(x=>'<button>'+E(x)+'</button>').join("")+'</div><p class="note" id="fb" hidden>'+E(s[5])+'</p></section>';
 if(t==="summary")h='<section class="slide"><div class="k">'+E(s[1])+'</div><h1 class="title">'+E(s[2])+'</h1><div class="card"><p class="note" style="white-space:pre-line">'+E(s[3])+'</p></div></section>';
 stage.innerHTML=h; counter.textContent=(i+1)+" / "+S.length; bar.style.width=((i+1)/S.length*100)+"%";
 const sp=document.getElementById("sp"); if(sp)sp.onclick=()=>speak(s[2]);
 if(t==="practice"){[...stage.querySelectorAll(".choices button")].forEach(b=>b.onclick=()=>{b.classList.add(b.textContent===s[4]?"good":"bad");document.getElementById("fb").hidden=false})}
}
function go(d){i=(i+d+S.length)%S.length;render()} document.getElementById("next").onclick=()=>go(1);document.getElementById("prev").onclick=()=>go(-1);
document.addEventListener("keydown",e=>{if(["ArrowDown","ArrowLeft","PageDown"," "].includes(e.key)){e.preventDefault();go(1)}else if(["ArrowUp","ArrowRight","PageUp"].includes(e.key)){e.preventDefault();go(-1)}});let y=null;stage.addEventListener("touchstart",e=>y=e.touches[0].clientY,{passive:true});stage.addEventListener("touchend",e=>{if(y!==null){let d=e.changedTouches[0].clientY-y;if(Math.abs(d)>45)go(d<0?1:-1);y=null}},{passive:true});render();
</script></body></html>
