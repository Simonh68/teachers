*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(circle at 85% 10%,#0aa7c82f,transparent 35%),var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;overflow:hidden}.app{height:100dvh;max-width:1280px;margin:auto;display:grid;grid-template-rows:auto 4px 1fr auto;padding:10px 14px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:10px}.home{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 11px}.brand{font-weight:900}.counter{direction:ltr;color:var(--mut);font-weight:800}.progress{background:#ffffff16;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));width:0}.stage{min-height:0;padding:8px 0}.slide{height:100%;overflow:auto;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,48px);background:linear-gradient(145deg,#0d1d31,#07101d);display:grid;align-content:center}.k{font:900 13px Nunito,Arial,sans-serif;color:var(--cyan);letter-spacing:.13em}.title{font-size:clamp(36px,6vw,76px);line-height:1.05;margin:.18em 0}.sub{font-size:clamp(19px,2.5vw,30px);color:var(--mut);font-weight:700}.story{direction:ltr;text-align:left;font:800 clamp(26px,3.3vw,44px)/1.6 Nunito,Arial,sans-serif}.he{font-size:clamp(18px,2vw,25px);color:#b7fff2;line-height:1.55}.card{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:22px}.q{direction:ltr;text-align:left;font:900 clamp(28px,4vw,52px)/1.25 Nunito,Arial,sans-serif}.a{direction:ltr;text-align:left;color:var(--lime);font:900 clamp(21px,2.6vw,32px) Nunito,Arial,sans-serif}.formula{direction:ltr;text-align:center;font:900 clamp(24px,3.6vw,46px) Nunito,Arial,sans-serif;background:#06101d;padding:18px;border-radius:18px;margin:18px 0}.note{font-size:clamp(19px,2.2vw,28px);line-height:1.55;color:var(--mut);font-weight:700}.speak{border:1px solid var(--cyan);background:#103344;color:#fff;border-radius:999px;padding:9px 14px;font-weight:900;cursor:pointer;width:max-content;margin-bottom:16px}footer button{background:#10253d;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:900;font-size:16px}.small{color:var(--mut);font-size:13px}@media(max-width:700px){.slide{border-radius:18px;padding:18px}.story{font-size:24px}.q{font-size:31px}.title{font-size:40px}.small{display:none}}
</style></head><body><div class="app"><header><a class="home" href="../">⌂ Monkey Festival</a><div class="brand">כיתה ח׳ · מצגת 8 באוקטובר</div><div class="counter" id="counter"></div></header><div class="progress"><div class="bar" id="bar"></div></div><main class="stage" id="stage"></main><footer><button id="prev">→ הקודם</button><span class="small">כל הסיפור · 28 משפטים · החלקה או חיצים</span><button id="next">הבא ←</button></footer></div><script>
const S=[{"type":"cover","k":"THE MONKEY FESTIVAL · 8 OCTOBER","t":"כל הסיפור + מילות שאלה","s":"28 משפטי הסיפור המלאים · Read Along · שאלות הבנה · הווה פשוט · עבר פשוט · מבני WH מגוונים"},{"type":"story","n":1,"ey":"PART ONE · A · SENTENCE 1/28","en":"I am at one of the most unusual festivals in the world – the Monkey Festival in Lopburi, Thailand.","he":"אני נמצא באחד הפסטיבלים הכי יוצאי דופן בעולם – פסטיבל הקופים בלופבורי, תאילנד."},{"type":"story","n":2,"ey":"PART ONE · A · SENTENCE 2/28","en":"People are getting ready for the festival, so I finally have some time to write about my adventures.","he":"אנשים מתכוננים לפסטיבל, ולכן סוף סוף יש לי קצת זמן לכתוב על ההרפתקאות שלי."},{"type":"question","tag":"WHERE / WHAT","q":"Where is the Monkey Festival?","a":"It is in Lopburi, Thailand."},{"type":"grammar","tag":"WHERE / WHAT","q":"Where is the writer? / What are people getting ready for?","formula":"WH + BE + subject?","note":"עם am / is / are לא מוסיפים do או does. הפועל be עצמו עובר לפני הנושא."},{"type":"story","n":3,"ey":"PART ONE · B · SENTENCE 3/28","en":"Everybody in town gets together and the entire town goes a little crazy on this day!","he":"כל האנשים בעיר מתאספים, וכל העיר קצת משתגעת ביום הזה!"},{"type":"story","n":4,"ey":"PART ONE · B · SENTENCE 4/28","en":"Many people are dressed like monkeys, and the festival has live performances and dances.","he":"אנשים רבים לבושים כמו קופים, ובפסטיבל יש הופעות חיות וריקודים."},{"type":"question","tag":"WHAT / WHAT ... LIKE?","q":"What does the festival have?","a":"It has live performances and dances."},{"type":"grammar","tag":"WHAT / WHAT ... LIKE?","q":"What does the festival have? / What is the festival like?","formula":"What + does + subject + V1? / What + is + subject + like?","note":"אחרי does משתמשים בצורת הבסיס. What ... like? שואל איך משהו נראה או מרגיש, לא מה הוא אוהב."},{"type":"story","n":5,"ey":"PART ONE · C · SENTENCE 5/28","en":"The first thing you notice when you look around town are the monkeys.","he":"הדבר הראשון שמבחינים בו כשמסתכלים ברחבי העיר הוא הקופים."},{"type":"story","n":6,"ey":"PART ONE · C · SENTENCE 6/28","en":"They are everywhere!","he":"הם בכל מקום!"},{"type":"question","tag":"WHERE / WHO","q":"Where are the monkeys?","a":"They are everywhere in town."},{"type":"grammar","tag":"WHERE / WHO","q":"Where are the monkeys? / Who is everywhere in town?","formula":"Where + are + subject? / Who + BE + ...?","note":"Who יכול להיות הנושא של השאלה. במקרה כזה לא צריך do/does."},{"type":"story","n":7,"ey":"PART ONE · C · SENTENCE 7/28","en":"I can see a few of them right now.","he":"אני יכול לראות כמה מהם ממש עכשיו."},{"type":"story","n":8,"ey":"PART ONE · C · SENTENCE 8/28","en":"They are gathered together on the street corner, playing with each other and making loud noises.","he":"הם מתאספים יחד בפינת הרחוב, משחקים זה עם זה ומשמיעים קולות חזקים."},{"type":"question","tag":"WHAT / HOW","q":"What are the monkeys doing on the street corner?","a":"They are playing with each other and making loud noises."},{"type":"grammar","tag":"WHAT / HOW","q":"What are the monkeys doing? / How loudly are they behaving?","formula":"What + are + subject + V-ing?","note":"כאן הטקסט מתאר מה קורה עכשיו. How יכול להתחבר גם לתואר או לתואר הפועל."},{"type":"story","n":9,"ey":"PART ONE · D · SENTENCE 9/28","en":"They may look cute, but you have to be careful.","he":"הם אולי נראים חמודים, אבל צריך להיזהר."},{"type":"story","n":10,"ey":"PART ONE · D · SENTENCE 10/28","en":"These monkeys can cause major trouble.","he":"הקופים האלה יכולים לגרום לצרות גדולות."},{"type":"question","tag":"HOW + ADJECTIVE","q":"How dangerous are the monkeys?","a":"They can cause major trouble, so people have to be careful."},{"type":"grammar","tag":"HOW + ADJECTIVE","q":"How dangerous are the monkeys?","formula":"How + adjective + BE + subject?","note":"How dangerous / difficult / good / noisy / crowded שואל על דרגה — לא רק כן או לא."},{"type":"story","n":11,"ey":"PART ONE · D · SENTENCE 11/28","en":"They like to take things from people, especially food and drinks, and even valuable things, like handbags and sunglasses.","he":"הם אוהבים לקחת דברים מאנשים, במיוחד אוכל ומשקאות, ואפילו דברים יקרי ערך, כמו תיקים ומשקפי שמש."},{"type":"story","n":12,"ey":"PART ONE · E · SENTENCE 12/28","en":"This is an annual festival, and people look forward to it all year.","he":"זהו פסטיבל שנתי, ואנשים מחכים לו כל השנה."},{"type":"question","tag":"WHAT / HOW OFTEN","q":"What do the monkeys like to take from people?","a":"They take food, drinks and even valuable things."},{"type":"grammar","tag":"WHAT / HOW OFTEN","q":"What do the monkeys take? / How often does the festival happen?","formula":"WH + do/does + subject + V1?","note":"הווה פשוט מתאר הרגל או עובדה. אחרי do/does הפועל תמיד בצורת הבסיס."},{"type":"story","n":13,"ey":"PART ONE · E · SENTENCE 13/28","en":"Early in the morning, people prepare huge plates of fruit and put them on long tables.","he":"מוקדם בבוקר, אנשים מכינים צלחות ענקיות של פירות ומניחים אותן על שולחנות ארוכים."},{"type":"story","n":14,"ey":"PART ONE · E · SENTENCE 14/28","en":"The tables look beautiful, but they aren’t going to stay that way.","he":"השולחנות נראים יפים, אבל הם לא יישארו כך."},{"type":"question","tag":"WHEN / HOW MUCH / HOW MANY","q":"When do people prepare the fruit?","a":"Early in the morning."},{"type":"grammar","tag":"WHEN / HOW MUCH / HOW MANY","q":"When do people prepare the fruit? / How much fruit do they prepare? / How many tables are there?","formula":"WH phrase + do/does + subject + V1?","note":"How many לדברים שאפשר לספור; How much לכמות שאינה נספרת. When שואל על זמן."},{"type":"story","n":15,"ey":"PART ONE · F · SENTENCE 15/28","en":"The best part of the festival is when thousands of excited monkeys jump on the tables and eat as much fruit as they possibly can.","he":"החלק הטוב ביותר של הפסטיבל הוא כאשר אלפי קופים נרגשים קופצים על השולחנות ואוכלים כמה שיותר פירות."},{"type":"story","n":16,"ey":"PART ONE · F · SENTENCE 16/28","en":"I heard that sometimes the monkeys even have food fights!","he":"שמעתי שלפעמים הקופים אפילו עורכים מלחמות אוכל!"},{"type":"question","tag":"WHEN / HOW MUCH","q":"What happens when thousands of monkeys jump on the tables?","a":"They eat as much fruit as they can."},{"type":"grammar","tag":"WHEN / HOW MUCH","q":"When do the monkeys jump on the tables? / How much fruit do they eat?","formula":"WH + do + subject + V1?","note":"גם במשפט ארוך, שלד השאלה נשאר פשוט: מילת שאלה + עזר + נושא + פועל בסיס."},{"type":"story","n":17,"ey":"PART ONE · F · SENTENCE 17/28","en":"I hope they have one today.","he":"אני מקווה שתהיה אחת היום."},{"type":"story","n":18,"ey":"PART ONE · F · SENTENCE 18/28","en":"What a crazy festival!","he":"איזה פסטיבל משוגע!"},{"type":"question","tag":"HOW OFTEN / WHAT ... LIKE?","q":"How often do the monkeys have food fights?","a":"Sometimes."},{"type":"grammar","tag":"HOW OFTEN / WHAT ... LIKE?","q":"How often do the monkeys have food fights? / What is the festival like?","formula":"How often + do + subject + V1?","note":"How often שואל על תדירות. What ... like? מבקש תיאור."},{"type":"story","n":19,"ey":"PART TWO · G · SENTENCE 19/28","en":"I also noticed the way the people of Lopburi treat the monkeys.","he":"שמתי לב גם לאופן שבו אנשי לופבורי מתייחסים לקופים."},{"type":"story","n":20,"ey":"PART TWO · G · SENTENCE 20/28","en":"They are kind to them and make sure that they are not hungry.","he":"הם נחמדים אליהם ודואגים שלא יהיו רעבים."},{"type":"question","tag":"HOW / WHY","q":"How do the people of Lopburi treat the monkeys?","a":"They are kind to them and make sure they are not hungry."},{"type":"grammar","tag":"HOW / WHY","q":"How do the people treat the monkeys? / Why are the monkeys not hungry?","formula":"How + do + subject + V1? / Why + BE + subject ...?","note":"How שואל על האופן שבו עושים פעולה. Why מבקש סיבה, ולעיתים התשובה מתחילה ב־because."},{"type":"story","n":21,"ey":"PART TWO · G · SENTENCE 21/28","en":"In the beginning, I found this attitude a bit strange.","he":"בהתחלה, הגישה הזאת נראתה לי קצת מוזרה."},{"type":"story","n":22,"ey":"PART TWO · G · SENTENCE 22/28","en":"Why would these people care so much about the monkeys?","he":"למה האנשים האלה דואגים כל כך לקופים?"},{"type":"question","tag":"WHAT / WHY / PAST","q":"Why did the writer find the attitude strange?","a":"Because the monkeys can be scary and often steal things."},{"type":"grammar","tag":"WHAT / WHY / PAST","q":"What did the writer think at first? / Why would people care so much?","formula":"WH + did + subject + V1?","note":"בעבר פשוט משתמשים ב־did. אחרי did חוזרים לפועל בסיס: find, notice, ask, explain."},{"type":"story","n":23,"ey":"PART TWO · G · SENTENCE 23/28","en":"After all, they are quite scary and they often steal things.","he":"הרי הם די מפחידים ולעיתים קרובות גונבים דברים."},{"type":"story","n":24,"ey":"PART TWO · H · SENTENCE 24/28","en":"I asked my friend Aroon, who owns a small business in the center of town.","he":"שאלתי את חברי ארון, שבבעלותו עסק קטן במרכז העיר."},{"type":"question","tag":"HOW OFTEN / WHO / WHAT","q":"Who did the writer ask?","a":"He asked his friend Aroon."},{"type":"grammar","tag":"HOW OFTEN / WHO / WHAT","q":"How often do the monkeys steal things? / Who did the writer ask? / What does Aroon own?","formula":"WH + do/does/did + subject + V1?","note":"אותה מילת שאלה יכולה להופיע בזמנים שונים. העזר מסמן את הזמן: do/does בהווה, did בעבר."},{"type":"story","n":25,"ey":"PART TWO · H · SENTENCE 25/28","en":"He explained that the people of Lopburi admire the monkeys because of a famous story that happened many centuries ago.","he":"הוא הסביר שאנשי לופבורי מעריצים את הקופים בגלל סיפור מפורסם שהתרחש לפני מאות רבות של שנים."},{"type":"story","n":26,"ey":"PART TWO · H · SENTENCE 26/28","en":"It is about Prince Rama and it tells how monkeys helped him save his wife from a horrible monster.","he":"הסיפור הוא על הנסיך ראמה, והוא מספר כיצד קופים עזרו לו להציל את אשתו ממפלצת איומה."},{"type":"question","tag":"WHY / WHEN / HOW LONG","q":"Why do the people admire the monkeys?","a":"Because of a famous story from many centuries ago."},{"type":"grammar","tag":"WHY / WHEN / HOW LONG","q":"Why do people admire the monkeys? / When did the famous story happen? / How long ago did it happen?","formula":"WH phrase + do/did + subject + V1?","note":"How long יכול לשאול משך זמן או כמה זמן עבר. When מצביע על נקודת זמן."},{"type":"story","n":27,"ey":"PART TWO · I · SENTENCE 27/28","en":"They take care of the monkeys and once a year, every November, they honor them by having a monkey festival.","he":"הם דואגים לקופים, ופעם בשנה, בכל נובמבר, הם חולקים להם כבוד באמצעות פסטיבל קופים."},{"type":"story","n":28,"ey":"PART TWO · I · SENTENCE 28/28","en":"They believe that these monkeys will bring them good luck, like they did for Prince Rama.","he":"הם מאמינים שהקופים האלה יביאו להם מזל טוב, כפי שעשו עבור הנסיך ראמה."},{"type":"question","tag":"WHEN / HOW OFTEN / WHY","q":"How often do they honor the monkeys with a festival?","a":"Once a year, every November."},{"type":"grammar","tag":"WHEN / HOW OFTEN / WHY","q":"When do people honor the monkeys? / How often do they have the festival? / Why do they believe the monkeys bring good luck?","formula":"WH + do + subject + V1?","note":"בסיום הסיפור חוזרים להווה פשוט: מנהג קבוע, אמונה קבועה ופסטיבל שחוזר מדי שנה."},{"type":"summary","t":"סיכום מבני השאלה","body":"Present Simple: WH + do / does + subject + V1?\nPast Simple: WH + did + subject + V1?\nBE: WH + am / is / are / was / were + subject?\n\nHow many = כמה דברים נספרים\nHow much = כמה מכמות לא־נספרת / מחיר\nHow long = כמה זמן\nHow often = באיזו תדירות\nHow + adjective = עד כמה\nWhat ... like? = איך הוא / איזה הוא\nWhere ... from? = מאיפה"}];let i=0;const stage=document.getElementById("stage"),counter=document.getElementById("counter"),bar=document.getElementById("bar");const E=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function say(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}
function render(){const s=S[i];let h="";if(s.type==="cover")h='<section class="slide"><div class="k">'+E(s.k)+'</div><h1 class="title">'+E(s.t)+'</h1><p class="sub">'+E(s.s)+'</p></section>';if(s.type==="story")h='<section class="slide"><div class="k">'+E(s.ey)+'</div><button class="speak" id="sp">▶ Read Along</button><div class="story">'+E(s.en)+'</div><p class="he">'+E(s.he)+'</p></section>';if(s.type==="question")h='<section class="slide"><div class="k">QUESTION · '+E(s.tag)+'</div><div class="card"><p class="q">'+E(s.q)+'</p><details><summary>הצג תשובה</summary><p class="a">'+E(s.a)+'</p></details></div></section>';if(s.type==="grammar")h='<section class="slide"><div class="k">GRAMMAR · '+E(s.tag)+'</div><h1 class="title">איך בונים את השאלה?</h1><p class="q">'+E(s.q)+'</p><div class="formula">'+E(s.formula)+'</div><p class="note">'+E(s.note)+'</p></section>';if(s.type==="summary")h='<section class="slide"><div class="k">SUMMARY</div><h1 class="title">'+E(s.t)+'</h1><div class="card"><p class="note" style="white-space:pre-line">'+E(s.body)+'</p></div></section>';stage.innerHTML=h;counter.textContent=(i+1)+" / "+S.length;bar.style.width=((i+1)/S.length*100)+"%";const sp=document.getElementById("sp");if(sp)sp.onclick=()=>say(s.en)}
function go(d){i=(i+d+S.length)%S.length;render()}document.getElementById("next").onclick=()=>go(1);document.getElementById("prev").onclick=()=>go(-1);document.addEventListener("keydown",e=>{if(["ArrowDown","ArrowLeft","PageDown"," "].includes(e.key)){e.preventDefault();go(1)}else if(["ArrowUp","ArrowRight","PageUp"].includes(e.key)){e.preventDefault();go(-1)}});let y=null;stage.addEventListener("touchstart",e=>y=e.touches[0].clientY,{passive:true});stage.addEventListener("touchend",e=>{if(y!==null){const d=e.changedTouches[0].clientY-y;if(Math.abs(d)>45)go(d<0?1:-1);y=null}},{passive:true});render();
</script></body></html>
