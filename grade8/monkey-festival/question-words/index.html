<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>8 באוקטובר · The Monkey Festival · 18 Sentences</title><style>
@import url("https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Nunito:wght@700;800;900&display=swap");
:root{--bg:#050b14;--panel:#0d1d31;--panel2:#122842;--ink:#f5f9ff;--mut:#abc1d9;--cyan:#58e6ff;--lime:#dfff5b;--line:#2d4968;--bad:#ff8b8b}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(circle at 85% 10%,#0aa7c82f,transparent 35%),var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;overflow:hidden}.app{height:100dvh;max-width:1280px;margin:auto;display:grid;grid-template-rows:auto 4px 1fr auto;padding:10px 14px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:10px}.home{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 11px}.brand{font-weight:900}.counter{direction:ltr;color:var(--mut);font-weight:800}.progress{background:#ffffff16;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));width:0}.stage{min-height:0;padding:8px 0}.slide{height:100%;overflow:auto;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,48px);background:linear-gradient(145deg,#0d1d31,#07101d);display:grid;align-content:center}.k{font:900 13px Nunito,Arial,sans-serif;color:var(--cyan);letter-spacing:.13em}.title{font-size:clamp(36px,6vw,76px);line-height:1.05;margin:.18em 0}.sub{font-size:clamp(19px,2.5vw,30px);color:var(--mut);font-weight:700}.story{direction:ltr;text-align:left;font:800 clamp(26px,3.3vw,44px)/1.6 Nunito,Arial,sans-serif}.he{font-size:clamp(18px,2vw,25px);color:#b7fff2;line-height:1.55}.card{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:22px}.q{direction:ltr;text-align:left;font:900 clamp(28px,4vw,52px)/1.25 Nunito,Arial,sans-serif}.a{direction:ltr;text-align:left;color:var(--lime);font:900 clamp(21px,2.6vw,32px) Nunito,Arial,sans-serif}.formula{direction:ltr;text-align:center;font:900 clamp(24px,3.6vw,46px) Nunito,Arial,sans-serif;background:#06101d;padding:18px;border-radius:18px;margin:18px 0}.note{font-size:clamp(19px,2.2vw,28px);line-height:1.55;color:var(--mut);font-weight:700}.speak{border:1px solid var(--cyan);background:#103344;color:#fff;border-radius:999px;padding:9px 14px;font-weight:900;cursor:pointer;width:max-content;margin-bottom:16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choices button{background:#10253d;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;font:900 24px Nunito,Arial,sans-serif}.choices button.good{border-color:var(--lime);background:#163d27}.choices button.bad{border-color:var(--bad);background:#421d28}.example{direction:ltr;text-align:left;font:900 clamp(22px,3vw,38px) Nunito,Arial,sans-serif;color:var(--cyan);margin-bottom:22px}footer button{background:#10253d;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:900;font-size:16px}.small{color:var(--mut);font-size:13px}@media(max-width:700px){.slide{border-radius:18px;padding:18px}.story{font-size:24px}.q{font-size:31px}.title{font-size:40px}.small{display:none}.choices{grid-template-columns:1fr}}
</style></head><body><div class="app"><header><a class="home" href="../">⌂ Monkey Festival</a><div class="brand">כיתה ח׳ · 8 באוקטובר · 18 משפטים</div><div class="counter" id="counter"></div></header><div class="progress"><div class="bar" id="bar"></div></div><main class="stage" id="stage"></main><footer><button id="prev">→ הקודם</button><span class="small">18 משפטים · 5 שקפים לכל משפט</span><button id="next">הבא ←</button></footer></div><script>
const S=[{"type":"cover","k":"THE MONKEY FESTIVAL · PART ONE A–F","t":"18 sentences · Questions & Grammar","s":"מצגת 8 באוקטובר · לכל משפט: Read Along → שאלה → תשובה והסבר → מבנה דקדוקי → דוגמה ותרגול"},{"type":"story","n":1,"sec":"A","en":"I am at one of the most unusual festivals in the world – the Monkey Festival in Lopburi, Thailand.","he":"אני נמצא באחד הפסטיבלים הכי יוצאי דופן בעולם – פסטיבל הקופים בלופבורי, תאילנד."},{"type":"question","n":1,"q":"Where is the writer?"},{"type":"answer","n":1,"q":"Where is the writer?","a":"He is at the Monkey Festival in Lopburi, Thailand.","why":"Where asks about a place. Here the sentence uses am/is/are, so we do not need do or does."},{"type":"grammar","n":1,"formula":"Where + is + the writer?","why":"Where asks about a place. Here the sentence uses am/is/are, so we do not need do or does."},{"type":"practice","n":1,"ex":"Where is the Monkey Festival?","pq":"Where ___ the writer?","choices":["is","does"],"good":"is"},{"type":"story","n":2,"sec":"A","en":"People are getting ready for the festival, so I finally have some time to write about my adventures.","he":"אנשים מתכוננים לפסטיבל, ולכן סוף סוף יש לי קצת זמן לכתוב על ההרפתקאות שלי."},{"type":"question","n":2,"q":"What are people getting ready for?"},{"type":"answer","n":2,"q":"What are people getting ready for?","a":"They are getting ready for the festival.","why":"What asks about a thing or idea. The sentence uses are getting, so the question keeps the verb be before the subject."},{"type":"grammar","n":2,"formula":"What + are + people + getting ready for?","why":"What asks about a thing or idea. The sentence uses are getting, so the question keeps the verb be before the subject."},{"type":"practice","n":2,"ex":"What are the people preparing for?","pq":"What ___ people getting ready for?","choices":["are","do"],"good":"are"},{"type":"story","n":3,"sec":"B","en":"Everybody in town gets together and the entire town goes a little crazy on this day!","he":"כל האנשים בעיר מתאספים, וכל העיר קצת משתגעת ביום הזה!"},{"type":"question","n":3,"q":"Who gets together in town?"},{"type":"answer","n":3,"q":"Who gets together in town?","a":"Everybody in town gets together.","why":"Who can be the subject of the question. When who is the subject, we usually do not add do or does."},{"type":"grammar","n":3,"formula":"Who + gets together + in town?","why":"Who can be the subject of the question. When who is the subject, we usually do not add do or does."},{"type":"practice","n":3,"ex":"Who goes a little crazy on this day?","pq":"Who ___ together in town?","choices":["gets","does get"],"good":"gets"},{"type":"story","n":4,"sec":"B","en":"Many people are dressed like monkeys, and the festival has live performances and dances.","he":"אנשים רבים לבושים כמו קופים, ובפסטיבל יש הופעות חיות וריקודים."},{"type":"question","n":4,"q":"What does the festival have?"},{"type":"answer","n":4,"q":"What does the festival have?","a":"It has live performances and dances.","why":"In the Present Simple, use does with he/she/it. After does, the main verb returns to its base form: have, not has."},{"type":"grammar","n":4,"formula":"What + does + the festival + have?","why":"In the Present Simple, use does with he/she/it. After does, the main verb returns to its base form: have, not has."},{"type":"practice","n":4,"ex":"What do people wear at the festival?","pq":"What does the festival ___?","choices":["have","has"],"good":"have"},{"type":"story","n":5,"sec":"C","en":"The first thing you notice when you look around town are the monkeys.","he":"הדבר הראשון שמבחינים בו כשמסתכלים ברחבי העיר הוא הקופים."},{"type":"question","n":5,"q":"What do you notice first?"},{"type":"answer","n":5,"q":"What do you notice first?","a":"The monkeys.","why":"With you/we/they and plural subjects, use do in Present Simple questions."},{"type":"grammar","n":5,"formula":"What + do + you + notice + first?","why":"With you/we/they and plural subjects, use do in Present Simple questions."},{"type":"practice","n":5,"ex":"What do visitors notice around town?","pq":"What ___ you notice first?","choices":["do","does"],"good":"do"},{"type":"story","n":6,"sec":"C","en":"They are everywhere!","he":"הם בכל מקום!"},{"type":"question","n":6,"q":"Where are the monkeys?"},{"type":"answer","n":6,"q":"Where are the monkeys?","a":"They are everywhere.","why":"With the verb be, move are before the subject. Do not add do."},{"type":"grammar","n":6,"formula":"Where + are + the monkeys?","why":"With the verb be, move are before the subject. Do not add do."},{"type":"practice","n":6,"ex":"Where are they now?","pq":"Where ___ the monkeys?","choices":["are","do"],"good":"are"},{"type":"story","n":7,"sec":"C","en":"I can see a few of them right now.","he":"אני יכול לראות כמה מהם ממש עכשיו."},{"type":"question","n":7,"q":"How many monkeys can the writer see right now?"},{"type":"answer","n":7,"q":"How many monkeys can the writer see right now?","a":"He can see a few of them.","why":"How many asks about a countable number. With can, the modal itself comes before the subject."},{"type":"grammar","n":7,"formula":"How many + monkeys + can + the writer + see?","why":"How many asks about a countable number. With can, the modal itself comes before the subject."},{"type":"practice","n":7,"ex":"How many can he see right now?","pq":"How many monkeys ___ the writer see?","choices":["can","does can"],"good":"can"},{"type":"story","n":8,"sec":"C","en":"They are gathered together on the street corner, playing with each other and making loud noises.","he":"הם מתאספים יחד בפינת הרחוב, משחקים זה עם זה ומשמיעים קולות חזקים."},{"type":"question","n":8,"q":"What are the monkeys doing?"},{"type":"answer","n":8,"q":"What are the monkeys doing?","a":"They are playing with each other and making loud noises.","why":"This asks about an action happening now, so the question uses are + subject + verb-ing."},{"type":"grammar","n":8,"formula":"What + are + the monkeys + doing?","why":"This asks about an action happening now, so the question uses are + subject + verb-ing."},{"type":"practice","n":8,"ex":"Where are they playing?","pq":"What ___ the monkeys doing?","choices":["are","do"],"good":"are"},{"type":"story","n":9,"sec":"D","en":"They may look cute, but you have to be careful.","he":"הם אולי נראים חמודים, אבל צריך להיזהר."},{"type":"question","n":9,"q":"What do the monkeys look like?"},{"type":"answer","n":9,"q":"What do the monkeys look like?","a":"They look cute.","why":"What ... like? asks for a description. It does not mean 'what do they like?'"},{"type":"grammar","n":9,"formula":"What + do + the monkeys + look like?","why":"What ... like? asks for a description. It does not mean 'what do they like?'"},{"type":"practice","n":9,"ex":"What is the festival like?","pq":"What do the monkeys ___ like?","choices":["look","looks"],"good":"look"},{"type":"story","n":10,"sec":"D","en":"These monkeys can cause major trouble.","he":"הקופים האלה יכולים לגרום לצרות גדולות."},{"type":"question","n":10,"q":"How dangerous can these monkeys be?"},{"type":"answer","n":10,"q":"How dangerous can these monkeys be?","a":"They can cause major trouble.","why":"How + adjective asks about degree: how dangerous, how difficult, how good, how noisy."},{"type":"grammar","n":10,"formula":"How + dangerous + can + these monkeys + be?","why":"How + adjective asks about degree: how dangerous, how difficult, how good, how noisy."},{"type":"practice","n":10,"ex":"How difficult is it to control them?","pq":"How ___ can the monkeys be?","choices":["dangerous","danger"],"good":"dangerous"},{"type":"story","n":11,"sec":"D","en":"They like to take things from people, especially food and drinks, and even valuable things, like handbags and sunglasses.","he":"הם אוהבים לקחת דברים מאנשים, במיוחד אוכל ומשקאות, ואפילו דברים יקרי ערך, כמו תיקים ומשקפי שמש."},{"type":"question","n":11,"q":"What do the monkeys like to take from people?"},{"type":"answer","n":11,"q":"What do the monkeys like to take from people?","a":"Food, drinks and valuable things such as handbags and sunglasses.","why":"What asks about the object of the action. With plural monkeys, use do + base verb."},{"type":"grammar","n":11,"formula":"What + do + the monkeys + like to take?","why":"What asks about the object of the action. With plural monkeys, use do + base verb."},{"type":"practice","n":11,"ex":"Which valuable things are mentioned?","pq":"What ___ the monkeys like to take?","choices":["do","does"],"good":"do"},{"type":"story","n":12,"sec":"E","en":"This is an annual festival, and people look forward to it all year.","he":"זהו פסטיבל שנתי, ואנשים מחכים לו כל השנה."},{"type":"question","n":12,"q":"How often does the festival happen?"},{"type":"answer","n":12,"q":"How often does the festival happen?","a":"Once a year. It is annual.","why":"How often asks about frequency. With singular festival, use does, and the main verb is happen."},{"type":"grammar","n":12,"formula":"How often + does + the festival + happen?","why":"How often asks about frequency. With singular festival, use does, and the main verb is happen."},{"type":"practice","n":12,"ex":"When does the festival happen?","pq":"How often does the festival ___?","choices":["happen","happens"],"good":"happen"},{"type":"story","n":13,"sec":"E","en":"Early in the morning, people prepare huge plates of fruit and put them on long tables.","he":"מוקדם בבוקר, אנשים מכינים צלחות ענקיות של פירות ומניחים אותן על שולחנות ארוכים."},{"type":"question","n":13,"q":"When do people prepare the fruit?"},{"type":"answer","n":13,"q":"When do people prepare the fruit?","a":"Early in the morning.","why":"When asks about time. With plural people, use do + base verb."},{"type":"grammar","n":13,"formula":"When + do + people + prepare + the fruit?","why":"When asks about time. With plural people, use do + base verb."},{"type":"practice","n":13,"ex":"How much fruit do people prepare?","pq":"When ___ people prepare the fruit?","choices":["do","does"],"good":"do"},{"type":"story","n":14,"sec":"E","en":"The tables look beautiful, but they aren’t going to stay that way.","he":"השולחנות נראים יפים, אבל הם לא יישארו כך."},{"type":"question","n":14,"q":"What do the tables look like?"},{"type":"answer","n":14,"q":"What do the tables look like?","a":"They look beautiful.","why":"What ... look like? asks for appearance or description. It is different from What do they like?"},{"type":"grammar","n":14,"formula":"What + do + the tables + look like?","why":"What ... look like? asks for appearance or description. It is different from What do they like?"},{"type":"practice","n":14,"ex":"What is the town like during the festival?","pq":"What do the tables ___ like?","choices":["look","looks"],"good":"look"},{"type":"story","n":15,"sec":"F","en":"The best part of the festival is when thousands of excited monkeys jump on the tables and eat as much fruit as they possibly can.","he":"החלק הטוב ביותר של הפסטיבל הוא כאשר אלפי קופים נרגשים קופצים על השולחנות ואוכלים כמה שיותר פירות."},{"type":"question","n":15,"q":"When do thousands of monkeys jump on the tables?"},{"type":"answer","n":15,"q":"When do thousands of monkeys jump on the tables?","a":"During the best part of the festival.","why":"When asks at what time something happens. The subject is plural, so use do."},{"type":"grammar","n":15,"formula":"When + do + thousands of monkeys + jump?","why":"When asks at what time something happens. The subject is plural, so use do."},{"type":"practice","n":15,"ex":"How many monkeys jump on the tables?","pq":"When ___ the monkeys jump?","choices":["do","does"],"good":"do"},{"type":"story","n":16,"sec":"F","en":"I heard that sometimes the monkeys even have food fights!","he":"שמעתי שלפעמים הקופים אפילו עורכים מלחמות אוכל!"},{"type":"question","n":16,"q":"How often do the monkeys have food fights?"},{"type":"answer","n":16,"q":"How often do the monkeys have food fights?","a":"Sometimes.","why":"How often asks about frequency: always, often, sometimes, rarely, never."},{"type":"grammar","n":16,"formula":"How often + do + the monkeys + have + food fights?","why":"How often asks about frequency: always, often, sometimes, rarely, never."},{"type":"practice","n":16,"ex":"What do they sometimes have?","pq":"How often ___ the monkeys have food fights?","choices":["do","does"],"good":"do"},{"type":"story","n":17,"sec":"F","en":"I hope they have one today.","he":"אני מקווה שתהיה אחת היום."},{"type":"question","n":17,"q":"What does the writer hope will happen today?"},{"type":"answer","n":17,"q":"What does the writer hope will happen today?","a":"He hopes the monkeys will have a food fight.","why":"With the singular subject the writer, use does. The main verb stays hope, not hopes."},{"type":"grammar","n":17,"formula":"What + does + the writer + hope?","why":"With the singular subject the writer, use does. The main verb stays hope, not hopes."},{"type":"practice","n":17,"ex":"What does he hope they have today?","pq":"What does the writer ___?","choices":["hope","hopes"],"good":"hope"},{"type":"story","n":18,"sec":"F","en":"What a crazy festival!","he":"איזה פסטיבל משוגע!"},{"type":"question","n":18,"q":"What is the festival like?"},{"type":"answer","n":18,"q":"What is the festival like?","a":"It is crazy, unusual and exciting.","why":"What is ... like? asks for a description. You can answer with adjectives."},{"type":"grammar","n":18,"formula":"What + is + the festival + like?","why":"What is ... like? asks for a description. You can answer with adjectives."},{"type":"practice","n":18,"ex":"How crazy is the festival?","pq":"What ___ the festival like?","choices":["is","does"],"good":"is"},{"type":"summary","t":"Question Toolbox","body":"Present Simple: WH + do / does + subject + V1?\nBE: WH + am / is / are + subject?\nModal: WH + can + subject + V1?\nPresent Continuous: WH + am / is / are + subject + V-ing?\n\nHow many = כמה דברים נספרים\nHow much = כמה מכמות לא־נספרת / מחיר\nHow long = כמה זמן\nHow often = באיזו תדירות\nHow + adjective = עד כמה\nWhat ... like? = איך / איזה\nWhere ... from? = מאיפה\n\nאחרי do / does — הפועל בצורת הבסיס."}];let i=0;const stage=document.getElementById("stage"),counter=document.getElementById("counter"),bar=document.getElementById("bar");const E=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function say(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}
function render(){const s=S[i];let h="";
if(s.type==="cover")h='<section class="slide"><div class="k">'+E(s.k)+'</div><h1 class="title">'+E(s.t)+'</h1><p class="sub">'+E(s.s)+'</p></section>';
if(s.type==="story")h='<section class="slide"><div class="k">PART ONE · '+E(s.sec)+' · SENTENCE '+s.n+'/18</div><button class="speak" id="sp">▶ Read Along</button><div class="story">'+E(s.en)+'</div><p class="he">'+E(s.he)+'</p></section>';
if(s.type==="question")h='<section class="slide"><div class="k">SENTENCE '+s.n+' · COMPREHENSION</div><h1 class="title">שאלה על המשפט</h1><p class="q">'+E(s.q)+'</p></section>';
if(s.type==="answer")h='<section class="slide"><div class="k">SENTENCE '+s.n+' · ANSWER</div><p class="q">'+E(s.q)+'</p><div class="card"><p class="a">'+E(s.a)+'</p><p class="note">'+E(s.why)+'</p></div></section>';
if(s.type==="grammar")h='<section class="slide"><div class="k">SENTENCE '+s.n+' · QUESTION STRUCTURE</div><h1 class="title">איך בנינו את השאלה?</h1><div class="formula">'+E(s.formula)+'</div><p class="note">'+E(s.why)+'</p></section>';
if(s.type==="practice")h='<section class="slide"><div class="k">SENTENCE '+s.n+' · EXAMPLE + PRACTICE</div><div class="example">'+E(s.ex)+'</div><p class="q">'+E(s.pq)+'</p><div class="choices">'+s.choices.map(x=>'<button>'+E(x)+'</button>').join("")+'</div><p id="fb" class="note" hidden>התשובה: <b>'+E(s.good)+'</b></p></section>';
if(s.type==="summary")h='<section class="slide"><div class="k">SUMMARY</div><h1 class="title">'+E(s.t)+'</h1><div class="card"><p class="note" style="white-space:pre-line">'+E(s.body)+'</p></div></section>';
stage.innerHTML=h;counter.textContent=(i+1)+" / "+S.length;bar.style.width=((i+1)/S.length*100)+"%";const sp=document.getElementById("sp");if(sp)sp.onclick=()=>say(s.en);if(s.type==="practice"){[...stage.querySelectorAll(".choices button")].forEach(b=>b.onclick=()=>{b.classList.add(b.textContent===s.good?"good":"bad");document.getElementById("fb").hidden=false})}}
function go(d){i=(i+d+S.length)%S.length;render()}document.getElementById("next").onclick=()=>go(1);document.getElementById("prev").onclick=()=>go(-1);document.addEventListener("keydown",e=>{if(["ArrowDown","ArrowLeft","PageDown"," "].includes(e.key)){e.preventDefault();go(1)}else if(["ArrowUp","ArrowRight","PageUp"].includes(e.key)){e.preventDefault();go(-1)}});let y=null;stage.addEventListener("touchstart",e=>y=e.touches[0].clientY,{passive:true});stage.addEventListener("touchend",e=>{if(y!==null){const d=e.changedTouches[0].clientY-y;if(Math.abs(d)>45)go(d<0?1:-1);y=null}},{passive:true});render();
</script></body></html>
