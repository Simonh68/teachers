function pickVoice(){const v=speechSynthesis.getVoices();return v.find(x=>/Natural|Premium|Enhanced|Google UK|Google US|Samantha|Daniel|Microsoft.*Natural/i.test(x.name)&&/^en/i.test(x.lang))||v.find(x=>/^en-US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))}
function speak(force=false){clearTimeout(timer);speechSynthesis.cancel();if(!audioOn||(!audioUnlocked&&!force))return;const t=decodeURIComponent(nodes[index].dataset.audio||'');if(!t)return;timer=setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.87;const v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u)},2000)}
function show(n){index=Math.max(0,Math.min(nodes.length-1,n));nodes.forEach((x,j)=>x.classList.toggle('active',j===index));counter.textContent=`${index+1} / ${nodes.length}`;progress.style.width=`${(index+1)/nodes.length*100}%`;speak();const b=document.getElementById('startLesson');if(b)b.onclick=()=>{audioUnlocked=true;speak(true);setTimeout(()=>show(1),450)}}
document.getElementById('next').onclick=()=>{audioUnlocked=true;show(index+1)};document.getElementById('prev').onclick=()=>{audioUnlocked=true;show(index-1)};document.getElementById('replayBtn').onclick=()=>{audioUnlocked=true;speak(true)};audioBtn.onclick=()=>{audioOn=!audioOn;audioBtn.classList.toggle('on',audioOn);audioBtn.textContent=audioOn?'🔊 AUDIO':'🔇 MUTED';if(!audioOn)speechSynthesis.cancel();else{audioUnlocked=true;speak(true)}};
window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();audioUnlocked=true;show(index+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();audioUnlocked=true;show(index-1)}if(e.key.toLowerCase()==='r'){audioUnlocked=true;speak(true)}});
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();show(0);
</script>
</body>
