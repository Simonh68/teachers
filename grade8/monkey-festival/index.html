const slides=[
{type:'cover',eyebrow:'GRADE 8 · 60 MINUTES',title:'The Monkey Festival',sub:'Vocabulary · sentence-by-sentence reading · comprehension · translation',audio:'The Monkey Festival. Today we will learn the key vocabulary, read the story sentence by sentence, and prepare for the test.'},
{type:'plan',eyebrow:'TODAY · 60 MINUTES',title:'מה נעשה בשיעור?',audio:'First, vocabulary. Then, sentence by sentence reading. Next, comprehension questions. Finally, translation practice.',plan:[['0–15','Vocabulary'],['15–42','Reading'],['42–53','Questions'],['53–60','Translation + exit']]},
{type:'visual',img:img1,credit:'Supercarwaar · Wikimedia Commons · CC BY-SA',title:'Lopburi, Thailand',text:'Monkeys are part of everyday life in this Thai city. The festival turns that relationship into a public celebration.',audio:'Lopburi is a city in Thailand. Monkeys are part of everyday life there, and the festival turns that relationship into a public celebration.'},
{type:'section',eyebrow:'PART 1 · VOCABULARY',title:'Words before the story',sub:'Look → listen → guess → reveal',audio:'Let us learn the key words before we read the story.'},
{type:'vocab',word:'unusual',example:'This is an unusual festival.',audio:'Unusual. This is an unusual festival.'},
{type:'vocabReveal',word:'unusual',example:'This is an unusual festival.',meaning:'לא רגיל; יוצא דופן',audio:'Unusual means not usual or different from what we expect.'},
{type:'vocab',word:'prepare',example:'People prepare huge plates of fruit.',audio:'Prepare. People prepare huge plates of fruit.'},
{type:'vocabReveal',word:'prepare',example:'People prepare huge plates of fruit.',meaning:'להכין',audio:'Prepare means to make something ready.'},
{type:'vocab',word:'valuable',example:'Monkeys sometimes take valuable things.',audio:'Valuable. Monkeys sometimes take valuable things.'},
{type:'vocabReveal',word:'valuable',example:'Monkeys sometimes take valuable things.',meaning:'יקר ערך; בעל ערך',audio:'Valuable means worth a lot, or important.'},
{type:'vocab',word:'annual',example:'The annual festival happens once a year.',audio:'Annual. The annual festival happens once a year.'},
{type:'vocabReveal',word:'annual',example:'The annual festival happens once a year.',meaning:'שנתי; פעם בשנה',audio:'Annual means happening once every year.'},

{type:'vocabReveal',word:'careful',example:'You have to be careful around the monkeys.',meaning:'זהיר',audio:'Careful means paying attention so that nothing bad happens.'},

{type:'vocabReveal',word:'honor',example:'People honor the monkeys with a festival.',meaning:'לכבד; לחלוק כבוד',audio:'Honor means to show respect.'},
{type:'visual',img:img2,credit:'Adam Jones · Wikimedia Commons · CC BY-SA 2.0',title:'Pause & imagine',text:'Ancient stone, a modern town, and monkeys moving freely between them. What kind of festival would grow in a place like this?',audio:'Look at the place. Ancient stone, a modern town, and monkeys moving freely between them. What kind of festival would grow here?'},
{type:'section',eyebrow:'PART 2 · READING',title:'One sentence at a time',sub:'Listen first. Then read it yourself.',audio:'Now we read one sentence at a time. Listen first, then read it yourself.'},
{type:'story',eyebrow:'STORY · 1',text:'I am at one of the most <span class="focus">unusual festivals</span> in the world – the Monkey Festival in Lopburi, Thailand.',audio:'I am at one of the most unusual festivals in the world, the Monkey Festival in Lopburi, Thailand.'},
{type:'question',level:'basic',label:'שאלה בסיסית · BASIC',q:'<strong>WHERE</strong> does the Monkey Festival take place?',audio:'Where does the Monkey Festival take place?'},
{type:'answer',level:'basic',q:'<strong>WHERE</strong> does the Monkey Festival take place?',a:'It takes place in Lopburi, Thailand.',audio:'It takes place in Lopburi, Thailand.'},
{type:'story',eyebrow:'STORY · 2',text:'Everybody in town gets together, and the entire town goes a little crazy on this day.',audio:'Everybody in town gets together, and the entire town goes a little crazy on this day.'},
{type:'story',eyebrow:'STORY · 3',text:'Many people are dressed like monkeys, and the festival has live performances and dances.',audio:'Many people are dressed like monkeys, and the festival has live performances and dances.'},
{type:'story',eyebrow:'STORY · 4',text:'The monkeys are everywhere. They gather on street corners, play with each other, and make loud noises.',audio:'The monkeys are everywhere. They gather on street corners, play with each other, and make loud noises.'},
{type:'question',level:'basic',label:'שאלה בסיסית · BASIC',q:'<strong>WHAT</strong> are the monkeys doing on the street corners?',audio:'What are the monkeys doing on the street corners?'},
{type:'answer',level:'basic',q:'<strong>WHAT</strong> are the monkeys doing on the street corners?',a:'They are playing with each other and making loud noises.',audio:'They are playing with each other and making loud noises.'},
{type:'story',eyebrow:'STORY · 5',text:'They may look cute, but you have to be <span class="focus">careful</span>. These monkeys can cause major trouble.',audio:'They may look cute, but you have to be careful. These monkeys can cause major trouble.'},
{type:'story',eyebrow:'STORY · 6',text:'They like to take things from people – especially food and drinks, and even <span class="focus">valuable</span> things like handbags and sunglasses.',audio:'They like to take things from people, especially food and drinks, and even valuable things like handbags and sunglasses.'},
{type:'question',level:'basic',label:'שאלה בסיסית · BASIC',q:'<strong>WHICH</strong> two valuable things are mentioned in the text?',audio:'Which two valuable things are mentioned in the text?'},
{type:'answer',level:'basic',q:'<strong>WHICH</strong> two valuable things are mentioned in the text?',a:'Handbags and sunglasses.',audio:'Handbags and sunglasses.'},
{type:'visual',img:img3,credit:'Adam Jones · Wikimedia Commons · CC BY-SA 2.0',title:'A cute face…',text:'The text warns us not to confuse “cute” with “safe.” A good reader notices that contrast.',audio:'The text warns us not to confuse cute with safe. A good reader notices that contrast.'},
{type:'story',eyebrow:'STORY · 7',text:'This is an <span class="focus">annual</span> festival. Early in the morning, people <span class="focus">prepare</span> huge plates of fruit and put them on long tables.',audio:'This is an annual festival. Early in the morning, people prepare huge plates of fruit and put them on long tables.'},
{type:'story',eyebrow:'STORY · 8',text:'The best part is when thousands of excited monkeys jump on the tables and eat as much fruit as they possibly can.',audio:'The best part is when thousands of excited monkeys jump on the tables and eat as much fruit as they possibly can.'},
{type:'story',eyebrow:'STORY · 9',text:'The people of Lopburi are kind to the monkeys and make sure that they are not hungry.',audio:'The people of Lopburi are kind to the monkeys and make sure that they are not hungry.'},
{type:'story',eyebrow:'STORY · 10',text:'At first, the writer finds this attitude strange because the monkeys can be scary and they often steal things.',audio:'At first, the writer finds this attitude strange because the monkeys can be scary and they often steal things.'},
{type:'question',level:'comp',label:'שאלת הבנה · COMPREHENSION',q:'<strong>WHY</strong> does the writer find the people’s attitude strange?',audio:'Why does the writer find the people’s attitude strange?'},
{type:'answer',level:'comp',q:'<strong>WHY</strong> does the writer find the people’s attitude strange?',a:'Because the people are kind to the monkeys even though the monkeys can be scary and often steal things.',audio:'Because the people are kind to the monkeys even though the monkeys can be scary and often steal things.'},
{type:'story',eyebrow:'STORY · 11',text:'Aroon explains an old story about Prince Rama: monkeys helped the prince save his wife from a terrible monster.',audio:'Aroon explains an old story about Prince Rama. Monkeys helped the prince save his wife from a terrible monster.'},
{type:'question',level:'basic',label:'שאלה בסיסית · BASIC',q:'<strong>WHO</strong> explains the old story to the writer?',audio:'Who explains the old story to the writer?'},
{type:'answer',level:'basic',q:'<strong>WHO</strong> explains the old story to the writer?',a:'Aroon explains it.',audio:'Aroon explains it.'},
{type:'story',eyebrow:'STORY · 12',text:'Once a year, every November, the people <span class="focus">honor</span> the monkeys with a festival because they believe the monkeys bring good luck.',audio:'Once a year, every November, the people honor the monkeys with a festival because they believe the monkeys bring good luck.'},
{type:'question',level:'basic',label:'שאלה בסיסית · BASIC',q:'<strong>WHEN</strong> do the people honor the monkeys with a festival?',audio:'When do the people honor the monkeys with a festival?'},
{type:'answer',level:'basic',q:'<strong>WHEN</strong> do the people honor the monkeys with a festival?',a:'Every November.',audio:'Every November.'},
{type:'question',level:'comp',label:'שאלת הבנה · COMPREHENSION',q:'<strong>HOW</strong> does the story about Prince Rama help explain the festival?',audio:'How does the story about Prince Rama help explain the festival?'},
{type:'answer',level:'comp',q:'<strong>HOW</strong> does the story about Prince Rama help explain the festival?',a:'It explains why the people admire the monkeys, care for them, and believe they can bring good luck.',audio:'It explains why the people admire the monkeys, care for them, and believe they can bring good luck.'},
{type:'section',eyebrow:'PART 3 · TEST LANGUAGE',title:'עברית → English',sub:'Use the story vocabulary. Build the sentence.',audio:'Now translate from Hebrew to English. Use the vocabulary from the story.'},
{type:'translation',text:'אנשים מכינים צלחות גדולות של פירות.',hint:'prepare · huge plates · fruit',audio:'Translate this sentence into English.'},
{type:'translationAnswer',text:'אנשים מכינים צלחות גדולות של פירות.',a:'People prepare huge plates of fruit.',audio:'People prepare huge plates of fruit.'},
{type:'translation',text:'צריך להיות זהירים כי הקופים לוקחים דברים מאנשים.',hint:'careful · because · take things from people',audio:'Translate this sentence into English.'},
{type:'translationAnswer',text:'צריך להיות זהירים כי הקופים לוקחים דברים מאנשים.',a:'You have to be careful because the monkeys take things from people.',audio:'You have to be careful because the monkeys take things from people.'},
{type:'exit',eyebrow:'EXIT · 5 MINUTES',title:'Before you leave…',items:['Say 3 vocabulary words without looking.','Answer: WHERE? WHEN? WHO?','Explain one WHY / HOW question.','Translate one sentence from Hebrew.','Read one story sentence aloud.'],audio:'Before you leave, say three vocabulary words, answer where when and who, explain one why or how question, translate one sentence, and read one story sentence aloud.'}
];

const stage=document.getElementById('stage');
function esc(s){return s||''}
function render(s,i){
  let inner='';
  if(s.type==='cover') inner=`<div class="frame"><p class="eyebrow">${s.eyebrow}</p><h1 class="title en">${s.title}</h1><p class="subtitle en">${s.sub}</p><button class="start" id="startLesson">Start lesson + audio</button><p class="smallnote">האודיו מתחיל כ־2 שניות לאחר כל שקף. ניתן להשתיק או להשמיע שוב.</p></div>`;
  else if(s.type==='plan') inner=`<div class="frame"><p class="eyebrow">${s.eyebrow}</p><h1 class="sectionTitle">${s.title}</h1><div class="plan">${s.plan.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div>`;
  else if(s.type==='visual') inner=`<div class="frame"><img src="${s.img}" alt="Lopburi monkeys and temple"><div class="caption"><h2 class="en">${s.title}</h2><p class="en">${s.text}</p></div><span class="credit">${s.credit}</span></div>`;
  else if(s.type==='section') inner=`<div class="frame"><p class="eyebrow">${s.eyebrow}</p><h1 class="sectionTitle en">${s.title}</h1><p class="sectionSub en">${s.sub}</p></div>`;
  else if(s.type==='vocab') inner=`<div class="frame"><p class="eyebrow">VOCABULARY · LISTEN FIRST</p><h1 class="word">${s.word}</h1><p class="example">${s.example}</p></div>`;
  else if(s.type==='vocabReveal') inner=`<div class="frame"><p class="eyebrow">VOCABULARY · REVEAL</p><h1 class="word">${s.word}</h1><p class="example">${s.example}</p><p class="meaning">${s.meaning}</p></div>`;
  else if(s.type==='story') inner=`<div class="frame"><p class="eyebrow">${s.eyebrow}</p><p class="story">${s.text}</p></div>`;
  else if(s.type==='question') inner=`<div class="frame"><span class="pill ${s.level}">${s.label}</span><h1 class="question">${s.q}</h1><p class="instruction">Answer before moving to the next slide.</p></div>`;
  else if(s.type==='answer') inner=`<div class="frame"><span class="pill answer">ANSWER</span><h1 class="question">${s.q}</h1><p class="answerText">${s.a}</p></div>`;
  else if(s.type==='translation') inner=`<div class="frame"><p class="eyebrow">TRANSLATE · HEBREW → ENGLISH</p><h1 class="translationPrompt">${s.text}</h1><p class="hint">Help: ${s.hint}</p></div>`;
  else if(s.type==='translationAnswer') inner=`<div class="frame"><span class="pill answer">ANSWER</span><h1 class="translationPrompt">${s.text}</h1><p class="answerText">${s.a}</p></div>`;
  else if(s.type==='exit') inner=`<div class="frame"><p class="eyebrow">${s.eyebrow}</p><h1 class="sectionTitle en">${s.title}</h1><div class="plan" style="grid-template-columns:1fr 1fr;margin-top:28px">${s.items.map((x,j)=>`<div><b>${j+1}</b><span class="en">${x}</span></div>`).join('')}</div></div>`;
  return `<section class="slide ${s.type==='visual'?'visual':''}" data-audio="${encodeURIComponent(s.audio||'')}" aria-label="Slide ${i+1} of ${slides.length}">${inner}</section>`;
}
stage.innerHTML=slides.map(render).join('');
const nodes=[...document.querySelectorAll('.slide')];
let index=0,audioOn=true,audioUnlocked=false,timer=null;
const counter=document.getElementById('counter'),progress=document.getElementById('progress'),audioBtn=document.getElementById('audioBtn');
function voices(){return speechSynthesis.getVoices()}
function pickVoice(){const vs=voices();return vs.find(v=>/Natural|Premium|Enhanced|Google UK|Google US|Samantha|Daniel|Microsoft.*Natural/i.test(v.name)&&/^en/i.test(v.lang))||vs.find(v=>/^en-GB/i.test(v.lang))||vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))}
function speakCurrent(force=false){clearTimeout(timer);speechSynthesis.cancel();if(!audioOn||(!audioUnlocked&&!force))return;const txt=decodeURIComponent(nodes[index].dataset.audio||'');if(!txt)return;timer=setTimeout(()=>{const u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=.88;u.pitch=1;const v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u)},2000)}
function show(n){index=Math.max(0,Math.min(nodes.length-1,n));nodes.forEach((x,j)=>x.classList.toggle('active',j===index));counter.textContent=`${index+1} / ${nodes.length}`;progress.style.width=`${((index+1)/nodes.length)*100}%`;speakCurrent();const start=document.getElementById('startLesson');if(start)start.onclick=()=>{audioUnlocked=true;speakCurrent(true);setTimeout(()=>show(1),450)};}
document.getElementById('next').onclick=()=>{audioUnlocked=true;show(index+1)};document.getElementById('prev').onclick=()=>{audioUnlocked=true;show(index-1)};
document.getElementById('replayBtn').onclick=()=>{audioUnlocked=true;speakCurrent(true)};audioBtn.onclick=()=>{audioOn=!audioOn;audioBtn.classList.toggle('on',audioOn);audioBtn.textContent=audioOn?'🔊 AUDIO':'🔇 MUTED';if(!audioOn)speechSynthesis.cancel();else{audioUnlocked=true;speakCurrent(true)}};
window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();audioUnlocked=true;show(index+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();audioUnlocked=true;show(index-1)}if(e.key.toLowerCase()==='r'){audioUnlocked=true;speakCurrent(true)}});
window.addEventListener('pointerdown',()=>audioUnlocked=true,{once:true});
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>voices()}
show(0);
</script>
