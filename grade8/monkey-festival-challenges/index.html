let isTranslation=s.type==='create',instruction=isTranslation?'היעזרו במשפטים מהסיפור ותרגמו את המשפט הבא לאנגלית.':s.type==='mc'?'קראו את קטע העזר מהסיפור, ואז בחרו את התשובה הנכונה לשאלה הבאה.':'קראו את קטע העזר מהסיפור, ואז ענו על השאלה הבאה באנגלית.';
html='<p class="label">אתגר '+s.n+' מתוך 41'+(s.hard?' · קצת יותר מאתגר':'')+'</p><h1 class="task-banner '+(isTranslation?'task-translate':'task-question')+'">'+instruction+'</h1><p class="label">'+(isTranslation?'משפטי עזר מהסיפור:':'קטע עזר מהסיפור:')+'</p><div class="refs">'+s.refs.map(x=>en(x)).join('')+'</div><p class="task-label '+(isTranslation?'task-translate-label':'task-question-label')+'">'+(isTranslation?'המשפט לתרגום:':'השאלה:')+'</p><div class="he">'+esc(s.he)+'</div>';
if(s.type==='mc')html+='<div class="options">'+s.options.map((x,i)=>'<div class="option"><button data-choice="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(x)+'</button><button class="speak" data-speak="'+esc(x)+'" aria-label="הקראת אפשרות">🔊</button></div>').join('')+'</div><p id="feedback" role="status"></p>';
else html+='<p>התשובה לדוגמה בשקף הבא — נסו קודם בעצמכם.</p>';
}
stage.innerHTML=html+'<p id="status" role="status"></p>';document.getElementById('count').textContent=(pos+1)+' / '+slides.length;document.getElementById('prev').disabled=pos===0;document.getElementById('next').disabled=pos===slides.length-1;stage.scrollTop=0;try{localStorage.setItem('grade8-exam-prep-slide',String(pos))}catch(e){}
}
function move(n){pos=Math.max(0,Math.min(slides.length-1,pos+n));render()}
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);
document.getElementById('stop').onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel()};
stage.onclick=e=>{
let b=e.target.closest('[data-speak]');if(b){
if(!('speechSynthesis' in window)){document.getElementById('status').textContent='הדפדפן הזה אינו תומך בהקראה. פתחו ב־Chrome או Edge.';return}
speechSynthesis.cancel();utter=new SpeechSynthesisUtterance(b.dataset.speak);utter.lang='en-US';utter.rate=.8;
let voices=speechSynthesis.getVoices();let voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(voice)utter.voice=voice;
utter.onstart=()=>{b.textContent='▶';document.getElementById('status').textContent='הקראה באנגלית'};
utter.onend=()=>{b.textContent='🔊';document.getElementById('status').textContent=''};
utter.onerror=()=>{b.textContent='🔊';document.getElementById('status').textContent='ההקראה לא הופעלה. נסו שוב ובדקו את עוצמת השמע.'};speechSynthesis.speak(utter);return;
}
let a=e.target.closest('[data-choice]');if(a){let q=slides[pos],ok=q.options[Number(a.dataset.choice)]===q.answer;a.classList.add(ok?'good':'bad');document.getElementById('feedback').textContent=ok?'נכון! מצוין.':'נסו שוב. חפשו את המידע במשפט שמעל השאלה.'}
};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='PageDown')move(1);if(e.key==='ArrowRight'||e.key==='PageUp')move(-1)});

// Swipe follows the reading deck convention: left/up next, right/down previous.
let touch=null,ignoreClickUntil=0;
const interactive=t=>t.closest('button,a,input,textarea,select');
stage.addEventListener('touchstart',e=>{
 if(e.touches.length!==1||interactive(e.target)){touch=null;return}
 const t=e.touches[0];touch={x:t.clientX,y:t.clientY,top:stage.scrollTop,done:false};
},{passive:true});
function swipe(dx,dy){
 if(!touch||touch.done||Math.max(Math.abs(dx),Math.abs(dy))<55)return false;
 const horizontal=Math.abs(dx)>Math.abs(dy)*1.25;
 if(!horizontal&&Math.abs(dy)<=Math.abs(dx)*1.25)return false;
 const canScroll=dy<0?stage.scrollHeight-stage.clientHeight-touch.top>5:touch.top>5;
 if(!horizontal&&canScroll)return false;
 touch.done=true;ignoreClickUntil=Date.now()+650;
 move((horizontal?dx:dy)<0?1:-1);return true;
}
stage.addEventListener('touchmove',e=>{
 if(!touch||e.touches.length!==1)return;
 const t=e.touches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;
 if(touch.done){if(e.cancelable)e.preventDefault();return}
 if(Math.abs(dx)>Math.abs(dy)*1.25&&Math.abs(dx)>10&&e.cancelable)e.preventDefault();
 if(swipe(dx,dy)&&e.cancelable)e.preventDefault();
},{passive:false});
stage.addEventListener('touchend',e=>{
 if(!touch)return;
 if(e.changedTouches.length){const t=e.changedTouches[0];swipe(t.clientX-touch.x,t.clientY-touch.y)}
 if(touch.done&&e.cancelable)e.preventDefault();touch=null;
},{passive:false});
stage.addEventListener('touchcancel',()=>{touch=null},{passive:true});
stage.addEventListener('click',e=>{if(Date.now()<ignoreClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
let wheelAt=0;stage.addEventListener('wheel',e=>{
 if(e.ctrlKey||Math.abs(e.deltaY)<25)return;
 const canScroll=e.deltaY>0?stage.scrollTop+stage.clientHeight<stage.scrollHeight-5:stage.scrollTop>5;
 if(canScroll)return;e.preventDefault();
 if(Date.now()-wheelAt<650)return;wheelAt=Date.now();move(e.deltaY>0?1:-1);
},{passive:false});

document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis' in window)speechSynthesis.cancel()});render();
if(new URLSearchParams(location.search).has("download"))document.querySelector("a.pdf").click();
</script></html>
