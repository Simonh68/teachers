<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>כיתה ח׳ — השבוע הראשון</title>
  <meta name="description" content="חומרי פתיחת השנה לכיתה ח׳">
  <meta name="theme-color" content="#050b14">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Heebo:wght@500;600;700;800;900&family=Nunito:wght@700;800;900&display=swap");
    :root{--bg:#050b14;--text:#f5f9ff;--muted:#9eb1c7;--cyan:#53e4ff;--lime:#dfff5b;--line:#29435d}
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;background:radial-gradient(circle at 84% 5%,#0a8cae35,transparent 31%),radial-gradient(circle at 12% 92%,#8ad6001b,transparent 28%),var(--bg);color:var(--text);font-family:"Heebo",Arial,sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 84%)}
    header{position:relative;border-bottom:1px solid #ffffff12;background:#050b14cc;backdrop-filter:blur(18px)}
    .bar{max-width:1180px;margin:auto;padding:17px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:900}.dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px var(--cyan)}
    .back{color:#c8d4e2;text-decoration:none;border:1px solid #ffffff1e;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:900}.back:hover{border-color:var(--cyan);color:#fff}
    main{position:relative;max-width:1180px;margin:auto;padding:clamp(38px,7vw,78px) 22px 60px}
    .hero{display:flex;align-items:end;justify-content:space-between;gap:22px;border-bottom:1px solid #ffffff14;padding-bottom:28px}
    .eyebrow{color:var(--cyan);font:900 12px "Nunito",Arial,sans-serif;letter-spacing:.17em;direction:ltr}
    h1{font-size:clamp(50px,8vw,90px);letter-spacing:-3.5px;line-height:.95;margin:10px 0 12px}
    .hero p{margin:0;color:var(--muted);font-size:18px;font-weight:700}.week-no{color:#ffffff08;font:900 clamp(90px,15vw,180px)/.7 "Nunito",Arial,sans-serif}
    .card{--accent:var(--lime);position:relative;max-width:880px;min-height:330px;margin-top:30px;padding:clamp(28px,5vw,48px);overflow:hidden;display:flex;flex-direction:column;color:inherit;text-decoration:none;background:linear-gradient(145deg,#11263a,#0a1625 66%,#152817);border:1px solid var(--line);border-radius:28px;box-shadow:0 28px 80px #0007,inset 0 1px #ffffff0d;transition:.22s}
    .card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--cyan),var(--accent),transparent)}
    .card:hover{transform:translateY(-5px);border-color:var(--cyan);box-shadow:0 34px 95px #0008,0 0 42px #53e4ff12}
    .index{width:52px;height:52px;display:grid;place-items:center;border:1px solid #53e4ff66;border-radius:16px;background:#53e4ff12;color:var(--cyan);font:900 14px "Nunito",Arial,sans-serif}
    .type{margin-top:24px;color:var(--cyan);font:900 12px "Nunito",Arial,sans-serif;letter-spacing:.13em;direction:ltr;text-align:right}
    .card h2{font-size:clamp(34px,5vw,54px);letter-spacing:-1.5px;line-height:1.05;margin:11px 0 15px}.card p{max-width:720px;margin:0;color:var(--muted);line-height:1.65;font-size:18px;font-weight:650}
    .open{position:relative;z-index:2;margin-top:auto;padding-top:28px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ffffff12;color:#fff;font-weight:900}.open span{color:var(--lime);font-size:28px}
    @media(max-width:640px){.bar{padding:14px 16px}.hero{display:block}.week-no{display:none}h1{font-size:58px}.card{min-height:310px}}
  </style>
</head>
<body>
  <header><div class="bar"><div class="brand"><i class="dot"></i> כיתה ח׳ · השבוע הראשון</div><a class="back" href="../#grade8">חזרה לתפריט הכיתות</a></div></header>
  <main>
    <section class="hero"><div><div class="eyebrow">GRADE 8 · WEEK 01</div><h1>פתיחת השנה</h1><p>המצגת הראשונה מוכנה להפעלה בכיתה.</p></div><div class="week-no">01</div></section>
    <a class="card" href="opening/">
      <span class="index">01</span>
      <span class="type">HTML PRESENTATION</span>
      <h2><span lang="en" dir="ltr">New Directions</span> · פתיחת השנה</h2>
      <p>הציוד לכל שיעור, היעד השנתי ב־Band II Core I ופתיחת קבוצה 01.</p>
      <div class="open">פתיחת המצגת <span>←</span></div>
    </a>
  </main>
</body>
</html>
