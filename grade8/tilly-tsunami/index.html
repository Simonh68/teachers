<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 8 | The Girl Who Saved 100 Lives — Read Alone</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#145677,#071624 65%);color:#f5f8ff;font:18px Arial,sans-serif;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:20px}a{color:#8be5ff}header{text-align:center;margin:30px 0}h1{font-size:clamp(32px,6vw,58px);margin:10px 0}.sub{color:#c9e4ef}.panel{border-radius:25px;background:#f7fafc;color:#16334b;padding:clamp(20px,5vw,52px);min-height:315px;box-shadow:0 20px 50px #0006}.meta{display:flex;justify-content:space-between;font-weight:bold;font-size:14px;color:#5e7685}.bar{height:8px;background:#dce5ec;border-radius:8px;margin:20px 0}.progress{height:100%;background:#147aa4;border-radius:8px;transition:width .2s}.sentence{font-size:clamp(25px,4vw,42px);font-weight:650;line-height:1.8;direction:ltr;min-height:130px}.word{background:transparent;border:0;border-bottom:2px dotted #8eb5c8;color:#174260;font:inherit;cursor:pointer;margin-right:.25em;padding:0}.word:focus-visible{outline:3px solid #ffb800}.bubble{font-size:22px;color:#152a3c;background:#ffebaa;border-radius:13px;padding:12px;direction:rtl;text-align:center;display:none}.heb{font-size:22px;color:#174260;background:#e2f2fb;padding:16px;border-radius:12px;direction:rtl;margin-top:20px;display:none}.controls,.options,.paras{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:18px}button.action{background:#195776;border:1px solid #7bb8d8;color:white;padding:12px 19px;border-radius:12px;font-size:17px;cursor:pointer}button.action.primary{background:#f5c75f;color:#09283b;font-weight:bold}button:disabled{opacity:.35}.options{font-size:15px;align-items:center}.options label{cursor:pointer}.options select{padding:8px;border-radius:8px}.tip{text-align:center;direction:rtl;color:#bbd3e0;font-size:16px;margin:25px auto}@media(max-width:520px){.wrap{padding:12px}.panel{min-height:300px}.controls{gap:6px}button.action{padding:12px;font-size:14px}}</style></head><body><div class="wrap"><a href="../">← Grade 8</a><header><div class="sub">GRADE 8 · READ ALONE PLUS</div><h1>The Girl Who Saved 100 Lives</h1><div class="sub" dir="rtl">הילדה שהצילה מאה אנשים · שלוש פסקאות</div></header><section class="panel"><div class="meta"><span id="parno"></span><span id="count"></span></div><div class="bar"><div class="progress" id="progress"></div></div><div id="sentence" class="sentence"></div><div id="bubble" class="bubble" role="status"></div><div id="hebrew" class="heb"></div></section><div class="controls"><button class="action" id="prev">← Previous</button><button class="action primary" id="play">▶ Read aloud</button><button class="action" id="repeat">🔊 Repeat</button><button class="action" id="next">Next →</button></div><div class="options"><label>Speed <select id="speed"><option value=".65">0.65×</option><option selected value=".85">0.85×</option><option value="1">1×</option><option value="1.15">1.15×</option></select></label><label><input type="checkbox" id="translate"> עברית / Hebrew translation</label><label><input type="checkbox" id="whole"> Full paragraph</label></div><div class="paras"><button class="action" data-p="0">Paragraph 1</button><button class="action" data-p="1">Paragraph 2</button><button class="action" data-p="2">Paragraph 3</button></div><p class="tip">לחצו על מילה להקראה ולתרגום. אפשר לעצור, לחזור על משפט או לקרוא פסקה שלמה.</p></div><script>
const data=[[["In December 2004, a ten-year-old girl named Tilly Smith went on vacation with her family to Thailand.","בדצמבר 2004 ילדה בת עשר בשם טילי סמית נסעה לחופשה בתאילנד עם משפחתה."],["One morning, they went to the beach.","בוקר אחד הם הלכו לחוף הים."],["The weather was beautiful, but Tilly saw something strange.","מזג האוויר היה יפה, אבל טילי ראתה משהו מוזר."],["The water in the sea was moving in an unusual way.","המים בים נעו בצורה לא רגילה."]],[["Tilly remembered a lesson from school.","טילי נזכרה בשיעור מבית הספר."],["Her teacher showed the class a video about tsunamis.","המורה שלה הראה לכיתה סרטון על צונאמי."],["She learned that strange changes in the sea could mean danger.","היא למדה ששינויים מוזרים בים עלולים להצביע על סכנה."],["We must leave the beach now! she shouted.","אנחנו חייבים לעזוב את החוף עכשיו! היא צעקה."],["Her parents listened to her and told the hotel workers.","הוריה הקשיבו לה וסיפרו לעובדי המלון."],["The workers helped people leave the beach.","העובדים עזרו לאנשים לעזוב את החוף."]],[["A few minutes later, a huge tsunami reached the beach.","כמה דקות מאוחר יותר צונאמי עצום הגיע לחוף."],["The people were already in a safe place.","האנשים כבר היו במקום בטוח."],["Tilly's warning helped save about 100 lives.","האזהרה של טילי עזרה להציל כמאה אנשים."],["She became famous, but she was just a young girl who remembered her teacher's lesson.","היא התפרסמה, אבל הייתה רק ילדה צעירה שזכרה את השיעור של המורה שלה."],["Her story shows that children can save lives too.","הסיפור שלה מראה שגם ילדים יכולים להציל חיים."]]];
const dict={"vacation":"חופשה","beach":"חוף הים","strange":"מוזר","unusual":"לא רגיל","sea":"ים","moving":"נעים","remembered":"נזכרה","lesson":"שיעור","school":"בית ספר","teacher":"מורה","tsunamis":"גלי צונאמי","changes":"שינויים","danger":"סכנה","must":"חייבים","leave":"לעזוב","shouted":"צעקה","listened":"הקשיבו","workers":"עובדים","helped":"עזרו","huge":"עצום","reached":"הגיע","safe":"בטוח","warning":"אזהרה","save":"להציל","lives":"חיים","famous":"מפורסמת","children":"ילדים","beautiful":"יפה","weather":"מזג אוויר","family":"משפחה","morning":"בוקר","saw":"ראתה","water":"מים","minutes":"דקות","later":"אחר כך","young":"צעירה","people":"אנשים","hotel":"מלון","showed":"הראה","video":"סרטון","learned":"למדה","parents":"הורים","story":"סיפור","about":"על","a":"אחד / ה׳ הידיעה","the":"ה׳ הידיעה","in":"ב־","to":"ל־","with":"עם","was":"היה / הייתה","were":"היו","her":"שלה","she":"היא","they":"הם","and":"ו־","but":"אבל","now":"עכשיו"};
const items=data.flatMap((sentences,p)=>sentences.map(([en,he])=>({p,en,he})));
let i=0,playing=false,token=0,timer=null;
const $=id=>document.getElementById(id),syn=window.speechSynthesis;
function stop(){playing=false;token++;syn?.cancel();$('play').textContent='▶ Read aloud'}
function speak(s,onEnd){if(!syn)return;const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=Number($('speed').value);u.onend=()=>onEnd?.();u.onerror=()=>stop();syn.speak(u)}
function draw(){let x=items[i];$('parno').textContent='PARAGRAPH '+(x.p+1)+' / 3';$('count').textContent='SENTENCE '+(i+1)+' / '+items.length;$('progress').style.width=((i+1)/items.length*100)+'%';$('sentence').replaceChildren();if($('whole').checked){$('sentence').textContent=data[x.p].map(v=>v[0]).join(' ')}else{x.en.split(/\s+/).forEach(w=>{let b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>word(w);$('sentence').append(b)})}$('hebrew').textContent=x.he;$('hebrew').style.display=$('translate').checked?'block':'none';$('prev').disabled=i===0;$('next').disabled=i===items.length-1;$('bubble').style.display='none'}
function go(n){stop();i=Math.max(0,Math.min(items.length-1,n));draw()}
function word(w){stop();let clean=w.toLowerCase().replace(/[^a-z-]/g,'');$('bubble').textContent=w+' — '+(dict[clean]||'האזינו למילה');$('bubble').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('bubble').style.display='none',4000);speak(clean)}
function run(n,t){if(!playing||t!==token)return;i=n;draw();speak(items[n].en,()=>{if(!playing||t!==token)return;if(n<items.length-1)setTimeout(()=>run(n+1,t),650);else stop()})}
$('play').onclick=()=>{if(playing){stop();return}stop();playing=true;$('play').textContent='Ⅱ Pause';run(i,token)};$('repeat').onclick=()=>{stop();speak(items[i].en)};$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('translate').onchange=draw;$('whole').onchange=draw;$('speed').onchange=stop;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(data.slice(0,Number(b.dataset.p)).reduce((n,s)=>n+s.length,0)));document.onkeydown=e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)};draw();
</script></body></html>
