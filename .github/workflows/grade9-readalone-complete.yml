name: Complete and verify Grade 9 Read Alone
on:
  push:
    branches: [main]
    paths:
      - tools/grade9_complete_readalone.py
      - tools/grade9_readalone_finalize.py
      - tools/grade9_readalone_qa.py
      - tools/grade9_readalone_public_qa.py
      - tools/grade9-readalone/player.js
      - tools/grade9-readalone/reader.css
      - tools/grade9-readalone/translations.json
      - .github/workflows/grade9-readalone-complete.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: grade9-readalone-completion
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production and browser validation dependencies
        run: |
          python -m pip install beautifulsoup4==4.13.4 Pillow==11.3.0 playwright==1.55.0 edge-tts==7.2.8
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg
      - name: Reuse verified narration and build both readers
        run: |
          python -m py_compile tools/grade9_complete_readalone.py tools/grade9_readalone_finalize.py tools/grade9_readalone_qa.py tools/grade9_readalone_public_qa.py
          python -u tools/grade9_read_alone_audio.py
          python -u tools/grade9_complete_readalone.py
          python -u tools/grade9_readalone_finalize.py
          node --check grade9/unit-1/read-alone/player.js
      - name: Verify all passages all sentence slides and real playback
        run: python -u tools/grade9_readalone_qa.py
      - name: Commit only completed tested materials
        run: |
          git config user.name 'Teachers Read Alone builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grade9/unit-1/read-alone grade9/unit-1/index.html grade9/unit-1/reading.html grade9/unit-1/resources.html grade9/unit-1/student-preparation.html grade9/unit-1/teacher.html grade9/the-message-without-a-voice/index.html tools/grade9-readalone/original-deck.html
          if ! git diff --cached --quiet; then
            git commit -m 'Complete both Grade 9 Read Alone modes with verified full story audio'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = '3' ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload tested site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish tested site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public site and recorded audio in a browser
        run: python -u tools/grade9_readalone_public_qa.py
      - name: Preserve screenshots and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade9-readalone-browser-qa
          path: grade9-ra-qa/
          retention-days: 30
