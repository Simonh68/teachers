name: Build Tilly Smith Read Alone audio content
on:
  workflow_dispatch:
  push:
    paths:
      - 'grade8/tilly-tsunami/build-content.py'
      - '.github/workflows/tilly-read-along.yml'
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update checkout before generating
        run: git pull --ff-only origin main
      - name: Install neural speech tools
        run: |
          python3 -m venv "$RUNNER_TEMP/tilly-venv"
          "$RUNNER_TEMP/tilly-venv/bin/pip" install --disable-pip-version-check edge-tts
          echo "$RUNNER_TEMP/tilly-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -n 1
      - name: Build story data and recordings
        run: python3 grade8/tilly-tsunami/build-content.py
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grade8/tilly-tsunami/audio grade8/tilly-tsunami/unit-data.js grade8/tilly-tsunami/phrase-data.js grade8/tilly-tsunami/alignment.js
          if ! git diff --cached --quiet; then
            git commit -m "Generate Tilly recorded story content for existing Read Alone engine"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then exit 0; fi
              echo "Remote main advanced; rebasing generated assets (attempt $attempt)"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
            done
            echo "Could not publish generated assets after five safe attempts" >&2
            exit 1
          fi
