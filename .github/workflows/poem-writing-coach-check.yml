name: Verify poem writing coach links
on:
  push:
    branches: [main]
    paths:
      - 'grade10/group-a/poem-writing-coach/**'
      - '.github/workflows/poem-writing-coach-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poem-writing-coach-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check source questions and public files
        run: |
          python -u - <<'PY'
          from pathlib import Path
          import hashlib, html, json, re, time, urllib.request
          folder=Path('grade10/group-a/poem-writing-coach')
          source=Path('grade10/group-a/the-road-not-taken-review/index.html').read_text()
          short=(folder/'session-01.txt').read_text()
          questions={20:'Where is the speaker at the beginning, and what choice must he make?',24:'Copy words that show the two roads are similar.',28:'What might the two roads represent? Explain the metaphor.'}
          for number,question in questions.items():
              match=re.search(r'<section\b[^>]*id="slide-'+str(number)+r'".*?</section>',source,re.S)
              assert match,'Missing source slide '+str(number)
              plain=html.unescape(re.sub('<[^>]+>',' ',match.group()))
              plain=' '.join(plain.split())
              assert question in plain,(number,question)
              assert question in short
          original=(folder/'prompt.txt').read_bytes()
          original_sha=hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()
          assert original_sha=='0136b14270eb15dd769964e377a7e955cde7b9ab','Full prompt changed: review before certifying preservation'
          assert short.rstrip().endswith('Start now with the brief Hebrew introduction and QUESTION 1 ONLY, then wait for my answer.')
          expected={p:hashlib.sha256((folder/p).read_bytes()).hexdigest() for p in ['index.html','session-01.txt','prompt.txt']}
          base='https://simonh68.github.io/teachers/grade10/group-a/poem-writing-coach/'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Teachers-Poem-Coach-QA/1.0'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  assert r.status==200,(url,r.status)
                  return r.read()
          for attempt in range(24):
              try:
                  for name,digest in expected.items():
                      data=get(base+name+'?qa=20260917-session1-'+str(attempt))
                      assert hashlib.sha256(data).hexdigest()==digest,'Old deployment: '+name
                  break
              except Exception as error:
                  if attempt==23:raise
                  print('Waiting for Pages:',str(error),flush=True)
                  time.sleep(10)
          review=get('https://simonh68.github.io/teachers/grade10/group-a/the-road-not-taken-review/').decode()
          assert 'The Road' in review and 'slide-20' in review
          vocab=get('https://englishfornoar.co.il/band-ii/groups/group-01.html').decode()
          assert 'Group 01' in vocab and 'Core I' in vocab
          result={'passed':True,'source_questions_verified':list(questions),'full_prompt_unchanged':True,'live_coach_files_match_repository':list(expected),'grade7_vocabulary_url':'https://englishfornoar.co.il/band-ii/groups/group-01.html','review_url_reachable':True,'model_conversation_tested':False}
          Path('poem-coach-link-check.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: poem-coach-link-check
          path: poem-coach-link-check.json
