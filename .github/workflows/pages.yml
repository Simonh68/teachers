name: Publish isolated classroom branches to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout stable site shell
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble independent classroom content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site" "$RUNNER_TEMP/classroom"
          rsync -a --exclude='.git/' --exclude='.github/' ./ "$RUNNER_TEMP/site/"
          for grade in 7 8 9 10 11 12; do
            branch="classroom/grade${grade}"
            dest="$RUNNER_TEMP/classroom/grade${grade}"
            git clone --quiet --depth 1 --single-branch --branch "$branch" "https://github.com/${GITHUB_REPOSITORY}.git" "$dest"
            test -s "$dest/grade${grade}/index.html" || { echo "::error::Missing grade${grade}/index.html in $branch"; exit 1; }
            mkdir -p "$RUNNER_TEMP/site/grade${grade}"
            rsync -a --delete --exclude='.git/' "$dest/grade${grade}/" "$RUNNER_TEMP/site/grade${grade}/"
            echo "$branch $(git -C "$dest" rev-parse --short HEAD)" >> "$RUNNER_TEMP/site/classroom-build.txt"
          done
          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/grade11/five-units/index.html"
          test -s "$RUNNER_TEMP/site/grade11/sentence-detective-classroom/index.html"
          test -s "$RUNNER_TEMP/site/grade11/sentence-detective-tree/index.html"
          SITE="$RUNNER_TEMP/site" python3 - <<'PY'
          import os, pathlib
          root=pathlib.Path(os.environ['SITE'])
          for path in root.glob('grade*/**/*.html'):
              if path.stat().st_size == 0:
                  raise SystemExit(f'Empty HTML file: {path}')
          print('Validated classroom HTML files and required Grade 11 presentation paths')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload assembled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
