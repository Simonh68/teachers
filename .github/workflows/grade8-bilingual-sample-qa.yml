name: Verify Grade 8 bilingual reading sample
on:
  push:
    branches: [main]
    paths:
      - 'grade8/unit-1-reading-pilot/bilingual-sample/**'
      - '.github/workflows/grade8-bilingual-sample-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grade8-bilingual-sample-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check the two-slide sample, paired markers, real pauses and public link
        run: python -u grade8/unit-1-reading-pilot/bilingual-sample/verify.py
      - name: Preserve sample screenshots and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade8-bilingual-sample-qa
          path: /tmp/bilingual-sample-qa/
          if-no-files-found: error
      - name: Summarize sample verification
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/bilingual-sample-qa/qa-report.json')
          if p.exists():
              report=json.loads(p.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('## One-page bilingual reading sample\n\n```json\n'+json.dumps(report,ensure_ascii=False,indent=2)+'\n```\n')
          PY
