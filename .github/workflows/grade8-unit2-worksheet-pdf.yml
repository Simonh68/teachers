name: Grade 8 Unit 2 printable worksheet PDF
on:
  workflow_dispatch:
  push:
    branches: [classroom/grade8]
    paths:
      - 'grade8/unit-2/worksheet.html'
      - 'tools/build-grade8-unit2-pdf.py'
permissions:
  contents: read
jobs:
  make-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and browser tooling
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 pymupdf
          python -m playwright install --with-deps chromium
      - name: Create and verify two A4 PDF pages
        run: python tools/build-grade8-unit2-pdf.py
      - name: Store generated PDF as build artifact, never push to main
        uses: actions/upload-artifact@v4
        with:
          name: grade8-unit2-worksheet-pdf
          path: grade8/unit-2/files/Grade8-Unit2-Australia-CooberPedy-Worksheet.pdf
          if-no-files-found: error
