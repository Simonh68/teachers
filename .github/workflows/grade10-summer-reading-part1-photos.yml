name: Grade 10 Summer Reading Part 1 photo QA and assets
on:
  push:
    paths:
      - 'grade10/group-a/a-summers-reading/part1/build_photos.py'
      - '.github/workflows/grade10-summer-reading-part1-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install --quiet pillow requests
      - name: Retrieve and verify each separately matched photograph
        run: python grade10/group-a/a-summers-reading/part1/build_photos.py
      - name: Confirm one image per term
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('grade10/group-a/a-summers-reading/part1/photos')
          keys=list(p.glob('v-*.jpg'))
          assert len(keys)==36,len(keys)
          assert all(x.stat().st_size>9000 for x in keys)
          print('36 vocabulary photos validated',len(keys))
          PY
      - name: Save images, visual contact sheet and attribution source inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grade10/group-a/a-summers-reading/part1/photos/
          if ! git diff --cached --quiet; then
            git commit -m "Host individual realistic visuals for Part 1 vocabulary and audio scenes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
