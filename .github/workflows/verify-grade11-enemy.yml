name: Verify The Enemy Read-Along on published Grade 11 site
on:
  push:
    branches: [classroom/grade11]
    paths:
      - 'grade11/the-enemy/**'
      - 'grade11/five-units/index.html'
      - 'grade11/manifest.json'
      - 'grade11/THE_ENEMY_PUBLISH_STATUS.md'
      - '.github/scripts/verify_enemy_reader.py'
      - '.github/workflows/verify-grade11-enemy.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate all five synchronized parts and class navigation
        run: |
          node --check grade11/the-enemy/read-along/sentences/reader.js
          node --check grade11/the-enemy/read-along/sentences/lesson.js
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('grade11/the-enemy/read-along')
          assert 'sentences/reader.js' in (root/'index.html').read_text()
          assert (root/'guided.html').exists()
          lesson=(root/'sentences/lesson.js').read_text()
          assert lesson.count('focusHe:') == 5
          for part,total in enumerate([111,186,118,158,45],1):
              data=json.loads((root/f'sentences/part-{part}.json').read_text())
              assert len(data['rows'])==total
              if part>1: assert len(data['checks'])==6 and str(total) in data['checks']
              for track in data['tracks']: assert (root/'sentences'/track['file']).stat().st_size>1000
              previous=-1
              for row in data['rows']:
                  track=data['tracks'][row['track']]
                  assert row['he'] and row['words'] and 0 <= row['start'] < row['end'] <= track['duration']+.002
                  assert track['offset']+row['start']>=previous-.002
                  previous=track['offset']+row['end']
                  pos=row['start']
                  for word,a,b in row['words']:
                      assert word and pos-.002<=a<b<=row['end']+.002
                      pos=b
          assert '../the-enemy/read-along/' in Path('grade11/five-units/index.html').read_text()
          assert any(m.get('url')=='grade11/the-enemy/read-along/' for m in json.loads(Path('grade11/manifest.json').read_text())['materials'])
          PY
      - name: Match the live player, timing data and recordings against this revision
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          base='https://simonh68.github.io/teachers/'
          root=Path('grade11/the-enemy/read-along')
          def download(path):
              request=urllib.request.Request(base+path+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt),headers={'Cache-Control':'no-cache'})
              return urllib.request.urlopen(request,timeout=20).read()
          files=[root/'index.html',root/'guided.html',*sorted((root/'sentences').rglob('*'))]
          files=[p for p in files if p.is_file()]
          def page_source(path):
              body=download(path)
              counter=b'<script defer src="https://englishfornoar.co.il/teacher-visits.js" data-material="/teachers/grade11/the-enemy/read-along/"></script>'
              return body.replace(counter,b'')
          for attempt in range(40):
              try:
                  if page_source(str(root)+'/') != (root/'index.html').read_bytes():
                      raise ValueError('Waiting for the new entry page')
                  for f in files:
                      actual=page_source(str(f)) if f==root/'index.html' else download(str(f))
                      if hashlib.sha256(actual).digest()!=hashlib.sha256(f.read_bytes()).digest():
                          raise ValueError('Waiting for '+str(f))
                  assert b'Five-Part Read-Along' in download('grade11/five-units/')
                  manifest=json.loads(download('data/grade11.json'))
                  assert any(m.get('id')=='the-enemy-read-along' and 'Five-Part' in m.get('title','') for m in manifest['materials'])
                  print('Live class link, all five original audio parts and all player files match the checked-out revision.')
                  break
              except Exception as exc:
                  if attempt==39: raise
                  print(exc,flush=True);time.sleep(8)
          PY
      - name: Exercise desktop and mobile reading on the published Pages site
        run: |
          python3 -m venv "$RUNNER_TEMP/enemy-browser"
          "$RUNNER_TEMP/enemy-browser/bin/pip" -q install 'playwright>=1.53,<2'
          "$RUNNER_TEMP/enemy-browser/bin/python" .github/scripts/verify_enemy_reader.py
