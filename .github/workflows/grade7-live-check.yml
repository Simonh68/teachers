name: Verify public Grade 7 lesson
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grade7-live-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify live HTML, scripts, source data and audio
        run: |
          python - <<'PY'
          import concurrent.futures, json, time, urllib.request
          base='https://simonh68.github.io/teachers/grade7/band2-groups-01-02/'
          def get(path):
              url=base+path+('?' if '?' not in path else '&')+'check=20260916-full2'
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Teachers-Live-QA'}),timeout=30) as r:
                  assert r.status==200,(path,r.status)
                  return r.read()
          for attempt in range(25):
              try:
                  html=get('index.html').decode()
                  assert 'sequence.js?v=20260916-full2' in html
                  assert 'sequence.css?v=20260916-full2' in html
                  assert len(get('sequence.js'))>10000
                  assert len(get('sequence.css'))>5000
                  raw=get('data.js').decode()
                  words=json.loads(raw.split('=',1)[1].strip().rstrip(';'))
                  manifest=json.loads(get('audio/manifest.json'))
                  assert len(words)==110 and len(manifest['files'])==110
                  break
              except Exception as e:
                  if attempt==24: raise
                  print('Waiting for Pages deployment:',str(e),flush=True)
                  time.sleep(6)
          def check(w):
              a=manifest['files'][w['id']]
              assert a['text']==w['en'].rstrip('.!?')+'. '+w['ex_en']
              assert len(get(a['src']))>1000
              return w['id']
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              ids=list(pool.map(check,words))
          assert len(ids)==110
          print('LIVE CHECK PASSED:',base, '110 entries, 110 matching playable MP3 assets, full HTML and scripts reachable.',flush=True)
          PY
