name: Grade 8 approved bilingual Read Along
on:
  push:
    branches: [main, codex/grade8-bilingual-readalong-20261005]
    paths:
      - '.github/workflows/grade8-readalong-rollout.yml'
      - 'tools/grade8-readalong/**'
      - 'grade8/read-along/bootstrap.js'
      - 'grade8/read-along/reader.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grade8-readalong-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved sample and preserve curriculum
        if: github.ref != 'refs/heads/main'
        run: python -u tools/grade8-readalong/build.py
      - name: Check syntax
        run: |
          node --check grade8/read-along/bootstrap.js
          node --check grade8/read-along/reader.js
          node --check grade8/read-along/phrase-player.js
          python -m py_compile tools/grade8-readalong/*.py
      - name: Install browser test tools
        run: |
          python -m pip install --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify every bilingual page, touch navigation, source preservation and real audio
        run: python -u tools/grade8-readalong/verify.py
      - name: Preserve verified output on isolated branch only
        if: github.ref != 'refs/heads/main'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'Teachers Lesson Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grade8/read-along grade8/unit-1/index.html grade8/unit-1-reading-pilot/index.html PROJECT_CHARTER.md
          if ! git diff --cached --quiet; then
            git commit -m 'Apply approved Grade 8 bilingual Read Along after full source, mobile, marker and audio QA'
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Verify actual public deployment and every narration part
        if: github.ref == 'refs/heads/main'
        run: python -u tools/grade8-readalong/live.py
      - name: Preserve screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade8-bilingual-readalong-qa
          path: /tmp/grade8-readalong-qa/
          if-no-files-found: warn
      - name: Summarize test results
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              for name in ['qa-report.json','live-report.json']:
                  p=Path('/tmp/grade8-readalong-qa')/name
                  if p.exists():f.write('## '+name+'\n```json\n'+p.read_text()+'\n```\n')
          PY
