name: Inspect public The Enemy audio sources
on:
  push:
    branches: [classroom/grade11]
    paths: [.github/workflows/inspect-enemy-audio-sources.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Resolve audio URLs from public teaching sites
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, html
          urls=[
            'https://xpressenglish.com/our-stories/the-enemy/',
            'https://ortbinyaminaenglish.yolasite.com/the-enemy.php',
            'https://xpressenglish.com/the-enemy/',
            'https://www.youtube.com/watch?v=o0JUfjujdqA',
          ]
          for url in urls:
            print('\nPAGE',url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=18) as h: raw=h.read(350000).decode('utf-8','replace')
              print('LEN',len(raw))
              matches=re.findall(r'(?:https?://|/)[^\"\'\s<>]{0,300}\.(?:mp3|m4a|ogg|wav)(?:\?[^\"\'\s<>]*)?',raw,re.I)
              print('AUDIO URL candidates',list(dict.fromkeys(html.unescape(m) for m in matches))[:16])
              for m in re.findall(r'<(?:audio|source)[^>]{0,450}>',raw,re.I):print('AUDIO TAG',html.unescape(m)[:450])
              if 'yolasite' in url:
                for line in raw.splitlines():
                  if re.search('part 1|part 2|part 3|full story',line,re.I):print('YOLA HINT',line[:320])
            except Exception as e: print('ERROR',repr(e))
          PY
