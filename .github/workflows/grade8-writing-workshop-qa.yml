name: Grade 8 writing workshop checks
on:
  push:
    branches: [codex/grade8-monkey-writing-workshop]
    paths:
      - 'grade8/monkey-writing-workshop/**'
      - 'tools/check_grade8_writing_workshop.py'
      - '.github/workflows/grade8-writing-workshop-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check_grade8_writing_workshop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade8-workshop-browser-checks
          path: grade8-workshop-qa/
