name: Assemble and publish independent classroom branches
on:
  workflow_dispatch:
  repository_dispatch:
    types: [classroom-content-updated]
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-classrooms.yml'
      - 'tools/validate-publication.py'
      - 'index.html'
      - 'index2.html'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: teachers-pages-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout stable public shell
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
          persist-credentials: false
      - name: Checkout grade branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for n in 7 8 9 10 11 12; do
            git clone --quiet --depth 1 --branch "classroom/grade${n}" "https://github.com/${{ github.repository }}.git" "sources/grade${n}"
          done
      - name: Assemble site without merging histories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data
          cp -a base/. public/
          rm -rf public/.git public/.github
          for n in 7 8 9 10 11 12; do
            test -f "sources/grade${n}/grade${n}/manifest.json"
            cp "sources/grade${n}/grade${n}/manifest.json" "public/data/grade${n}.json"
            rsync -a --exclude manifest.json --exclude '.git' "sources/grade${n}/grade${n}/" "public/grade${n}/"
          done
          python3 base/tools/validate-publication.py public
          for n in 7 8 9 10 11 12; do
            test -s "public/data/grade${n}.json"
          done
          test -s public/grade11/sentence-detective-classroom/index.html
          test -s public/grade11/sentence-detective-classroom/app.js
          test -s public/grade11/sentence-detective-classroom/lesson.js
          test -s public/grade11/sentence-detective-classroom/complete.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public/data/grade11.json').read_text(encoding='utf-8'))
          target='grade11/sentence-detective-classroom/complete.html'
          assert d['materials'][0]['url']==target, 'Grade 11 homepage manifest is stale'
          assert sum(x['url']==target for x in d['materials'])==1, 'Duplicate or missing full course'
          print('Verified Grade 11 homepage manifest:', target)
          PY
      - name: Record pinned classroom revisions
        shell: bash
        run: |
          set -euo pipefail
          printf 'grade,revision\\n' > public/classroom-revisions.csv
          for n in 7 8 9 10 11 12; do
            printf 'grade%s,%s\\n' "$n" "$(git -C sources/grade${n} rev-parse HEAD)" >> public/classroom-revisions.csv
          done
          cat public/classroom-revisions.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Validate JavaScript syntax for Grade 11
        shell: bash
        run: |
          set -euo pipefail
          node --check public/grade11/sentence-detective-classroom/app.js
          node --check public/grade11/sentence-detective-classroom/lesson.js
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Grade 11 presentation
        shell: bash
        run: |
          set -euo pipefail
          url="https://simonh68.github.io/teachers/grade11/sentence-detective-classroom/"
          full="https://simonh68.github.io/teachers/grade11/sentence-detective-classroom/complete.html"
          manifest="https://simonh68.github.io/teachers/data/grade11.json"
          for attempt in $(seq 1 12); do
            status=$(curl -L -s -o /tmp/grade11-live.html -w '%{http_code}' "$url?deploy=${GITHUB_RUN_ID}")
            if [ "$status" = "200" ] && grep -q 'lesson.js' /tmp/grade11-live.html; then
              curl -fsSL "${url}app.js?deploy=${GITHUB_RUN_ID}" -o /tmp/grade11-app.js
              curl -fsSL "${url}lesson.js?deploy=${GITHUB_RUN_ID}" -o /tmp/grade11-lesson.js
              curl -fsSL "$full?deploy=${GITHUB_RUN_ID}" -o /tmp/grade11-full.html
              curl -fsSL "$manifest?deploy=${GITHUB_RUN_ID}" -o /tmp/grade11-manifest.json
              python3 - <<'PY'
              import json
              d=json.load(open('/tmp/grade11-manifest.json'))
              assert d['materials'][0]['url']=='grade11/sentence-detective-classroom/complete.html'
              PY
              echo "Live Grade 11 presentation and manifest verified"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status; retrying"
            sleep 10
          done
          echo "::error::Live Grade 11 presentation unavailable after deployment"
          exit 1
