name: Assemble and publish independent classroom branches
on:
  workflow_dispatch:
  repository_dispatch:
    types: [classroom-content-updated]
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-classrooms.yml'
      - 'tools/validate-publication.py'
      - 'index.html'
      - 'index2.html'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: teachers-pages-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout stable public shell
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
          persist-credentials: false
      - name: Checkout grade branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for n in 7 8 9 10 11 12; do
            git clone --quiet --depth 1 --branch "classroom/grade${n}" "https://github.com/${{ github.repository }}.git" "sources/grade${n}"
          done
      - name: Assemble site without merging histories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data
          cp -a base/. public/
          rm -rf public/.git public/.github
          for n in 7 8 9 10 11 12; do
            test -f "sources/grade${n}/grade${n}/manifest.json"
            cp "sources/grade${n}/grade${n}/manifest.json" "public/data/grade${n}.json"
            rsync -a --exclude manifest.json --exclude '.git' "sources/grade${n}/grade${n}/" "public/grade${n}/"
          done
          python3 base/tools/validate-publication.py public
          for n in 7 8 9 10 11 12; do
            test -s "public/data/grade${n}.json"
          done
          test -s public/grade11/sentence-detective-classroom/index.html
          test -s public/grade11/sentence-detective-classroom/app.js
          test -s public/grade11/sentence-detective-classroom/lesson.js
          test -s public/grade11/sentence-detective-classroom/complete.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public/data/grade7.json').read_text(encoding='utf-8'))
          assert d['materials'][0]['url']=='grade7/can-vs-present-simple/', 'Grade 7 homepage link is stale'
          assert '70-minute Lesson' in d['materials'][0]['title'], 'Grade 7 title is stale'
          print('Grade 7 manifest verified: 70-minute lesson is first')
          PY
          test -s public/grade7/can-vs-present-simple/index.html
          grep -q 'CAN · 70 MIN' public/grade7/can-vs-present-simple/index.html
          grep -q 'audioTimer=setTimeout' public/grade7/can-vs-present-simple/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public/data/grade11.json').read_text(encoding='utf-8'))
          target='grade11/sentence-detective-classroom/complete.html'
          assert d['materials'][0]['url']==target, 'Grade 11 homepage manifest is stale'
          assert sum(x['url']==target for x in d['materials'])==1, 'Duplicate or missing full course'
          print('Verified Grade 11 homepage manifest:', target)
          PY
      - name: Record pinned classroom revisions
        shell: bash
        run: |
          set -euo pipefail
          printf 'grade,revision\\n' > public/classroom-revisions.csv
          for n in 7 8 9 10 11 12; do
            printf 'grade%s,%s\\n' "$n" "$(git -C sources/grade${n} rev-parse HEAD)" >> public/classroom-revisions.csv
          done
          cat public/classroom-revisions.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate JavaScript syntax for Grade 11
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          timeout 15s node --check public/grade11/sentence-detective-classroom/app.js
          timeout 15s node --check public/grade11/sentence-detective-classroom/lesson.js
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Live availability smoke test (non-blocking)
        if: success()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          root="https://simonh68.github.io/teachers"
          for attempt in 1 2 3; do
            if curl --fail --location --silent --show-error --max-time 8 "$root/grade11/sentence-detective-classroom/complete.html?check=${GITHUB_RUN_ID}" -o /tmp/full.html &&
               curl --fail --location --silent --show-error --max-time 8 "$root/data/grade11.json?check=${GITHUB_RUN_ID}" -o /tmp/grade11.json; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          html=Path('/tmp/full.html').read_text(encoding='utf-8')
          d=json.loads(Path('/tmp/grade11.json').read_text(encoding='utf-8'))
          assert 'Sentence Detective' in html
          assert d['materials'][0]['url']=='grade11/sentence-detective-classroom/complete.html'
          PY
              then
                echo "Live presentation and manifest verified"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::warning::Deployment succeeded, but the live-site check did not yet confirm propagation."
