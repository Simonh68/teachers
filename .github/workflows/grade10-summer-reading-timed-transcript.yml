name: Summer Reading timed word-level transcript
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/grade10-summer-reading-timed-transcript.yml'
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU transcription engine
        run: python -m pip install --quiet 'faster-whisper==1.2.1'
      - name: Align words and original narration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel
          root=Path('grade10/group-a/a-summers-reading')
          model=WhisperModel('base.en',device='cpu',compute_type='int8',cpu_threads=4,num_workers=1)
          for p in (1,2,3):
              source=root/'audio'/f'part{p}.ogg'
              if not source.exists(): raise RuntimeError(f'Missing user audio: {source}')
              segments,info=model.transcribe(str(source),language='en',beam_size=5,word_timestamps=True,vad_filter=False,initial_prompt='A Summers Reading by Bernard Malamud. George Stoyonovich. Sophie. Mr. Cattanzara. railroad flat. World Almanac. Lower East Side. IRT subway.',condition_on_previous_text=True)
              out=[]
              for seg in segments:
                  words=[{'s':round(w.start,2),'e':round(w.end,2),'t':w.word} for w in seg.words or [] if w.start is not None and w.end is not None]
                  out.append({'s':round(seg.start,2),'e':round(seg.end,2),'t':seg.text,'w':words})
              target=root/'audio'/f'part{p}-timed.json'
              target.write_text(json.dumps({'part':p,'language':'en','duration':round(info.duration,2),'segments':out},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              print(f'Part {p}: {len(out)} segments, {sum(len(x["w"]) for x in out)} words, {target.stat().st_size} bytes',flush=True)
          PY
      - name: Publish timed transcripts alongside recordings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grade10/group-a/a-summers-reading/audio/*-timed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add word-timed narration transcript for Summer Reading Parts 1–3'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
