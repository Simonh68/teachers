name: Grade 11 More Than Books Sentence Detective QA
on:
  push:
    paths:
      - "grade11/module-e-more-than-books-detective/**"
      - ".github/workflows/grade11-more-than-books-detective-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-deck:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static source, key, and JavaScript validation
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const p='grade11/module-e-more-than-books-detective/';
          const html=fs.readFileSync(p+'index.html','utf8');
          const source=JSON.parse(fs.readFileSync(p+'exam-data.json','utf8'));
          const lesson=JSON.parse(html.match(/<script id="lesson-data" type="application\/json">([\s\S]*?)<\/script>/)[1]);
          const ver=JSON.parse(html.match(/<script id="version-data" type="application\/json">([\s\S]*?)<\/script>/)[1]);
          assert.equal(lesson.questions.length,7);
          assert.equal(lesson.vocabulary.length,5);
          assert.deepEqual(Object.keys(ver.versions),['A','B','C','D']);
          assert.deepEqual(Object.keys(source.versions),['A','B','C','D']);
          const expected={A:[1,0],B:[1,2],C:[2,1],D:[0,2]};
          for(const k of Object.keys(expected)){
            const v=source.versions[k];
            assert.deepEqual([v.mc[1].correct,v.mc[7].correct],expected[k]);
            for(const q of [8,9,10,11,12]){
              assert.equal(v.vocab[q].items.length,6);
              assert.equal(v.vocab[q].definitions.length,3);
              assert.equal(v.vocab[q].keys.length,3);
              assert(v.vocab[q].keys.every(x=>x>=1&&x<=6));
            }
          }
          const scripts=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)]
            .filter(m=>!m[1].includes('application/json')&&!m[1].includes('src='));
          for(const script of scripts)new vm.Script(script[2]);
          new vm.Script(fs.readFileSync('shared/phone-remote/remote.js','utf8'));
          assert(html.includes('shared/phone-remote/remote.js'));
          assert(html.includes('teacherRemote'));
          assert(html.includes('function grammarSlide'));
          assert(html.includes('function buildSlide'));
          assert(html.includes('versionSelect'));
          console.log('STATIC_DETECTIVE_QA_PASS: four exam versions, 7 questions, 5 lexical tasks, JS syntax, QR');
          NODE
      - name: Install browser testing
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install chromium
      - name: Run interactive browser QA against local HTML
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),assert=require('assert');
          const {pathToFileURL}=require('url'),path=require('path');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:900}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              // Prevent network dependencies from blocking a local content check.
              await page.route('**/peerjs@**',route=>route.abort());
              await page.route('**/qrcodejs@**',route=>route.abort());
              const file=pathToFileURL(path.resolve('grade11/module-e-more-than-books-detective/index.html')).href;
              await page.goto(file,{waitUntil:'domcontentloaded'});
              await page.waitForSelector('#counter');
              await page.waitForTimeout(1500);
              await page.evaluate(()=>{
                const root=document.getElementById('teachers-qr-remote-host')?.shadowRoot;
                root?.getElementById('close')?.click();
              });
              assert.equal((await page.locator('body > footer #counter').textContent()).trim(),'1 / 38');
              await page.locator('#versionSelect').selectOption('B');
              for(let i=0;i<4;i++)await page.locator('body > footer #next').click();
              assert((await page.locator('.eyebrow').textContent()).includes('QUESTION 1'));
              await page.locator('body > footer #reveal').click();
              assert((await page.locator('.part.n').count())>0);
              assert((await page.locator('.part.v').count())>0);
              await page.locator('body > footer #reveal').click();
              assert((await page.locator('.part.c').count())>=0);
              await page.locator('body > footer #reveal').click();
              assert((await page.locator('.grammarTip').count())===1);
              await page.locator('body > footer #next').click();
              assert((await page.locator('.eyebrow').textContent()).includes('QUESTION 1'));
              assert((await page.locator('.option').count())===4);
              for(let i=0;i<3;i++)await page.locator('body > footer #reveal').click();
              assert((await page.locator('.answer').textContent()).includes('ANSWER B'));
              await page.locator('#versionSelect').selectOption('C');
              for(let i=0;i<3;i++)await page.locator('body > footer #reveal').click();
              assert((await page.locator('.answer').textContent()).includes('ANSWER C'));
              await page.locator('#versionSelect').selectOption('D');
              for(let i=0;i<3;i++)await page.locator('body > footer #reveal').click();
              assert((await page.locator('.answer').textContent()).includes('ANSWER A'));
              // Navigate to the first vocabulary question (Q8).
              for(let i=0;i<4;i++)await page.locator('body > footer #next').click();
              assert((await page.locator('.eyebrow').textContent()).includes('QUESTION 8'));
              assert((await page.locator('.vocabItem').count())===6);
              assert((await page.locator('select[data-vocab-question]').count())===3);
              await page.locator('body > footer #reveal').click();await page.locator('body > footer #reveal').click();
              assert((await page.locator('.answer').textContent()).includes('6 · 4 · 2'));
              assert.deepEqual(errors,[]);
              // Mock the browser TTS engine so phrase boundaries, pauses, and
              // visual highlighting can be tested deterministically in CI.
              const readPage=await browser.newPage({viewport:{width:1440,height:900}});
              const readErrors=[];
              readPage.on('pageerror',e=>readErrors.push(e.message));
              await readPage.addInitScript(()=>{
                window.__spoken=[];
                window.SpeechSynthesisUtterance=class {
                  constructor(text){this.text=text;this.rate=1;this.pitch=1}
                };
                const speech={
                  speaking:false,paused:false,getVoices:()=>[],
                  speak(u){
                    window.__spoken.push(u.text);
                    this.speaking=true;
                    u.onstart?.();
                    setTimeout(()=>u.onboundary?.({name:'word',charIndex:0}),15);
                    setTimeout(()=>{this.speaking=false;u.onend?.()},95);
                  },
                  cancel(){this.speaking=false;this.paused=false},
                  pause(){this.paused=true},resume(){this.paused=false}
                };
                Object.defineProperty(window,'speechSynthesis',{configurable:true,value:speech});
              });
              await readPage.route('**/peerjs@**',route=>route.abort());
              await readPage.route('**/qrcodejs@**',route=>route.abort());
              await readPage.goto(file,{waitUntil:'domcontentloaded'});
              await readPage.waitForTimeout(1500);
              await readPage.evaluate(()=>document.getElementById('teachers-qr-remote-host')?.shadowRoot?.getElementById('close')?.click());
              await readPage.locator('body > footer #next').click();
              await readPage.locator('body > footer #next').click();
              assert((await readPage.locator('.para').count())===1);
              await readPage.locator('#play').click();
              assert((await readPage.locator('.word.inChunk').count())>=2);
              assert((await readPage.locator('#chunkStatus').textContent()).includes('חלק 1 מתוך'));
              const first=await readPage.evaluate(()=>window.__spoken[0]);
              assert(first.split(/\s+/).length<=10,'First spoken phrase exceeds ten words');
              await readPage.waitForTimeout(140);
              await readPage.locator('#pause').click();
              assert((await readPage.locator('#chunkStatus').textContent()).includes('מושהה'));
              await readPage.waitForTimeout(950);
              assert.equal((await readPage.evaluate(()=>window.__spoken.length)),1,'Pause did not stop next phrase');
              await readPage.locator('#pause').click();
              await readPage.waitForFunction(()=>window.__spoken.length>=2,null,{timeout:3000});
              assert((await readPage.locator('.word.inChunk').count())>=2);
              await readPage.locator('#repeatPart').click();
              await readPage.waitForFunction(()=>window.__spoken.length>=3,null,{timeout:1500});
              const repeated=await readPage.evaluate(()=>window.__spoken.slice(1,3));
              assert.equal(repeated[0],repeated[1],'Repeat did not replay the highlighted phrase');
              assert.deepEqual(readErrors,[]);
              await readPage.close();
              // Touch gestures on the REAL phone-remote overlay. Intercept the
              // outbound command rather than depending on a network connection.
              const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              await mobile.route('**/peerjs@**',route=>route.abort());
              await mobile.goto(file+'?teacherRemote=testing123456',{waitUntil:'domcontentloaded'});
              await mobile.waitForFunction(()=>Boolean(window.teachersPhoneRemote&&document.querySelector('#teachers-qr-remote-host')?.shadowRoot?.getElementById('swipeZone')));
              const swipeResult=await mobile.evaluate(()=>{
                const root=document.getElementById('teachers-qr-remote-host').shadowRoot;
                const panel=root.getElementById('remote');
                const zone=root.getElementById('swipeZone');
                const commands=[];
                const ctx=window.teachersPhoneRemote;
                ctx.connected=true;ctx.channel={open:true,send:x=>commands.push(x)};
                function fire(type,x,y){
                  const t=new Touch({identifier:1,target:zone,clientX:x,clientY:y,pageX:x,pageY:y,screenX:x,screenY:y});
                  const ev=new TouchEvent(type,{bubbles:true,cancelable:true,
                    touches:type==='touchend'?[]:[t],targetTouches:type==='touchend'?[]:[t],
                    changedTouches:[t]});
                  zone.dispatchEvent(ev);
                }
                fire('touchstart',180,480);fire('touchmove',182,330);fire('touchend',182,330);
                fire('touchstart',180,300);fire('touchmove',182,465);fire('touchend',182,465);
                return {commands,zoneVisible:getComputedStyle(zone).display!=='none',
                  touchAction:getComputedStyle(panel).touchAction,zoneLabel:zone.textContent};
              });
              assert(swipeResult.zoneVisible);
              assert.equal(swipeResult.touchAction,'none');
              assert.deepEqual(swipeResult.commands.map(x=>x.action),['next','previous']);
              assert(swipeResult.zoneLabel.includes('SWIPE UP'));
              await mobile.close();
              // A phone showing the slides directly must also support vertical
              // swipes. This is separate from the QR remote surface.
              const direct=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              await direct.route('**/peerjs@**',route=>route.abort());
              await direct.route('**/qrcodejs@**',route=>route.abort());
              await direct.goto(file,{waitUntil:'domcontentloaded'});
              await direct.waitForTimeout(1500);
              await direct.evaluate(()=>document.getElementById('teachers-qr-remote-host')?.shadowRoot?.getElementById('close')?.click());
              const directSwipe=await direct.evaluate(()=>{
                const stage=document.getElementById('stage');
                function touch(type,y){
                  const t=new Touch({identifier:2,target:stage,clientX:190,clientY:y,pageX:190,pageY:y,screenX:190,screenY:y});
                  const event=new TouchEvent(type,{bubbles:true,cancelable:true,touches:type==='touchend'?[]:[t],
                    targetTouches:type==='touchend'?[]:[t],changedTouches:[t]});
                  stage.dispatchEvent(event);
                }
                const before=document.querySelector('body > footer #counter').textContent.trim();
                touch('touchstart',540);touch('touchmove',330);touch('touchend',330);
                const afterUp=document.querySelector('body > footer #counter').textContent.trim();
                return {before,afterUp,touchAction:getComputedStyle(stage).touchAction};
              });
              assert.equal(directSwipe.before,'1 / 38');
              assert.equal(directSwipe.afterUp,'2 / 38');
              assert.equal(directSwipe.touchAction,'pan-x');
              await direct.waitForTimeout(380);
              await direct.evaluate(()=>{
                const stage=document.getElementById('stage');
                function touch(type,y){
                  const t=new Touch({identifier:3,target:stage,clientX:190,clientY:y,pageX:190,pageY:y,screenX:190,screenY:y});
                  stage.dispatchEvent(new TouchEvent(type,{bubbles:true,cancelable:true,
                    touches:type==='touchend'?[]:[t],targetTouches:type==='touchend'?[]:[t],changedTouches:[t]}));
                }
                touch('touchstart',280);touch('touchmove',500);touch('touchend',500);
              });
              assert.equal((await direct.locator('body > footer #counter').textContent()).trim(),'1 / 38');
              await direct.close();
              console.log('DIRECT_SLIDE_SWIPE_QA_PASS: swipe up and down navigate the Grade 11 slide on a phone without QR');
              console.log('PHONE_SWIPE_QA_PASS: swipe up = next, down = previous; full-screen no-scroll gesture zone');
              console.log('BROWSER_DETECTIVE_QA_PASS: 38 slides, A-D answer keys, 10-word TTS chunks, visual phrase highlight, pause/resume and repeat');

            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
