name: Notify central classroom publisher
on:
  push:
    branches:
      - 'classroom/grade*'
    paths:
      - 'grade*/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Request centralized publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/dispatch.json
          import json,os
          print(json.dumps({"event_type":"classroom-content-updated","client_payload":{"branch":os.environ["BRANCH"],"revision":os.environ["REVISION"]}}))
          PY
          curl --fail-with-body --retry 3 --retry-delay 2 -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/dispatches" \
            --data-binary @/tmp/dispatch.json
