name: Notify central classroom publisher
on:
  push:
    branches:
      - 'classroom/grade*'
    paths:
      - 'grade*/**'
      - '.github/workflows/notify-classroom-publisher.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Request centralized publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 --retry-delay 2 -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/publish-classrooms.yml/dispatches" \
            --data '{"ref":"main"}'
