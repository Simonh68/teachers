name: Grade 8 Unit 2 Chromium live Read-Along QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/grade8-unit2-live-qa.py'
      - '.github/workflows/grade8-unit2-live-smoke.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser test
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify public reader UI and recorded audio
        run: python tools/grade8-unit2-live-qa.py
