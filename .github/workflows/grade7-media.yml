name: Build Grade 7 vocabulary and neural audio
on:
  push:
    branches: [main]
    paths:
      - tools/build_grade7_vocab.py
      - tools/refine_grade7_vocab.py
      - tools/check_grade7_lesson.py
      - .github/workflows/grade7-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grade7-neural-media
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create and align complete source snapshot
        run: |
          python tools/build_grade7_vocab.py --data-only
          python tools/refine_grade7_vocab.py
      - name: Commit source snapshot and navigation
        run: |
          git config user.name 'Teachers lesson builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grade7/band2-groups-01-02/entries.json grade7/band2-groups-01-02/vocabulary-audit.txt grade7/band2-groups-01-02/lesson.css index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Align Grade 7 translations and link full presentation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/cache@v4
        with:
          path: .cache/kokoro-v1
          key: teachers-kokoro-v1-onnx-voices
      - name: Install neural speech dependencies
        run: |
          python -m pip install kokoro-onnx==0.5.0 soundfile==0.13.1 playwright==1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate and validate real MP3 files
        run: python -u tools/build_grade7_vocab.py --audio
      - name: Commit only lesson audio assets
        run: |
          git add grade7/band2-groups-01-02/audio grade7/band2-groups-01-02/audio-manifest.json grade7/band2-groups-01-02/AUDIO-NOTICE.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Verify 110 final English narration MP3 files'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              sleep 3
            done
          fi
      - name: Install browser for QA
        run: python -m playwright install --with-deps chromium
      - name: Verify complete lesson, gestures and public deployment
        run: python -u tools/check_grade7_lesson.py
      - name: Preserve verification report
        if: always()
        run: |
          if [ -f grade7/band2-groups-01-02/qa-report.json ]; then
            git add grade7/band2-groups-01-02/qa-report.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record full Grade 7 browser and public website verification'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
