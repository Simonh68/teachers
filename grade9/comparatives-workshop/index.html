<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 9 · Comparatives Workshop</title><style>
*{box-sizing:border-box}body{margin:0;background:#08172b;color:#f6fbff;font-family:Arial,"Noto Sans Hebrew",sans-serif}.deck{height:100dvh;display:flex;flex-direction:column}.header{display:flex;justify-content:space-between;align-items:center;background:#0d3046;padding:10px 18px;font-size:15px}.header a{color:#b4e9fb}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px 5vw;gap:24px;overflow:auto}.tag{color:#9debf1;font-weight:900;letter-spacing:.1em}.heading{font-size:clamp(35px,5vw,75px);line-height:1.08;margin:0;color:#ffe18b}.sentence{font-size:clamp(30px,3.7vw,58px);line-height:1.35;max-width:1300px;font-weight:750;direction:ltr}.hebrew{direction:rtl;color:#b7e2f0;font-size:clamp(22px,2.3vw,34px)}.choices{display:grid;grid-template-columns:1fr;gap:12px;width:min(850px,100%)}.choice{background:#1a4059;border:2px solid #6c9fb8;border-radius:15px;color:white;font-size:clamp(19px,2.1vw,30px);font-weight:800;padding:15px;cursor:pointer}.choice.correct{background:#1b694f}.choice.wrong{background:#753d48}.feedback{font-size:23px;min-height:25px}.footer{display:flex;align-items:center;gap:8px;padding:12px;background:#0c2c42;flex-wrap:wrap;justify-content:center}.footer button,.footer select{background:#174a66;color:white;border:1px solid #86c7df;border-radius:9px;padding:11px;font-size:16px;font-weight:bold}.footer .count{font-weight:bold;min-width:75px;text-align:center}.word{border-radius:4px}.word.active{background:#ffdd73;color:#10273b}.word.segment{background:#224f68}.detail{display:none;background:#153f52;padding:14px;border-radius:12px;font-size:clamp(19px,2vw,30px);color:#f9e29c;direction:rtl}.detail.visible{display:block}@media(max-width:600px){.stage{gap:15px;padding:16px}.footer button,.footer select{font-size:13px;padding:8px}.footer select{max-width:120px}.header{font-size:12px}}
.word-pairs{display:flex;flex-direction:column;align-items:center;gap:clamp(15px,3vh,32px);width:100%;font-size:clamp(31px,4vw,58px);line-height:1.2}.word-pair{display:flex;direction:ltr;unicode-bidi:isolate;align-items:center;justify-content:center;gap:clamp(14px,4vw,48px);width:100%;white-space:nowrap}.word-pair span{display:inline-block}.word-pair span:nth-child(2){color:#ffe18b}@media(max-width:600px){.word-pairs{font-size:clamp(29px,7vw,44px);gap:24px}.word-pair{gap:20px}}  .suffix-er{color:#ff982e!important;font-weight:900;text-shadow:0 0 8px #ff982e33}</style></head><body><div class="deck"><header class="header"><span>GRADE 9 · COMPARATIVES · ENGLISH / HEBREW</span><a href="../../#grade9">⌂ כיתה ט׳</a></header><main class="stage" id="stage"></main><footer class="footer"><button id="prev">← PREV</button><button id="read">🔊 Read</button><button id="reveal">✨ Explain</button><select id="speed" aria-label="Reading speed"><option value=".6">0.6×</option><option value=".7" selected>0.7×</option><option value=".85">0.85×</option><option value="1">1×</option></select><span id="count" class="count"></span><button id="next">NEXT →</button></footer></div>
<script>
const slides=[["cover","Comparisons in English","Bigger · More Beautiful · Better","השוואות באנגלית — כיתה ט׳"],["teach","Look at the bags","The blue bag is heavy. The black bag is heavier.","איזה תיק כבד יותר?"],["teach","Compare two things","The black bag is heavier than the blue bag.","heavier than = כבד יותר מ־"],["quiz","Choose the correct word","A bus is usually ___ than a bicycle.",["faster","fastest","more fast"],0],["teach","Short adjectives","tall → taller · small → smaller · fast → faster","מוסיפים er לתארים קצרים"],["quiz","Choose the correct form","My brother is ___ than I am.",["tallest","taller","more tall"],1],["teach","Double the last letter","big → bigger · hot → hotter · thin → thinner","לפעמים מכפילים את העיצור האחרון"],["quiz","Choose the correct sentence","This box is biger than that one.",["This box is bigger than that one.","This box is more big than that one.","This box is biggest than that one."],0],["teach","Change y to i","happy → happier · easy → easier · busy → busier","עיצור + y: מחליפים y ב־i"],["quiz","Complete the sentence","This question is ___ than the last one.",["easyer","more easy","easier"],2],["teach","Long adjectives","expensive → more expensive · beautiful → more beautiful","תארים ארוכים: more + adjective"],["teach","More attractive","This design is more attractive than the old design.","attractive = מושך / נאה"],["teach","More interesting","The new story is more interesting than the old story.","interesting = מעניין"],["quiz","Which sentence is correct?","Choose the correct comparison.",["This car is expensiver than mine.","This car is more expensive than mine.","This car is most expensive than mine."],1],["quiz","Compare the places","The city center is ___ than the village.",["more crowded","crowdeder","most crowded"],0],["teach","The exception: GOOD","good → better → the best","טוב → טוב יותר → הטוב ביותר"],["teach","Better than","This solution is better than the first solution.","better — לא gooder ולא more good"],["teach","The best","Of the three solutions, this one is the best.","the best — הטוב ביותר"],["quiz","Choose the correct form","My English is ___ than last year.",["gooder","better","the best"],1],["teach","The exception: BAD","bad → worse → the worst","רע → גרוע יותר → הגרוע ביותר"],["teach","Worse than","Today's weather is worse than yesterday's weather.","worse — לא badder"],["teach","The worst","That was the worst mistake in the whole test.","the worst — הגרוע ביותר"],["quiz","Choose the correct form","This is ___ day of the week.",["the worst","worse than","badder"],0],["teach","More irregular forms","far → farther / further · little → less · many → more","נלמד גם יוצאי דופן נוספים"],["quiz","Mixed practice","This route is ___ than the other route.",["more short","shorter","the shortest"],1],["detect","Sentence Detective 1","Although the new apartment is more expensive than the old one, it is much more comfortable because it is closer to school.","Although = ויתור; because = סיבה; more expensive = השוואה"],["detect","Sentence Detective 2","The new road is safer than the old road because it has fewer cars.","The new road = נושא; is = פועל; safer than = השוואה; because = סיבה"],["detect","Sentence Detective 3","Although the first restaurant was better than the second one, the third restaurant was the best because it had the most interesting menu.","better = השוואה בין שניים; the best = דרגת ההפלגה"],["quiz","Sentence Detective challenge","Which words express the comparison in this sentence: The new journey is much longer than the old one because the route has changed.",["because the route","much longer than","the new journey"],1],["finish","Your final challenge","Write one sentence with -er, one with more, and one with better or worse.","השתמשו בשלושה סוגים של השוואות"]];const originalSlides=slides.slice();slides.length=0;for(const item of originalSlides){slides.push(item);let hebrew=item[0]==='quiz'?'בחרו את התשובה הנכונה. קראו את כל האפשרויות לפני הבחירה.':(item[0]==='cover'?'בשיעור זה נלמד להשוות בין דברים באמצעות תארים.':item[0]==='finish'?'כתבו שלושה משפטי השוואה משלכם.':item[3]);if(typeof hebrew==='string'&&hebrew.trim())slides.push(['hebrew','הסבר בעברית',hebrew,'']);}let index=0,timer=null,utterance=null,playing=false,paused=false,active=null,wordEls=[],boundaries=0,start=0,interval=null,token=0,elapsed=0;
const $=id=>document.getElementById(id),synth=window.speechSynthesis;
function stop(){token++;clearTimeout(timer);clearInterval(interval);timer=null;interval=null;synth?.cancel();playing=false;paused=false;elapsed=0;active?.classList.remove('active');active=null;$('read').textContent='🔊 Read'}
function mark(i){active?.classList.remove('active');active=wordEls[Math.max(0,Math.min(i,wordEls.length-1))];active?.classList.add('active')}
function speak(){if(!synth||!wordEls.length)return;const id=token;let text=wordEls.map(w=>w.textContent).join(' ');utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-US';utterance.rate=Number($('speed').value);utterance.onstart=()=>{start=performance.now();playing=true;$('read').textContent='⏸ Pause'};const offsets=[];let at=0;for(const w of wordEls){offsets.push(at);at+=w.textContent.length+1}let lastBoundary=0;utterance.onboundary=e=>{if(id!==token||e.name!=='word')return;lastBoundary=performance.now();boundaries++;let n=0;for(let j=0;j<offsets.length;j++)if(offsets[j]<=e.charIndex)n=j;mark(n)};
const duration=Math.max(1000,wordEls.reduce((n,w)=>n+Math.max(2,w.textContent.length*.5),0)*145/utterance.rate);mark(0);
interval=setInterval(()=>{if(id!==token||paused||performance.now()-lastBoundary<650)return;const ratio=Math.min(.99,(elapsed+performance.now()-start)/duration);mark(Math.floor(ratio*wordEls.length))},85);
utterance.onend=()=>{if(id!==token)return;clearInterval(interval);playing=false;mark(wordEls.length-1);$('read').textContent='🔊 Again'};utterance.onerror=()=>{if(id===token){clearInterval(interval);playing=false;$('read').textContent='🔊 Retry'}};synth.speak(utterance)}
function render(n){stop();$('read').disabled=false;$('read').title='Read sentence aloud';index=Math.max(0,Math.min(slides.length-1,n));const d=slides[index],stage=$('stage');stage.replaceChildren();if(d[0]==='hebrew'){const h=document.createElement('h1');h.className='heading';h.textContent='הסבר ותרגול';stage.append(h);const p=document.createElement('div');p.className='sentence';p.dir='rtl';p.lang='he';p.textContent=d[2];stage.append(p);$('count').textContent=(index+1)+' / '+slides.length;$('read').disabled=true;$('read').title='אין הקראה בשקף ההסבר';history.replaceState(null,'','#slide-'+(index+1));return;}const tag=document.createElement('div');tag.className='tag';tag.textContent=d[0]==='quiz'?'INTERACTIVE CHALLENGE':d[0]==='detect'?'SENTENCE DETECTIVE':'DISCOVER · PRACTISE';stage.append(tag);const h=document.createElement('h1');h.className='heading';h.textContent=d[1];stage.append(h);const sentence=document.createElement('div');sentence.className='sentence';const raw=d[2];for(const t of raw.match(/\s+|[^\s]+/g)||[]){if(/^\s+$/.test(t))sentence.append(document.createTextNode(t));else{const span=document.createElement('span');span.className='word';span.textContent=t;sentence.append(span)}}if(raw.includes('→')&&!/[.!?]$/.test(raw.trim())){
 sentence.classList.add('word-pairs');sentence.replaceChildren();
 for(const part of raw.split('·').map(x=>x.trim()).filter(Boolean)){
  const line=document.createElement('div');line.className='word-pair';line.dir='ltr';
  const match=part.match(/^(.+?)\s*→\s*(.+)$/);
  if(match){const base=document.createElement('span');base.textContent=match[1].trim();line.append(base);const arrow=document.createElement('span');arrow.textContent='→';line.append(arrow);const result=document.createElement('span');const value=match[2].trim();if(value.endsWith('er')&&index<=10){result.append(document.createTextNode(value.slice(0,-2)));const suffix=document.createElement('strong');suffix.className='suffix-er';suffix.textContent='er';result.append(suffix)}else result.textContent=value;line.append(result)}
  else line.textContent=part;
  sentence.append(line);
 }
}
stage.append(sentence);wordEls=[...sentence.querySelectorAll('.word')];if(d[0]==='quiz'){const choices=document.createElement('div');choices.className='choices';const feedback=document.createElement('div');feedback.className='feedback';d[3].forEach((answer,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=answer;b.onclick=()=>{choices.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add(i===d[4]?'correct':'wrong');if(i!==d[4])choices.children[d[4]].classList.add('correct');feedback.textContent=i===d[4]?'✓ Correct!':'Try to understand why the green answer is correct.'};choices.append(b)});stage.append(choices,feedback)}else{}
if(d[0]==='detect'){const detail=document.createElement('div');detail.className='detail';detail.textContent=d[3];stage.append(detail)}
$('count').textContent=(index+1)+' / '+slides.length;history.replaceState(null,'','#slide-'+(index+1));const fullSentence=/[.!?]$/.test(raw.trim())&&!/[→←↔]/.test(raw)&&raw.trim().split(/\s+/).length>=5;if(fullSentence&&d[0]!=='quiz'){timer=setTimeout(()=>{timer=null;speak()},4000)}else{$('read').disabled=true;$('read').title='Narration is for complete English sentences only';}}
$('prev').onclick=()=>render(index-1);$('next').onclick=()=>render(index+1);$('reveal').onclick=()=>{const e=document.querySelector('.detail');if(e)e.classList.toggle('visible')};$('read').onclick=()=>{if(playing&&!paused){paused=true;elapsed+=performance.now()-start;synth.pause();$('read').textContent='▶ Resume'}else if(paused){paused=false;start=performance.now();synth.resume();$('read').textContent='⏸ Pause'}else{stop();speak()}};let swipeX=0,swipeY=0;
document.getElementById('stage').addEventListener('touchstart',e=>{swipeX=e.changedTouches[0].clientX;swipeY=e.changedTouches[0].clientY},{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{if(e.target.closest('button,select'))return;const dx=e.changedTouches[0].clientX-swipeX,dy=e.changedTouches[0].clientY-swipeY;if(Math.abs(dy)>65&&Math.abs(dy)>Math.abs(dx)*1.2)render(index+(dy<0?1:-1))},{passive:true});
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key))render(index+1);if(['ArrowLeft','PageUp'].includes(e.key))render(index-1)});render(Number(location.hash.match(/slide-(\d+)/)?.[1]||1)-1);
</script><script>
