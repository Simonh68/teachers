ax-width:120px}.header{font-size:12px}}

<script>
const slides=[["cover","The Best of All","Today we will find the biggest, the most beautiful, and the best.","היום נלמד לבחור את המוביל בקבוצה."],["teach","Three Buildings","This building is tall. That building is taller. The third building is the tallest.","כשמשווים שלושה פריטים, משתמשים בדרגת ההפלגה."],["teach","Short Adjectives","tall → tallest · small → smallest · fast → fastest","בתארים קצרים מוסיפים בדרך כלל את הסיומת המתאימה."],["quiz","Choose the correct form","Of all three roads, this road is the ___.",["shortest","shorter","more short"],0],["teach","The Important Word","This is the tallest building in our neighborhood.","בדרך כלל מופיעה היידוע לפני דרגת ההפלגה."],["teach","Double the Letter","big → biggest · hot → hottest · thin → thinnest","לעיתים מכפילים את העיצור האחרון."],["quiz","Choose the correct sentence","Which sentence is correct?",["This is the bigest room.","This is the biggest room.","This is the more big room."],1],["teach","Words Ending in Y","happy → happiest · easy → easiest · busy → busiest","כאשר לפני האות האחרונה יש עיצור, מחליפים אותה לפני הוספת הסיומת."],["quiz","Choose the correct form","This is the ___ question in the test.",["most easy","easier","easiest"],2],["teach","Long Adjectives","expensive → most expensive · beautiful → most beautiful","בתארים ארוכים משתמשים במילת ההפלגה לפני התואר."],["teach","The Most Attractive","This is the most attractive design in the shop.","תארים ארוכים אינם מקבלים בדרך כלל את הסיומת הקצרה."],["quiz","Choose the correct sentence","Choose the correct sentence.",["This is the most interesting book.","This is the interestingest book.","This is the more interesting book."],0],["teach","Good Is Irregular","good → better → best","זהו תואר יוצא דופן: הצורה משתנה לגמרי."],["teach","The Best","This is the best solution to our problem.","הטוב ביותר מתוך כמה אפשרויות."],["quiz","Choose the correct form","Of all the students, Maya gave the ___ answer.",["better","best","goodest"],1],["teach","Bad Is Irregular","bad → worse → worst","גם כאן הצורה משתנה לגמרי."],["teach","The Worst","This was the worst day of our journey.","הגרוע ביותר מתוך הקבוצה."],["quiz","Choose the correct form","This is the ___ mistake in the whole report.",["worst","worse","baddest"],0],["teach","More Irregular Forms","far → farthest · many → most · little → least","נכיר גם צורות נוספות שאינן רגילות."],["quiz","Comparative or Superlative?","The red bicycle is ___ than the blue bicycle.",["the fastest","faster","fastest"],1],["quiz","Comparative or Superlative?","This is ___ bicycle in the entire shop.",["the fastest","faster","more fast"],0],["detect","Sentence Detective","Although the museum is the most expensive place we visited, it is also the most interesting because its exhibits tell amazing stories.","מצאו את המשפט המרכזי, את הניגוד ואת הסיבה."],["detect","Find the Main Clause","The tallest building in the city, which was built many years ago, is now a famous tourist attraction.","זהו את הנושא ואת הפסוקית המתארת אותו."],["quiz","Sentence Detective Challenge","Which words show the highest degree in this sentence: This is the most comfortable room in the hotel?",["in the hotel","comfortable room","the most comfortable"],2],["finish","Your Final Challenge","Write two sentences about the best and the worst choices for a school trip.","כתבו משפטים מקוריים והסבירו מדוע בחרתם בהם."]];const mode=new URLSearchParams(location.search).get('lang')==='he'?'he':'en';

document.documentElement.lang=mode;
document.documentElement.dir='ltr';document.getElementById('home-link').textContent=hebrewMode?'בחירת מסלול':'CHOOSE VERSION';if(hebrewMode){document.getElementById('reveal').textContent='✨ הסבר';document.getElementById('prev').textContent='← הקודם';document.getElementById('next').textContent='הבא →';}
let index=0,timer=null,utterance=null,playing=false,paused=false,active=null,wordEls=[],boundaries=0,start=0,interval=null,token=0,elapsed=0;

function speak(){if(!synth||!wordEls.length)return;const id=token;let text=wordEls.map(w=>w.textContent).join(' ');utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-US';utterance.rate=Number($('speed').value);utterance.onstart=()=>{start=performance.now();playing=true;$('read').textContent='⏸ Pause'};const offsets=[];let at=0;for(const w of wordEls){offsets.push(at);at+=w.textContent.length+1}let lastBoundary=0;utterance.onboundary=e=>{if(id!==token||e.name!=='word')return;lastBoundary=performance.now();boundaries++;let n=0;for(let j=0;j<offsets.length;j++)if(offsets[j]<=e.charIndex)n=j;mark(n)};
const duration=Math.max(1000,wordEls.reduce((n,w)=>n+Math.max(2,w.textContent.length*.5),0)*145/utterance.rate);mark(0);
interval=setInterval(()=>{if(id!==token||paused||performance.now()-lastBoundary<650)return;const ratio=Math.min(.99,(elapsed+performance.now()-start)/duration);mark(Math.floor(ratio*wordEls.length))},85);

function render(n){stop();$('read').disabled=false;$('read').title='Read sentence aloud';index=Math.max(0,Math.min(slides.length-1,n));const d=slides[index],stage=$('stage');stage.replaceChildren();const tag=document.createElement('div');tag.className='tag';tag.textContent=hebrewMode?(d[0]==='quiz'?'תרגול אינטראקטיבי':d[0]==='detect'?'פירוק משפטים':'לומדים ומתרגלים'):(d[0]==='quiz'?'INTERACTIVE CHALLENGE':d[0]==='detect'?'SENTENCE DETECTIVE':'DISCOVER · PRACTISE');stage.append(tag);const h=document.createElement('h1');h.className='heading';h.textContent=hebrewMode?({ 'Choose the correct word':'בחרו את המילה הנכונה','Choose the correct form':'בחרו את הצורה הנכונה','Choose the correct sentence':'בחרו את המשפט הנכון','Find the mistake':'מצאו את הטעות','Complete the sentence':'השלימו את המשפט','Which sentence is correct?':'איזה משפט נכון?','Compare the places':'השוו בין המקומות','Mixed practice':'תרגול משולב','Sentence Detective challenge':'אתגר פירוק משפטים','Your final challenge':'אתגר מסכם'}[d[1]]||d[1]):d[1];stage.append(h);const sentence=document.createElement('div');sentence.className='sentence';const raw=d[2];for(const t of raw.match(/\s+|[^\s]+/g)||[]){if(/^\s+$/.test(t))sentence.append(document.createTextNode(t));else{const span=document.createElement('span');span.className='word';span.textContent=t;sentence.append(span)}}if(raw.includes('→')&&!/[.!?]$/.test(raw.trim())){
 sentence.classList.add('word-pairs');sentence.replaceChildren();
 for(const part of raw.split('·').map(x=>x.trim()).filter(Boolean)){

  if(match){const base=document.createElement('span');base.textContent=match[1].trim();line.append(base);const arrow=document.createElement('span');arrow.textContent='→';line.append(arrow);const result=document.createElement('span');const value=match[2].trim();if(value.endsWith('er')&&index<=10){result.append(document.createTextNode(value.slice(0,-2)));const suffix=document.createElement('strong');suffix.className='suffix-er';suffix.textContent='er';result.append(suffix)}else result.textContent=value;line.append(result)}
  else line.textContent=part;
  sentence.append(line);
 }
}
stage.append(sentence);wordEls=[...sentence.querySelectorAll('.word')];if(hebrewMode){const explanation=document.createElement('div');explanation.className='hebrew';explanation.dir='rtl';explanation.lang='he';explanation.textContent=d[0]==='quiz'?'בחרו את התשובה הנכונה.':(typeof d[3]==='string'?d[3]:'');if(explanation.textContent)stage.append(explanation)}if(d[0]==='quiz'){const choices=document.createElement('div');choices.className='choices';const feedback=document.createElement('div');feedback.className='feedback';d[3].forEach((answer,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=answer;b.onclick=()=>{choices.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add(i===d[4]?'correct':'wrong');if(i!==d[4])choices.children[d[4]].classList.add('correct');feedback.textContent=i===d[4]?'✓ Correct!':'Try to understand why the green answer is correct.'};choices.append(b)});stage.append(choices,feedback)}else{}

$('count').textContent=(index+1)+' / '+slides.length;history.replaceState(null,'','#slide-'+(index+1));const fullSentence=/[.!?]$/.test(raw.trim())&&!/[→←↔]/.test(raw)&&raw.trim().split(/\s+/).length>=5;if(fullSentence&&d[0]!=='quiz'){timer=setTimeout(()=>{timer=null;speak()},4000)}else{$('read').disabled=true;$('read').title='Narration is for complete English sentences only';}}
$('prev').onclick=()=>render(index-1);$('next').onclick=()=>render(index+1);$('reveal').onclick=()=>{const e=document.querySelector('.detail');if(e)e.classList.toggle('visible')};$('read').onclick=()=>{if(playing&&!paused){paused=true;elapsed+=performance.now()-start;synth.pause();$('read').textContent='▶ Resume'}else if(paused){paused=false;start=performance.now();synth.resume();$('read').textContent='⏸ Pause'}else{stop();speak()}};let swipeX=0,swipeY=0;
document.getElementById('stage').addEventListener('touchstart',e=>{swipeX=e.changedTouches[0].clientX;swipeY=e.changedTouches[0].clientY},{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{if(e.target.closest('button,select'))return;const dx=e.changedTouches[0].clientX-swipeX,dy=e.changedTouches[0].clientY-swipeY;if(Math.abs(dy)>65&&Math.abs(dy)>Math.abs(dx)*1.2)render(index+(dy<0?1:-1))},{passive:true});
