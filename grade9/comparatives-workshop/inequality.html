const slides=[["cover","Not As ... As","Today we will describe differences without using -er or more.","נלמד לתאר אי־שוויון בין שני דברים."],["teach","Two Different Bags","The small bag is not as heavy as the large bag.","התיק הקטן פחות כבד מהגדול."],["teach","The Pattern","not → as → heavy → as","מוסיפים שלילה למבנה השוויון."],["quiz","Choose the correct form","This box is not ___ big ___ that box.",["as / as","more / than","the / most"],0],["teach","Different Heights","Ben is not as tall as Tom.","בן נמוך יותר מטום."],["teach","Two Ways to Say It","Ben is shorter than Tom. Ben is not as tall as Tom.","שתי הדרכים מתארות אותו הבדל."],["quiz","Choose the correct sentence","Choose the correct sentence.",["This street isn't as long as that street.","This street isn't as longer as that street.","This street isn't longer as that street."],0],["teach","Long Adjectives","This phone is not as expensive as that phone.","גם כאן התואר הארוך נשאר בצורתו הבסיסית."],["teach","Less Interesting","This book is not as interesting as the last book.","הספר הזה פחות מעניין מהקודם."],["quiz","Choose the correct form","The old house isn't as ___ as the new house.",["more beautiful","beautiful","most beautiful"],1],["teach","Not As Attractive","The first design is not as attractive as the second design.","העיצוב הראשון פחות מושך מהשני."],["teach","Not As Good As","This answer is not as good as your previous answer.","משתמשים בצורת הבסיס ולא בצורת ההשוואה."],["quiz","Choose the correct form","The new plan isn't as ___ as the first plan.",["better","good","best"],1],["teach","Not As Bad As","Today's weather is not as bad as yesterday's weather.","מזג האוויר היום פחות גרוע."],["quiz","Choose the correct form","The second mistake wasn't as ___ as the first.",["worse","worst","bad"],2],["teach","Short and Long","This route is not as short as the old route, but it is safer.","אפשר לשלב אי־שוויון עם השוואה רגילה."],["quiz","Choose the correct meaning","The red bag isn't as heavy as the blue bag.",["The red bag is lighter.","The red bag is heavier.","Both bags weigh the same."],0],["teach","Not As Quickly","The new student does not read as quickly as the others.","אפשר להשוות גם פעולות."],["quiz","Choose the correct form","I can't run as ___ as my brother.",["faster","fast","fastest"],1],["teach","Different but Better","The new road is not as short as the old road, but it is safer.","משפט אחד יכול לתאר גם חיסרון וגם יתרון."],["quiz","Rewrite the Sentence","The bus is slower than the train.",["The bus isn't as fast as the train.","The bus isn't as faster as the train.","The bus is as fast as the train."],0],["detect","Sentence Detective","Although the new apartment is not as large as the old one, it is more comfortable because it is closer to school.","זהו את הניגוד, אי־השוויון והסיבה."],["detect","Find the Main Clause","The route that we chose yesterday is not as short as the route our teacher suggested, but it is much safer.","זהו את הנושא המורחב ואת שתי ההשוואות."],["quiz","Sentence Detective Challenge","Which phrase expresses inequality: The old phone isn't as expensive as the new one because it has fewer features?",["because it has","isn't as expensive as","the new one"],1],["finish","Your Final Challenge","Write three sentences showing how two things are different.","כתבו שלושה משפטים מקוריים המתארים הבדלים."]];const mode=new URLSearchParams(location.search).get('lang')==='he'?'he':'en';

 }
