<!doctype html>

  <title>Too Much Noise at School | Grade 9 Lesson</title>

<body>
  <header class="topbar">
    <a class="back" href="../../#grade9" aria-label="Back to Grade 9 materials">← <span>Grade 9</span></a>
    <nav class="chapters" aria-label="Lesson sections">
      <button data-chapter="start">Start</button>
      <button data-chapter="words">Words</button>
      <button data-chapter="reading">Read</button>
      <button data-chapter="questions">Questions</button>
      <button data-chapter="writing">Write</button>

    <div class="top-actions">
      <a class="pdf-link" href="grade9-noise-and-school-trips.pdf" type="application/pdf" target="_blank" rel="noopener">PDF</a>
      <button id="copy-link" aria-label="Copy presentation link">Copy link</button>
      <button id="hebrew-toggle" lang="he" aria-pressed="false" title="Show or hide Hebrew translations">עברית</button>

      <button id="next" aria-label="Next slide"><span>Next</span> ↓</button>

  <dialog id="contents-dialog" aria-labelledby="contents-title">
