<script>const lines=[["I’m fourteen and a half. My family always forgets the half.","אני בן ארבע עשרה וחצי. המשפחה שלי תמיד שוכחת את החצי."],["Last Friday, Dad drove us to Grandpa’s house.","ביום שישי האחרון אבא הסיע אותנו לבית של סבא."],["Ben, who’s eleven, took one window seat. Daniel took the other.","בן, שהוא בן אחת עשרה, התיישב ליד חלון אחד. דניאל התיישב ליד החלון השני."],["He’s seventeen and has a driver’s license. I got the middle seat again.","הוא בן שבע עשרה ויש לו רישיון נהיגה. אני שוב קיבלתי את המושב האמצעי."],["Ben wanted my phone. “Be patient,” Dad said. “You’re older.”","בן רצה את הטלפון שלי. ״קצת סבלנות,״ אמר אבא. ״אתה גדול ממנו.״"],["I handed it over. Up ahead, I saw the turn for the football field.","נתתי לו אותו. בהמשך הדרך ראיתי את הפנייה למגרש הכדורגל."],["“There’s a shorter way past the field,” I began. “Hang on,” Daniel said.","״יש דרך קצרה יותר שעוברת ליד המגרש,״ התחלתי לומר. ״חכה רגע,״ אמר דניאל."],["Dad listened to Daniel. Ben played his game. I watched us miss the turn.","אבא הקשיב לדניאל. בן שיחק בטלפון. ראיתי איך אנחנו חולפים על פני הפנייה."],["On the way home, Ben put down my phone. “Where was that shorter road?”","בדרך הביתה בן הניח את הטלפון שלי. ״איפה הייתה הדרך הקצרה ההיא?״"],["“Just past Grandpa’s gate,” I said. This time, Daniel leaned over to see.","״ממש אחרי השער של סבא,״ אמרתי. הפעם דניאל רכן קדימה כדי לראות."],["“Left here?” Dad asked. I nodded. We drove past the football field.","״שמאלה כאן?״ שאל אבא. הנהנתי. חלפנו על פני מגרש הכדורגל."],["I still had the middle seat. But this time, both my brothers were looking at me.","עדיין ישבתי באמצע. אבל הפעם שני האחים שלי הסתכלו עליי."]],questions=[["Why does the half matter to the narrator?","Think about what his family forgets.",0,"He wants his family to notice that he is growing up."],["How does he end up in the middle seat?","Picture the two windows.",2,"Ben and Daniel take the window seats before he sits down."],["Why does Dad expect him to give Ben the phone?","Listen to Dad’s last two words.",4,"Dad expects him to be patient because he is older than Ben."],["What happens while Dad is listening to Daniel?","Watch the road through the narrator’s eyes.",7,"They drive past the turn the narrator wanted to show them."],["Who remembers the shorter road first on the way home?","Notice who puts the phone down.",8,"Ben remembers it and asks his brother about it."],["How do we know Dad trusts the narrator’s directions?","Look for what Dad does after the nod.",10,"Dad asks where to turn and then follows his directions."],["What changes for the narrator even though his seat stays the same?","Compare the way his brothers act at the end with the first ride.",11,"He feels heard. Ben asks for his help, and Daniel turns to look."]],clips=[[[0.43, 0.991, 1.147, 1.186, 1.54, 1.784, 2.215, 2.723, 3.253, 3.32, 3.792], "SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//NIxAAaS+IgCGBGnYPwrhEFYlAMqdkQnlRReiyABDx+Y/GMf835Uf/uXz0Qt3NzQvfqK5lZTf0L6+l/d/uhHubxKc8ieIX/EgRK5uTnEpl8Qn0L9ELOEhU/RCCCPyd/r/+X6E+n///TQv/OFC9CiIEL+iOI0ioRqQAkzEM3fKodBaB87JgNLw3mA8xusv8l//NIxBkaAyZUVGBGmdf5fnxEqV84if/9OIYQuu59P0RTc/Liz0TfTKvECF6Spnwryv/np+T67nCOz/L7//ThV//t3c0ufBse8D/O4zYfzjmO1R2rmMEXbqUu7NgY1YDR6fK0F6FpN5mfbaMCwoiJ+sizn8ZXpnS/6qlG8uRpG1uqmRNeR1j6qJILP/h5/GPq//NIxDQZYx5MUnhGfF/Zm7GYu5ZUm0ZmVfjG3kZr5l98iL/n91/voZkDKc4FampR61/QxKocFUFTQ5bSJFq6htQ6FhDWPj7lorlkMD7t44YSTYhCz+/2dc92I/1Lsv/nMsmlSAky/k0I4kmS5UuZO2d4efc2LMlOPlzLvQVamPIQMzetDcJSvYd8z8cylNk6//NIxFEbm844AMBGnTXdoIBNe0lzv50lz/OO6SfZlu9U2JsRNwsfHKYh9WDt8WzGhgrIO6gCXl2fptMgyMXRSu/yUuc60pP19dzu+udmczCCjXnIz2dbH2RipEyljWq7XO9mc51zFdM1kKoixoxBBGdihtzOQtTItMTulWOu29KpVVFi1e6KphF7tO9VPSyF//NIxGUda+o4AMBKfbFkV6C6u9lVjGIWew7Ovj3qBmQchkrgcRuCYArB0w397b+rb+qU/+df/zhflff/T8+/Pn/t+yfkkmVKqoZWjUGCbZFZ40yMu+esJSWl8zjkauI9KVL76LnnF01sqx0lQmM/LJl/Jz75Q9URvLKbn36RFWIz+ws0f23HNg6Hy5KXay8V//NIxHIcg6o8SU8YAJAEBw4Eb0OZwGJjBQK5LtBj2Or/i9zdFUuUq2om/M9rGpwe+EsdqjEIQq9nJOjonAuJGzvU6cfPZtk6jDk5LeZliZSc0eIUB5A6Ufh8LCZTKejNQJhm0kMGGkRknEzdB const quiz=new URLSearchParams(location.search).has('questions'),$=id=>document.getElementById(id);
const slides=[{k:quiz?'Reading questions':'Read Along',t:'The Middle Seat',cover:true}];
if(quiz){for(const [t,h,n,a] of questions)slides.push({k:'Question',t,h},{k:'From the story',t:lines[n][0],n},{k:'Possible answer',t:a})}
else{lines.forEach(([t,he],n)=>{const k=['The ride','The missed turn','The way home'][Math.floor(n/4)];slides.push({k,t,n},{k,t,n,he})})}
