<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grade 9 · Simple and Continuous Tenses</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#071322;color:#f6fbff;font-family:system-ui,Arial,sans-serif;overflow:hidden}body{display:flex;flex-direction:column}.head{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;color:#90e7e2;font-weight:800}.head a{color:white;text-decoration:none;font-size:25px}.deck{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;max-width:1250px;width:100%;margin:auto;padding:12px 25px 30px;touch-action:pan-y}h1{font-size:clamp(28px,4.2vw,53px);margin:0 0 12px}p{margin:2px 0 20px;color:#b6cee4;font-size:clamp(15px,2vw,21px)}.lines{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:12px;min-height:0;height:min(57vh,520px)}.line.placeholder{visibility:hidden;pointer-events:none}.line{min-height:0;display:grid;grid-template-columns:170px 1fr;direction:ltr;align-items:center;gap:10px;background:#142940;border:1px solid #35516d;border-radius:18px;padding:19px;min-height:100px}.line:nth-child(1){border-left:7px solid #71eec5}.line:nth-child(2){border-left:7px solid #ffce72}.line:nth-child(3){border-left:7px solid #85b5ff}.tag{font-size:14px;color:#bbcde1;font-weight:bold;text-transform:uppercase}.sentence{font-size:clamp(22px,3.1vw,42px);font-weight:700;line-height:1.35}.hint{padding:14px;border-radius:14px;background:#233c50;margin-top:15px;display:none;font-size:17px}.hint.show{display:block}.foot{padding:10px;display:flex;gap:9px;justify-content:center;align-items:center;background:#0a1a2c;border-top:1px solid #294059;flex-wrap:wrap}button{font:700 16px system-ui;border-radius:13px;background:#193651;border:1px solid #58728b;color:white;padding:12px 17px;cursor:pointer}button.primary{background:#72e6ca;color:#052c28}button:disabled{opacity:.35}.progress{position:fixed;bottom:0;right:0;height:4px;background:#6ee9c9;transition:width .3s}.small{color:#aecbe0;font-size:13px} @media(max-width:650px){.deck{padding:8px 13px 20px}.lines{height:min(55vh,440px)}.line{grid-template-columns:1fr;padding:10px;gap:2px;min-height:0}.sentence{font-size:clamp(20px,5.4vw,30px)}.head{padding:12px}.foot button{padding:10px}.small{display:none}}</style></head><body><header class="head"><a href="../../#grade9" title="בחזרה לכיתה ט׳">⌂</a><span>GRADE 9 · SIMPLE & CONTINUOUS</span><span id="count"></span></header><main class="deck" id="deck"><h1 id="title"></h1><p id="sub"></p><div class="lines" id="lines"></div><div class="hint" id="hint"></div></main><footer class="foot"><button id="prev">↓ קודם</button><button id="next" class="primary">↑ הבא</button><button id="why">💡 הסבר</button><button id="hear">🔊 הקראה</button><span class="small">החליקו למעלה לשקף הבא · למטה לחזור</span></footer><div class="progress" id="bar"></div><script>
const slides=[],names=['Present','Past','Future'],kinds=['משפט חיובי','משפט שלילי','משפט שאלה','משפט שאלה עם מילת שאלה'];
const sets=[['John','help','helps','helped','the community','Who'],['David','display','displays','displayed','the evidence','What'],['Daniel','translate','translates','translated','the message','What']];
function triple(lines,heading,note,sub){for(let n=1;n<=3;n++)slides.push({title:heading,sub:sub+' · שלב '+n+' מתוך 3',lines:lines.slice(0,n),note})}
sets.forEach(([s,b,t,p,o,w],i)=>{let all=[[s+' '+t+' '+o+'.',s+' '+p+' '+o+'.',s+' will '+b+' '+o+'.'],[s+' does not '+b+' '+o+'.',s+' did not '+b+' '+o+'.',s+' will not '+b+' '+o+'.'],['Does '+s+' '+b+' '+o+'?','Did '+s+' '+b+' '+o+'?','Will '+s+' '+b+' '+o+'?'],[w+' does '+s+' '+b+'?',w+' did '+s+' '+b+'?',w+' will '+s+' '+b+'?']];all.forEach((a,j)=>triple(a,'מחזור '+(i+1)+' · '+kinds[j],'שימו לב לצורת הפועל אחרי does / did / will. אותו רעיון בשלושה זמנים.','Simple Tenses'))});
const compare=[['John usually studies at home.','John is studying at the library today.','שגרה לעומת פעולה זמנית'],['I think this is a good idea.','I am thinking about your suggestion.','דעה לעומת תהליך חשיבה'],['David works at the library.','David is working there this week.','עובדה קבועה לעומת מצב זמני'],['Daniel reads before bed.','Daniel is reading an article right now.','הרגל לעומת עכשיו'],['The bus leaves at eight.','The bus is leaving in five minutes.','לוח זמנים לעומת תוכנית קרובה'],['John always helps his friends.','John is always interrupting me!','Always עם Continuous יכול להדגיש הרגל מעצבן'],['I see what you mean.','I am seeing the dentist tomorrow.','מבין לעומת פגישה מתוכננת'],['This soup tastes delicious.','David is tasting the soup.','תכונה לעומת פעולה'],['I have a plan.','I am having lunch with Daniel.','בעלות לעומת פעילות']];
compare.forEach((a,i)=>slides.push({title:'Simple vs Continuous · '+(i+1),sub:'מה ההבדל במשמעות?',lines:a.slice(0,2),note:a[2]}));
const stat=[['I know the answer.','Not usually: I am knowing the answer.','know מציין ידיעה, לא פעולה רגעית'],['David believes his friend.','Not usually: David is believing his friend.','believe במשמעות אמונה'],['This bag belongs to John.','Not usually: This bag is belonging to John.','belong מציין שייכות'],['I understand the question.','Not usually: I am understanding the question.','understand מציין הבנה'],['Daniel needs help.','Not usually: Daniel is needing help.','need מציין צורך'],['John loves this song.','Not usually: John is loving this song.','love לרוב מציין רגש; יש שימושים שיווקיים חריגים']];
stat.forEach((a,i)=>slides.push({title:'Stative Verbs · '+(i+1)+'/6',sub:'פעלים של מצב בדרך כלל אינם מופיעים ב־Continuous',lines:a.slice(0,2),note:a[2]}));
const have=[['John has a new bike.','Not usually: John is having a new bike.','בעלות: have בהווה פשוט'],['David has breakfast at seven.','David is having breakfast now.','ארוחה: שתי הצורות אפשריות במשמעויות שונות'],['We have a great time every Friday.','We are having a great time today.','חוויה מתמשכת: having טבעי'],['Daniel has a meeting every Monday.','Daniel is having a meeting now.','אירוע או פגישה יכולים להופיע ב־Continuous'],['Does John have a car?','Is John having lunch?','Have של בעלות לעומת Have של פעילות']];
have.forEach((a,i)=>slides.push({title:'Have vs Having · '+(i+1)+'/5',sub:'המשמעות קובעת את הצורה',lines:a.slice(0,2),note:a[2]}));
const progressive=[['John','prepare','preparing','a school project','What','when the teacher called','at seven tomorrow'],['David','read','reading','the article','What','when the bell rang','at eight tomorrow'],['Daniel','help','helping','his friend','Who','when the teacher entered','at noon tomorrow']];
progressive.forEach(([s,b,ing,o,w,pastTime,futureTime],i)=>{let a=[s+' is '+ing+' '+o+' now.',s+' was '+ing+' '+o+' '+pastTime+'.',s+' will be '+ing+' '+o+' '+futureTime+'.'];let neg=[s+' is not '+ing+' '+o+' now.',s+' was not '+ing+' '+o+' '+pastTime+'.',s+' will not be '+ing+' '+o+' '+futureTime+'.'];let c=['Is '+s+' '+ing+' '+o+' now?','Was '+s+' '+ing+' '+o+' '+pastTime+'?','Will '+s+' be '+ing+' '+o+' '+futureTime+'?'];let d=[w+' is '+s+' '+ing+' now?',w+' was '+s+' '+ing+' '+pastTime+'?',w+' will '+s+' be '+ing+' '+futureTime+'?'];[a,neg,c,d].forEach((x,j)=>triple(x,'Continuous · מחזור '+(i+1)+' · '+kinds[j],'Present: am/is/are + ing · Past: was/were + ing · Future: will be + ing','Continuous Tenses'))});
let index=0;const $=x=>document.getElementById(x);function show(){const s=slides[index];$('count').textContent=(index+1)+' / '+slides.length;$('title').textContent=s.title;$('sub').textContent=s.sub;$('lines').innerHTML=Array.from({length:3},(_,i)=>i<s.lines.length?'<div class="line"><span class="tag">'+names[i]+'</span><span class="sentence">'+s.lines[i]+'</span></div>':'<div class="line placeholder" aria-hidden="true"></div>').join('');$('hint').textContent=s.note;$('hint').classList.remove('show');$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;$('bar').style.width=((index+1)/slides.length*100)+'%'}function move(d){index=Math.max(0,Math.min(slides.length-1,index+d));show()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('why').onclick=()=>$('hint').classList.toggle('show');$('hear').onclick=()=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(slides[index].lines.join('. '));u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};let sx=null,sy=null;document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(sy===null)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dy)>45&&Math.abs(dy)>Math.abs(dx)*1.1)move(dy<0?1:-1);else if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)move(dx<0?1:-1);sx=sy=null},{passive:true});document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowLeft',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();move(-1)}});show();
</script></body></html>
