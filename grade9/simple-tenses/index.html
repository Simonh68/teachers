<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grade 9 · Simple and Continuous Tenses</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#071322;color:#f6fbff;font-family:system-ui,Arial,sans-serif;overflow:hidden}body{display:flex;flex-direction:column}.head{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;color:#90e7e2;font-weight:800}.head a{color:white;text-decoration:none;font-size:25px}.deck{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;max-width:1250px;width:100%;margin:auto;padding:12px 25px 30px;touch-action:pan-y}h1{font-size:clamp(28px,4.2vw,53px);margin:0 0 12px}p{margin:2px 0 20px;color:#b6cee4;font-size:clamp(15px,2vw,21px)}.lines{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:12px;min-height:0;height:min(57vh,520px)}.line.placeholder{visibility:hidden;pointer-events:none}.line.correct{border:2px solid #44dd91;background:#10352b}.line.correct .tag{color:#70ffb2}.line.wrong{border:2px solid #ff5768;background:#431b2b}.line.wrong .tag,.line.wrong .sentence{color:#ffb5a0}.line.wrong .sentence{font-size:clamp(20px,2.65vw,35px)}.line{min-height:0;display:grid;grid-template-columns:170px 1fr;direction:ltr;align-items:center;gap:10px;background:#142940;border:1px solid #35516d;border-radius:18px;padding:19px;min-height:100px}.line:nth-child(1){border-left:7px solid #71eec5}.line:nth-child(2){border-left:7px solid #ffce72}.line:nth-child(3){border-left:7px solid #85b5ff}.tag{font-size:14px;color:#bbcde1;font-weight:bold;text-transform:uppercase}.sentence{font-size:clamp(22px,3.1vw,42px);font-weight:700;line-height:1.35}.quiz{display:flex;flex-direction:column;justify-content:center;gap:15px;direction:ltr;align-items:stretch;text-align:center;min-height:0;height:min(57vh,520px)}.quizQuestion{font-size:clamp(24px,4vw,45px);font-weight:800}.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.choice{min-width:210px;font-size:clamp(20px,2.6vw,30px);padding:23px;border:2px solid #5c7998}.choice.correct{border-color:#54ecac;background:#14533b}.choice.wrong{border-color:#ff647c;background:#582332}.feedback{font-size:21px;min-height:36px;color:#9bead4}.hint{padding:14px;border-radius:14px;background:#233c50;margin-top:15px;display:none;font-size:17px}.hint.show{display:block}.foot{padding:10px;display:flex;gap:9px;justify-content:center;align-items:center;background:#0a1a2c;border-top:1px solid #294059;flex-wrap:wrap}button{font:700 16px system-ui;border-radius:13px;background:#193651;border:1px solid #58728b;color:white;padding:12px 17px;cursor:pointer}button.primary{background:#72e6ca;color:#052c28}button:disabled{opacity:.35}.progress{position:fixed;bottom:0;right:0;height:4px;background:#6ee9c9;transition:width .3s}.small{color:#aecbe0;font-size:13px} @media(max-width:650px){.deck{padding:8px 13px 20px}.lines{height:min(55vh,440px)}.line{grid-template-columns:1fr;padding:10px;gap:2px;min-height:0}.sentence{font-size:clamp(20px,5.4vw,30px)}.head{padding:12px}.foot button{padding:10px}.small{display:none}}</style></head><body><header class="head"><a href="../../#grade9" title="בחזרה לכיתה ט׳">⌂</a><span>GRADE 9 · SIMPLE & CONTINUOUS</span><span id="count"></span></header><main class="deck" id="deck"><h1 id="title"></h1><p id="sub"></p><div class="lines" id="lines"></div><div class="hint" id="hint"></div></main><footer class="foot"><button id="prev">↑ קודם</button><button id="next" class="primary">↓ הבא</button><button id="why">💡 הסבר</button><button id="hear">🔊 הקראה</button><span class="small">החליקו למעלה לשקף הבא · למטה לחזור</span></footer><div class="progress" id="bar"></div><script>
const slides=[],names=['Present','Past','Future'],kinds=['משפט חיובי','משפט שלילי','משפט שאלה','משפט שאלה עם מילת שאלה'];
const sets=[['John','help','helps','helped','the community','Who'],['David','display','displays','displayed','the evidence','What']];
function triple(lines,heading,note,sub){for(let n=1;n<=3;n++)slides.push({title:heading,sub:sub+' · שלב '+n+' מתוך 3',lines:lines.slice(0,n),note})}
function quizSlide(q,title){slides.push({title,sub:'בחרו תשובה אחת · משוב מיידי',lines:[],note:q.reason,quiz:q})}
function simpleCycle([s,b,t,p,o,w],i){const all=[[s+' '+t+' '+o+'.',s+' '+p+' '+o+'.',s+' will '+b+' '+o+'.'],[s+' does not '+b+' '+o+'.',s+' did not '+b+' '+o+'.',s+' will not '+b+' '+o+'.'],['Does '+s+' '+b+' '+o+'?','Did '+s+' '+b+' '+o+'?','Will '+s+' '+b+' '+o+'?'],[w+' does '+s+' '+b+'?',w+' did '+s+' '+b+'?',w+' will '+s+' '+b+'?']];all.forEach((x,j)=>triple(x,'מחזור '+(i+1)+' · '+kinds[j],'אחרי does / did / will משתמשים בפועל הבסיסי.','Simple Tenses'))}
sets.forEach((set,i)=>simpleCycle(set,i));
[
{q:'John ___ the community every week.',choices:['help','helps'],correct:1,reason:'John = he: בהווה פשוט מוסיפים s.'},
{q:'Did John ___ the community yesterday?',choices:['help','helped'],correct:0,reason:'אחרי Did הפועל בצורת בסיס.'},
{q:'David ___ the evidence every day.',choices:['display','displays'],correct:1,reason:'David = he, לכן displays.'},
{q:'Did David ___ the evidence?',choices:['display','displayed'],correct:0,reason:'אחרי Did משתמשים בצורת הבסיס.'},
{q:'David will ___ the evidence tomorrow.',choices:['display','displays'],correct:0,reason:'אחרי will משתמשים בפועל בסיס.'},
{q:'John ___ help tomorrow.',choices:['will','did'],correct:0,reason:'Tomorrow → will + base verb.'}
].forEach((q,i)=>quizSlide(q,'מחזור שאלות בלבד · Simple Tenses · '+(i+1)+'/6'));
// Contractions appear immediately after the three simple-tense cycles.
const contractions=[
{title:'שלילה בהווה · do not → don’t',lines:['They do not agree.','They don’t agree.'],note:'עם I / you / we / they משתמשים ב־do not או בקיצור don’t. שתי הצורות נכונות; בדיבור הקיצור שכיח.'},
{title:'שלילה בהווה · does not → doesn’t',lines:['It does not belong to Daniel.','It doesn’t belong to Daniel.'],note:'עם he / she / it משתמשים ב־does not או doesn’t. אחרי doesn’t הפועל בצורה הבסיסית: belong, לא belongs.'},
{title:'שלילה בהווה · David',lines:['David does not believe the story.','David doesn’t believe the story.'],note:'שימו לב: does not / doesn’t + פועל בסיס. לא כותבים doesn’t believes.'},
{title:'שלילה בעבר · did not → didn’t',lines:['They did not agree yesterday.','They didn’t agree yesterday.'],note:'אחרי didn’t משתמשים בפועל בסיס: agree, לא agreed.'},
{title:'שלילה בעתיד · will not → won’t',lines:['They will not cancel the meeting.','They won’t cancel the meeting.'],note:'won’t הוא הקיצור של will not, לא willn’t. אחריו פועל בסיס.'},
{title:'אותו רעיון · שלושה זמנים',lines:['They don’t agree.','They didn’t agree yesterday.','They won’t agree tomorrow.'],note:'הווה: don’t; עבר: didn’t; עתיד: won’t. אחרי כל פועל עזר משתמשים בפועל בסיס.'},
{title:'מתי משתמשים בקיצור?',lines:['It does not matter.','It doesn’t matter.'],note:'שתי הצורות תקינות. צורה מלאה שימושית להדגשה או בסגנון רשמי; קיצור טבעי מאוד בשיחה. אפשר לומר גם I don’t, he doesn’t, we won’t.'}
];contractions.forEach(x=>slides.push({...x,sub:'צורה מלאה מול צורה מקוצרת · אותה משמעות',contraction:true}));
const quiz1=[
{q:'They ___ agree with this plan.',choices:["don't","doesn't"],correct:0,reason:"They → don't, ולא doesn't."},
{q:'Daniel ___ believe this story.',choices:["don't","doesn't"],correct:1,reason:"Daniel = he → doesn't + believe."},
{q:'They ___ cancel the meeting tomorrow.',choices:["won't","didn't"],correct:0,reason:"Tomorrow → future: won't + verb."}
];quiz1.forEach((q,i)=>slides.push({title:'בדיקת הבנה · '+(i+1)+'/3',sub:'בחרו את התשובה הנכונה',lines:[],note:q.reason,quiz:q}));
const compare=[['John usually studies at home.','John is studying at the library now.','שגרה לעומת פעולה שמתרחשת עכשיו'],['I think this is a good idea.','I am thinking about the problem.','דעה לעומת תהליך חשיבה'],['David reads after school.','David is reading right now.','הרגל לעומת פעולה כעת'],['John has a new bike.','John is having lunch.','בעלות לעומת פעולה']];
compare.forEach((a,i)=>slides.push({title:'Simple vs Continuous · '+(i+1),sub:'מה ההבדל במשמעות?',lines:a.slice(0,2),note:a[2]}));
slides.push({title:'Stative Verbs · הכלל',sub:'פעלים המתארים מצב בדרך כלל מופיעים ב־Simple ולא ב־Continuous',lines:['I know the answer.','I am knowing the answer.'],note:'במשמעות של ידיעה משתמשים ב־I know. אין כלל של איסור מוחלט, אך הצורה השנייה אינה טבעית כאן.',stative:true});
const groups=[
{title:'קבוצה 1 · מחשבה וידיעה',sub:'Thinking & Knowing',lines:['I know the answer.','Daniel understands the question.','David remembers the story.'],note:'know, understand, remember, believe — מציינים ידיעה, הבנה, זיכרון ואמונה.'},
{title:'קבוצה 2 · רגשות ורצונות',sub:'Feelings & Wants',lines:['John loves music.','Daniel wants a new book.','David prefers tea.'],note:'love, like, hate, want, prefer, need — מתארים רגשות, העדפות וצרכים.'},
{title:'קבוצה 3 · בעלות, שייכות ותכונות',sub:'Possession & Being',lines:['John has a bicycle.','This bag belongs to David.','The answer seems correct.'],note:'have (בעלות), own, belong, seem — מציינים שייכות, בעלות או מצב.'},
{title:'קבוצה 4 · חושים ותפיסה',sub:'Senses & Perception',lines:['I hear the music.','This cake smells good.','I see the problem.'],note:'hear, see, smell, taste, feel — פעמים רבות סטטיים, אבל בפעולה מכוונת אפשר לומר I am smelling the flowers.'}
];
groups.forEach((g,i)=>{slides.push({...g,category:true});const tests=[
{q:'I ___ the answer.',choices:['know','am knowing'],correct:0,reason:'Know במשמעות ידיעה הוא פועל סטטי.'},
{q:'Daniel ___ this song.',choices:['loves','is loving'],correct:0,reason:'Love במשמעות רגש בדרך כלל מופיע ב־Simple.'},
{q:'This bag ___ to David.',choices:['belongs','is belonging'],correct:0,reason:'Belong הוא פועל של שייכות.'},
{q:'The soup ___ delicious.',choices:['tastes','is tasting'],correct:0,reason:'Taste שמתאר תכונה של מרק הוא סטטי.'}];quizSlide(tests[i],'שאלת תרגול · '+g.title)});
const have=[['John has a new bike.','Not usually: John is having a new bike.','בעלות: have בהווה פשוט'],['David has breakfast at seven.','David is having breakfast now.','ארוחה: שתי הצורות אפשריות במשמעויות שונות'],['I usually have a good time with my friends.','I am having a great time right now!','אני מדווח על חוויה שאני עובר ממש עכשיו. במשמעות של חוויה, having הוא שימוש טבעי ותקין.'],['Daniel has a meeting every Monday.','Daniel is having a meeting now.','אירוע או פגישה יכולים להופיע ב־Continuous'],['Does John have a car?','Is John having lunch?','Have של בעלות לעומת Have של פעילות']];
have.forEach((a,i)=>slides.push({title:'Have vs Having · '+(i+1)+'/5',sub:'המשמעות קובעת את הצורה',lines:a.slice(0,2),note:a[2]}));
const quiz2=[
{q:'I ___ about the problem right now.',choices:['think','am thinking'],correct:1,reason:'Thinking כאן הוא תהליך חשיבה עכשיו.'},
{q:'This bag ___ to David.',choices:['belongs','is belonging'],correct:0,reason:'Belong מתאר שייכות. בדרך כלל לא משתמשים ב־Continuous.'},
{q:'We ___ lunch right now.',choices:['have','are having'],correct:1,reason:'ארוחה שאנחנו אוכלים כרגע: are having.'}
];quiz2.forEach((q,i)=>slides.push({title:'אתגר · Simple or Continuous?',sub:'בחרו את המשפט המתאים להקשר',lines:[],note:q.reason,quiz:q}));
const progressive=[['John','prepare','preparing','a school project','What','when the teacher called','at seven tomorrow'],['David','read','reading','the article','What','when the bell rang','at eight tomorrow']];
progressive.forEach(([subject,base,ing,obj,wh,pastTime,futureTime],i)=>{
 const pos=[subject+' is '+ing+' '+obj+' now.',subject+' was '+ing+' '+obj+' '+pastTime+'.',subject+' will be '+ing+' '+obj+' '+futureTime+'.'];
 const neg=[subject+' is not '+ing+' '+obj+' now.',subject+' was not '+ing+' '+obj+' '+pastTime+'.',subject+' will not be '+ing+' '+obj+' '+futureTime+'.'];
 const yes=['Is '+subject+' '+ing+' '+obj+' now?','Was '+subject+' '+ing+' '+obj+' '+pastTime+'?','Will '+subject+' be '+ing+' '+obj+' '+futureTime+'?'];
 const whq=[wh+' is '+subject+' '+ing+' now?',wh+' was '+subject+' '+ing+' '+pastTime+'?',wh+' will '+subject+' be '+ing+' '+futureTime+'?'];
 [pos,neg,yes,whq].forEach((x,j)=>triple(x,'Continuous · מחזור '+(i+1)+' · '+kinds[j],'Present: am/is/are + ing · Past: was/were + ing · Future: will be + ing','Continuous Tenses'));
});
[
{q:'John ___ a project right now.',choices:['is preparing','was preparing'],correct:0,reason:'Right now → is preparing.'},
{q:'Yesterday at seven, John ___ a project.',choices:['was preparing','will be preparing'],correct:0,reason:'Yesterday at seven → was preparing.'},
{q:'David ___ the article now.',choices:['is reading','was reading'],correct:0,reason:'Now → Present Continuous.'},
{q:'Yesterday at eight, David ___ the article.',choices:['will be reading','was reading'],correct:1,reason:'Yesterday at eight → Past Continuous.'},
{q:'Tomorrow at eight, David ___ the article.',choices:['will be reading','was reading'],correct:0,reason:'Tomorrow at eight → Future Continuous.'}
].forEach((q,i)=>quizSlide(q,'מחזור שאלות בלבד · Continuous · '+(i+1)+'/5'));
const quiz3=[
{q:'At eight yesterday, Daniel ___ his friend.',choices:['was helping','is helping'],correct:0,reason:'At eight yesterday → Past Continuous.'},
{q:'At eight tomorrow, David ___ the article.',choices:['was reading','will be reading'],correct:1,reason:'At eight tomorrow → Future Continuous.'}
];quiz3.forEach((q,i)=>slides.push({title:'אתגר מסכם · '+(i+1)+'/2',sub:'בחרו את הזמן הנכון',lines:[],note:q.reason,quiz:q}));
const finalComparisons=[
['דיוויד קורא ספר בכל ערב.','David reads a book every evening.','David is reading a book every evening.',0,'Every evening מציין הרגל קבוע → Present Simple.'],
['ג׳ון קורא ספר ממש עכשיו.','John reads a book right now.','John is reading a book right now.',1,'Right now מציין פעולה שקורית עכשיו → Present Progressive.'],
['דניאל בדרך כלל משחק כדורגל אחרי הלימודים.','Daniel usually plays football after school.','Daniel is usually playing football after school.',0,'Usually מציין הרגל → Present Simple.'],
['תראו! דיוויד רץ לתחנת האוטובוס.','Look! David runs to the bus stop.','Look! David is running to the bus stop.',1,'Look! מצביע על אירוע שקורה כרגע.'],
['ג׳ון גר בחיפה.','John lives in Haifa.','John is living in Haifa.',0,'כשמתארים מקום מגורים קבוע ללא רמז לזמניות, Present Simple הוא הבחירה הרגילה.'],
['השבוע דניאל מתארח אצל סבא שלו.','Daniel stays with his grandfather this week.','Daniel is staying with his grandfather this week.',1,'This week מדגיש מצב זמני → Present Progressive.'],
['דיוויד אוהב את השיר הזה.','David likes this song.','David is liking this song.',0,'Like במשמעות של העדפה הוא בדרך כלל פועל סטטי.'],
['תסתכלו! ג׳ון אוכל ארוחת צהריים.','Look! John has lunch.','Look! John is having lunch.',1,'Having lunch היא פעילות שמתרחשת עכשיו.'],
['בית הספר שלנו מתחיל בשמונה בכל יום.','Our school starts at eight every day.','Our school is starting at eight every day.',0,'לוח זמנים קבוע: Present Simple.'],
['הקשיבו! דניאל מדבר בטלפון עכשיו.','Listen! Daniel talks on the phone now.','Listen! Daniel is talking on the phone now.',1,'Listen! ו־now מציינים פעולה שמתרחשת עכשיו.'],
['מה דיוויד עושה בכל שבת?','What does David do every Saturday?','What is David doing every Saturday?',0,'Every Saturday = הרגל; שואלים עם does.'],
['מה ג׳ון עושה כרגע?','What does John do right now?','What is John doing right now?',1,'Right now = פעולה ברגע זה; שואלים עם is + ing.']
];
finalComparisons.forEach((x,i)=>{const swap=Math.random()<.5;const options=swap?[x[2],x[1]]:[x[1],x[2]];const correct=swap?1-x[3]:x[3];quizSlide({q:x[0],choices:options,correct,reason:x[4]},'סיכום · Simple או Progressive? · '+(i+1)+'/12')});
let index=0;const $=x=>document.getElementById(x);function show(){const slide=slides[index];$('count').textContent=(index+1)+' / '+slides.length;$('title').textContent=slide.title;$('sub').textContent=slide.sub;$('hint').textContent=slide.note;$('hint').classList.remove('show');
if(slide.quiz){const q=slide.quiz;$('lines').className='quiz';$('lines').innerHTML='<div class="quizQuestion" dir="ltr">'+q.q+'</div><div class="choices">'+q.choices.map((x,i)=>'<button class="choice" data-choice="'+i+'">'+x+'</button>').join('')+'</div><div class="feedback" id="feedback" aria-live="polite"></div>';document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{const good=Number(btn.dataset.choice)===q.correct;btn.classList.add(good?'correct':'wrong');if(good){document.querySelectorAll('.choice').forEach(b=>b.disabled=true)}$('feedback').textContent=(good?'✅ נכון! ':'❌ נסו שוב. ')+q.reason;});}
else{$('lines').className='lines';$('lines').innerHTML=Array.from({length:3},(_,i)=>i<slide.lines.length?'<div class="line '+(slide.stative?(i===0?'correct':'wrong'):'')+'"><span class="tag">'+(slide.stative?(i===0?'✅ שימוש רגיל':'⚠️ שימוש חריג'):slide.contraction?(i===0?'צורה מלאה':i===1?'צורה מקוצרת':'צורה נוספת'):slide.category?'דוגמה '+(i+1):slide.lines.length===3?'['+['הווה','עבר','עתיד'][i]+']':i===0?'דוגמה ראשונה':'דוגמה שנייה')+'</span><span class="sentence">'+slide.lines[i]+'</span></div>':'<div class="line placeholder" aria-hidden="true"></div>').join('');}
$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;$('bar').style.width=((index+1)/slides.length*100)+'%'}
function move(d){index=Math.max(0,Math.min(slides.length-1,index+d));show()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('why').onclick=()=>$('hint').classList.toggle('show');$('hear').onclick=()=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(slides[index].lines.join('. '));u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};let sx=null,sy=null;document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(sy===null)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dy)>45&&Math.abs(dy)>Math.abs(dx)*1.1)move(dy<0?1:-1);else if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)move(dx<0?1:-1);sx=sy=null},{passive:true});document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();move(-1)}});show();
</script></body></html>
