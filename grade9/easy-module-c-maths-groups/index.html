<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 9 | Easy Module C</title><style>
:root{--bg:#081425;--ink:#f8fcff;--blue:#60e9f8;--gold:#ffd576}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 20%,#183d53,transparent 48%),var(--bg);color:var(--ink);font-family:Arial,sans-serif;overflow:hidden}.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:7vh 6vw 11vh}.slide.active{display:flex}.inside{width:min(1100px,100%);text-align:left;direction:ltr}.eyebrow{font-size:clamp(15px,1.7vw,21px);letter-spacing:.13em;color:var(--blue);font-weight:800}.main{font-size:clamp(40px,6.3vw,86px);line-height:1.13;font-weight:900;margin:22px 0}.sub{font-size:clamp(23px,3.3vw,45px);line-height:1.28;color:#d8e7f3}.he{direction:rtl;text-align:right}.he .main{color:var(--gold)}.word{color:var(--blue)}.quote{border-left:6px solid var(--gold);padding-left:25px}.small{font-size:clamp(19px,2.45vw,34px);line-height:1.45}.long{font-size:clamp(23px,3.4vw,48px)}.tag{display:inline-block;background:#183b50;border:1px solid #4cb2c4;padding:10px 18px;border-radius:20px;color:#d7f7ff;font-weight:700}.actions{position:fixed;bottom:0;left:0;right:0;background:#04101dd9;border-top:1px solid #ffffff22;display:flex;align-items:center;gap:12px;padding:13px 3vw;z-index:20}.actions button{background:#18354a;color:white;border:1px solid #628091;border-radius:12px;font-size:22px;min-width:51px;min-height:43px;cursor:pointer}.actions a{color:var(--blue);font-size:14px}.space{flex:1}.pill{font-size:15px;color:#bdd2df}#star{position:fixed;top:17px;right:20px;border:0;background:#20374c;color:var(--gold);font-size:27px;z-index:21;border-radius:12px;padding:6px 13px;cursor:pointer}#tip{display:none;position:fixed;top:65px;right:20px;max-width:380px;padding:16px;border:1px solid var(--gold);border-radius:15px;background:#15293e;z-index:23;font-size:19px;direction:rtl}#tip.open{display:block}@media(max-width:650px){.slide{padding:6vh 5vw 13vh}.main{font-size:clamp(33px,9vw,58px)}.actions{gap:6px}.actions a{font-size:12px}.pill{font-size:12px}}
</style></head><body><main id="deck"></main><button id="star" title="רמז">★</button><div id="tip"></div><footer class="actions"><button id="prev">↑</button><button id="next">↓</button><span id="counter" class="pill"></span><span class="space"></span><button id="audio" title="Read aloud">🔊</button><a href="./worksheet.pdf">PDF</a><a href="../../#grade9">חומרי כיתה ט׳</a></footer><script>
const vocabulary=[["different","שונה","Students learn in different groups."],["group","קבוצה / הקבצה","Our group meets today."],["quickly","במהירות","Some students learn quickly."],["practise","לתרגל","We need time to practise."],["supporter","תומך","Supporters like the idea."],["difficult","קשה","Maths can be difficult."],["comfortable","נוח","Everyone needs a comfortable speed."],["however","אולם / עם זאת","However, not everyone agrees."],["agree","להסכים","Do you agree?"],["clever","חכם","She is a clever student."],["opportunity","הזדמנות","Everyone needs an opportunity."],["system","שיטה / מערכת","The school tried a new system."],["together","ביחד","They studied together."],["topic","נושא","This topic is difficult."],["progress","התקדמות","We can all make progress."],["allow","לאפשר","Should schools allow phones?"]], paragraphs=["Many schools put students into different maths groups. Some groups learn quickly, while other groups have more time to practise. Is this a good idea?","Supporters say that groups help teachers plan better lessons. Students who find maths difficult can get more help. Students who learn quickly can try harder questions. Everyone can learn at a comfortable speed.","However, not everyone agrees. Some students feel bad when they are put in a slower group. They may think they are not clever. Also, students in different groups do not always get the same opportunities.","At Green Hill School, students tried a new system. They studied together for three lessons a week. In one lesson, they worked in small groups and got help with the topics they found difficult.","After two months, most students said they liked the new system. They felt that they could learn from one another. Their teacher said, \"The important thing is not the name of the group. It is helping every student make progress.\""], questions=[["What is the text mainly about?","Different maths groups in schools.","The text explains the advantages and problems of maths groups."],["Complete: Some maths groups have more time to _____.","practise","Find the answer in paragraph 1."],["Give ONE reason why supporters like maths groups.","Students can get more help OR try harder questions.","Paragraph 2 gives both reasons."],["Why may students feel bad in a slower group?","They may think they are not clever.","Look at paragraph 3."],["What did students at Green Hill School do three times a week?","They studied together.","Look at paragraph 4."],["What did most students think after two months?","They liked the new system.","Look at paragraph 5."],["According to the teacher, what is the most important thing?","Helping every student make progress.","The last sentence of the text gives the answer."]];
const slides=[];function add(k,head,main,sub="",tip=""){slides.push({k,head,main,sub,tip})}
add("intro","GRADE 9 · EASY MODULE C","Should Schools Have Different Maths Groups?","Vocabulary · Reading · Seven questions · 70-word writing");
add("intro","TODAY'S GOAL","Read. Understand. Answer.","Easy Module C practice");
vocabulary.forEach(([en,he,example])=>{add("word","VOCABULARY",en,example,"חשבו על משמעות המילה לפני שאתם עוברים לשקף הבא.");add("he","VOCABULARY",he,en+" — "+example)});
add("intro","READING","Should Schools Have Different Maths Groups?","Five short paragraphs");
paragraphs.forEach((p,i)=>{add("read","PARAGRAPH "+(i+1),p,"", "קראו שוב את הפסקה והצביעו על המשפט שמסביר את הרעיון המרכזי.");add("he","MAIN IDEA · PARAGRAPH "+(i+1),["בתי ספר מחלקים תלמידים להקבצות במתמטיקה.","יתרונות ההקבצות: יותר עזרה ואתגר מתאים.","חסרונות: תחושת תיוג והזדמנויות לא שוות.","בית הספר ניסה לשלב למידה משותפת ועבודה בקבוצות קטנות.","התלמידים אהבו את השיטה; החשוב הוא שכל תלמיד יתקדם."][i])});
questions.forEach(([q,a,h],i)=>{add("question","QUESTION "+(i+1),q,"",h);add("answer","MODEL ANSWER",a,"",h)});
add("intro","QUESTION 8 · WRITING","Should students be allowed to use mobile phones in class?","Write about 70 words. Give TWO reasons.");
["In my opinion, ...","First, ...","Also, ...","For example, ...","In conclusion, ..."].forEach(x=>add("write","WRITING FRAME",x,"Build your own opinion."));
add("intro","READY FOR YOUR TEST?","Read the text. Answer 1–7. Write about 70 words.","Open the two-page PDF below.");
const deck=document.getElementById("deck");slides.forEach((s,i)=>{const e=document.createElement("section");e.className="slide "+(s.k==="he"?"he":"");e.innerHTML='<div class="inside"><div class="eyebrow">'+s.head+'</div><div class="main '+(s.main.length>130?'small':s.main.length>65?'long':'')+'">'+s.main.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</div>'+(s.sub?'<div class="sub">'+s.sub.replace(/&/g,"&amp;")+'</div>':'')+'</div>';deck.appendChild(e)});
let current=0,startX=0,startY=0,locked=false,audioTimer;const elems=[...document.querySelectorAll(".slide")];
function show(i){current=Math.max(0,Math.min(elems.length-1,i));elems.forEach((e,n)=>e.classList.toggle("active",n===current));document.getElementById("counter").textContent=(current+1)+" / "+elems.length;document.getElementById("tip").classList.remove("open");clearTimeout(audioTimer);if("speechSynthesis" in window)speechSynthesis.cancel();if(!["he","intro"].includes(slides[current].k))audioTimer=setTimeout(()=>read(),4000);location.hash="slide-"+(current+1)}
function read(){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const s=slides[current];if(s.k==="he")return;const text=s.k==="read"||s.k==="word"||s.k==="answer"||s.k==="question"?s.main:"";if(!text)return;const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.7;speechSynthesis.speak(u)}
document.getElementById("prev").onclick=()=>show(current-1);document.getElementById("next").onclick=()=>show(current+1);document.getElementById("audio").onclick=read;document.getElementById("star").onclick=()=>{const t=document.getElementById("tip");t.textContent=slides[current].tip||"קראו, חשבו ורק אז המשיכו.";t.classList.toggle("open")};
document.addEventListener("keydown",e=>{if(["ArrowDown","ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();show(current+1)}else if(["ArrowUp","ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(current-1)}});
document.addEventListener("wheel",e=>{if(locked||Math.abs(e.deltaY)<15)return;locked=true;show(current+(e.deltaY>0?1:-1));setTimeout(()=>locked=false,450)},{passive:true});
document.addEventListener("touchstart",e=>{startY=e.changedTouches[0].clientY;startX=e.changedTouches[0].clientX},{passive:true});document.addEventListener("touchend",e=>{const y=startY-e.changedTouches[0].clientY,x=startX-e.changedTouches[0].clientX,d=Math.abs(y)>Math.abs(x)?y:x;if(Math.abs(d)>38)show(current+(d>0?1:-1))},{passive:true});
show(Math.max(0,(Number((location.hash.match(/slide-(\d+)/)||[])[1])||1)-1));
</script></body></html>
