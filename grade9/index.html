add(`<div class="content"><div class="eyebrow">MAIN ROUTE</div><h1 class="title">BAND II — CORE I</h1><p class="subtitle">רק בדיקה זריזה: Core I ומספר הקבוצה שקיבלתם.</p><div class="bubble">הכול מתאים? מתחילים.</div></div>`);
add(`<div class="content"><div class="eyebrow">LEARNING ROUTINE</div><h1 class="title">שתי קבוצות ואז בוחן</h1><div class="flow"><div class="step">קבוצה 1</div><div class="arrow">＋</div><div class="step">קבוצה 2</div><div class="arrow">←</div><div class="step" style="border-color:var(--gold)">בוחן מילים</div></div></div>`);
add(`<div class="content"><div class="eyebrow">HOW TO LEARN</div><h1 class="title">שנייה. לא להפוך ישר.</h1><div class="flow"><div class="step">קוראים</div><div class="arrow">←</div><div class="step">מנסים להיזכר</div><div class="arrow">←</div><div class="step">בודקים</div></div><p class="subtitle">המוח עובד כשמנסים לבד — לא כשישר מציצים.</p></div>`);
add(`<div class="content"><div class="eyebrow">CHALLENGE</div><h1 class="title">30 מילים שצריך לפצח</h1><p class="subtitle">קודם מילה ומשפט. מנסים להבין לבד. רק אז עוברים לפתרון.</p><div class="bubble">קודם ניחוש חכם, אחר כך תשובה 🎯</div></div>`);
words.forEach((x,i)=>{
  const wordSize=x.w.length>25?'xlong':x.w.length>16?'long':'';
  const meaningSize=x.m.length>25?'long':'';
  add(`<span class="challengeTag">WORD ${String(i+1).padStart(2,'0')} / 30</span><span class="groupTag">CORE I · GROUP ${String(x.g).padStart(2,'0')}</span><div class="content"><span class="pos">${x.p}</span><div class="word ${wordSize}">${x.w}</div><div class="sentence">${x.e}</div><p class="hint">מה נראה לכם שזה אומר?</p></div>`);
  add(`<span class="challengeTag">ANSWER ${String(i+1).padStart(2,'0')} / 30</span><span class="groupTag">CORE I · GROUP ${String(x.g).padStart(2,'0')}</span><div class="content answer"><span class="pos">${x.p}</span><div class="word ${wordSize}">${x.w}</div><div class="meaning ${meaningSize}">${x.m}</div><div class="sentence">${x.e}</div><div class="translation">${x.h}</div></div>`);
  if((i+1)%10===0){
    const breaks={10:{cls:'petra',title:'PETRA',sub:'Jordan',note:'INTERNATIONAL WONDER'},20:{cls:'aurora',title:'THE NORTHERN LIGHTS',sub:'Nature lights up the sky',note:'AMAZING'},30:{cls:'everest',title:'MOUNT EVEREST',sub:'Nepal',note:'ACHIEVE YOUR GOAL'}};
    const b=breaks[i+1];
    add(`<div class="content"><div class="breakNote">${b.note}</div><h1 class="title">${b.title}</h1><p class="subtitle en">${b.sub}</p></div>`,`breakSlide ${b.cls}`);
  }
});
const forgeWords=[
  {level:'LEVEL 1 · LOW',prompt:'b__k',answer:'book',meaning:'ספר',choices:['oo','ea','ou']},
  {level:'LEVEL 4 · HIGH',prompt:'t__gh',answer:'tough',meaning:'קשוח',choices:['ou','oo','au']},
  {level:'LEVEL 4 · HIGH',prompt:'deci__on',answer:'decision',meaning:'החלטה',choices:['si','ti','ci']},
  {level:'LEVEL 5 · HIGHEST',prompt:'through__t',answer:'throughout',meaning:'לאורך כל',choices:['ou','oo','ow']},
  {level:'LEVEL 5 · HIGHEST',prompt:'thorough__',answer:'thoroughly',meaning:'ביסודיות',choices:['ly','ley','li']}
];
add(`<div class="content"><div class="eyebrow">LOCAL DEMO</div><h1 class="title">WORD FORGE</h1><p class="subtitle">חמש מילים. שלוש רמות. הכול קורה כאן בתוך המצגת.</p><div class="bubble">משלימים את החלק החסר ובודקים מיד ⚒️</div></div>`);
forgeWords.forEach((x,i)=>add(`<div class="content"><div class="forgeBox" data-answer="${x.answer}" data-meaning="${x.meaning}"><div class="forgeLevel">${x.level} · ${i+1}/5</div><div class="forgePrompt">${x.prompt}</div><div class="forgeChoices">${x.choices.map(c=>`<button class="forgeChoice" data-choice="${c}">${c}</button>`).join('')}</div><div class="forgeResult" aria-live="polite">בחרו את החלק החסר</div></div></div>`));
add(`<div class="content"><div class="eyebrow">EXTRA SUPPORT</div><h1 class="title">READ ALONG</h1><p class="subtitle">הקריאה קשה? מתחילים מסיפור קל ומתקדמים בקצב שלכם.</p><div class="screen"><iframe src="https://simonh68.github.io/E-Vocab-Band-II/Read-Along/" title="Read Along"></iframe></div></div>`);
add(`<div class="content"><div class="domain"><span class="english">ENGLISH</span> <span class="for">FOR</span> <span class="noar">NOAR</span><span class="suffix">.CO.IL</span></div><h1 class="title">READY?</h1><div class="flow"><div class="step">קישור ב־WhatsApp</div><div class="arrow">←</div><div class="step">שתי קבוצות</div><div class="arrow">←</div><div class="step">בוחן מילים</div></div><p class="subtitle">אותו מכשיר, אותו דפדפן, והפרטים שלכם נשארים שלכם.</p></div>`);

const deck=document.getElementById('deck');
slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide '+s.cls;el.innerHTML=s.html;el.dataset.index=i;deck.appendChild(el)});
let index=0,wheelLock=false,touchX=0,touchY=0;const all=[...document.querySelectorAll('.slide')];const prev=document.getElementById('prev'),next=document.getElementById('next'),up=document.getElementById('up'),down=document.getElementById('down');
function show(n){index=Math.max(0,Math.min(all.length-1,n));all.forEach((s,i)=>s.classList.toggle('active',i===index));document.getElementById('counter').textContent=`${index+1} / ${all.length}`;document.getElementById('progress').style.width=`${(index+1)/all.length*100}%`;prev.disabled=up.disabled=index===0;next.disabled=down.disabled=index===all.length-1;location.hash=`slide-${index+1}`}
prev.onclick=up.onclick=()=>show(index-1);next.onclick=down.onclick=()=>show(index+1);
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(all.length-1)});
document.addEventListener('wheel',e=>{if(wheelLock||Math.abs(e.deltaY)<18)return;wheelLock=true;show(index+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,500)},{passive:true});
document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const dx=touchX-e.changedTouches[0].clientX,dy=touchY-e.changedTouches[0].clientY;const d=Math.abs(dy)>Math.abs(dx)?dy:dx;if(Math.abs(d)>45)show(index+(d>0?1:-1))},{passive:true});
const hash=Number((location.hash.match(/slide-(\d+)/)||[])[1]);show(hash?hash-1:0);
document.querySelectorAll('.forgeBox').forEach(box=>box.addEventListener('click',e=>{const btn=e.target.closest('.forgeChoice');if(!btn)return;const blank=(box.querySelector('.forgePrompt').textContent.match(/_+/)||[''])[0];const completed=box.querySelector('.forgePrompt').textContent.replace(blank,btn.dataset.choice);const ok=completed.toLowerCase()===box.dataset.answer.toLowerCase();box.querySelectorAll('.forgeChoice').forEach(b=>b.classList.remove('correct','wrong'));btn.classList.add(ok?'correct':'wrong');const result=box.querySelector('.forgeResult');result.textContent=ok?`✓ ${box.dataset.answer} — ${box.dataset.meaning}`:'כמעט — נסו אפשרות אחרת';result.classList.toggle('show',ok)}));
</script>
