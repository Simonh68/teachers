function wordPhoto(word,fallback){const k=pictureOverride[word.toLowerCase()];return (k&&customPhoto.has(k))?'special:'+k:(k||fallback);}
function imgKey(key){return photo(key);}
function picMarkup(key){let k=key||'books';return `<div class="visual"><div class="missing">${e(String(k).replace('special:',''))}</div><img src="${e(imgKey(k))}" alt="Real photograph illustrating ${e(k)}" onerror="this.style.display='none';/* no incorrect fallback: show the meaningful missing-image label */"><span class="attribution">${String(k).startsWith('gen:')?'Period-style photorealistic reconstruction · not an archival photo':'Contextual photograph · period varies; see vocabulary context'}</span></div>`;}
function renderSlide(){readMode=false;document.getElementById('main').style.display='flex';modal.hidden=true;const s=slides[slide];bottom.hidden=false;document.getElementById('count').textContent=`${slide+1} / ${slides.length} · ${chapterInfo().title}`;setProg((slide+1)/(slides.length+1));document.getElementById('prev').disabled=slide===0;document.getElementById('next').textContent=slide===slides.length-1?'🎧 להתחיל להאזין':'הבא ←';
if(s.type==='map'){
main.innerHTML=`<article class="card"><div class="visual"><iframe class="mapview" loading="lazy" title="${e(s.title)}" src="https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(s.box)}&layer=mapnik"></iframe><span class="maptitle">OpenStreetMap · ${e(s.title)}</span></div><div class="copy"><div class="eyebrow">HISTORICAL & GEOGRAPHICAL BACKGROUND</div><h1 class="title en">${e(s.title)}</h1><p class="subtitle en">${e(s.sub)}</p><p class="note">${e(s.note)}</p></div></article>`;return;}
if(s.type==='vocab'){
revealed=false;main.innerHTML=`<article class="card">${picMarkup(s.pic)}<div class="copy"><div class="eyebrow">${e(chapterInfo().title)} · WORD ${s.index+1} · VOCABULARY</div><h1 class="title en">${e(s.title)}</h1><p class="subtitle en">${e(s.sub)}</p><div class="hebrew concealed" id="heWord">${e(s.he)}</div><div class="act"><button class="btn primary" id="revealBtn">הצג פירוש בעברית</button></div><p class="note">${e(s.note)}</p></div></article>`;
document.getElementById('revealBtn').onclick=()=>{revealed=!revealed;document.getElementById('heWord').classList.toggle('concealed',!revealed);document.getElementById('revealBtn').textContent=revealed?'הסתר פירוש':'הצג פירוש בעברית';};return;}
main.innerHTML=`<article class="card">${picMarkup(s.pic)}<div class="copy"><div class="eyebrow">${e(s.type==='ready'?'READY TO LISTEN':s.type==='context'?'NEW YORK IN THE 1950s':'PART '+part+' · LESSON '+chapterInfo().lesson)}</div><h1 class="title en">${e(s.title)}</h1><p class="subtitle en">${e(s.sub)}</p><p class="note">${e(s.note||'')}</p>${s.type==='ready'?'<button class="btn primary" id="startFromSlide">▶ השמע את ההקלטה המקורית</button>':''}</div></article>`;
if(s.type==='ready')document.getElementById('startFromSlide').onclick=startAudio;
}
function fmt(t){t=Math.max(0,Math.round(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function breakAt(t){if(t>=chapterInfo().stops[1]&&!done[1])return 1;if(t>=chapterInfo().stops[0]&&!done[0])return 0;return -1;}
function pictureAt(t){const arr=chapterInfo().images;let i=0;for(let n=0;n<arr.length;n++){if(t>=arr[n][1])i=n;}return {i,key:arr[i][0]};}
function wordSpan(w,active){return `<span class="w${active?' active':''}">${e(w.t)}</span>`;}
function showCaption(t){const box=document.getElementById('currentText'),prev=document.getElementById('previousText');if(!box||!transcript?.segments?.length)return;
const segs=transcript.segments;let lo=0,hi=segs.length-1,idx=0;while(lo<=hi){const mid=(lo+hi)>>1;if(segs[mid].s<=t){idx=mid;lo=mid+1;}else hi=mid-1;}
const s=segs[idx];let wi=-1;for(let n=0;n<(s.w||[]).length;n++){if(t>=s.w[n].s)wi=n;else break;}
if(idx===segIndex&&wi===wordIndex)return;segIndex=idx;wordIndex=wi;
box.innerHTML=s.w?.length?s.w.map((w,i)=>wordSpan(w,i===wi)).join(' '):e(s.t);
prev.textContent=idx>0?segs[idx-1].t:'';
}
function listeningView(){readMode=true;bottom.hidden=true;const c=chapterInfo();document.getElementById('main').innerHTML=`<div class="listening" id="listenCanvas"><div class="visual" id="listenPic"><img src="${photo(c.images[0][0])}" alt="Realistic visual context of story narration"><span class="attribution">Contextual photographs during the original narration</span></div><div class="transcript"><div class="listenHead">🎧 ORIGINAL AUDIO · ${e(c.title)} · ${e(c.name)}</div><div class="audioBadge">קובץ אודיו מתוך ההקלטה שהעלית · לא YouTube</div><div class="previousText en" id="previousText"></div><div class="now en" id="currentText" aria-live="off">Listen carefully. The words will follow the narrator.</div><div class="listenHelp">שומעים את הקול המקורי. בין המקטעים יופיעו שאלות עם תמונות. אפשר לחזור אחורה ולהאט את הקריאה.</div><input type="range" class="audioProgress" id="timeline" min="0" max="${c.duration}" step=".1" value="0" aria-label="Audio progress"><div class="act" style="justify-content:space-between"><span class="time" id="clock">0:00 / ${fmt(c.duration)}</span><span class="counter" id="miniProgress">Segment 1 / 3</span></div><div class="listenTools"><button id="togglePlay" class="btn primary">⏸ השהה</button><button id="back15" class="btn">↶ 15 שניות אחורה</button><button id="replayChunk" class="btn">↶ חזור למקטע</button><label>מהירות <select id="speed"><option value=".5">0.5</option><option value=".75" selected>0.75</option><option value="1">1.0</option><option value="1.25">1.25</option></select></label></div><div class="act"><button class="btn secondary" id="backWords">← חזרה לשקפי אוצר המילים</button><button class="btn secondary" id="nextChapter">${part<3?`לפרק ${part+1} ←`:'סיום הסיפור'}</button></div></div></div>`;
const t=document.getElementById('timeline');t.onchange=()=>{voice.currentTime=+t.value;};document.getElementById('togglePlay').onclick=()=>{if(voice.paused)voice.play().catch(()=>{});else voice.pause();};document.getElementById('back15').onclick=()=>{voice.currentTime=Math.max(0,voice.currentTime-15);};document.getElementById('replayChunk').onclick=()=>{const a=c.stops;let start=voice.currentTime<=a[0]?0:voice.currentTime<=a[1]?a[0]:a[1];voice.currentTime=start;voice.play().catch(()=>{});};document.getElementById('speed').onchange=x=>voice.playbackRate=+x.target.value;document.getElementById('backWords').onclick=()=>{voice.pause();slide=slides.length-1;renderSlide();};document.getElementById('nextChapter').onclick=()=>{voice.pause();window.location.href=part<3?'?part='+(part+1):'?';};pictureIndex=-1;segIndex=-1;wordIndex=-1;updatePlaying();}
async function startAudio(){if(!readMode)listeningView();if(!voice.src.includes('part'+part+'.ogg'))voice.src=chapterInfo().audio;voice.playbackRate=.75;try{await voice.play();}catch(err){let b=document.getElementById('togglePlay');if(b)b.textContent='▶ לחץ להפעלה';}}
async function getTranscript(){try{const response=await fetch(`../audio/part${part}-timed.json`);if(!response.ok)throw new Error('not ready');const parsed=await response.json();if(!Array.isArray(parsed.segments)||parsed.segments.length<30)throw new Error('incomplete');transcript=parsed;}catch(e){transcript=null;}}
function updatePlaying(){if(!readMode)return;const t=voice.currentTime||0,c=chapterInfo();const timeline=document.getElementById('timeline');if(timeline&&document.activeElement!==timeline)timeline.value=t;
const clock=document.getElementById('clock');if(clock)clock.textContent=fmt(t)+' / '+fmt(c.duration);const pr=document.getElementById('miniProgress');if(pr)pr.textContent=`Segment ${t<c.stops[0]?1:t<c.stops[1]?2:3} / 3`;
const play=document.getElementById('togglePlay');if(play)play.textContent=voice.paused?'▶ המשך':'⏸ השהה';
const img=pictureAt(t);if(img.i!==pictureIndex){pictureIndex=img.i;const p=document.querySelector('#listenPic img');if(p)p.src=photo(img.key);}
if(transcript)showCaption(t);
else{const text=document.getElementById('currentText');if(text){const groups=part===1?['George leaves school and looks for a job.','We meet George’s family and his neighborhood.','George dreams of a better life.']:part===2?['Meet Mr. C and learn about his work.','George speaks to Mr. C about reading.','The neighbors begin to see George differently.']:['George tries to read the books.','George meets Mr. C again.','George must decide how to change.'];text.textContent=groups[t<c.stops[0]?0:t<c.stops[1]?1:2];}}
const s=breakAt(t);if(s>=0&&breakIndex<0){voice.pause();breakIndex=s;quizIndex=0;quizAnswered=false;renderCheckpoint();}}
function renderCheckpoint(){const c=chapterInfo(),pair=breakIndex===-2?endings[part]:checks[part][breakIndex];const q=pair[quizIndex];if(!q){modal.hidden=true;return;}modal.hidden=false;const number=breakIndex===-2?'FINAL LISTENING QUESTIONS':`PAUSE ${breakIndex+1} OF 2 · ${fmt(c.stops[breakIndex])}`;
modal.innerHTML=`<div class="quiz">${picMarkup(q.pic)}<div class="quizBody"><div class="eyebrow">${e(c.title)} · LISTENING CHECK</div><div class="stopHeading">⏸ ${e(number)} · Question ${quizIndex+1}/${pair.length}</div><h2 class="quizTitle">${e(q.q)}</h2><div class="choices">${q.choices.map((v,i)=>`<button class="choice" data-choice="${i}">${String.fromCharCode(65+i)}. ${e(v)}</button>`).join('')}</div><div class="feedback" id="feedback">Choose the correct answer to continue listening.</div><div class="act"><button class="btn" id="relisten">↶ Listen Again</button><button class="btn primary" id="continueQuiz" disabled>${quizIndex===pair.length-1?(breakIndex===-2?'סיום הפרק':'▶ המשך האזנה'):'השאלה הבאה ←'}</button></div></div></div>`;
quizAnswered=false;modal.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const answer=+b.dataset.choice;const trueAns=q.answer;b.classList.add(answer===trueAns?'correct':'wrong');const fb=document.getElementById('feedback');fb.textContent=answer===trueAns?'Correct! '+q.why:'Try again. Listen carefully and choose another answer.';if(answer===trueAns){quizAnswered=true;document.getElementById('continueQuiz').disabled=false;} });
modal.querySelector('#relisten').onclick=()=>{if(breakIndex===-2){voice.currentTime=Math.max(0,chapterInfo().duration-55);}else{const last=breakIndex===0?0:c.stops[0];voice.currentTime=last;}modal.hidden=true;breakIndex=-1;voice.play().catch(()=>{});};
modal.querySelector('#continueQuiz').onclick=()=>{if(!quizAnswered)return;if(quizIndex<pair.length-1){quizIndex++;renderCheckpoint();return;}if(breakIndex===-2){finalDone=true;modal.hidden=true;voice.pause();showFinished();return;}done[breakIndex]=true;breakIndex=-1;modal.hidden=true;voice.play().catch(()=>{});};}
function showFinished(){readMode=false;bottom.hidden=true;const c=chapterInfo();main.innerHTML=`<article class="card">${picMarkup(part===3?'library':'books2')}<div class="copy"><div class="eyebrow">${e(c.title)} · LISTENING COMPLETED</div><h1 class="title en">Well done!</h1><p class="subtitle en">You listened to ${e(c.title)} and answered the questions.</p><p class="note">אפשר לחזור לחלק, להאזין שוב או להתקדם לחלק הבא. כל חלק מתחיל בהכנת אוצר מילים.</p><div class="act"><button class="btn" id="listenAgain">↶ האזן שוב</button><a class="btn primary" href="${part<3?'?part='+(part+1):'?'}">${part<3?'לחלק '+(part+1):'חזרה לתפריט'} ←</a></div></div></article>`;document.getElementById('listenAgain').onclick=()=>{done=[false,false];breakIndex=-1;voice.currentTime=0;startAudio();};}
function go(delta){if(readMode)return;if(slide===slides.length-1&&delta>0){startAudio();return;}slide=Math.max(0,Math.min(slides.length-1,slide+delta));renderSlide();}
function attach(){document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.addEventListener('keydown',ev=>{if(!modal.hidden||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(readMode&&ev.code==='Space'){ev.preventDefault();voice.paused?voice.play().catch(()=>{}):voice.pause();return;}if(readMode)return;if(['ArrowLeft','ArrowUp','PageDown'].includes(ev.key)){ev.preventDefault();go(1);}if(['ArrowRight','ArrowDown','PageUp'].includes(ev.key)){ev.preventDefault();go(-1);}});
let x0=null,y0=null;document.addEventListener('touchstart',v=>{if(v.touches.length===1){x0=v.touches[0].clientX;y0=v.touches[0].clientY;}},{passive:true});document.addEventListener('touchend',v=>{if(readMode||!modal.hidden||x0==null)return;const x=v.changedTouches[0].clientX-x0,y=v.changedTouches[0].clientY-y0;x0=y0=null;if(Math.max(Math.abs(x),Math.abs(y))<90)return;go(Math.abs(x)>Math.abs(y)?x<0?1:-1:y<0?1:-1);},{passive:true});}
voice.addEventListener('timeupdate',updatePlaying);voice.addEventListener('play',updatePlaying);voice.addEventListener('pause',updatePlaying);voice.addEventListener('ended',()=>{if(!readMode||finalDone)return;voice.pause();breakIndex=-2;quizIndex=0;renderCheckpoint();});
const qs=new URLSearchParams(location.search);if(qs.has('worksheet')){location.replace('../?worksheet='+encodeURIComponent(qs.get('worksheet')));return;}
if(!chapter[part]){renderOverview();return;}document.getElementById('tab'+part).setAttribute('aria-current','page');build();attach();voice.src=chapter[part].audio;getTranscript();renderSlide();
})();
</script></body></html>
