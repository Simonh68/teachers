king regularly."},{"type":"question","title":"What does George's sister want?","body":"George's Situation","kind":"Evidence","answer":"For him to improve his life","why":"She worries about his future."},{"type":"answer","title":"Check your answer","body":"For him to improve his life","why":"She worries about his future."},{"type":"question","title":"What is George's central internal conflict?","body":"George's Situation","kind":"Choose","answer":"He wants change but avoids effort","why":"Desire and action do not match."},{"type":"answer","title":"Check your answer","body":"He wants change but avoids effort","why":"Desire and action do not match."},{"type":"section","title":"The Promise","body":"Think · Answer · Explain · Connect to the story"},{"type":"question","title":"Who is Mr. Cattanzara?","body":"The Promise","kind":"Choose","answer":"A neighborhood man who works at a change booth","why":"He takes an interest in George."},{"type":"answer","title":"Check your answer","body":"A neighborhood man who works at a change booth","why":"He takes an interest in George."},{"type":"question","title":"What does George tell Mr. Cattanzara?","body":"The Promise","kind":"Explain","answer":"That he is reading many books","why":"The claim gives him status."},{"type":"answer","title":"Check your answer","body":"That he is reading many books","why":"The claim gives him status."},{"type":"question","title":"Why might George make this claim?","body":"The Promise","kind":"True or false","answer":"He wants to be respected","why":"He wants others to see him differently."},{"type":"answer","title":"Check your answer","body":"He wants to be respected","why":"He wants others to see him differently."},{"type":"question","title":"What does Mr. Cattanzara represent?","body":"The Promise","kind":"Complete","answer":"A caring adult and moral guide","why":"He encourages George without humiliating him."},{"type":"answer","title":"Check your answer","body":"A caring adult and moral guide","why":
