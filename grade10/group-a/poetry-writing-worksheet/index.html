t enough.", "note": "המוקד הוא ההזדמנות שהוחמצה לעזור. אפשר לתת הסבר אחר המבוסס על השיר."}, {"number": 5, "poem": "road", "question": "Describe a real or imagined choice between two options. Explain how choosing one option could close another opportunity. Connect your example to the speaker's doubt that he will ever come back.", "length": "Write 4-5 complete sentences.", "lines": 6, "hebrew": "תארו בחירה אמיתית או דמיונית בין שתי אפשרויות. הסבירו כיצד בחירה באחת יכולה לסגור הזדמנות אחרת, וקשרו זאת לספק של הדובר אם יחזור אי פעם.", "evidence": "Oh, I kept the first for another day!\nYet knowing how way leads on to way,\nI doubted if I should ever come back.", "answer": [["I had to ", {"alts": ["choose", "decide", "make a choice"]}, " between a football match and a school trip on the same day."], ["I chose the trip ", {"alts": ["because", "since", "as"], "role": "link"}, " I wanted to visit a new place."], ["As a result, I ", {"alts": ["missed", "could not attend", "was unable to attend"]}, " the match."], ["I could go to another match later, but I could not return to that exact day."], ["This ", {"alts": ["connects to", "is similar to", "reminds me of"]}, " the speaker's situation because he doubts that he will return to try the first road."]], "check": "Include two options, a consequence, and a clear connection to the poem.", "note": "זו דוגמה אחת בלבד. קבלו חוויות אמיתיות או דמיוניות וקשרים מנומקים."}, {"number": 6, "poem": "day", "question": "A student says, \"I cannot make someone's day better because I have no money.\" Do you agree? Explain using a detail from the poem and an example from school life.", "length": "Write 4-5 complete sentences.", "lines": 6, "hebrew": "תלמיד אומר שאינו יכול לשפר את יומו של מישהו כי אין לו כסף. האם אתם מסכימים? הסבירו בעזרת פרט מהשיר ודוגמה מחיי בית הספר.", "evidence": "If, through it all\nYou've nothing done that you can trace\nThat brought the sunshine to one face—\nNo act most small\nThat helped some soul and nothing cost—", "answer": [["I ", {"alts": ["disagree with", "do not agree with", "cannot agree with"]}, " the student."], ["The poem ", {"alts": ["shows us", "teaches us", "reminds us"]}, " that a helpful act can cost nothing."], [{"alts": ["For example", "For instance", "As an example"], "role": "link"}, ", I can ", {"alts": ["sit with", "talk to", "spend time with"]}, " a lonely classmate during a break."], ["This can help the classmate feel ", {"alts": ["included", "less lonely", "welcome"]}, "."], [{"alts": ["Therefore", "For this reason", "As a result"], "role": "link"}, ", kindness does not have to cost money."]], "check": "State your view, use the poem, and give a school example.", "note": "נדרשים עמדה, פרט מהשיר ודוגמה. ניסוח שונה תקין כל עוד הוא נתמך בטקסט."}, {"number": 7, "poem": "both", "question": "Compare the two poems. What does each poem suggest about our choices or actions? Give ONE detail from EACH poem to support your answer.", "length": "Write 4-5 complete sentences.", "lines": 7, "hebrew": "השוו בין שני השירים. מה מלמד כל שיר על בחירותינו או על מעשינו? הביאו פרט אחד מכל שיר לתמיכה בתשובה.", "evidence": "The Road Not Taken:\nYet knowing how way leads on to way,\nI doubted if I should ever come back.\n\nCount That Day Lost:\nNo act most small\nThat helped some soul and nothing cost—\nThen count that day as worse than lost.", "answer": [["Both poems ", {"alts": ["show", "suggest", "help us understand"]}, " that our choices and actions matter."], ["In The Road Not Taken, the speaker chooses one road and doubts that he will ever return."], ["This ", {"alts": ["shows", "suggests", "helps us understand"]}, " that a choice can ", {"alts": ["close another opportunity", "make another option unavailable", "take us away from another possibility"]}, "."], ["In Count That Day Lost, even a small kind act can make a day well spent ", {"alts": ["because", "since", "as"], "role": "link"}, " it helps another person."], [{"alts": ["While", "Whereas"], "role": "link"}, " the first poem explores choices about our own path, the second focuses on our actions toward others."]], "check": "Discuss both poems and support each side with a detail.", "note": "יש כמה השוואות אפשריות. חשוב להזכיר את שני השירים ולבסס כל צד בפרט מתאים."}]};

 stopSpeech();const s=slides[index];let markup='';

  const q=s.q;markup='<section class="slide"><p class="eyebrow">Question '+q.number+' · '+esc(poemName(q))+'</p><h1 class="question" data-read="true">'+esc(q.question)+'</h1><p class="length">'+esc(q.length)+'</p><p class="hint">Read your answer aloud. Which detail supports your idea?</p><div class="actions"><button class="primary" data-action="next">Show a model answer</button><button class="quiet" data-action="evidence">Poem evidence</button><button class="quiet" data-action="help" dir="rtl">עזרה בעברית</button><button class="quiet" data-action="speak">▶ Read aloud</button></div><p id="help" class="hebrew hidden">'+esc(q.hebrew)+'</p></section>';

function go(n){index=Math.max(0,Math.min(slides.length-1,n));render();}
function swap(button){stopSpeech();let q=slides[index].q;let part=q.answer[Number(button.dataset.si)][Number(button.dataset.pi)];let n=((choices.get(button.dataset.key)||0)+1)%part.alts.length;choices.set(button.dataset.key,n);button.innerHTML=wordTokens(part.alts[n]);button.setAttribute('aria-label',part.alts[n]+'. Click for another wording.');$('announcement').textContent=part.alts[n];}
function act(action){if(action==='next')go(index+1);else if(action==='first')go(2);else if(action==='question')openDialog('Question '+slides[index].q.number,'<p class="poem">'+esc(slides[index].q.question)+'</p>');else if(action==='help')$('help').classList.toggle('hidden');else if(action==='note')$('note').classList.toggle('hidden');else if(action==='speak')speaking?stopSpeech():readAloud();else if(action==='reset'){let q=slides[index].q;for(let k of choices.keys())if(k.startsWith(q.number+'-'))choices.delete(k);render();}else if(action==='evidence')openDialog('Poem evidence','<div class="poem" data-read="true">'+esc(slides[index].q.evidence)+'</div><button class="quiet" id="readEvidence">▶ Read aloud</button>',()=>{$('readEvidence').onclick=()=>speaking?stopSpeech():readAloud($('dialogbody').querySelector('[data-read]'));});}
function openDialog(title,body,after){stopSpeech();$('dialogtitle').textContent=title;$('dialogbody').innerHTML=body;if(!$('dialog').open)$('dialog').showModal();if(after)after();}
function poemDialog(key='road'){const p=DATA.poems[key];openDialog(p.title+' · '+p.author,'<div class="poem-tabs"><button class="quiet" id="roadTab">The Road Not Taken</button><button class="quiet" id="dayTab">Count That Day Lost</button></div><div class="poem" data-read="true">'+esc(p.stanzas.map(a=>a.join('\n')).join('\n\n'))+'</div><button class="quiet" id="readPoem">▶ Read aloud</button><div class="sources"><a href="'+esc(p.source)+'" target="_blank" rel="noopener">Text source</a></div>',()=>{$('roadTab').onclick=()=>poemDialog('road');$('dayTab').onclick=()=>poemDialog('day');$('readPoem').onclick=()=>speaking?stopSpeech():readAloud($('dialogbody').querySelector('[data-read]'));});}
function stopSpeech(){$('readSlide').textContent='▶ Read slide';speaking=false;currentUtterance=null;if('speechSynthesis' in window)window.speechSynthesis.cancel();document.querySelectorAll('.active-word').forEach(e=>e.classList.remove('active-word'));document.querySelectorAll('[data-action="speak"]').forEach(e=>e.textContent='▶ Read aloud');}
function readAloud(element){
 const target=element||$('stage').querySelector('[data-read]');if(!target)return;
 if(!('speechSynthesis' in window)){openDialog('Read aloud','<p>Read aloud is not available in this browser. The text remains available on the slide.</p>');return;}
 stopSpeech();const text=target.innerText||target.textContent;const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;
 const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-US'&&/Google|Microsoft|Samantha|Jenny/i.test(v.name))||voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'))||null;
 let offset=0;wordMap=[];target.querySelectorAll('.speech-word').forEach(el=>{let pos=text.indexOf(el.textContent,offset);if(pos>=0){wordMap.push({start:pos,end:pos+el.textContent.length,el});offset=pos+el.textContent.length;}});
 u.onboundary=e=>{document.querySelectorAll('.active-word').forEach(el=>el.classList.remove('active-word'));let w=wordMap.find(w=>e.charIndex>=w.start&&e.charIndex<w.end);if(w)w.el.classList.add('active-word');};
 u.onend=()=>{if(currentUtterance===u)stopSpeech();};u.onerror=()=>{if(currentUtterance===u)stopSpeech();};
 currentUtterance=u;speaking=true;$('readSlide').textContent='■ Stop reading';document.querySelectorAll('[data-action="speak"]').forEach(e=>e.textContent='■ Stop reading');speechSynthesis.speak(u);
}
$('jump').innerHTML='<option value="start">Introduction</option>'+DATA.questions.map(q=>'<option value="'+q.number+'">Question '+q.number+' · '+(q.poem==='both'?'Both poems':q.poem==='road'?'The Road Not Taken':'Count That Day Lost')+'</option>').join('')+'<option value="end">Final check</option>';
$('jump').addEventListener('change',e=>go(e.target.value==='start'?0:e.target.value==='end'?slides.length-1:2+(Number(e.target.value)-1)*2));
$('readSlide').onclick=()=>speaking?stopSpeech():readAloud();
$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('poems').onclick=()=>poemDialog();$('close').onclick=()=>{$('dialog').close();stopSpeech();};$('dialog').addEventListener('cancel',stopSpeech);
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch{}};
document.addEventListener('keydown',e=>{if($('dialog').open)return;const tag=e.target.tagName;if(['SELECT','INPUT','TEXTAREA'].includes(tag))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(index+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(index-1);}});
window.addEventListener('pagehide',stopSpeech);
// The deck opens at the beginning so model answers are not exposed before independent work.
render();
</script></body></html>
