<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f"><title>Count That Day Lost · George Eliot · Grade 10</title>
<link rel="stylesheet" href="../../../assets/lesson-decks/deck.css?v=20260910f">
<style>
.ra{max-width:980px;margin:auto;text-align:left;direction:ltr}.ra-text{font-size:clamp(28px,4.2vw,54px);line-height:1.55;font-weight:700}.ra-text.compact{font-size:clamp(18px,2.35vw,30px);line-height:1.48}
.w{display:inline;border-radius:.2em;padding:.02em .03em;transition:background .08s}.w.on{background:#ffe66d;color:#07111f}.read-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px}.speed{display:flex;gap:6px}.speed button{border:1px solid #ffffff33;border-radius:999px;background:#07111f;color:#fff;padding:9px 12px;font-weight:800}.speed button.active{border-color:#dfff5b;color:#dfff5b}.play{margin-top:0;font-size:20px;box-shadow:0 0 0 3px #53e4ff22;border:1px solid #53e4ff;border-radius:999px;background:#0d1c2d;color:#f5f8ff;padding:12px 22px;font:800 17px inherit;cursor:pointer}.poem-all{columns:2;column-gap:48px;font-size:clamp(15px,1.65vw,22px);line-height:1.5;text-align:left;white-space:pre-line}.hint{font-size:clamp(22px,3vw,36px);line-height:1.45;text-align:left}.mini{font-size:clamp(18px,2.3vw,28px);line-height:1.5;text-align:left}.slide-meta{direction:ltr}.home{direction:rtl}
@media(max-width:720px){.poem-all{columns:1;font-size:14px;line-height:1.35}.ra-text.compact{font-size:17px}.section-nav{display:none}}
</style></head><body>
<a class="home" href="../" aria-label="Back to Grade 10">⌂</a>
<nav class="section-nav"><button data-jump="prepare">Prepare</button><button data-jump="poem">Poem</button><button data-jump="close">Close reading</button><button data-jump="finish">Finish</button></nav>
<main class="stage" id="stage"></main>
<nav class="nav"><div class="nav-group"><button data-step="-1">↑</button><button data-step="-1">←</button><button data-step="1">→</button><button data-step="1">↓</button></div><output id="counter" class="progress"></output></nav><div class="progress-track"><div class="progress-fill"></div></div>
<script>
const stanza1=["If you sit down at set of sun","And count the acts that you have done,","And, counting, find","One self-denying deed, one word","That eased the heart of him who heard,","One glance most kind","That fell like sunshine where it went—","Then you may count that day well spent."];
const stanza2=["But if, through all the livelong day,","You've cheered no heart, by yea or nay—","If, through it all","You've nothing done that you can trace","That brought the sunshine to one face—","No act most small","That helped some soul and nothing cost—","Then count that day as worse than lost."];
const bg=[
"George Eliot was the pen name of Mary Ann Evans, an English writer who lived from 1819 to 1880.",
"She chose a male pen name at a time when women writers were often not taken as seriously as men.",
"Eliot wrote about people, choices, responsibility, and the way our actions affect other people.",
"In “Count That Day Lost,” she asks us to judge a day by the good we do for someone else."
];
const slides=[];
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function words(s){return s.split(/(\s+)/).map(x=>/^\s+$/.test(x)?x:'<span class="w">'+esc(x)+'</span>').join('')}
function meta(label){return '<div class="slide-meta"><p class="eyebrow">'+label+'</p><p class="tense"></p></div>'}
function add(section,cls,body){slides.push({section,cls,body})}
function raBlock(text,compact=false){return '<div class="ra"><p class="ra-text '+(compact?'compact':'')+'" data-read="'+esc(text)+'">'+words(text)+'</p><div class="read-controls"><button class="play" aria-label="Play clear Read Along">🔊 Play & highlight</button><div class="speed" aria-label="Reading speed"><button data-rate=".68">0.7×</button><button class="active" data-rate=".82">0.8×</button><button data-rate="1">1.0×</button></div></div></div>'}
add("prepare","cover",'<div class="frame">'+meta("GRADE 10 · 5 POINTS · LITERATURE")+'<h1 class="cover-title en">Count That<br>Day Lost</h1><p class="cover-sub en">George Eliot</p><p class="level en">B1 · prepare · read · understand</p></div>');
bg.forEach((x,i)=>add("prepare","reading",'<div class="frame">'+meta("Meet George Eliot · "+(i+1)+"/4")+'<div class="ra"><p class="ra-text" data-read="'+esc(x)+'">'+words(x)+'</p><button class="play">▶ Read Along</button></div></div>'));
add("prepare","qa",`<div class="frame">`+meta("Before reading")+raBlock("What makes a day a good day? Think of one small action that can make another person feel better.")+`</div>`);
add("prepare","reading",`<div class="frame">`+meta("Key idea")+raBlock("The poem gives us a simple test: at the end of the day, ask what good you did for another person.")+`</div>`);
add("poem","poem",`<div class="frame">`+meta("The whole poem")+raBlock(stanza1.join(" ")+" "+stanza2.join(" "),true)+`</div>`);
add("poem","poem",`<div class="frame">`+meta("Stanza 1 / 2")+raBlock(stanza1.join(" "),true)+`</div>`);
add("poem","poem",`<div class="frame">`+meta("Stanza 2 / 2")+raBlock(stanza2.join(" "),true)+`</div>`);
[["Stanza 1",stanza1],["Stanza 2",stanza2]].forEach(([label,arr])=>{let x=arr.join(" ");add("poem","reading",'<div class="frame">'+meta(label+" · Read Along")+'<div class="ra"><p class="ra-text compact" data-read="'+esc(x)+'">'+words(x)+'</p><button class="play">▶ Read Along</button></div></div>')});
[...stanza1,...stanza2].forEach((x,i)=>add("close","reading",'<div class="frame">'+meta("Line "+(i+1)+" / 16 · Read Along")+'<div class="ra"><p class="ra-text" data-read="'+esc(x)+'">'+words(x)+'</p><button class="play">▶ Read Along</button></div></div>'));
add("close","reading",'<div class="frame">'+meta("Stanza 1 · meaning")+raBlock("What kinds of actions make a day well spent? Small acts of kindness, helpful words, and caring about other people.")+'</div>');
add("close","reading",'<div class="frame">'+meta("Stanza 2 · meaning")+raBlock("What makes a day worse than lost? Doing nothing that helps, encourages, or brings happiness to another person.")+'</div>');
add("close","reading",`<div class="frame">`+meta("Contrast")+raBlock("Stanza 1 shows a day with kindness. Stanza 2 shows a day without kindness. The contrast makes the message clear.")+`</div>`);
add("close","reading",`<div class="frame">`+meta("Images")+raBlock("Sunshine is an image of warmth, hope, and happiness. A kind act can bring sunshine into another person’s life.")+`</div>`);
add("close","reading",`<div class="frame">`+meta("Theme")+raBlock("A meaningful day is not measured only by what we achieve for ourselves, but also by the good we do for others.")+`</div>`);
add("finish","reading",'<div class="frame">'+meta("Think")+raBlock("Why does Eliot use very small acts, not heroic acts, as examples? Because everyone can make a difference. Kindness does not have to be large or expensive.")+'</div>');
add("finish","reading",`<div class="frame">`+meta("Exit ticket")+raBlock("Complete this sentence: According to the poem, a day is well spent when blank. Use one detail from the poem.")+`</div>`);
const stage=document.getElementById("stage");
stage.innerHTML=slides.map((s,i)=>'<section id="slide-'+(i+1)+'" class="slide '+s.cls+(i===0?' active':'')+'" data-section="'+s.section+'" role="group" aria-label="'+(i+1)+' of '+slides.length+'" '+(i?'hidden':'')+'>'+s.body+'</section>').join("");
let idx=0; const els=[...document.querySelectorAll(".slide")], counter=document.getElementById("counter"),fill=document.querySelector(".progress-fill");
function show(n){clearRead();idx=Math.max(0,Math.min(els.length-1,n));els.forEach((e,j)=>{e.hidden=j!==idx;e.classList.toggle("active",j===idx)});counter.textContent=(idx+1)+" / "+els.length;fill.style.width=((idx+1)/els.length*100)+"%"}
document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>show(idx+Number(b.dataset.step)));
document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>show(els.findIndex(x=>x.dataset.section===b.dataset.jump)));
let sx=0,sy=0;addEventListener("touchstart",e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>45)show(idx+((dx<0||dy<0)?1:-1))},{passive:true});
addEventListener("keydown",e=>{if(["ArrowRight","ArrowDown","PageDown"].includes(e.key))show(idx+1);if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key))show(idx-1)});
let activeTimers=[];
function clearRead(){speechSynthesis.cancel();activeTimers.forEach(clearTimeout);activeTimers=[];document.querySelectorAll(".w").forEach(w=>w.classList.remove("on"))}
document.querySelectorAll(".speed button").forEach(b=>b.onclick=()=>{let box=b.closest(".speed");box.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
document.querySelectorAll(".play").forEach(btn=>btn.onclick=()=>{
 clearRead();
 let ra=btn.closest(".ra"),p=ra.querySelector("[data-read]"),txt=p.dataset.read,ws=[...p.querySelectorAll(".w")];
 let rate=Number(ra.querySelector(".speed .active")?.dataset.rate||.82);
 let voices=speechSynthesis.getVoices(),preferred=voices.find(v=>/Google US English|Samantha|Microsoft Aria|English United States/i.test(v.name))||voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
 let chunks=txt.match(/[^,;:—–.!?]+[,;:—–.!?]?/g)||[txt],cursor=0,chunkIndex=0;
 function speakChunk(){
   if(chunkIndex>=chunks.length){ws.forEach(w=>w.classList.remove("on"));return}
   let raw=chunks[chunkIndex],spoken=raw.trim(),chunkStart=txt.indexOf(raw,cursor);cursor=chunkStart+raw.length;
   let u=new SpeechSynthesisUtterance(spoken);u.lang="en-US";u.rate=rate;u.volume=1;u.pitch=1;if(preferred)u.voice=preferred;
   let localStarts=[],pos=chunkStart;
   ws.forEach((w,j)=>{let q=txt.indexOf(w.textContent,pos);if(q>=chunkStart&&q<chunkStart+raw.length){localStarts.push({j,start:q-chunkStart});pos=q+w.textContent.length}});
   if(localStarts.length){ws.forEach((w,j)=>w.classList.toggle("on",j===localStarts[0].j))}
   u.onboundary=e=>{if(e.name!=="word")return;let k=localStarts[0]?.j??0;for(const item of localStarts)if(item.start<=e.charIndex)k=item.j;ws.forEach((w,j)=>w.classList.toggle("on",j===k))};
   u.onend=()=>{let pause=/[.!?]\s*$/.test(raw)?420:/[—–]\s*$/.test(raw)?260:/[,;:]\s*$/.test(raw)?180:0;activeTimers.push(setTimeout(()=>{chunkIndex++;speakChunk()},pause/rate))};
   u.onerror=()=>{chunkIndex++;speakChunk()};
   speechSynthesis.speak(u)
 }
 speakChunk()
});
show(0);
</script></body></html>
