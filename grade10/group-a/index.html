<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Heebo",Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 10% 10%,#17466b 0,transparent 36%),radial-gradient(circle at 88% 86%,#4a244e 0,transparent 36%),linear-gradient(135deg,#06101c,#0b1729);pointer-events:none}.deck{height:100%;position:relative}.slide{position:absolute;inset:0;padding:5.5vh 6vw 8.5vh;display:none;align-items:center;justify-content:center;overflow:auto}.slide.active{display:flex;animation:enter .4s ease-out}@keyframes enter{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}.content{width:min(1180px,100%);margin:auto;text-align:center}.eyebrow{color:var(--cyan);font:800 clamp(14px,1.5vw,20px) "Nunito";letter-spacing:.13em}.title{font-size:clamp(38px,6vw,82px);margin:.18em 0;line-height:1.03;font-weight:900}.hero{font-size:clamp(52px,8vw,108px);background:linear-gradient(90deg,var(--cyan),#fff,var(--gold));-webkit-background-clip:text;color:transparent;margin:.12em 0}.subtitle{font-size:clamp(21px,2.6vw,36px);color:var(--muted);margin:.45em auto 1em;font-weight:700;max-width:980px}.en{direction:ltr;font-family:"Nunito",sans-serif}.badge{display:inline-block;border:2px solid #ffffff33;border-radius:999px;background:#ffffff0d;padding:.35em .8em;font-size:clamp(20px,2.4vw,32px)}.goals,.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;direction:ltr;margin:3vh auto;max-width:1100px}.goal,.card{padding:22px 16px;border:1px solid #ffffff24;border-radius:24px;background:linear-gradient(145deg,#142942,#0d1a2c);min-height:170px;display:flex;flex-direction:column;justify-content:center}.goal b,.card b{font:900 clamp(18px,2vw,27px) "Nunito"}.goal small,.card small{color:var(--muted);font-size:16px}.goal.active{border-color:var(--cyan);box-shadow:0 0 36px #4ee5ff33;transform:translateY(-5px)}.list{display:grid;gap:12px;max-width:900px;margin:3vh auto;text-align:left;direction:ltr}.list div{padding:14px 20px;border-bottom:1px solid #ffffff22;font:800 clamp(20px,2.4vw,31px) "Nunito"}.list .active{color:var(--gold);border-color:var(--gold)}.flow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;direction:ltr;margin:4vh auto}.step{background:#ffffff0d;border:1px solid #ffffff2c;border-radius:23px;padding:20px 27px;font:900 clamp(20px,2.5vw,32px) "Nunito"}.step.quiz{border-color:var(--gold);color:var(--gold)}.arrow{font-size:36px;color:var(--cyan)}.checks{display:grid;gap:13px;max-width:850px;margin:3vh auto;text-align:right;font-size:clamp(20px,2.4vw,31px)}.checks div{padding:12px 18px;border-right:5px solid var(--cyan);background:#ffffff08}.word{direction:ltr;font:900 clamp(56px,9vw,126px)/1.03 "Nunito";color:var(--cyan);letter-spacing:-.04em;margin:.12em auto}.word.long{font-size:clamp(42px,6.5vw,88px)}.definition{direction:ltr;font:800 clamp(24px,3vw,42px)/1.25 "Nunito";max-width:1000px;margin:2vh auto}.meaning{font-size:clamp(30px,4vw,55px);color:var(--gold);font-weight:900}.context{font-size:clamp(19px,2.2vw,29px);color:var(--muted);margin-top:2vh}.poem{direction:ltr;text-align:left;font:700 clamp(21px,2.45vw,34px)/1.48 "Nunito";width:min(870px,96%);margin:2vh auto;padding:24px 34px;border-left:5px solid var(--gold);background:#ffffff09;border-radius:0 24px 24px 0}.question{direction:ltr;font:900 clamp(22px,2.6vw,35px) "Nunito";color:var(--cyan);margin-top:2vh}.breakSlide{padding:0;background-size:cover;background-position:center}.breakSlide:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#02060dbb,transparent 62%)}.breakSlide .content{position:relative;z-index:1}.autumn{background-image:url('assets/autumn-fork.webp')}.bridges{background-image:url('assets/four-bridges.webp')}.horizon{background-image:url('assets/road-horizon.webp')}.footer{position:fixed;bottom:0;left:0;right:0;height:58px;background:#07111fee;border-top:1px solid #ffffff1b;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;z-index:20}.nav{display:flex;gap:9px;direction:ltr}.nav button{border:1px solid #ffffff2a;background:#ffffff0d;color:#fff;border-radius:13px;padding:9px 15px;font-size:18px;cursor:pointer}.progressWrap{flex:1;max-width:440px;margin:0 20px;height:7px;border-radius:999px;background:#ffffff18;overflow:hidden}.progress{height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:.3s}.counter{direction:ltr;color:var(--muted);min-width:75px}.home{position:fixed;top:18px;left:22px;z-index:30;color:#fff;text-decoration:none;background:#ffffff12;border:1px solid #ffffff24;border-radius:13px;padding:8px 12px;font-size:21px}.tracker{position:absolute;top:3vh;right:4vw;display:flex;gap:10px;direction:ltr;color:#7890a8;font:800 13px "Nunito"}.tracker .on{color:var(--gold)}
@media(max-width:760px){.slide{padding:7vh 4vw 11vh}.goals,.cards{grid-template-columns:1fr 1fr}.goal,.card{min-height:115px;padding:12px}.progressWrap{display:none}.poem{font-size:19px;padding:18px}.tracker{display:none}}
</style>

<footer class="footer"><div class="counter" id="counter"></div><div class="progressWrap"><div class="progress" id="progress"></div></div><div class="nav"><button id="prev">←</button><button id="next">→</button></div></footer>
<script>
const slides=[];const add=(html,cls='')=>slides.push({html,cls});
const track=(on)=>`<div class="tracker"><span class="${on==='read'?'on':''}">READING</span><span class="${on==='write'?'on':''}">WRITING</span><span class="${on==='vocab'?'on':''}">VOCABULARY</span><span class="${on==='lit'?'on':''}">LITERATURE</span></div>`;
add(`<div class="content"><span class="badge">כיתה י׳ · הקבצה א׳ · 5 יח״ל</span><h1 class="hero en">WELCOME TO GRADE 10</h1><p class="subtitle en">Read deeper. Write better. Think independently.</p></div>`);
add(`${track('')}<div class="content"><div class="eyebrow">OUR GOALS</div><h1 class="title">המטרות שלנו השנה</h1><div class="goals"><div class="goal"><b>READING</b><small>B1–B2</small></div><div class="goal"><b>WRITING</b><small>Advanced Grammar</small></div><div class="goal"><b>LITERATURE</b><small>Think & Discuss</small></div><div class="goal"><b>VOCABULARY</b><small>Core II → A–D</small></div></div></div>`);
add(`${track('read')}<div class="content"><div class="eyebrow">READING</div><h1 class="hero en">B1 → B2</h1><p class="subtitle">טקסטים ארוכים יותר · מידע משתמע · נקודות מבט · דוגמאות מתוך הטקסט</p></div>`);
add(`${track('write')}<div class="content"><div class="eyebrow">ADVANCED WRITING</div><h1 class="title">כותבים רעיון ברור ומשכנע</h1><p class="subtitle en">Clear paragraphs · Strong arguments · Linking words · Accurate grammar</p></div>`);
add(`${track('write')}<div class="content"><div class="eyebrow">GRAMMAR WITH A PURPOSE</div><h1 class="title">דקדוק שמשרת את הכתיבה</h1><div class="flow"><span class="step">Perfect Tenses</span><span class="step">Conditionals</span><span class="step">Passive</span><span class="step">Relative Clauses</span></div></div>`);
add(`${track('lit')}<div class="content"><div class="eyebrow">OUR LITERATURE JOURNEY</div><h1 class="title">מסלול הספרות</h1><div class="list"><div class="active">The Road Not Taken — this year</div><div>A Summer’s Reading — this year</div><div>The Split Cherry Tree — this year</div><div>The Enemy — this year</div><div>Count That Day Lost — this year</div><div>The Wave — later</div></div></div>`);
add(`${track('lit')}<div class="content"><div class="eyebrow">THIS YEAR</div><h1 class="title">חמש יצירות נלמד השנה</h1><p class="subtitle en">Five works. Five perspectives. One growing reader.</p></div>`);
add(`<div class="content"></div>`,'breakSlide bridges');
add(`${track('vocab')}<div class="content"><div class="eyebrow">VOCABULARY ROADMAP</div><h1 class="title">מחצית א׳: Core II</h1><p class="subtitle">לאחר מכן עוברים לאוצר המילים לבגרות A–D.</p></div>`);
add(`${track('vocab')}<div class="content"><div class="eyebrow">THE NEXT QUIZ</div><h1 class="title">הבוחן הקרוב</h1><div class="flow"><span class="step">21</span><span class="arrow">→</span><span class="step">22</span><span class="arrow">→</span><span class="step">23</span><span class="arrow">→</span><span class="step">24</span><span class="arrow">→</span><span class="step quiz">QUIZ</span></div></div>`);
add(`${track('vocab')}<div class="content"><div class="eyebrow">OPEN YOUR CLASS PAGE</div><h1 class="title">כך נכנסים למסלול</h1><div class="checks"><div>פותחים את דף הכיתה</div><div>נכנסים ל־Core II</div><div>בוחרים את הקבוצה שניתנה</div><div>ממשיכים מהמקום שבו עצרנו</div></div></div>`);
add(`${track('vocab')}<div class="content"><div class="eyebrow">ONE GROUP AT A TIME</div><h1 class="title">מסיימים לפני שעוברים</h1><p class="subtitle">לא מדלגים על מילים קשות · מתקנים טעויות · ממשיכים לקבוצה הבאה</p></div>`);
add(`${track('vocab')}<div class="content"><div class="eyebrow">SAVE YOUR PROGRESS</div><h1 class="title">אותו מכשיר. אותו דפדפן.</h1><p class="subtitle">מאשרים שמירת התקדמות ולא משתמשים בגלישה פרטית.</p></div>`);
add(`${track('vocab')}<div class="content"><div class="eyebrow">CHECK YOUR PROGRESS</div><h1 class="title en">SEEN ≠ MASTERED</h1><p class="subtitle">בודקים מה הושלם, מה עדיין קשה ומהי הקבוצה הבאה.</p></div>`);
add(`${track('vocab')}<div class="content"><div class="eyebrow">WRONG ANSWER?</div><h1 class="title">טעות היא חלק מהמסלול</h1><p class="subtitle">בודקים משמעות · קוראים שוב את ההקשר · ממשיכים ללמוד</p></div>`);
add(`${track('vocab')}<div class="content"><div class="eyebrow">BEFORE THE QUIZ</div><h1 class="title">21 ✓　22 ✓　23 ✓　24 ✓</h1><p class="subtitle en">Four groups completed. One quiz ready.</p></div>`);
add(`${track('lit')}<div class="content"><div class="eyebrow">BACK TO LITERATURE</div><div class="list"><div class="active">The Road Not Taken — NOW</div><div>A Summer’s Reading</div><div>The Split Cherry Tree</div><div>The Enemy</div><div>Count That Day Lost</div><div>The Wave — later</div></div></div>`);
add(`${track('lit')}<div class="content"><div class="eyebrow">ROBERT FROST</div><h1 class="hero en">THE ROAD NOT TAKEN</h1><p class="subtitle en">One traveler. Two roads. One unavoidable choice.</p></div>`);
add(`<div class="content"></div>`,'breakSlide autumn');
add(`${track('lit')}<div class="content"><div class="eyebrow">A YELLOW WOOD</div><h1 class="title">מהו יער צהוב?</h1><p class="subtitle">יער בשלכת: העלים משתנים מירוק לצהוב, כתום ואדום.</p></div>`);
add(`${track('lit')}<div class="content"><div class="eyebrow">AUTUMN MEANS CHANGE</div><h1 class="title">תרבות השלכת</h1><div class="flow"><span class="step">Change</span><span class="step">Time</span><span class="step">Maturity</span><span class="step">New Beginnings</span></div></div>`);
add(`${track('lit')}<div class="content"><div class="eyebrow">A NEW SCHOOL YEAR</div><h1 class="title">גם תחילת השנה היא צומת</h1><p class="question">What makes a new school year feel like a new road?</p></div>`);
const vocab=[
['diverged','Separated and continued in different directions','התפצלו / נפרדו לכיוונים שונים','הדובר מגיע לנקודה שבה עליו לבחור.'],
['yellow wood','A forest with yellow autumn leaves','יער צהוב בשלכת','מקום של שינוי ומעבר.'],
['traveler','A person making a journey','נוסע / הולך בדרך','הדובר מייצג אדם שנדרש לבחור.'],
['looked down','Looked along the road','הביט לאורך הדרך','הוא מנסה להבין את התוצאה מראש.'],
['bent','Changed direction; curved','התעקלה','הדרך מסתירה את מה שיבוא בהמשך.'],
['undergrowth','Plants and bushes beneath trees','סבך / צמחייה נמוכה וצפופה','הסבך מסתיר את המשך הדרך.'],
['just as fair','Equally attractive or suitable','יפה או ראויה באותה מידה','גם הדרך השנייה מושכת.'],
['better claim','A stronger reason to be chosen','סיבה טובה יותר להיבחר','הדובר מחפש הצדקה לבחירה.'],
['grassy','Covered with grass','מכוסה עשב','הדרך נראית בתחילה פחות משומשת.'],
['wanted wear','Seemed to need more people to walk on it','נראתה כאילו כמעט לא הלכו בה','זהו ביטוי, לא תרגום מילולי.'],
['passing there','People walking along the road','המעבר של אנשים בדרך','הדובר מבין שאנשים עברו בשתיהן.'],
['trodden black','Darkened by people stepping on leaves','עלים שהשחירו מדריכה','באותו בוקר העלים עדיין טריים.'],
['kept for another day','Planned to choose it in the future','שמר אותה ליום אחר','הדובר רוצה להאמין שיוכל לחזור.'],
['way leads on to way','One choice creates another','דרך מובילה לדרך','כל החלטה משנה את האפשרויות הבאות.'],
['sigh','A long, deep breath expressing emotion','אנחה','ייתכן סיפוק, געגוע, חרטה או שילוב.'],
['made all the difference','Changed the direction or result','שינה הכול / חולל את ההבדל','השיר אינו אומר אם ההבדל חיובי.']];
vocab.forEach(([w,d,m,c])=>add(`${track('lit')}<div class="content"><div class="word ${w.length>18?'long':''}">${w}</div><div class="definition">${d}</div><div class="meaning">${m}</div><div class="context">${c}</div></div>`));
add(`${track('lit')}<div class="content"><div class="eyebrow">STANZA ONE</div><div class="poem">Two roads diverged in a yellow wood,<br>And sorry I could not travel both<br>And be one traveler, long I stood<br>And looked down one as far as I could<br>To where it bent in the undergrowth;</div><div class="question">Why does the speaker stand there for a long time?</div></div>`);
add(`${track('lit')}<div class="content"><div class="eyebrow">STANZA TWO</div><div class="poem">Then took the other, as just as fair,<br>And having perhaps the better claim,<br>Because it was grassy and wanted wear;<br>Though as for that the passing there<br>Had worn them really about the same,</div><div class="question">Does the speaker finally believe that one road is better?</div></div>`);
add(`${track('lit')}<div class="content"><div class="eyebrow">STANZA THREE</div><div class="poem">And both that morning equally lay<br>In leaves no step had trodden black.<br>Oh, I kept the first for another day!<br>Yet knowing how way leads on to way,<br>I doubted if I should ever come back.</div><div class="question">Why is returning unlikely?</div></div>`);
add(`${track('lit')}<div class="content"><div class="eyebrow">STANZA FOUR</div><div class="poem">I shall be telling this with a sigh<br>Somewhere ages and ages hence:<br>Two roads diverged in a wood, and I—<br>I took the one less traveled by,<br>And that has made all the difference.</div><div class="question">What might the sigh mean?</div></div>`);
add(`<div class="content"></div>`,'breakSlide horizon');
add(`${track('lit')}<div class="content"><div class="eyebrow">LOOK AGAIN</div><h1 class="title">האם הדרכים באמת היו שונות?</h1><p class="subtitle en">One looked grassier — but both were worn almost the same.</p><div class="question">Why might memory change the story of a choice?</div></div>`);
add(`${track('lit')}<div class="content"><div class="eyebrow">CHOICE, MEMORY AND MEANING</div><h1 class="title">אנחנו בוחרים — ואז מעניקים לבחירה משמעות</h1><p class="question">Do our choices shape our lives, or do we shape the story of our choices?</p></div>`);
add(`${track('write')}<div class="content"><div class="eyebrow">FINAL RESPONSE · 80–100 WORDS</div><h1 class="title">Is the speaker satisfied with his choice?</h1><div class="checks"><div>Present a clear opinion</div><div>Use two details from the poem</div><div>Include a linking word</div><div>Include one complex sentence</div></div></div>`);
add(`${track('')}<div class="content"><div class="eyebrow">OUR GOALS IN ACTION</div><h1 class="title">שיר אחד חיבר את כל המטרות</h1><div class="goals"><div class="goal active"><b>READING</b><small>Examples from the poem</small></div><div class="goal active"><b>VOCABULARY</b><small>Context</small></div><div class="goal active"><b>LITERATURE</b><small>Interpretation</small></div><div class="goal active"><b>WRITING</b><small>Response</small></div></div></div>`);
const deck=document.getElementById('deck');slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide '+s.cls;el.innerHTML=s.html;deck.appendChild(el)});let index=0,wheelLock=false,touchX=0,touchY=0;const all=[...document.querySelectorAll('.slide')];function show(n){index=Math.max(0,Math.min(all.length-1,n));all.forEach((s,i)=>s.classList.toggle('active',i===index));counter.textContent=`${index+1} / ${all.length}`;progress.style.width=`${(index+1)/all.length*100}%`;prev.disabled=index===0;next.disabled=index===all.length-1;location.hash=`slide-${index+1}`}prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(all.length-1)});document.addEventListener('wheel',e=>{if(wheelLock||Math.abs(e.deltaY)<18)return;wheelLock=true;show(index+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,450)},{passive:true});document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const dx=touchX-e.changedTouches[0].clientX,dy=touchY-e.changedTouches[0].clientY,d=Math.abs(dy)>Math.abs(dx)?dy:dx;if(Math.abs(d)>45)show(index+(d>0?1:-1))},{passive:true});const hash=Number((location.hash.match(/slide-(\d+)/)||[])[1]);show(hash?hash-1:0);
</script>
