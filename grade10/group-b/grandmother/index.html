<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grandmother — כיתה י׳, הקבצה ב׳</title><meta name="theme-color" content="#07101d">
<style>
@import url("https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Nunito:wght@600;700;800;900&display=swap");
:root{--bg:#07101d;--ink:#f7f9ff;--muted:#a9b7ca;--cyan:#55e7ff;--gold:#ffc95c;--rose:#ff7fa8;--green:#9cef8a}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 12% 10%,#174f723d,transparent 36%),radial-gradient(circle at 88% 86%,#63264d40,transparent 38%),linear-gradient(135deg,#06101c,#10182a);pointer-events:none}
.deck{height:100%;position:relative}.slide{position:absolute;inset:0;padding:6vh 6vw 9vh;display:none;align-items:center;justify-content:center;overflow:auto}.slide.active{display:flex;animation:enter .35s ease-out}@keyframes enter{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.content{width:min(1160px,100%);margin:auto;text-align:center}.en{direction:ltr;font-family:Nunito,sans-serif}.eyebrow{color:var(--cyan);font:900 clamp(13px,1.4vw,19px) Nunito;letter-spacing:.14em}.title{font-size:clamp(38px,6vw,80px);line-height:1.04;margin:.2em 0;font-weight:900}.hero{direction:ltr;font:900 clamp(58px,10vw,130px)/.96 Nunito;color:var(--cyan);margin:.12em 0}.subtitle{font-size:clamp(20px,2.5vw,34px);line-height:1.45;color:var(--muted);max-width:980px;margin:2vh auto}.question{direction:ltr;font:900 clamp(24px,3vw,41px)/1.25 Nunito;color:var(--cyan);max-width:1050px;margin:3vh auto}.quote{direction:ltr;font:900 clamp(34px,5vw,68px)/1.2 Nunito;color:var(--gold);margin:3vh auto}.meaning{font-size:clamp(27px,3.5vw,49px);color:var(--gold);font-weight:900}.word{direction:ltr;font:900 clamp(55px,9vw,120px)/1 Nunito;color:var(--cyan);margin:.1em 0}.definition{direction:ltr;font:800 clamp(22px,2.8vw,38px)/1.3 Nunito;max-width:980px;margin:2vh auto}
.cards,.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;direction:ltr;margin:3vh auto}.card{min-height:155px;padding:20px 16px;display:flex;flex-direction:column;justify-content:center;border:1px solid #ffffff24;border-radius:22px;background:#ffffff09}.card b{font:900 clamp(18px,2vw,27px) Nunito}.card small{color:var(--muted);font:700 15px Nunito}.card.on{border-color:var(--gold);box-shadow:0 0 32px #ffc95c2c}.steps{display:grid;gap:13px;max-width:930px;margin:3vh auto;text-align:left;direction:ltr}.steps div{padding:14px 19px;border-left:5px solid var(--cyan);background:#ffffff08;font:800 clamp(19px,2.2vw,29px) Nunito}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px;direction:ltr;margin:3vh auto}.compare>div{padding:25px;border-radius:24px;background:#ffffff09;border:1px solid #ffffff22}.compare h3{font:900 28px Nunito;color:var(--gold);margin:0 0 12px}.compare p{font:700 21px/1.45 Nunito;color:var(--muted)}
.breakSlide{padding:0;background:linear-gradient(135deg,#112f47,#25192f)}.breakSlide:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 45%,#ffc95c35 0 3%,transparent 22%),radial-gradient(circle at 70% 45%,#55e7ff28 0 3%,transparent 24%)}.breakSlide .content{position:relative}
.footer{position:fixed;bottom:0;left:0;right:0;height:60px;background:#07111fee;border-top:1px solid #ffffff1b;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;z-index:20}.nav{display:flex;gap:9px;direction:ltr}.nav button{border:1px solid #ffffff2a;background:#ffffff0d;color:#fff;border-radius:13px;padding:9px 15px;font-size:18px}.progressWrap{flex:1;max-width:430px;margin:0 20px;height:7px;border-radius:99px;background:#ffffff18;overflow:hidden}.progress{height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold))}.counter{direction:ltr;color:var(--muted);min-width:75px}.home{position:fixed;top:18px;left:22px;z-index:30;color:#fff;text-decoration:none;background:#ffffff12;border:1px solid #ffffff24;border-radius:13px;padding:8px 12px;font-size:21px}
@media(max-width:760px){.slide{padding:8vh 4vw 11vh}.cards,.roadmap{grid-template-columns:1fr 1fr}.card{min-height:108px;padding:12px}.compare{grid-template-columns:1fr}.progressWrap{display:none}.title{font-size:clamp(35px,10vw,62px)}}
</style></head>
<body>
<a class="home" href="../" aria-label="חזרה לספריית הקבצה ב׳">⌂</a>
<div class="deck" id="deck"></div>
<footer class="footer"><nav class="nav"><button id="prev">←</button><button id="next">→</button></nav><div class="progressWrap"><div class="progress" id="progress"></div></div><span class="counter" id="counter"></span></footer>
<script>
const slides=[];const add=(html,cls='')=>slides.push({html,cls});
add(`<div class="content"><div class="eyebrow">GRADE 10 · GROUP B · 4 POINTS</div><h1 class="hero">GRANDMOTHER</h1><p class="subtitle en">Sameeneh Shirazie</p></div>`);
add(`<div class="content"><div class="eyebrow">OUR LITERATURE JOURNEY</div><h1 class="title">ארבע היצירות שלנו</h1><div class="roadmap"><div class="card"><b>Thank You, Ma’am</b><small>Kindness</small></div><div class="card on"><b>Grandmother</b><small>Listening</small></div><div class="card"><b>Count That Day Lost</b><small>Meaningful action</small></div><div class="card"><b>A Summer’s Reading</b><small>Change</small></div></div></div>`);
add(`<div class="content"><div class="eyebrow">TODAY'S GOALS</div><div class="cards"><div class="card on"><b>Understand</b><small>What happens</small></div><div class="card on"><b>Infer</b><small>What is not stated</small></div><div class="card on"><b>Connect</b><small>Family and listening</small></div><div class="card on"><b>Write</b><small>A personal response</small></div></div></div>`);
add(`<div class="content"><div class="eyebrow">BEFORE READING</div><p class="question">When did you last stop and really listen to an older person?</p></div>`);
add(`<div class="content"><div class="eyebrow">THE POET</div><h1 class="title en">Sameeneh Shirazie</h1><p class="subtitle">משוררת ילידת קראצ׳י שבפקיסטן. השיר מתמקד ברגע קטן של הקשבה שהופך להבנה משמעותית.</p></div>`);
add(`<div class="content"><div class="eyebrow">READING RULE</div><h1 class="title">קוראים מהעותק המאושר</h1><p class="subtitle">השקפים אינם מחליפים את השיר. הם עוזרים להבין את המילים, השינוי בדוברת והמסר.</p></div>`);
const vocab=[
['sheets','large pieces of cloth used on a bed','סדינים'],
['towel','cloth used for drying','מגבת'],
['heavy','difficult to lift or carry','כבד'],
['chores','regular jobs around the house','מטלות הבית'],
['complain','to say that something is wrong or difficult','להתלונן'],
['notice','to become aware of something','להבחין'],
['listen','to give attention to someone speaking','להקשיב'],
['miss','to fail to notice or experience something important','להחמיץ / לא להבחין']
];
vocab.forEach(([w,d,m])=>add(`<div class="content"><div class="eyebrow">KEY VOCABULARY</div><div class="word">${w}</div><div class="definition">${d}</div><div class="meaning">${m}</div></div>`));
add(`<div class="content"><div class="eyebrow">FIRST READING</div><h1 class="title">מה קורה בשיר?</h1><div class="steps"><div>The granddaughter asks a simple question.</div><div>The grandmother answers with details from her day.</div><div>The granddaughter begins to listen differently.</div><div>A routine conversation becomes an important moment.</div></div></div>`);
add(`<div class="content"><div class="eyebrow">A SMALL QUESTION</div><div class="quote">“just how she felt”</div><p class="question">Why does this simple question become important?</p></div>`);
add(`<div class="content"><div class="eyebrow">THE GRANDMOTHER</div><div class="steps"><div>She talks about ordinary household work.</div><div>Her body is becoming weaker.</div><div>She wants someone to hear the details of her life.</div></div></div>`);
add(`<div class="content"><div class="eyebrow">THE GRANDDAUGHTER</div><div class="compare"><div><h3>At first</h3><p>She asks casually and does not expect a long answer.</p></div><div><h3>By the end</h3><p>She understands that listening reveals a life she has not fully noticed.</p></div></div></div>`);
add(`<div class="content"><div class="eyebrow">INFERENCE</div><p class="question">What can we infer about the grandmother’s need to talk?</p><p class="subtitle en">Use details from the poem, not only your opinion.</p></div>`);
add(`<div class="content"><div class="eyebrow">CAUSE AND EFFECT</div><div class="compare"><div><h3>Cause</h3><p>The granddaughter finally gives her full attention.</p></div><div><h3>Effect</h3><p>She realizes how much of her grandmother’s inner life she has missed.</p></div></div></div>`);
add(`<div class="content"><div class="eyebrow">TITLE</div><h1 class="hero">GRANDMOTHER</h1><p class="question">Why is the title only one word?</p></div>`);
add(`<div class="content"><div class="eyebrow">CENTRAL THEME</div><h1 class="title">הקשבה הופכת אדם לנראה</h1><p class="subtitle en">Ordinary details can reveal loneliness, effort, age and love.</p></div>`);
add(`<div class="content"></div>`,'breakSlide');
add(`<div class="content"><div class="eyebrow">LOOK AGAIN</div><p class="question">Which detail changes the granddaughter’s understanding most strongly?</p></div>`);
add(`<div class="content"><div class="eyebrow">CHARACTERIZATION</div><div class="steps"><div>What does the grandmother do?</div><div>What does she say?</div><div>What do her words suggest about her feelings?</div><div>How does the granddaughter respond?</div></div></div>`);
add(`<div class="content"><div class="eyebrow">MESSAGE</div><p class="question">What does the poem teach us about relationships between generations?</p></div>`);
add(`<div class="content"><div class="eyebrow">PERSONAL CONNECTION</div><p class="question">Can a short conversation change the way we see someone? Explain.</p></div>`);
add(`<div class="content"><div class="eyebrow">SHORT RESPONSE · 60–80 WORDS</div><p class="question">Why is listening important in the poem?</p><div class="steps"><div>State your answer clearly.</div><div>Use two details from the poem.</div><div>Explain what the granddaughter learns.</div><div>Check spelling and punctuation.</div></div></div>`);
add(`<div class="content"><div class="eyebrow">WRITING BOT</div><h1 class="title">כותבים קודם — משפרים אחר כך</h1><div class="steps"><div>Write your own first draft.</div><div>Ask the bot to identify two unclear sentences.</div><div>Ask for an explanation of one language mistake.</div><div>Rewrite the response yourself.</div></div></div>`);
add(`<div class="content"><div class="eyebrow">BOT PROMPT</div><p class="quote" style="font-size:clamp(24px,3.5vw,46px)">“Do not rewrite my answer. Show me two places that are unclear and explain one grammar mistake.”</p></div>`);
add(`<div class="content"><div class="eyebrow">EXIT QUESTION</div><p class="question">What will you remember from Grandmother?</p></div>`);
const deck=document.getElementById('deck');slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide '+s.cls;el.innerHTML=s.html;deck.appendChild(el)});
let index=0,wheelLock=false,touchX=0,touchY=0;const all=[...document.querySelectorAll('.slide')];
function show(n){index=Math.max(0,Math.min(all.length-1,n));all.forEach((s,i)=>s.classList.toggle('active',i===index));counter.textContent=`${index+1} / ${all.length}`;progress.style.width=`${(index+1)/all.length*100}%`;prev.disabled=index===0;next.disabled=index===all.length-1;location.hash=`slide-${index+1}`}
prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}});document.addEventListener('wheel',e=>{if(wheelLock||Math.abs(e.deltaY)<18)return;wheelLock=true;show(index+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,450)},{passive:true});document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const dx=touchX-e.changedTouches[0].clientX,dy=touchY-e.changedTouches[0].clientY,d=Math.abs(dy)>Math.abs(dx)?dy:dx;if(Math.abs(d)>45)show(index+(d>0?1:-1))},{passive:true});const hash=Number((location.hash.match(/slide-(\d+)/)||[])[1]);show(hash?hash-1:0);
</script></body></html>
