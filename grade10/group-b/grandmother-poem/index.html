<script>
const slides=[];const add=(html,cls='')=>slides.push({html,cls});
add(`<div class="content"><div class="eyebrow">GRADE 10 · GROUP B · 4 POINTS</div><h1 class="hero heroTitle en">GRANDMOTHER</h1><p class="subtitle en">Sameeneh Shirazie</p><span class="badge">הפואמה בלבד</span></div>`);
add(`<div class="content"><div class="eyebrow">WHAT IS A POEM?</div><h1 class="hero">פואמה</h1><p class="subtitle">פואמה היא <strong style="color:var(--gold)">שיר ללא מנגינה</strong>.</p><p class="subtitle">קוראים אותה כדי להקשיב למילים, לתמונות ולרגשות שהן יוצרות.</p></div>`);
add(`<div class="content"><div class="eyebrow">OUR POEM LESSON</div><div class="cards"><div class="card on"><b>Words</b><small>Learn key vocabulary</small></div><div class="card on"><b>Read</b><small>Understand each part</small></div><div class="card on"><b>Think</b><small>Explain ideas simply</small></div><div class="card on"><b>Write</b><small>Give a short response</small></div></div></div>`);
add(`<div class="content"><div class="eyebrow">BEFORE READING</div><p class="question">When did you last stop and really listen to an older person?</p></div>`);
add(`<div class="content"><div class="eyebrow">THE POET</div><h1 class="title en">Sameeneh Shirazie</h1><p class="subtitle">משוררת ילידת קראצ׳י שבפקיסטן. השיר מתמקד ברגע קטן של הקשבה שהופך להבנה משמעותית.</p></div>`);
add(`<div class="content"><div class="eyebrow">THE POEM</div><h1 class="title">קוראים את השיר בחמישה חלקים</h1><p class="subtitle">בכל חלק עוצרים, מבינים את הפרטים ועונים על שאלה קצרה באנגלית.</p></div>`);
const vocab=[
['sheets','large pieces of cloth used on a bed','סדינים'],
['towel','cloth used for drying','מגבת'],
['heavy','difficult to lift or carry','כבד'],
['chores','regular jobs around the house','מטלות הבית'],
['complain','to say that something is wrong or difficult','להתלונן'],
['notice','to become aware of something','להבחין'],
['listen','to give attention to someone speaking','להקשיב'],
['miss','to fail to notice or experience something important','להחמיץ / לא להבחין']
];
vocab.forEach(([w,d,m])=>add(`<div class="content"><div class="eyebrow">KEY VOCABULARY</div><div class="word">${w}</div><div class="definition">${d}</div><div class="meaning">${m}</div></div>`));
add(`<div class="content"><div class="eyebrow">GRANDMOTHER · PART 1 / 5</div><div class="poemText">I hadn’t asked her much, just how she felt, and she told me all about her day,</div><p class="question">What kind of answer did the speaker expect?</p></div>`);
add(`<div class="content"><div class="eyebrow">GRANDMOTHER · PART 2 / 5</div><div class="poemText">and how she’d washed the sheets, and how she could not understand why the towel got so heavy when it was wet.</div><p class="question">What do these ordinary details tell us about the grandmother?</p></div>`);
add(`<div class="content"><div class="eyebrow">GRANDMOTHER · PART 3 / 5</div><div class="poemText">She’d also sunned the mattresses, such tired bones and so much to do,</div><p class="question">What contrast appears in this part?</p></div>`);
add(`<div class="content"></div>`,'breakSlide grandmotherScene');
add(`<div class="content"><div class="eyebrow">GRANDMOTHER · PART 4 / 5</div><div class="poemText">and my eyes filled with tears when I thought of how I was simply going to say “Salaam” and walk away and so many words would have been trapped inside her.</div><p class="question">Why do the speaker’s eyes fill with tears?</p></div>`);
add(`<div class="content"><div class="eyebrow">GRANDMOTHER · PART 5 / 5</div><div class="poemText">I would have passed by as if what lay between those bedclothes was just old life and not really my grandmother.</div><p class="question">What does the speaker finally understand?</p></div>`);
add(`<div class="content"><div class="eyebrow">FIRST READING</div><h1 class="title">מה קורה בפואמה?</h1><div class="steps"><div>The granddaughter asks a simple question.</div><div>The grandmother answers with details from her day.</div><div>The granddaughter begins to listen differently.</div><div>A routine conversation becomes an important moment.</div></div></div>`);
add(`<div class="content"><div class="eyebrow">3 POINTS · BASIC UNDERSTANDING</div><h1 class="title">Find the facts</h1><div class="steps"><div>Who is the speaker talking to?</div><div>What question does she ask?</div><div>Name two chores the grandmother completed.</div><div>What happens to the speaker at the end?</div></div></div>`);
add(`<div class="content"><div class="eyebrow">3 POINTS · ORDER OF EVENTS</div><h1 class="title">What happens first?</h1><div class="steps"><div>1. The granddaughter asks how her grandmother feels.</div><div>2. The grandmother describes her busy day.</div><div>3. The granddaughter understands that she almost walked away.</div><div>4. Her eyes fill with tears.</div></div></div>`);
add(`<div class="content"><div class="eyebrow">3 POINTS · SHORT ANSWERS</div><h1 class="title">Complete each answer</h1><div class="steps"><div>The towel became heavy because ______.</div><div>The grandmother’s bones were tired because ______.</div><div>The granddaughter almost said ______ and walked away.</div><div>She finally stopped and ______.</div></div></div>`);
add(`<div class="content"><div class="eyebrow">3 POINTS · ANSWER FRAME</div><h1 class="title">One clear sentence</h1><div class="steps"><div><strong>Question:</strong> Why was the towel heavy?</div><div><strong>Answer:</strong> The towel was heavy because it was wet.</div><div><strong>Your turn:</strong> Why were the grandmother’s bones tired?</div></div></div>`);
add(`<div class="content"><div class="eyebrow">4 POINTS · INFERENCE</div><h1 class="title">Read between the lines</h1><div class="steps"><div>Why does the grandmother share so many ordinary details?</div><div>What may have remained “trapped inside her”?</div><div>Why does the speaker suddenly see her grandmother differently?</div><div>What can we infer about their relationship before this moment?</div></div></div>`);
add(`<div class="content"><div class="eyebrow">4 POINTS · LANGUAGE</div><h1 class="title">Words reveal feelings</h1><div class="steps"><div>What does “tired bones” suggest about the grandmother?</div><div>Why does the poet repeat the words “and how”?</div><div>What does “old life” mean in the final sentence?</div><div>How does the word “really” change the ending?</div></div></div>`);
add(`<div class="content"><div class="eyebrow">4 POINTS · CHARACTER CHANGE</div><h1 class="title">At first — by the end</h1><div class="compare"><div><h3>At first</h3><p>The granddaughter plans to greet her grandmother and continue walking.</p></div><div><h3>By the end</h3><p>She understands that listening allows her to see the person behind the chores and age.</p></div></div><p class="question">What causes this change?</p></div>`);
add(`<div class="content"><div class="eyebrow">4 POINTS · DEVELOPED ANSWER</div><h1 class="title">Answer + detail + meaning</h1><div class="steps"><div><strong>Answer:</strong> The grandmother needs someone to notice and listen to her.</div><div><strong>Detail:</strong> She shares every small task she completed that day.</div><div><strong>Meaning:</strong> These details reveal her effort, age and possible loneliness.</div><div><strong>Conclusion:</strong> The speaker learns that a simple conversation can reveal a whole life.</div></div></div>`);
add(`<div class="content"><div class="eyebrow">A SMALL QUESTION</div><div class="quote">“just how she felt”</div><p class="question">Why does this simple question become important?</p></div>`);
add(`<div class="content"><div class="eyebrow">THE GRANDMOTHER</div><div class="steps"><div>She talks about ordinary household work.</div><div>Her body is becoming weaker.</div><div>She wants someone to hear the details of her life.</div></div></div>`);
add(`<div class="content"><div class="eyebrow">THE GRANDDAUGHTER</div><div class="compare"><div><h3>At first</h3><p>She asks casually and does not expect a long answer.</p></div><div><h3>By the end</h3><p>She understands that listening reveals a life she has not fully noticed.</p></div></div></div>`);
add(`<div class="content"><div class="eyebrow">INFERENCE</div><p class="question">What can we infer about the grandmother’s need to talk?</p><p class="subtitle en">Use details from the poem, not only your opinion.</p></div>`);
add(`<div class="content"><div class="eyebrow">CAUSE AND EFFECT</div><div class="compare"><div><h3>Cause</h3><p>The granddaughter finally gives her full attention.</p></div><div><h3>Effect</h3><p>She realizes how much of her grandmother’s inner life she has missed.</p></div></div></div>`);
add(`<div class="content"><div class="eyebrow">TITLE</div><h1 class="hero">GRANDMOTHER</h1><p class="question">Why is the title only one word?</p></div>`);
add(`<div class="content"><div class="eyebrow">CENTRAL THEME</div><h1 class="title">הקשבה הופכת אדם לנראה</h1><p class="subtitle en">Ordinary details can reveal loneliness, effort, age and love.</p></div>`);
add(`<div class="content"></div>`,'breakSlide');
add(`<div class="content"><div class="eyebrow">LOOK AGAIN</div><p class="question">Which detail changes the granddaughter’s understanding most strongly?</p></div>`);
add(`<div class="content"><div class="eyebrow">CHARACTERIZATION</div><div class="steps"><div>What does the grandmother do?</div><div>What does she say?</div><div>What do her words suggest about her feelings?</div><div>How does the granddaughter respond?</div></div></div>`);
add(`<div class="content"><div class="eyebrow">MESSAGE</div><p class="question">What does the poem teach us about relationships between generations?</p></div>`);
add(`<div class="content"><div class="eyebrow">PERSONAL CONNECTION</div><p class="question">Can a short conversation change the way we see someone? Explain.</p></div>`);
add(`<div class="content"><div class="eyebrow">SHORT RESPONSE · 60–80 WORDS</div><p class="question">Why is listening important in the poem?</p><div class="steps"><div>State your answer clearly.</div><div>Use two details from the poem.</div><div>Explain what the granddaughter learns.</div><div>Check spelling and punctuation.</div></div></div>`);
add(`<div class="content"><div class="eyebrow">WRITING BOT</div><h1 class="title">כותבים קודם — משפרים אחר כך</h1><div class="steps"><div>Write your own first draft.</div><div>Ask the bot to identify two unclear sentences.</div><div>Ask for an explanation of one language mistake.</div><div>Rewrite the response yourself.</div></div></div>`);
add(`<div class="content"><div class="eyebrow">BOT PROMPT</div><p class="quote" style="font-size:clamp(24px,3.5vw,46px)">“Do not rewrite my answer. Show me two places that are unclear and explain one grammar mistake.”</p></div>`);
add(`<div class="content"><div class="eyebrow">EXIT QUESTION</div><p class="question">What will you remember from Grandmother?</p></div>`);
const deck=document.getElementById('deck');slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide '+s.cls;el.innerHTML=s.html;deck.appendChild(el)});
let index=0,wheelLock=false,touchX=0,touchY=0,speechTimer=0,speechReady=false;const all=[...document.querySelectorAll('.slide')];
function stopSpeech(){clearTimeout(speechTimer);if('speechSynthesis' in window)speechSynthesis.cancel()}
function unlockSpeech(){if(speechReady||!('speechSynthesis' in window))return;speechReady=true;const u=new SpeechSynthesisUtterance('');u.volume=0;speechSynthesis.speak(u)}
function speakCurrentWord(delay=650){const word=all[index].querySelector('.word');if(!word||!('speechSynthesis' in window))return;clearTimeout(speechTimer);speechTimer=setTimeout(()=>{speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word.textContent.trim());utterance.lang='en-US';utterance.rate=.78;utterance.pitch=1;utterance.volume=1;speechSynthesis.speak(utterance)},delay)}
function show(n,fromUser=false){stopSpeech();index=Math.max(0,Math.min(all.length-1,n));all.forEach((s,i)=>s.classList.toggle('active',i===index));const hasWord=!!all[index].querySelector('.word');sound.classList.toggle('show',hasWord);counter.textContent=`${index+1} / ${all.length}`;progress.style.width=`${(index+1)/all.length*100}%`;prev.disabled=index===0;next.disabled=index===all.length-1;location.hash=`slide-${index+1}`;if(hasWord){if(fromUser)unlockSpeech();speakCurrentWord(fromUser?350:800)}}
sound.onclick=()=>{unlockSpeech();speakCurrentWord(0)};
prev.onclick=()=>show(index-1,true);next.onclick=()=>show(index+1,true);
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();unlockSpeech();show(index+1,true)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();unlockSpeech();show(index-1,true)}});
document.addEventListener('wheel',e=>{if(wheelLock||Math.abs(e.deltaY)<18)return;wheelLock=true;show(index+(e.deltaY>0?1:-1),true);setTimeout(()=>wheelLock=false,450)},{passive:true});
document.addEventListener('touchstart',e=>{unlockSpeech();touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const dx=touchX-e.changedTouches[0].clientX,dy=touchY-e.changedTouches[0].clientY,d=Math.abs(dy)>=Math.abs(dx)?dy:dx;if(Math.abs(d)>32)show(index+(d>0?1:-1),true)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech()});window.addEventListener('pagehide',stopSpeech);if('speechSynthesis' in window)speechSynthesis.getVoices();const hash=Number((location.hash.match(/slide-(\d+)/)||[])[1]);show(hash?hash-1:0);
</script></body></html>
