<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b14"><title>30 Useful Verbs for Essays</title><link rel="stylesheet" href="../../grade9/connectors/lesson.css?v=20260916-reveal"><style>a{color:var(--cyan)}.simple{font:800 clamp(22px,2.4vw,34px)/1.35 Nunito,Arial,sans-serif;color:var(--gold);margin:20px 0 0}.subtitle{font:800 clamp(25px,3vw,42px)/1.35 Nunito,Heebo,Arial,sans-serif;margin:28px 0 0;color:var(--muted)}.choices{font:800 clamp(22px,2.5vw,35px)/1.4 Nunito,Arial,sans-serif;margin:30px 0;color:var(--gold)}.reference-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 32px;margin-top:20px;font-size:clamp(17px,1.4vw,22px);text-align:left}.reference-grid p{margin:5px 0;break-inside:avoid}.reference-grid b{color:var(--cyan)}.reference-grid span{color:var(--muted);font-size:.85em}.model-text{font:700 clamp(23px,2.7vw,38px)/1.55 Nunito,Arial,sans-serif;text-align:left;margin-top:30px}.model-text b{color:var(--cyan)}@media(max-width:650px){.reference-grid{grid-template-columns:repeat(2,1fr);gap:0 15px;font-size:16px}.simple{font-size:23px}.subtitle{font-size:26px}.choices{font-size:22px}.model-text{font-size:24px}}</style></head><body><a class="home" href="../../#grade11" aria-label="חזרה לדף הכיתה" title="חזרה לדף הכיתה">⌂</a><button class="full" id="full" aria-label="מסך מלא" title="מסך מלא"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><main id="deck" aria-live="polite"></main><nav class="controls" aria-label="ניווט בשקפים" dir="ltr"><button id="prev" aria-label="השקף הקודם">←</button><select id="jump" aria-label="מעבר לשקף"></select><button id="next" aria-label="השקף הבא">→</button></nav><div class="progress"><i id="progress"></i></div><noscript>יש להפעיל JavaScript כדי להציג את המצגת.</noscript><script>const D={"verbs": [{"name": "sum up", "simple": "say the main points briefly", "he": "לסכם", "register": "כתיבה", "note": "סיום חיבור: To sum up, + פסיק. לפני שם עצם: sum up the main points.", "examples": [{"en": "To [[sum up]], schools should limit phone use.", "he": "לסיכום, בתי ספר צריכים להגביל שימוש בטלפונים.", "simple": "In short, schools should limit phone use.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "This example [[sums up]] the problem with phones in class.", "he": "הדוגמה הזאת מסכמת את הבעיה בשימוש בטלפונים בכיתה.", "simple": "This example gives a short version of the problem with phones in class.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "That sentence [[sums him up]] perfectly.", "he": "המשפט הזה מתאר בדיוק את האופי שלו.", "simple": "That sentence describes him perfectly.", "context": "משמעות נוספת: לתאר בקיצור את האופי או המהות"}], "outside": "משמעות נוספת: לתאר בקיצור את האופי או המהות"}, {"name": "point out", "simple": "say / show", "he": "לציין, להצביע על", "register": "כתיבה", "note": "point out that + משפט. לפני כינוי גוף: point it out.", "examples": [{"en": "I would like to [[point out]] one benefit of phone limits.", "he": "ברצוני לציין יתרון אחד של הגבלות על שימוש בטלפונים.", "simple": "I would like to mention one benefit of phone limits.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Teachers [[point out]] that messages distract students.", "he": "מורים מציינים שהודעות מסיחות את דעתם של תלמידים.", "simple": "Teachers say that messages distract students.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "She [[pointed out]] my seat.", "he": "היא הראתה לי איפה המושב שלי.", "simple": "She showed me my seat.", "context": "שימוש יומיומי: להפנות תשומת לב למשהו"}], "outside": "שימוש יומיומי: להפנות תשומת לב למשהו"}, {"name": "put forward", "simple": "suggest", "he": "להציע, להעלות הצעה", "register": "כתיבה", "note": "put forward an idea / a plan / an argument. put נשאר put גם בעבר.", "examples": [{"en": "I would like to [[put forward]] a rule about phone use.", "he": "ברצוני להציע כלל בנוגע לשימוש בטלפונים.", "simple": "I would like to suggest a rule about phone use.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Students can [[put forward]] ideas for fair phone rules.", "he": "תלמידים יכולים להציע רעיונות לכללים הוגנים בנוגע לטלפונים.", "simple": "Students can suggest ideas for fair phone rules.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Dad [[put forward]] a plan for our holiday.", "he": "אבא הציע תוכנית לחופשה שלנו.", "simple": "Dad suggested a plan for our holiday.", "context": "אותה משמעות בהקשר יומיומי: להציע"}], "outside": "אותה משמעות בהקשר יומיומי: להציע"}, {"name": "set out", "simple": "explain clearly", "he": "להציג באופן ברור", "register": "כתיבה", "note": "כאן set out פירושו להציג, לא לצאת לדרך. set נשאר set בעבר. בשימוש היומיומי כאן: set out = לצאת לדרך.", "examples": [{"en": "The school should [[set out]] its phone rules clearly.", "he": "בית הספר צריך להציג בבירור את כללי השימוש שלו בטלפונים.", "simple": "The school should explain its phone rules clearly.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Teachers can [[set out]] the reasons for phone limits.", "he": "מורים יכולים להציג בבירור את הסיבות להגבלות על שימוש בטלפונים.", "simple": "Teachers can clearly explain the reasons for phone limits.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "We [[set out]] at six in the morning.", "he": "יצאנו לדרך בשש בבוקר.", "simple": "We started our journey at six in the morning.", "context": "משמעות נוספת: לצאת לדרך"}], "outside": "משמעות נוספת: לצאת לדרך"}, {"name": "bring up", "simple": "mention", "he": "להעלות נושא", "register": "רגיל", "note": "bring up a topic. brought up בעבר. כינוי גוף: bring it up. brought up children = גידלו ילדים.", "examples": [{"en": "Some students [[bring up]] the need to contact their parents.", "he": "חלק מהתלמידים מעלים את הצורך ליצור קשר עם הוריהם.", "simple": "Some students mention the need to contact their parents.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Parents often [[bring up]] the issue of phone use in class.", "he": "הורים מעלים לעיתים קרובות את נושא השימוש בטלפונים בכיתה.", "simple": "Parents often mention the issue of phone use in class.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "My grandparents [[brought up]] three children.", "he": "סבא וסבתא שלי גידלו שלושה ילדים.", "simple": "My grandparents raised three children.", "context": "משמעות נוספת: לגדל ילדים"}], "outside": "משמעות נוספת: לגדל ילדים"}, {"name": "lead to", "simple": "cause", "he": "להוביל לתוצאה", "register": "כתיבה", "note": "lead to + שם עצם או פועל ב־ing. עבר: led to.", "examples": [{"en": "Too many messages can [[lead to]] poor concentration.", "he": "הודעות רבות מדי עלולות להוביל לריכוז לקוי.", "simple": "Too many messages can cause poor concentration.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Clear phone rules can [[lead to]] calmer lessons.", "he": "כללים ברורים בנוגע לטלפונים יכולים להוביל לשיעורים רגועים יותר.", "simple": "Clear phone rules can produce calmer lessons.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "This path [[leads to]] the beach.", "he": "השביל הזה מוביל לחוף.", "simple": "This path takes you to the beach.", "context": "שימוש מוחשי: להוביל למקום"}], "outside": "שימוש מוחשי: להוביל למקום"}, {"name": "result in", "simple": "cause", "he": "להביא לתוצאה", "register": "כתיבה", "note": "result in + תוצאה. result from + סיבה: הכיוון שונה.", "examples": [{"en": "Phone limits may [[result in]] fewer distractions.", "he": "הגבלות על שימוש בטלפונים עשויות להביא לפחות הסחות דעת.", "simple": "Phone limits may cause fewer distractions.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "An unfair phone rule can [[result in]] arguments.", "he": "כלל לא הוגן בנוגע לטלפונים עלול לגרום לוויכוחים.", "simple": "An unfair phone rule can cause arguments.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "The broken pipe [[resulted in]] a wet kitchen.", "he": "הצינור השבור גרם למטבח להיות רטוב.", "simple": "The broken pipe caused a wet kitchen.", "context": "אותה משמעות בהקשר ביתי: לגרום לתוצאה"}], "outside": "אותה משמעות בהקשר ביתי: לגרום לתוצאה"}, {"name": "bring about", "simple": "cause", "he": "לחולל, לגרום לשינוי", "register": "כתיבה", "note": "bring about a change. עבר: brought about.", "examples": [{"en": "A phone policy can [[bring about]] positive changes.", "he": "מדיניות בנוגע לטלפונים יכולה לחולל שינויים חיוביים.", "simple": "A phone policy can cause positive changes.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Student feedback can [[bring about]] better phone rules.", "he": "משוב מתלמידים יכול להביא לכללים טובים יותר בנוגע לטלפונים.", "simple": "Student feedback can produce better phone rules.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "A new baby can [[bring about]] big changes at home.", "he": "תינוק חדש יכול לחולל שינויים גדולים בבית.", "simple": "A new baby can cause big changes at home.", "context": "אותה משמעות בהקשר יומיומי: לגרום לשינוי"}], "outside": "אותה משמעות בהקשר יומיומי: לגרום לשינוי"}, {"name": "give rise to", "simple": "cause", "he": "לגרום, לעורר", "register": "כתיבה", "note": "ביטוי פורמלי. give rise to + תוצאה, לעיתים בעיה או דיון.", "examples": [{"en": "Unclear phone rules can [[give rise to]] problems.", "he": "כללים לא ברורים בנוגע לטלפונים עלולים לגרום לבעיות.", "simple": "Unclear phone rules can cause problems.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "A complete phone ban may [[give rise to]] concern among parents.", "he": "איסור מוחלט על טלפונים עשוי לעורר דאגה בקרב הורים.", "simple": "A complete phone ban may cause concern among parents.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "The strange noise [[gave rise to]] concern.", "he": "הרעש המוזר עורר דאגה.", "simple": "The strange noise caused concern.", "context": "אותה משמעות מחוץ לחיבור: לעורר, לגרום"}], "outside": "אותה משמעות מחוץ לחיבור: לעורר, לגרום"}, {"name": "stem from", "simple": "come from", "he": "לנבוע מ־", "register": "כתיבה", "note": "stem from + סיבה. התוצאה מופיעה לפני הביטוי.", "examples": [{"en": "Many phone problems [[stem from]] unclear rules.", "he": "בעיות רבות הקשורות לטלפונים נובעות מכללים לא ברורים.", "simple": "Many phone problems come from unclear rules.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Some classroom distractions [[stem from]] phone messages.", "he": "חלק מהסחות הדעת בכיתה נובעות מהודעות בטלפון.", "simple": "Some classroom distractions come from phone messages.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Her love of music [[stems from]] her childhood.", "he": "האהבה שלה למוזיקה נובעת מילדותה.", "simple": "Her love of music comes from her childhood.", "context": "אותה משמעות בהקשר אישי: לנבוע מ־"}], "outside": "אותה משמעות בהקשר אישי: לנבוע מ־"}, {"name": "carry out", "simple": "do", "he": "לבצע", "register": "כתיבה", "note": "carry out research / a survey / a plan. כינוי גוף: carry it out.", "examples": [{"en": "The school can [[carry out]] a survey about phone use.", "he": "בית הספר יכול לבצע סקר על השימוש בטלפונים.", "simple": "The school can do a survey about phone use.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Teachers should [[carry out]] the new phone policy fairly.", "he": "מורים צריכים ליישם את המדיניות החדשה בנוגע לטלפונים בצורה הוגנת.", "simple": "Teachers should apply the new phone policy fairly.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "The mechanic [[carried out]] the repairs.", "he": "המכונאי ביצע את התיקונים.", "simple": "The mechanic did the repairs.", "context": "אותה משמעות בחיי היום־יום: לבצע"}], "outside": "אותה משמעות בחיי היום־יום: לבצע"}, {"name": "set up", "simple": "start / create", "he": "להקים, לארגן", "register": "רגיל", "note": "set up a club / a meeting. כינוי גוף: set it up. עבר: set up.", "examples": [{"en": "The school can [[set up]] a safe place for phones.", "he": "בית ה ents should [[cut down on]] checking phones during lessons.", "he": "תלמידים צריכים להפחית את בדיקת הטלפונים במהלך שיעורים.", "simple": "Students should reduce checking phones during lessons.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "I am trying to [[cut down on]] coffee.", "he": "אני מנסה להפחית את צריכת הקפה.", "simple": "I am trying to drink less coffee.", "context": "אותה משמעות בהרגל יומיומי: לצרוך פחות"}], "outside": "אותה משמעות בהרגל יומיומי: לצרוך פחות"}, {"name": "take on", "simple": "accept", "he": "לקבל על עצמך", "register": "רגיל", "note": "take on responsibility / a task. עבר: took on.", "examples": [{"en": "Students should [[take on]] responsibility for their phone use.", "he": "תלמידים צריכים לקבל על עצמם אחריות על השימוש שלהם בטלפונים.", "simple": "Students should accept responsibility for their phone use.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "A student group can [[take on]] the task of suggesting phone rules.", "he": "קבוצת תלמידים יכולה לקבל על עצמה את המשימה להציע כללים לשימוש בטלפונים.", "simple": "A student group can accept the task of suggesting phone rules.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "The café will [[take on]] two new workers.", "he": "בית הקפה יעסיק שני עובדים חדשים.", "simple": "The café will hire two new workers.", "context": "משמעות נוספת: להעסיק עובדים"}], "outside": "משמעות נוספת: להעסיק עובדים"}, {"name": "look into", "simple": "check", "he": "לבדוק לעומק", "register": "רגיל", "note": "look into a problem / an issue. אין להפריד: look into it.", "examples": [{"en": "Schools should [[look into]] students’ needs before banning phones.", "he": "בתי ספר צריכים לבדוק את צורכי התלמידים לפני שהם אוסרים שימוש בטלפונים.", "simple": "Schools should examine students’ needs before banning phones.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Teachers can [[look into]] ways to use phones for learning.", "he": "מורים יכולים לבדוק דרכים להשתמש בטלפונים ללמידה.", "simple": "Teachers let body='';
if(s.kind==='example'){const v=D.verbs[s.verb],e=v.examples[s.example];body=`<div class="heading"><p class="eyebrow">${esc(D.groups[s.group])} · ${s.verb+1}/30 · ${s.example===2?'מחוץ לחיבור':'בחיבור'} · ${s.example+1}/3</p><h2 dir="ltr">${esc(v.name)}</h2></div><p class="tense">${v.register==='כתיבה'?'מתאים במיוחד לכתיבה':v.register==='שיחה'?'בעיקר דיבור · חלופה פשוטה לחיבור':'דיבור וכתיבה רגילה'}</p><div class="sentence" lang="en" dir="ltr">${rich(e.en)}</div>${translation(s,`<p class="meaning">${esc(e.he)}</p><p class="simple" lang="en" dir="ltr">Simple English: ${esc(e.simple)}</p><p class="rule">${esc(e.context)}</p>`)}`}
else if(s.kind==='quiz'){body=`<div class="heading"><p class="eyebrow">${esc(D.groups[s.group])} · תרגול שליפה</p><h2 dir="ltr">${esc(s.title)}</h2></div><p class="prompt" dir="rtl">בחרו תשובה והסבירו לבן הזוג.</p><div class="sentence" lang="en" dir="ltr">${esc(s.q.replace('____',s.reveal?s.answer:'____'))}</div><p class="choices" dir="ltr">${s.opts.map((o,j)=>`${'ABC'[j]}. ${esc(o)}`).join(' &nbsp; ' )}</p>${translation(s,`<p class="meaning">${esc(s.he)}</p><p class="simple" dir="ltr">Simple English: ${esc(s.simple)}</p>`)}`}
else if(s.kind==='reference'){body=`<div class="heading"><h2 dir="ltr">${esc(s.title)}</h2></div><div class="reference-grid">${D.verbs.map((v,j)=>`<p dir="ltr">${j+1}. <b>${esc(v.name)}</b><br><span>${esc(v.simple)}</span></p>`).join('')}</div>`}
else if(s.kind==='sources'){body=`<div class="heading"><h2 dir="ltr">${esc(s.title)}</h2></div><p class="rule">תוכנית: 72 דקות, כולל שלוש הפוגות. שקפי העזר והמודל אופציונליים.</p><p class="rule">בחיבור: משמעות ברורה, התאמה להקשר ודיוק דקדוקי. הביטויים אינם רשימת חובה לבגרות.</p><p class="rule">החלופה הפשוטה מתאימה למשפט המסוים. הרשימה כוללת פעלים צירופיים וביטויים פועליים.</p><p class="rule">כל הדוגמאות והתרגומים מקוריים. מקורות מילוניים למשמעויות מרכזיות ולשימושים נוספים:</p><p class="rule" dir="ltr"><a href="https://dictionary.cambridge.org/grammar/british-grammar/phrasal-verbs-and-multi-word-verbs">Cambridge: multi-word verbs</a><br><a href="https://dictionary.cambridge.org/dictionary/english/sum-up">sum up</a> · <a href="https://dictionary.cambridge.org/dictionary/english/carry-out">carry out</a> · <a href="https://dictionary.cambridge.org/dictionary/english/take-off">take off</a></p><p class="rule">שמעון הלוי · English for Noar · אוקטובר 2026</p>`}
else if(s.kind==='model'){body=`<div class="heading"><h2 dir="ltr">${esc(s.title)}</h2></div><div class="model-text" lang="en" dir="ltr">${rich(s.body)}</div><p class="rule">מודל אפשרי לפסקת תרגול. חשיפה אחרי הכתיבה העצמאית.</p>`}
else{body=`<div class="heading"><p class="eyebrow">${s.kind==='break'?'הפוגה · 2 דקות':'English for Noar · י״א · Module G'}</p><h2 dir="ltr">${esc(s.title)}</h2></div><p class="subtitle" lang="en" dir="${s.kind==='intro'&&i===0?'rtl':'ltr'}">${esc(s.subtitle||'')}</p><p class="explanation" dir="rtl">${esc(s.body||'').replace(/\n/g,'<br>')}</p>`}
return `<section ${common}><div class="content">${body}</div></section>`;
}).join('');
const all=[...deck.children],jump=document.getElementById('jump'),prev=document.getElementById('prev'),next=document.getElementById('next');
let currentChapter='';
jump.innerHTML=slides.map((s,i)=>{
 let group='';
 if(s.chapter!==currentChapter){group=(i?'</optgroup>':'')+`<optgroup label="${esc(s.chapter)}">`;currentChapter=s.chapter;}
 return group+`<option value="${i}">${i+1} / ${slides.length} · ${esc(s.title||s.en)}</option>`;
}).join('')+'</optgroup>';
let at=0;
function fit(){
 const slide=all[at],content=slide.querySelector('.content');
 if(!content)return;
 content.style.removeProperty('--fit');
 const css=getComputedStyle(slide);
 const available=slide.clientHeight-parseFloat(css.paddingTop)-parseFloat(css.paddingBottom);
 const scale=Math.min(1,available/content.offsetHeight,slide.clientWidth*.9/content.scrollWidth);
 content.style.setProperty('--fit',String(scale));
}
function show(n,write=true){
 n=Math.max(0,Math.min(all.length-1,Number.isFinite(n)?n:0));
 all[at].hidden=true;all[at].querySelectorAll('audio,video').forEach(m=>m.pause());
 at=n;all[at].hidden=false;jump.value=String(at);prev.disabled=at===0;next.disabled=at===all.length-1;
 document.getElementById('progress').style.width=((at+1)/all.length*100)+'%';
 fit();
 if(write)history.replaceState(null,'','#'+(at+1));
}
prev.onclick=()=>show(at-1);next.onclick=()=>show(at+1);jump.onchange=()=>show(Number(jump.value));
window.addEventListener('hashchange',()=>show(parseInt(location.hash.slice(1),10)-1,false));
window.addEventListener('resize',fit);
document.fonts.ready.then(fit);
document.addEventListener('keydown',e=>{
 if(e.target.matches('select,input,textarea'))return;
 let n;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key))n=at+1;
 if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))n=at-1;
 if(e.key==='Home')n=0;if(e.key==='End')n=all.length-1;
 if(n!==undefined){e.preventDefault();show(n);}
});
let wheel=0,last=0;
document.addEventListener('wheel',e=>{if(e.target.closest('select'))return;e.preventDefault();const now=Date.now();if(now-last<650)return;wheel+=e.deltaY;if(Math.abs(wheel)>45){show(at+Math.sign(wheel));wheel=0;last=now;}},{passive:false});
let touch=null;
deck.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY};else touch=null;},{passive:true});
deck.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<48)return;show(at+(Math.abs(dy)>Math.abs(dx)?(dy<0?1:-1):(dx<0?1:-1)));},{passive:true});
deck.addEventListener('touchcancel',()=>touch=null,{passive:true});
document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}};
show(parseInt(location.hash.slice(1),10)-1,false);

</script></body></html>
