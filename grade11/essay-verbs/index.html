ect><button id="listBtn">רשימת ביטויים</button><button id="noteBtn">הערות למורה</button><button id="full">מסך מלא</button></header><main id="stage" aria-live="polite"><div id="canvas"></div></main><footer><button id="prev">◀ הקודם</button><span id="counter"></span><button id="next">הבא ▶</button><button id="start">הפעלת שעון</button><span id="clock"></span><button id="reset" aria-label="איפוס שעון">↺</button></footer><aside id="notes"></aside><section id="list"></section><script>const DATA={"verbs": [{"name": "sum up", "simple": "say the main points briefly", "he": "לסכם", "register": "כתיבה", "note": "סיום חיבור: To sum up, + פסיק. לפני שם עצם: sum up the main points.", "examples": [{"en": "To [[sum up]], schools should limit phone use.", "he": "לסיכום, בתי ספר צריכים להגביל שימוש בטלפונים.", "simple": "In short, schools should limit phone use.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "This example [[sums up]] the problem with phones in class.", "he": "הדוגמה הזאת מסכמת את הבעיה בשימוש בטלפונים בכיתה.", "simple": "This example gives a short version of the problem with phones in class.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "That sentence [[sums him up]] perfectly.", "he": "המשפט הזה מתאר בדיוק את האופי שלו.", "simple": "That sentence describes him perfectly.", "context": "משמעות נוספת: לתאר בקיצור את האופי או המהות"}], "outside": "משמעות נוספת: לתאר בקיצור את האופי או המהות"}, {"name": "point out", "simple": "say / show", "he": "לציין, להצביע על", "register": "כתיבה", "note": "point out that + משפט. לפני כינוי גוף: point it out.", "examples": [{"en": "I would like to [[point out]] one benefit of phone limits.", "he": "ברצוני לציין יתרון אחד של הגבלות על שימוש בטלפונים.", "simple": "I would like to mention one benefit of phone limits.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Teachers [[point out]] that messages distract students.", "he": "מורים מציינים שהודעות מסיחות את דעתם של תלמידים.", "simple": "Teachers say that messages distract students.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "She [[pointed out]] my seat.", "he": "היא הראתה לי איפה המושב שלי.", "simple": "She showed me my seat.", "context": "שימוש יומיומי: להפנות תשומת לב למשהו"}], "outside": "שימוש יומיומי: להפנות תשומת לב למשהו"}, {"name": "put forward", "simple": "suggest", "he": "להציע, להעלות הצעה", "register": "כתיבה", "note": "put forward an idea / a plan / an argument. put נשאר put גם בעבר.", "examples": [{"en": "I would like to [[put forward]] a rule about phone use.", "he": "ברצוני להציע כלל בנוגע לשימוש בטלפונים.", "simple": "I would like to suggest a rule about phone use.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Students can [[put forward]] ideas for fair phone rules.", "he": "תלמידים יכולים להציע רעיונות לכללים הוגנים בנוגע לטלפונים.", "simple": "Students can suggest ideas for fair phone rules.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Dad [[put forward]] a plan for our holiday.", "he": "אבא הציע תוכנית לחופשה שלנו.", "simple": "Dad suggested a plan for our holiday.", "context": "אותה משמעות בהקשר יומיומי: להציע"}], "outside": "אותה משמעות בהקשר יומיומי: להציע"}, {"name": "set out", "simple": "explain clearly", "he": "להציג באופן ברור", "register": "כתיבה", "note": "כאן set out פירושו להציג, לא לצאת לדרך. set נשאר set בעבר. בשימוש היומיומי כאן: set out = לצאת לדרך.", "examples": [{"en": "The school should [[set out]] its phone rules clearly.", "he": "בית הספר צריך להציג בבירור את כללי השימוש שלו בטלפונים.", "simple": "The school should explain its phone rules clearly.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "Teachers can [[set out]] the reasons for phone limits.", "he": "מורים יכולים להציג בבירור את הסיבות להגבלות על שימוש בטלפונים.", "simple": "Teachers can clearly explain the reasons for phone limits.", "context": "חיבור: הגבלת טלפונים בבית הספר"}, {"en": "We [[set out]] at six in the morning.", "he": "יצאנו לדרך בשש בבוקר.", "simple": "We started our
