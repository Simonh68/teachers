<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מצגת פתיחת השנה — כיתה י״א, 4 יח״ל</title>
<meta name="theme-color" content="#050b14">
<style>
@import url("https://fonts.googleapis.com/css2?family=Heebo:wght@500;600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap");
:root{--bg:#050b14;--ink:#f7fbff;--muted:#a9bdd2;--cyan:#4ee5ff;--gold:#ffc857;--purple:#ac8cff;--green:#dfff5b;--red:#ff7163;--panel:#0e1e31}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Heebo",Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 10% 10%,#17466b 0,transparent 36%),radial-gradient(circle at 88% 86%,#4a244e 0,transparent 36%),linear-gradient(135deg,#06101c,#0b1729);pointer-events:none}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,#000,transparent 88%)}
.deck{height:100%;position:relative}.slide{position:absolute;inset:0;padding:clamp(58px,7vh,86px) 6vw 78px;display:none;align-items:center;justify-content:center;overflow:hidden}.slide.active{display:flex;animation:enter .38s ease-out}@keyframes enter{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.content{width:min(1180px,100%);margin:auto;text-align:center;position:relative;z-index:2}.eyebrow{color:var(--gold);font:800 clamp(13px,1.25vw,18px) "Nunito";letter-spacing:.14em}.title{font-size:clamp(39px,5.8vw,78px);margin:.2em 0;line-height:1.04;font-weight:900;letter-spacing:-.025em}.hero{font-size:clamp(58px,9vw,124px);background:linear-gradient(90deg,var(--cyan),#fff,var(--gold));-webkit-background-clip:text;color:transparent;margin:.1em 0;line-height:.98;font-weight:900}.subtitle{font-size:clamp(21px,2.6vw,35px);color:var(--muted);margin:.6em auto 0;font-weight:700;max-width:1000px;line-height:1.4}.en{direction:ltr;font-family:"Nunito",sans-serif}.badge{display:inline-block;border:2px solid #ffffff33;border-radius:999px;background:#ffffff0d;padding:.35em .85em;font-size:clamp(18px,2vw,28px);font-weight:800}.accent{color:var(--gold)}.cyan{color:var(--cyan)}.green{color:var(--green)}.red{color:var(--red)}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:3.5vh auto;max-width:1120px;direction:ltr}.pillar{min-height:175px;padding:22px 15px;border:1px solid #ffffff22;border-radius:25px;background:linear-gradient(145deg,#142942,#0d1a2c);display:flex;align-items:center;justify-content:center;flex-direction:column}.pillar b{font:900 clamp(23px,3vw,42px) "Nunito"}.pillar small{color:var(--muted);font-size:clamp(14px,1.4vw,19px);margin-top:7px}.pillar.on{border-color:var(--cyan);box-shadow:0 0 34px #4ee5ff25}.pillar.gold{border-color:#ffc85788}.pillar.purple{border-color:#ac8cff88}.pillar.green{border-color:#dfff5b77}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:4vh auto;max-width:1020px}.three .pillar{min-height:190px}.three .pillar b{font-family:"Heebo",Arial,sans-serif}
.flow{display:flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap;direction:ltr;margin:4vh auto}.step{background:#ffffff0d;border:1px solid #ffffff2c;border-radius:22px;padding:18px 24px;font:900 clamp(19px,2.2vw,30px) "Nunito"}.flow .arrow{font-size:32px;color:var(--cyan)}
.checks{display:grid;gap:13px;max-width:900px;margin:3vh auto;text-align:left;direction:ltr}.checks div{padding:14px 20px;border-left:5px solid var(--cyan);background:#ffffff08;font:800 clamp(19px,2.2vw,29px) "Nunito"}.checks.rtl{text-align:right;direction:rtl}.checks.rtl div{border-left:0;border-right:5px solid var(--gold)}
.quote{direction:ltr;text-align:left;margin:3vh auto 1.5vh;padding:24px 30px;max-width:1040px;border-left:5px solid var(--cyan);border-radius:0 22px 22px 0;background:#ffffff09;font:800 clamp(20px,2.4vw,32px)/1.45 "Nunito"}.answer{direction:ltr;margin:1.5vh auto;padding:17px 24px;max-width:900px;border:1px solid #dfff5b77;border-radius:18px;background:#dfff5b0c;font:800 clamp(18px,2vw,27px) "Nunito"}.highlight{color:var(--gold);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:3.5vh auto;max-width:1100px;direction:ltr}.choice{padding:23px 15px;border-bottom:4px solid var(--cyan);background:#ffffff09;border-radius:20px;font:900 clamp(19px,2vw,28px) "Nunito"}.choice:nth-child(2){border-color:var(--gold)}.choice:nth-child(3){border-color:var(--purple)}.choice:nth-child(4){border-color:var(--green)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:3vh auto;max-width:1080px}.panel{min-height:215px;padding:28px 24px;border:1px solid #ffffff22;border-radius:28px;background:linear-gradient(145deg,#142942,#0d1a2c);display:flex;flex-direction:column;align-items:center;justify-content:center}.panel strong{font:900 clamp(34px,5vw,68px) "Nunito"}.panel p{margin:10px 0 0;color:var(--muted);font-size:clamp(18px,2vw,26px);font-weight:700}.panel.now{border-color:var(--cyan);box-shadow:0 0 35px #4ee5ff22}.panel.next{border-color:var(--gold);box-shadow:0 0 35px #ffc85718}
.prompt{direction:ltr;text-align:left;margin:3vh auto;padding:25px 30px;max-width:1040px;border:1px solid #dfff5b77;border-radius:22px;background:#dfff5b0c;font:800 clamp(21px,2.6vw,35px)/1.45 "Nunito"}.appflow{display:flex;align-items:center;justify-content:center;gap:22px;direction:ltr;margin:3.5vh auto}.appbox{min-width:260px;padding:28px;border:1px solid #ffffff25;border-radius:26px;background:#ffffff09}.appbox b{display:block;font:900 clamp(30px,4vw,54px) "Nunito"}.appbox small{display:block;color:var(--muted);font-size:18px;margin-top:8px}.appflow .arrow{font-size:46px;color:var(--gold)}
.works{display:grid;gap:13px;direction:ltr;max-width:900px;margin:3vh auto;text-align:left}.work{padding:16px 22px;border-bottom:1px solid #ffffff22;font:900 clamp(21px,2.4vw,32px) "Nunito"}.work:nth-child(1){color:var(--gold)}.work:nth-child(2){color:var(--cyan)}.work:nth-child(3){color:var(--purple)}.work:nth-child(4){color:var(--green)}
.work-title{font:900 clamp(48px,7.5vw,102px)/1.02 "Nunito";direction:ltr;margin:.18em auto;letter-spacing:-.04em}.work-title.long{font-size:clamp(42px,6.2vw,82px)}
.footer{position:fixed;bottom:0;left:0;right:0;height:56px;background:#07111fee;border-top:1px solid #ffffff1b;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;z-index:20}.nav{display:flex;gap:9px;direction:ltr}.nav button{border:1px solid #ffffff2a;background:#ffffff0d;color:#fff;border-radius:13px;padding:8px 14px;font-size:18px;cursor:pointer}.nav button:disabled{opacity:.32}.progressWrap{flex:1;max-width:440px;margin:0 20px;height:7px;border-radius:999px;background:#ffffff18;overflow:hidden}.progress{height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:.3s}.counter{direction:ltr;color:var(--muted);min-width:75px}.home{position:fixed;top:16px;left:20px;z-index:30;color:#fff;text-decoration:none;background:#ffffff12;border:1px solid #ffffff24;border-radius:13px;padding:8px 12px;font-size:21px}.tracker{position:absolute;top:3vh;right:4vw;display:flex;gap:10px;direction:ltr;color:#7890a8;font:800 12px "Nunito";letter-spacing:.06em}.tracker .on{color:var(--gold)}
@media(max-width:780px){.slide{padding:68px 4vw 74px;overflow:auto}.four{grid-template-columns:1fr 1fr}.pillar{min-height:105px;padding:12px}.three{grid-template-columns:1fr}.three .pillar{min-height:92px}.split{grid-template-columns:1fr}.panel{min-height:135px;padding:17px}.choices{grid-template-columns:1fr 1fr}.appflow{gap:10px}.appbox{min-width:0;padding:18px}.progressWrap,.tracker{display:none}.quote,.prompt{padding:17px 20px}.home{top:11px;left:12px}.work-title.long{font-size:clamp(36px,10vw,66px)}}
@media(max-height:650px){.slide{padding-top:50px;padding-bottom:68px}.title{font-size:clamp(34px,5vw,62px)}.hero{font-size:clamp(48px,8vw,94px)}.subtitle{font-size:clamp(18px,2.2vw,28px)}.pillar,.panel{min-height:110px;padding:14px}.quote,.prompt{margin:1.5vh auto;padding:15px 22px}.flow,.choices,.four,.three{margin:2vh auto}.work-title{font-size:clamp(42px,7vw,78px)}}
</style>
</head>
<body>
<a class="home" href="../" aria-label="חזרה לספריית י״א 4 יח״ל">⌂</a>
<main class="deck" id="deck"></main>
<footer class="footer"><span class="counter" id="counter"></span><div class="progressWrap"><div class="progress" id="progress"></div></div><nav class="nav"><button id="prev" aria-label="השקף הקודם">←</button><button id="next" aria-label="השקף הבא">→</button></nav></footer>
<script>
const slides=[];
const add=(html,cls='')=>slides.push({html,cls});
const track=on=>`<div class="tracker"><span class="${on==='c'?'on':''}">MODULE C</span><span class="${on==='w'?'on':''}">WRITING</span><span class="${on==='v'?'on':''}">VOCABULARY</span><span class="${on==='l'?'on':''}">LITERATURE</span></div>`;

add(`<div class="content"><span class="badge">כיתה י״א · 4 יח״ל</span><div class="eyebrow" style="margin-top:3vh">WELCOME TO GRADE 11</div><h1 class="hero en">MODULE C</h1><p class="subtitle">בסוף השנה ניגשים לבגרות</p></div>`);

add(`${track('c')}<div class="content"><div class="eyebrow">OUR TARGET</div><h1 class="title">בסוף השנה ניגשים לשאלון C</h1><p class="subtitle">ההכנה מתחילה בשיעור הראשון</p></div>`);

add(`${track('')}<div class="content"><div class="eyebrow">OUR ROADMAP</div><h1 class="title">ארבעה מסלולים — יעד אחד</h1><div class="four"><div class="pillar on"><b>MODULE C</b><small>Reading</small></div><div class="pillar gold"><b>CORE II</b><small>Vocabulary</small></div><div class="pillar purple"><b>WRITING</b><small>Clear ideas</small></div><div class="pillar green"><b>LITERATURE</b><small>Four works</small></div></div></div>`);

add(`${track('')}<div class="content"><div class="eyebrow">BAGRUT HABITS</div><h1 class="title">עובדים כמו קבוצת בגרות</h1><div class="three"><div class="pillar on"><b>דיוק</b><small>עונים למה שנשאל</small></div><div class="pillar gold"><b>זמן</b><small>מתרגלים בקצב נכון</small></div><div class="pillar green"><b>עצמאות</b><small>בודקים לפני שמגישים</small></div></div></div>`);

add(`${track('c')}<div class="content"><div class="eyebrow">READING</div><h1 class="hero en">READ SMART</h1><p class="subtitle">לא מתרגמים כל מילה · מבינים את הנושא ומאתרים את המידע הדרוש</p></div>`);

add(`${track('c')}<div class="content"><div class="eyebrow">BEFORE YOU READ</div><div class="checks"><div>Read the title</div><div>Look at the source and headings</div><div>Predict the topic</div><div>Read the questions</div></div></div>`);

add(`${track('c')}<div class="content"><div class="eyebrow">FIND THE ANSWER</div><h1 class="title">לא מנחשים — מאתרים ומוכיחים</h1><div class="flow"><span class="step">QUESTION</span><span class="arrow">→</span><span class="step">KEYWORDS</span><span class="arrow">→</span><span class="step">TEXT</span><span class="arrow">→</span><span class="step">PROOF</span></div></div>`);

add(`${track('c')}<div class="content"><div class="eyebrow">PARAPHRASE</div><h1 class="title en">Same meaning — different words</h1><div class="quote">The school decided to <span class="highlight">postpone</span> the trip.</div><div class="answer">The trip will take place at a later date.</div><p class="subtitle">מחפשים משמעות — לא רק מילים זהות</p></div>`);

add(`${track('c')}<div class="content"><div class="eyebrow">ANSWER CLEARLY</div><h1 class="title en">Answer exactly what the question asks.</h1><div class="flow"><span class="step">WHY → REASON</span><span class="step">HOW → METHOD</span><span class="step">EXAMPLE → DETAIL</span></div><p class="subtitle">לא מעתיקים פסקה שלמה כאשר נדרש פרט אחד</p></div>`);

add(`${track('c')}<div class="content"><div class="eyebrow">CHECK BEFORE YOU MOVE ON</div><div class="checks"><div>Did I answer the question?</div><div>Is my answer supported by the text?</div><div>Is my sentence complete?</div><div>Did I copy accurately?</div></div></div>`);

add(`${track('c')}<div class="content"><div class="eyebrow">REAL EXAM PRACTICE</div><h1 class="title en">PAST MODULE C EXAMS</h1><div class="flow"><span class="step">GUIDED</span><span class="arrow">→</span><span class="step">INDEPENDENT</span><span class="arrow">→</span><span class="step">TIMED</span></div><p class="subtitle">בהדרגה מבנה הבחינה הופך למוכר</p></div>`);

add(`${track('w')}<div class="content"><div class="eyebrow">WRITING IS PART OF THE TARGET</div><h1 class="title en">READ CLEARLY.<br>THINK CLEARLY.<br>WRITE CLEARLY.</h1></div>`);

add(`${track('w')}<div class="content"><div class="eyebrow">WRITING IS DIFFERENT</div><h1 class="title">כתיבה יכולה להיות קלה</h1><h2 class="hero">אתם שולטים</h2><div class="choices"><div class="choice">YOUR IDEA</div><div class="choice">YOUR EXAMPLE</div><div class="choice">YOUR WORDS</div><div class="choice">YOUR STRUCTURE</div></div></div>`);

add(`${track('w')}<div class="content"><div class="eyebrow">TRAIN THE THINKING</div><h1 class="title">לא משננים תשובה</h1><p class="subtitle">מתמודדים עם נושאים מגוונים ולומדים לגבש עמדה</p><div class="choices"><div class="choice">SCHOOL</div><div class="choice">TECHNOLOGY</div><div class="choice">VOLUNTEERING</div><div class="choice">TEENAGE LIFE</div></div></div>`);

add(`${track('w')}<div class="content"><div class="eyebrow">A CLEAR STRUCTURE</div><h1 class="title">קודם חושבים — אחר כך כותבים</h1><div class="flow"><span class="step">OPINION</span><span class="arrow">→</span><span class="step">REASON</span><span class="arrow">→</span><span class="step">EXAMPLE</span><span class="arrow">→</span><span class="step">CONCLUSION</span></div></div>`);

add(`${track('w')}<div class="content"><div class="eyebrow">WRITING BOT</div><h1 class="title">הבוט עוזר לכם להשתפר</h1><div class="flow"><span class="step">WRITE</span><span class="arrow">→</span><span class="step">ASK</span><span class="arrow">→</span><span class="step">REWRITE</span></div><p class="subtitle">הקישור יישלח בקבוצת הכיתה</p></div>`);

add(`${track('w')}<div class="content"><div class="eyebrow">THE RULE</div><h1 class="title en">THE BOT DOES NOT WRITE FOR YOU</h1><div class="prompt">Do not rewrite my answer. Show me two unclear places and explain one grammar mistake.</div></div>`);

add(`${track('v')}<div class="content"><div class="eyebrow">CORE II</div><h1 class="title">לומדים באפליקציה — נבחנים בכיתה</h1><div class="appflow"><div class="appbox"><b class="cyan">APP</b><small>Learn and practise</small></div><span class="arrow">→</span><div class="appbox"><b class="accent">CLASS</b><small>Vocabulary quiz</small></div></div></div>`);

add(`${track('v')}<div class="content"><div class="eyebrow">LOCAL PROGRESS</div><h1 class="title en">SAME DEVICE · SAME BROWSER</h1><div class="checks"><div>Use the same phone or computer</div><div>Use the same browser</div><div>Do not use private mode</div><div>Check that your progress was saved</div></div></div>`);

add(`${track('v')}<div class="content"><div class="eyebrow">YOUR RESPONSIBILITY</div><h1 class="hero en">SEEN ≠ MASTERED</h1><p class="subtitle">מסיימים את הקבוצות · חוזרים על מילים קשות · מגיעים מוכנים לבוחן</p></div>`);

add(`${track('l')}<div class="content"><div class="eyebrow">OUR LITERATURE JOURNEY</div><h1 class="title">ארבע יצירות השנה</h1><div class="works"><div class="work">Thank You, Ma’am</div><div class="work">Grandmother</div><div class="work">Count That Day Lost</div><div class="work">A Summer’s Reading</div></div></div>`);

add(`${track('l')}<div class="content"><div class="eyebrow">THANK YOU, MA’AM</div><h1 class="work-title">Thank You, Ma’am</h1><p class="subtitle en">Kindness and a second chance</p></div>`);

add(`${track('l')}<div class="content"><div class="eyebrow">GRANDMOTHER</div><h1 class="work-title">Grandmother</h1><p class="subtitle en">Listening changes understanding</p></div>`);

add(`${track('l')}<div class="content"><div class="eyebrow">COUNT THAT DAY LOST</div><h1 class="work-title long">Count That Day Lost</h1><p class="subtitle en">What makes a day meaningful?</p></div>`);

add(`${track('l')}<div class="content"><div class="eyebrow">A SUMMER’S READING</div><h1 class="work-title long">A Summer’s Reading</h1><p class="subtitle en">Reading, dignity and change</p></div>`);

add(`${track('l')}<div class="content"><div class="eyebrow">LITERATURE BUILDS THE SAME SKILLS</div><h1 class="title">קוראים לעומק — ומוכיחים מן הטקסט</h1><div class="flow"><span class="step">READ</span><span class="arrow">→</span><span class="step">UNDERSTAND</span><span class="arrow">→</span><span class="step">EXPLAIN</span><span class="arrow">→</span><span class="step">PROVE</span></div></div>`);

add(`${track('')}<div class="content"><div class="eyebrow">OUR RESPONSIBILITY</div><h1 class="title">מגיעים · עובדים · מתרגלים · שואלים</h1><div class="choices"><div class="choice">SHOW UP</div><div class="choice">WORK</div><div class="choice">PRACTISE</div><div class="choice">ASK</div></div><p class="subtitle">כשמשהו אינו ברור — פונים אליי בזמן</p></div>`);

add(`<div class="content"><span class="badge">כיתה י״א · 4 יח״ל</span><div class="eyebrow" style="margin-top:3vh">THE TARGET IS CLEAR</div><h1 class="title">בסוף השנה ניגשים ל־C</h1><h2 class="hero en">START NOW</h2><p class="subtitle">מתקדמים בכל שבוע</p></div>`);

const deck=document.getElementById('deck');
slides.forEach(s=>{const el=document.createElement('section');el.className=`slide ${s.cls}`;el.innerHTML=s.html;deck.appendChild(el)});
let index=0,wheelLock=false,touchX=0,touchY=0;
const all=[...document.querySelectorAll('.slide')];
function show(n){index=Math.max(0,Math.min(all.length-1,n));all.forEach((s,i)=>s.classList.toggle('active',i===index));counter.textContent=`${index+1} / ${all.length}`;progress.style.width=`${(index+1)/all.length*100}%`;prev.disabled=index===0;next.disabled=index===all.length-1;location.hash=`slide-${index+1}`}
prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(all.length-1)});
document.addEventListener('wheel',e=>{if(wheelLock||Math.abs(e.deltaY)<18)return;wheelLock=true;show(index+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,430)},{passive:true});
document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const dx=touchX-e.changedTouches[0].clientX,dy=touchY-e.changedTouches[0].clientY,d=Math.abs(dy)>Math.abs(dx)?dy:dx;if(Math.abs(d)>45)show(index+(d>0?1:-1))},{passive:true});
const hash=Number((location.hash.match(/slide-(\d+)/)||[])[1]);show(hash?hash-1:0);
</script>
</body>
</html>
