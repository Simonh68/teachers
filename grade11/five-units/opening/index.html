<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מצגת פתיחת השנה — כיתה י״א, 5 יח״ל</title>
<meta name="theme-color" content="#050b14">
<style>
@import url("https://fonts.googleapis.com/css2?family=Heebo:wght@500;600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap");
:root{--bg:#050b14;--ink:#f7fbff;--muted:#a9bdd2;--cyan:#4ee5ff;--gold:#ffc857;--purple:#ac8cff;--green:#dfff5b;--red:#ff7163;--panel:#0e1e31}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Heebo",Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 10% 10%,#17466b 0,transparent 36%),radial-gradient(circle at 88% 86%,#4a244e 0,transparent 36%),linear-gradient(135deg,#06101c,#0b1729);pointer-events:none}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,#000,transparent 88%)}
.deck{height:100%;position:relative}.slide{position:absolute;inset:0;padding:clamp(58px,7vh,86px) 6vw 92px;display:none;align-items:center;justify-content:center;overflow:hidden}.slide.active{display:flex;animation:enter .38s ease-out}@keyframes enter{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.content{width:min(1180px,100%);margin:auto;text-align:center;position:relative;z-index:2}.eyebrow{color:var(--cyan);font:800 clamp(13px,1.25vw,18px) "Nunito";letter-spacing:.14em}.title{font-size:clamp(39px,5.8vw,78px);margin:.2em 0;line-height:1.04;font-weight:900;letter-spacing:-.025em}.hero{font-size:clamp(58px,9vw,124px);background:linear-gradient(90deg,var(--cyan),#fff,var(--gold));-webkit-background-clip:text;color:transparent;margin:.1em 0;line-height:.98;font-weight:900}.subtitle{font-size:clamp(21px,2.6vw,35px);color:var(--muted);margin:.6em auto 0;font-weight:700;max-width:1000px;line-height:1.4}.en{direction:ltr;font-family:"Nunito",sans-serif}.badge{display:inline-block;border:2px solid #ffffff33;border-radius:999px;background:#ffffff0d;padding:.35em .85em;font-size:clamp(18px,2vw,28px);font-weight:800}.accent{color:var(--gold)}.cyan{color:var(--cyan)}.green{color:var(--green)}.red{color:var(--red)}
.teacher-note{position:absolute;z-index:8;left:7vw;right:7vw;bottom:65px;text-align:center;color:#dbeaff42;font-size:clamp(7px,.62vw,10.5px);font-weight:600;line-height:1.25;max-height:2.6em;overflow:hidden;pointer-events:none}.teacher-note:before{content:""}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:4vh auto;max-width:1050px}.pillar{min-height:180px;padding:24px 18px;border:1px solid #ffffff22;border-radius:26px;background:linear-gradient(145deg,#142942,#0d1a2c);display:flex;align-items:center;justify-content:center;flex-direction:column}.pillar b{font-size:clamp(28px,4vw,53px)}.pillar small{color:var(--muted);font-size:clamp(15px,1.5vw,20px);margin-top:7px}.pillar.on{border-color:var(--cyan);box-shadow:0 0 34px #4ee5ff25}.pillar.gold{border-color:#ffc85788}.pillar.green{border-color:#dfff5b77}
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:3vh auto;max-width:1080px}.panel{min-height:225px;padding:30px 24px;border:1px solid #ffffff22;border-radius:28px;background:linear-gradient(145deg,#142942,#0d1a2c);display:flex;flex-direction:column;align-items:center;justify-content:center}.panel strong{font:900 clamp(36px,5.4vw,72px) "Nunito"}.panel p{margin:10px 0 0;color:var(--muted);font-size:clamp(18px,2vw,26px);font-weight:700}.panel.now{border-color:var(--cyan);box-shadow:0 0 35px #4ee5ff22}.panel.next{border-color:var(--gold);box-shadow:0 0 35px #ffc85718}
.roadmap{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;direction:ltr;margin:3vh auto;max-width:1120px}.stage{position:relative;min-height:220px;padding:27px 21px;border:1px solid #ffffff22;border-radius:25px;background:#ffffff09;text-align:left}.stage:first-child{border-color:var(--cyan)}.stage:nth-child(2){border-color:var(--gold)}.stage:nth-child(3){border-color:var(--purple)}.stage b{display:block;font:900 clamp(22px,2.7vw,36px) "Nunito";margin-bottom:14px}.stage span{display:block;color:var(--muted);font-size:clamp(16px,1.6vw,21px);line-height:1.55}
.quote{direction:ltr;text-align:left;margin:3vh auto 1.5vh;padding:24px 30px;max-width:1040px;border-left:5px solid var(--cyan);border-radius:0 22px 22px 0;background:#ffffff09;font:800 clamp(20px,2.4vw,32px)/1.45 "Nunito"}.answer{direction:ltr;margin:1.5vh auto;padding:17px 24px;max-width:900px;border:1px solid #ff716377;border-radius:18px;background:#ff716310;font:800 clamp(18px,2vw,27px) "Nunito"}.answer.good{border-color:#dfff5b88;background:#dfff5b0d}.question{direction:ltr;font:900 clamp(23px,2.8vw,39px) "Nunito";color:var(--cyan);margin:2.5vh auto}.tiny-label{font:900 12px "Nunito";letter-spacing:.13em;color:var(--red);margin-top:12px}.highlight{color:var(--gold);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.flow{display:flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap;direction:ltr;margin:4vh auto}.step{background:#ffffff0d;border:1px solid #ffffff2c;border-radius:22px;padding:18px 24px;font:900 clamp(19px,2.2vw,30px) "Nunito"}.flow .arrow{font-size:32px;color:var(--cyan)}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:3.5vh auto;max-width:1100px;direction:ltr}.choice{padding:23px 15px;border-bottom:4px solid var(--cyan);background:#ffffff09;border-radius:20px;font:900 clamp(19px,2vw,28px) "Nunito"}.choice:nth-child(2){border-color:var(--gold)}.choice:nth-child(3){border-color:var(--purple)}.choice:nth-child(4){border-color:var(--green)}
.requirements{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;direction:ltr;margin:4vh auto;max-width:1150px}.requirement{min-height:125px;padding:18px 11px;border:1px solid #ffffff24;border-radius:20px;background:#ffffff09;display:grid;place-items:center;font:900 clamp(17px,1.8vw,25px) "Nunito"}.upgrade{display:grid;gap:18px;direction:ltr;margin:3vh auto;max-width:1100px;text-align:left}.simple,.advanced{padding:20px 26px;border-radius:20px;font:800 clamp(20px,2.35vw,32px)/1.4 "Nunito"}.simple{border:1px solid #ffffff25;background:#ffffff08;color:var(--muted)}.advanced{border:1px solid #dfff5b77;background:#dfff5b0c;color:#fff}.advanced strong{color:var(--green)}
.grammar{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;direction:ltr;margin:3.5vh auto}.grammar span{padding:15px 21px;border:1px solid #ffffff29;border-radius:18px;background:#ffffff08;font:800 clamp(17px,1.8vw,24px) "Nunito"}.appflow{display:flex;align-items:center;justify-content:center;gap:22px;direction:ltr;margin:3.5vh auto}.appbox{min-width:260px;padding:28px;border:1px solid #ffffff25;border-radius:26px;background:#ffffff09}.appbox b{display:block;font:900 clamp(30px,4vw,54px) "Nunito"}.appbox small{display:block;color:var(--muted);font-size:18px;margin-top:8px}.appflow .arrow{font-size:46px;color:var(--gold)}
.works{display:grid;gap:13px;direction:ltr;max-width:850px;margin:3vh auto;text-align:left}.work{padding:16px 22px;border-bottom:1px solid #ffffff22;font:900 clamp(21px,2.4vw,32px) "Nunito"}.work:first-child{color:var(--gold)}.work:nth-child(2){color:var(--cyan)}
.footer{position:fixed;bottom:0;left:0;right:0;height:56px;background:#07111fee;border-top:1px solid #ffffff1b;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;z-index:20}.nav{display:flex;gap:9px;direction:ltr}.nav button{border:1px solid #ffffff2a;background:#ffffff0d;color:#fff;border-radius:13px;padding:8px 14px;font-size:18px;cursor:pointer}.nav button:disabled{opacity:.32}.progressWrap{flex:1;max-width:440px;margin:0 20px;height:7px;border-radius:999px;background:#ffffff18;overflow:hidden}.progress{height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:.3s}.counter{direction:ltr;color:var(--muted);min-width:75px}.home{position:fixed;top:16px;left:20px;z-index:30;color:#fff;text-decoration:none;background:#ffffff12;border:1px solid #ffffff24;border-radius:13px;padding:8px 12px;font-size:21px}.tracker{position:absolute;top:3vh;right:4vw;display:flex;gap:10px;direction:ltr;color:#7890a8;font:800 12px "Nunito";letter-spacing:.08em}.tracker .on{color:var(--gold)}
@media(max-width:780px){.slide{padding:70px 4vw 84px;overflow:auto}.three,.roadmap{grid-template-columns:1fr 1fr}.pillar{min-height:112px;padding:13px}.roadmap .stage:last-child{grid-column:1/-1}.stage{min-height:145px}.split{grid-template-columns:1fr}.panel{min-height:145px;padding:18px}.choices{grid-template-columns:1fr 1fr}.requirements{grid-template-columns:repeat(2,1fr)}.requirements .requirement:last-child{grid-column:1/-1}.appflow{gap:10px}.appbox{min-width:0;padding:18px}.progressWrap,.tracker{display:none}.teacher-note{left:5vw;right:5vw;bottom:59px;font-size:7px;max-height:2.6em}.quote{padding:17px 20px}.home{top:11px;left:12px}}
@media(max-height:650px){.slide{padding-top:50px;padding-bottom:82px}.title{font-size:clamp(34px,5vw,62px)}.hero{font-size:clamp(48px,8vw,94px)}.subtitle{font-size:clamp(18px,2.2vw,28px)}.teacher-note{font-size:7px}.pillar,.panel,.stage{min-height:125px;padding:16px}.quote{margin:1.5vh auto;padding:15px 22px}.flow,.choices,.requirements,.grammar{margin:2vh auto}}
</style>
</head>
<body>
<a class="home" href="../" aria-label="חזרה לספריית י״א 5 יח״ל">⌂</a>
<main class="deck" id="deck"></main>
<footer class="footer"><span class="counter" id="counter"></span><div class="progressWrap"><div class="progress" id="progress"></div></div><nav class="nav"><button id="prev" aria-label="השקף הקודם">←</button><button id="next" aria-label="השקף הבא">→</button></nav></footer>
<script>
const slides=[];
const add=(html,note,cls='')=>slides.push({html,note,cls});
const track=on=>`<div class="tracker"><span class="${on==='now'?'on':''}">MODULE E</span><span class="${on==='g'?'on':''}">G TRAINING</span><span class="${on==='next'?'on':''}">NEXT YEAR</span></div>`;

add(`<div class="content"><span class="badge">כיתה י״א · 5 יח״ל</span><div class="eyebrow" style="margin-top:3vh">THIS YEAR</div><h1 class="hero en">MODULE E</h1><p class="subtitle">חורף או קיץ — לפי הנוכחות, העבודה וההתקדמות</p></div>`,`אני מתחיל מהדבר החשוב ביותר: השנה כולכם אמורים לגשת לשאלון E. חלקכם בחורף וחלקכם בקיץ, לפי הנוכחות, העבודה הקשה וההתקדמות שתראו.`);

add(`${track('now')}<div class="content"><div class="eyebrow">HOW THE DATE IS DECIDED</div><h1 class="title">המועד נקבע לפי הדרך</h1><div class="three"><div class="pillar on"><b>נוכחות</b><small>מגיעים לכיתה</small></div><div class="pillar gold"><b>עבודה</b><small>מתרגלים ברצינות</small></div><div class="pillar green"><b>התקדמות</b><small>מראים מוכנות</small></div></div></div>`,`ההחלטה לא תתבסס על מבחן אחד. אסתכל על הדרך: האם אתם מגיעים, עובדים ומתקדמים. נוכחות היא חלק מההכנה לבגרות, לא פרט טכני.`);

add(`${track('g')}<div class="content"><div class="eyebrow">ONE YEAR · TWO LEVELS</div><h1 class="title">נבחנים ב־E — לומדים G</h1><div class="split"><div class="panel now"><strong class="cyan">E</strong><p>הבחינה השנה</p></div><div class="panel next"><strong class="accent">G</strong><p>רמת הלימוד בכיתה</p></div></div></div>`,`אף שהבחינה הקרובה היא E, רמת הלימוד בכיתה תהיה G. כך אנחנו מכינים אתכם גם לשאלון G שאליו תיגשו בחורף הבא.`);

add(`${track('g')}<div class="content"><div class="eyebrow">READING LEVEL</div><h1 class="hero en">NO E-LEVEL TEXTS</h1><p class="subtitle">האנסינים של G מכסים גם את דרישות הקריאה של E</p></div>`,`לא נעבוד על אנסינים ברמת E. מי שמסוגל להתמודד עם טקסט של G מוכן גם לדרישות של E, ולכן נתרגל כבר עכשיו ברמה הגבוהה יותר.`);

add(`${track('')}<div class="content"><div class="eyebrow">OUR TWO-YEAR MAP</div><h1 class="title">מה לומדים — ומתי נבחנים</h1><div class="roadmap"><div class="stage"><b>GRADE 11</b><span>Module E exam</span><span>G reading & writing</span><span>3 literature works</span></div><div class="stage"><b>NEXT WINTER</b><span>Module G exam</span><span>Based on this year’s preparation</span></div><div class="stage"><b>GRADE 12</b><span>COBE preparation</span><span>1 final literature work</span></div></div></div>`,`השנה ניגשים ל-E, לומדים קריאה וכתיבה של G ומסיימים שלוש יצירות. בשנה הבאה ניגשים ל-G מההכנה הזאת, ולומדים COBE ויצירה אחרונה.`);

add(`${track('g')}<div class="content"><div class="eyebrow">YOUR TESTS THIS YEAR</div><h1 class="title">שני מבנים למבחן</h1><div class="split"><div class="panel now"><strong class="en">G TEXT</strong><p class="en">+ G WRITING</p></div><div class="panel next"><strong class="en">G TEXT</strong><p class="en">+ E VOCABULARY</p></div></div><p class="subtitle">אין כתיבת E · אין טקסטים ברמת E</p></div>`,`כל מבחן יתחיל בטקסט G. לפעמים תצורף כתיבת G ולפעמים אוצר המילים של E. אין כתיבה של E, ולא יהיו טקסטים ברמת E.`);

add(`${track('g')}<div class="content"><div class="eyebrow">WHY G FEELS HARD</div><h1 class="title">הקושי אינו רק במילים</h1><h2 class="hero">מלכודות</h2><p class="subtitle">תשובה שנשמעת נכונה — מול תשובה שהטקסט באמת מוכיח</p></div>`,`טקסט G אינו קשה רק בגלל אוצר המילים. הקושי הגדול הוא להבדיל בין תשובה מפתה לבין תשובה שהטקסט באמת מוכיח. אפשר ללמוד לזהות את מבנה המלכודות.`);

add(`${track('g')}<div class="content"><div class="eyebrow">TRAP 01 · SAME WORDS</div><h1 class="title">אותן מילים ≠ אותה משמעות</h1><div class="quote">The program <span class="highlight">did not reduce pollution</span> during its first year.</div><div class="answer">The program reduced pollution.</div><div class="tiny-label">TEMPTING — BUT WRONG</div></div>`,`התשובה משתמשת באותן מילים, ולכן היא נראית מוכרת. אבל did not משנה את המשמעות. לא מחפשים התאמת מילים; בודקים את הטענה המלאה.`);

add(`${track('g')}<div class="content"><div class="eyebrow">TRAP 02 · TRUE BUT IRRELEVANT</div><h1 class="title">נכון בטקסט — לא עונה לשאלה</h1><div class="quote">Students joined because they wanted to help younger children. Meetings took place every Tuesday.</div><div class="question">Why did the students join?</div><div class="answer">Meetings took place every Tuesday.</div></div>`,`האפשרות מספרת עובדה נכונה, אבל אינה עונה על Why. לפני שבוחרים מזהים מה ביקשו: סיבה, תוצאה, מטרה, דוגמה או עמדה.`);

add(`${track('g')}<div class="content"><div class="eyebrow">TRAP 03 · ALMOST RIGHT</div><h1 class="title">מילה אחת משנה הכול</h1><div class="quote">Most participants preferred online lessons.</div><div class="split"><div class="panel now"><strong class="green en">MOST</strong><p>מה שהטקסט אומר</p></div><div class="panel next"><strong class="red en">ALL</strong><p>מה שהמסיח טוען</p></div></div></div>`,`תשובה יכולה להיות כמעט נכונה, אבל Most אינו All ו-Sometimes אינו Always. קוראים כל אפשרות עד הסוף ובודקים כל מילה.`);

add(`${track('g')}<div class="content"><div class="eyebrow">TRAP-KILLER METHOD</div><h1 class="title">לא מנחשים — מוכיחים</h1><div class="flow"><span class="step">LOCATE</span><span class="arrow">→</span><span class="step">PROVE</span><span class="arrow">→</span><span class="step">ELIMINATE</span><span class="arrow">→</span><span class="step">ANSWER</span></div><p class="subtitle">את הבוט לתרגול אפתח מהקישור שיישלח לכם</p></div>`,`קודם מאתרים את המקום בטקסט, מוצאים הוכחה, פוסלים את המסיחים ורק אז מסמנים. הבוט נועד לתרגל את התהליך הזה, לא לתת תשובות במקום התלמיד.`);

add(`${track('g')}<div class="content"><div class="eyebrow">WRITING IS DIFFERENT</div><h1 class="title">כתיבה יכולה להיות קלה</h1><h2 class="hero">אתם שולטים</h2><div class="choices"><div class="choice">YOUR IDEA</div><div class="choice">YOUR EXAMPLE</div><div class="choice">YOUR WORDS</div><div class="choice">YOUR STRUCTURE</div></div></div>`,`בניגוד לאנסין, בכתיבה אתם המחברים. אתם בוחרים רעיונות, דוגמאות, מילים ומבנים שאתם מכירים ויודעים לנסח בביטחון.`);

add(`${track('g')}<div class="content"><div class="eyebrow">TRAIN THE THINKING</div><h1 class="title">לא משננים חיבור</h1><p class="subtitle">מתמודדים עם נושאים מגוונים כדי ללמוד לגבש עמדה, נימוקים ודוגמאות</p><div class="choices"><div class="choice">TECHNOLOGY</div><div class="choice">SCHOOL</div><div class="choice">VOLUNTEERING</div><div class="choice">SOCIAL MEDIA</div></div></div>`,`נתמודד עם נושאים מגוונים כדי להרגיל את החשיבה. המטרה אינה לזכור דעה מוכנה, אלא לדעת לגבש עמדה, למצוא נימוקים ולבחור דוגמה מתאימה.`);

add(`${track('g')}<div class="content"><div class="eyebrow">G WRITING</div><h1 class="title">מה נדרש מכם?</h1><div class="requirements"><div class="requirement">CLEAR<br>OPINION</div><div class="requirement">REASONS</div><div class="requirement">EXAMPLE</div><div class="requirement">LINKING</div><div class="requirement">ACCURACY</div></div><p class="subtitle">לא רעיון גאוני — תשובה ברורה ומפותחת</p></div>`,`כתיבת G אינה דורשת רעיונות גאוניים. היא דורשת עמדה ברורה, פיתוח, דוגמה, קשר הגיוני בין המשפטים ושפה מדויקת.`);

add(`${track('g')}<div class="content"><div class="eyebrow">UPGRADE THE SENTENCE</div><h1 class="title">רעיון פשוט · ניסוח ברמת G</h1><div class="upgrade"><div class="simple">Technology makes learning more accessible. It helps students study independently.</div><div class="advanced"><strong>Not only</strong> can technology make learning more accessible, <strong>but it can also</strong> help students study independently.</div></div></div>`,`הרעיון נשאר פשוט. חיברנו שני משפטים שאנחנו יודעים לכתוב באמצעות מבנה מתקדם ובטוח. משפט G צריך להיות ברור, מדויק ומגוון, לא מלאכותי.`);

add(`${track('g')}<div class="content"><div class="eyebrow">ADVANCED GRAMMAR</div><h1 class="title">דקדוק שמשרת את הרעיון</h1><div class="grammar"><span>NOT ONLY</span><span>CONDITIONALS</span><span>PASSIVE</span><span>RELATIVE CLAUSES</span><span>LINKING WORDS</span><span>TENSE CONTROL</span></div><p class="subtitle">משתמשים רק במבנים ששולטים בהם</p></div>`,`דקדוק מתקדם אינו אוסף משפטים ארוכים. זו היכולת לבחור מבנה שמתאים לרעיון. לא משתמשים במבנה שאיננו שולטים בו.`);

const deck=document.getElementById('deck');
slides.forEach(s=>{const el=document.createElement('section');el.className=`slide ${s.cls}`;el.innerHTML=`${s.html}<div class="teacher-note">${s.note}</div>`;deck.appendChild(el)});
let index=0,wheelLock=false,touchX=0,touchY=0;
const all=[...document.querySelectorAll('.slide')];
function show(n){index=Math.max(0,Math.min(all.length-1,n));all.forEach((s,i)=>s.classList.toggle('active',i===index));counter.textContent=`${index+1} / ${all.length}`;progress.style.width=`${(index+1)/all.length*100}%`;prev.disabled=index===0;next.disabled=index===all.length-1;location.hash=`slide-${index+1}`}
prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(all.length-1)});
document.addEventListener('wheel',e=>{if(wheelLock||Math.abs(e.deltaY)<18)return;wheelLock=true;show(index+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,430)},{passive:true});
document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const dx=touchX-e.changedTouches[0].clientX,dy=touchY-e.changedTouches[0].clientY,d=Math.abs(dy)>Math.abs(dx)?dy:dx;if(Math.abs(d)>45)show(index+(d>0?1:-1))},{passive:true});
const hash=Number((location.hash.match(/slide-(\d+)/)||[])[1]);show(hash?hash-1:0);
</script>
