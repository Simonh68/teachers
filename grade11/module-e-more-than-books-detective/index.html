<script id="lesson-data" type="application/json">{"title":"MORE THAN JUST BOOKS","paras":[{"title":"The idea and the survey","he":"הרעיון והסקר","scope":"Paragraph I · printed lines 1–6","text":"When Daniel Morris suggested converting an unused room at Greenfield's central bus station into a small library, the proposal was met with considerable doubt. The station was noisy, and previous attempts to make it more welcoming had attracted little public interest. Nevertheless, Daniel questioned the assumption that residents were simply unwilling to read. A survey of 250 people supported his view: although nearly 60 percent expressed a desire to read more frequently, many claimed they lacked the time. Interestingly, these same residents reported spending an average of 25 minutes a day waiting for public transportation.","anchors":["the proposal was met with considerable doubt","nearly 60 percent expressed a desire to read more frequently","an average of 25 minutes a day waiting"],"explain":"הכותב מציג ספק ביחס לרעיון, ואז סתירה לכאורה: אנשים רוצים לקרוא, אבל טוענים שאין להם זמן. זמן ההמתנה היומי מסביר מדוע דווקא תחנת האוטובוס עשויה להתאים."},{"title":"Conditional approval","he":"אישור מותנה","scope":"Paragraph II · printed lines 7–11","text":"Despite these findings, the local council was reluctant to approve the proposal. Some members feared that books would be stolen or damaged, while others doubted whether volunteers could maintain the library without professional assistance. Rather than ignoring these objections, Daniel recommended a six-month trial funded mainly through donations. The council eventually agreed, on the condition that the project's results would be evaluated before any additional support was considered.","anchors":["reluctant to approve the proposal","a six-month trial","on the condition that the project's results would be evaluated"],"explain":"המועצה לא השתכנעה לגמרי. היא מאפשרת ניסיון זמני ותבחן תוצאות לפני תמיכה נוספת. ההבדל בין אישור מלא לאישור מותנה הוא המפתח."},{"title":"Numbers are not proof","he":"נתון אינו הוכחה","scope":"Paragraph III · printed lines 12–16","text":"The library opened with 300 books, which passengers could borrow without registering, leaving a deposit, or providing identification. Within three months, more than 700 books had been borrowed, and approximately 85 percent were returned within four weeks. Although these results initially appeared encouraging, they raised an important question about how success should be measured. Several council members argued that borrowing figures alone could not establish whether the project had actually increased reading.","anchors":["more than 700 books had been borrowed","approximately 85 percent were returned within four weeks","borrowing figures alone could not establish"],"explain":"700 השאלות הן לא בהכרח 700 תלמידים או קוראים. 85% חזרה בתוך ארבעה שבועות אינה הוכחה שאנשים קראו. צריך להפריד בין השתתפות בפעילות לבין השגת המטרה."},{"title":"A different kind of success","he":"הצלחה מסוג אחר","scope":"Paragraph IV · printed lines 17–23","text":"A follow-up survey produced a less straightforward picture. While about half of the regular visitors reported reading more frequently, others admitted that they mainly used the library as a place to meet people or escape the noise of the station. Daniel maintained that this unexpected development should not be regarded as a failure. He argued that the value of a public space could extend beyond its original purpose. Nevertheless, practical difficulties remained: rain damaged several books, and residents criticized the limited selection of titles in other languages. Volunteers addressed both problems but discovered that obtaining donated books was easier than ensuring that the collection reflected the community's needs.","anchors":["about half of the regular visitors reported reading more frequently","a place to meet people","the value of a public space could extend beyond its original purpose","obtaining donated books was easier than ensuring"],"explain":"שני קווי טיעון: התועלת החברתית החדשה היא הצלחה בפני עצמה, אבל גם כמות גדולה של תרומות אינה מבטיחה שהספרים מתאימים לקוראים."},{"title":"What makes it work?","he":"מה גורם להצלחה?","scope":"Paragraph V · printed lines 24–28","text":"A year later, two neighboring towns announced plans to establish similar libraries. Although Daniel welcomed their interest, he cautioned against assuming that reproducing the original design would lead to equally successful results. In his view, the project's most significant achievement depended neither on its modest budget nor on the number of books available, but on the willingness of residents to take responsibility for a shared space. Ultimately, the experiment suggested that meaningful improvements in public life may require a change in attitudes rather than substantial financial investment.","anchors":["reproducing the original design would lead to equally successful results","neither on its modest budget nor on the number of books","willingness of residents to take responsibility"],"explain":"המסר: אי אפשר להבטיח הצלחה באמצעות העתקת החדר או קניית עוד ספרים. הצלחה תלויה בנכונות להשתתף ובצרכים המקומיים."}],"questions":[{"n":1,"p":0,"type":"mc","he":"מה תפקיד המידע בפסקת הפתיחה?","stem":"What is the main purpose of the information given in paragraph I?","options":["To explain why earlier attempts to improve the station had failed.","To present the circumstances that made the proposal seem unlikely to succeed.","To show that the station's main problem was its limited space.","To suggest that passengers were becoming less interested in reading."],"correct":1,"evidence":"the proposal was met with considerable doubt ... previous attempts ... had attracted little public interest.","model":"b — The information establishes why Daniel's proposal initially appeared unlikely to succeed.","trap":["a: Previous attempts are mentioned, but their exact reasons for failure are not explained.","c: Limited space is not identified as the station's problem.","d: The survey suggests interest in reading, not declining interest."],"heTrap":"מלכודת המטרה: פרטים אמיתיים מהפסקה אינם בהכרח מטרת הפסקה.","rubric":"10 points only for the correct option."},{"n":2,"p":0,"type":"open","he":"איזה שני ממצאים בסקר מצדיקים ספרייה בתחנה?","stem":"Explain how TWO findings from the first survey supported the proposal.","evidence":"nearly 60 percent expressed a desire to read more ... many claimed they lacked the time ... average of 25 minutes a day waiting","model":"Many residents wanted to read more but said they lacked time. They also spent about 25 minutes a day waiting for buses, which created a chance to read.","trap":["Incomplete: '60% wanted to read' — does not explain the time problem.","Wrong: '250 people supported the idea' — 250 is the sample size, not the number of supporters.","Wrong: 'People already read for 25 minutes' — they WAITED, not read."],"heTrap":"מלכודת שני הרכיבים: 60% + מחסור בזמן; 25 דקות המתנה + אפשרות לקרוא.","rubric":"5 points: desire to read despite lack of time. 5 points: existing daily waiting time can be used for reading."},{"n":3,"p":1,"type":"open","he":"מה מגלה אישור לשישה חודשים על עמדת המועצה?","stem":"What does the council's decision to approve only a six-month trial suggest about its attitude? Support your answer with information from paragraph II.","evidence":"reluctant ... six-month trial ... on the condition that the project's results would be evaluated","model":"The council remained cautious and uncertain. It wanted to evaluate the six-month trial before offering any further support.","trap":["Wrong: 'The council fully supported Daniel' — approval was conditional.","Incomplete: 'It was a six-month trial' — reports the fact but does not interpret the attitude.","Wrong: 'The council rejected the proposal' — it approved a trial."],"heTrap":"מלכודת שינוי עמדה: אישור מוגבל אינו הבעת אמון מלאה.","rubric":"5 points: caution or doubt. 5 points: specific evidence about trial and review before further support."},{"n":4,"p":2,"type":"open","he":"איך אותם מספרים מאפשרים שתי מסקנות שונות?","stem":"Explain why the borrowing figures in paragraph III could support TWO different conclusions about the project's success.","evidence":"more than 700 books had been borrowed ... 85 percent were returned ... borrowing figures alone could not establish whether ... increased reading","model":"The figures suggest that the library attracted borrowers and books were returned. However, they do not prove that people read the books or started reading more.","trap":["Wrong: '700 people read books' — 700 loans are not 700 people.","Wrong: '85% read their books' — 85% refers to return within four weeks.","Incomplete: 'The statistics were good' — does not state the negative/limited inference."],"heTrap":"מלכודת נתון–מסקנה: השאלה דורשת פרשנות חיובית והסתייגות, לא רק ציטוט מספרים.","rubric":"5 points: participation/return figures suggest success. 5 points: figures cannot establish actual increase in reading."},{"n":5,"p":3,"type":"open","he":"למה הממצא שלא כולם קוראים יותר עדיין מעודד?","stem":"Why did Daniel consider the follow-up survey encouraging, even though it did not fully support the original purpose of the project?","evidence":"others ... used the library as a place to meet people ... value of a public space could extend beyond its original purpose","model":"Not everyone read more, but the library brought people together and made the station more welcoming. Daniel valued this social benefit even though it was not the original goal.","trap":["Wrong: 'Everyone read more' — only about half reported reading more.","Wrong: 'The original goal was abandoned' — additional value does not erase the original goal.","Incomplete: 'People met friends' — explain why Daniel viewed it positively."],"heTrap":"מלכודת מטרה מול תוצאה: צריך לציין גם תועלת חברתית וגם את ההערכה של דניאל.","rubric":"5 points: unexpected social benefit. 5 points: it can count as success beyond encouraging reading."},{"n":6,"p":3,"type":"open","he":"מה ההבדל בין השגת תרומות להתאמה לצרכים?","stem":"What did the volunteers discover about the difficulty of improving the collection? Answer according to paragraph IV.","evidence":"obtaining donated books was easier than ensuring that the collection reflected the community's needs","model":"They found it easier to collect donated books than to find books suitable for the people who used the library, including books in other languages.","trap":["Wrong focus: 'Rain damaged the books' — true elsewhere, but not the lesson about the collection.","Incomplete: 'They needed more books' — quantity alone is not the point.","Wrong: 'Nobody donated books' — donations were easier to obtain."],"heTrap":"מלכודת מענה לשאלה אחרת: גשם הוא פרט אמיתי, אבל השאלה על איכות והתאמת האוסף.","rubric":"10 points: explains the comparison. 7: suitability only. 5: language shortage without the broader point."},{"n":7,"p":4,"type":"mc","he":"מהו המסר המרכזי של המאמר כולו?","stem":"Which conclusion is best supported by the text as a whole?","options":["The value of a community project may depend on both practical achievements and local needs.","Successful local projects should be copied only when sufficient financial support is available.","Community projects should give greater importance to social interaction than to their original goals.","Projects that depend on volunteers are usually more successful than those managed by public authorities."],"correct":0,"evidence":"the willingness of residents to take responsibility for a shared space ... change in attitudes rather than substantial financial investment","model":"a — A project succeeds through practical results and the extent to which it responds to its community's needs.","trap":["b: Overstates the importance of money; Daniel explicitly stresses people over budget.","c: The text values social interaction but does not say it must always outrank original goals.","d: The text never compares all volunteer projects with all publicly managed projects."],"heTrap":"מלכודת הכללה: תשובה שלמה צריכה לכסות את הטקסט ולא לקבוע כלל שלא נכתב.","rubric":"10 points only for the correct option."}],"vocabulary":[{"n":8,"p":0,"items":["a characteristic","an analysis","a chance","a critic","advertising","a consequence"],"definitions":["a result of an action or decision","a detailed examination of information or a situation","a typical quality of a person or thing"],"keys":[6,2,1],"he":"תוצאה / ניתוח / תכונה","trap":"consequence ≠ chance (תוצאה לעומת הזדמנות). critic הוא אדם שמבקר; analysis הוא תהליך של ניתוח."},{"n":9,"p":1,"items":["current","complicated","professional","advanced","considerable","common"],"definitions":["having many parts and difficult to understand","large or important in amount or degree","happening or existing at the present time"],"keys":[2,5,1],"he":"מורכב / ניכר / עכשווי","trap":"current ≠ common (עכשווי לעומת נפוץ). considerable מתאר היקף משמעותי, לא רמה מתקדמת."},{"n":10,"p":2,"items":["to decrease","to perform","to conduct","to prevent","to emphasize","to recommend"],"definitions":["to stop something from happening","to make something smaller or less in amount","to suggest that someone should do or use something"],"keys":[4,1,6],"he":"למנוע / להפחית / להמליץ","trap":"prevent = למנוע; decrease = להפחית. recommend = להמליץ; emphasize = להדגיש."},{"n":11,"p":3,"items":["a purpose","a profession","pollution","a population","a policy","a priority"],"definitions":["a set of rules or principles used by an organization","the reason for doing something","all the people living in a particular area"],"keys":[5,1,4],"he":"מדיניות / מטרה / אוכלוסייה","trap":"purpose ≠ priority; population ≠ pollution; policy ≠ profession."},{"n":12,"p":4,"items":["efficient","reliable","effective","specific","rare","relevant"],"definitions":["producing the result that was wanted","able to be trusted or depended on","connected to the subject being discussed"],"keys":[3,2,6],"he":"יעיל בהשגת מטרה / אמין / רלוונטי","trap":"effective = משיג את התוצאה הרצויה; efficient = משיג אותה עם מעט זמן או משאבים. reliable ≠ relevant."}],"glossary":{"proposal":"הצעה","considerable":"ניכר / משמעותי","doubt":"ספק","assumption":"הנחה","survey":"סקר","residents":"תושבים","reluctant":"מהסס","approve":"לאשר","objections":"התנגדויות","trial":"ניסיון","donations":"תרומות","evaluated":"נבחן / הוערך","deposit":"פיקדון","approximately":"בערך","encouraging":"מעודד","establish":"לבסס / להוכיח","follow-up":"מעקב","straightforward":"פשוט וברור","maintained":"טען / עמד על כך","original":"מקורי","volunteers":"מתנדבים","reflected":"שיקף","collection":"אוסף","cautioned":"הזהיר","reproducing":"להעתיק / לשחזר","willingness":"נכונות","substantial":"משמעותי","financial":"כספי","investment":"השקעה","success":"הצלחה","evidence":"ראיות"}}</script>
<script>
(function(){
'use strict';
const d=JSON.parse(document.getElementById('lesson-data').textContent);
const metadata=JSON.parse(document.getElementById('version-data').textContent);
const versions=metadata.versions;
let version='A';
function vt(value){
 const v=versions[version],first=v.person.split(' ')[0];
 return String(value||'').replaceAll('Daniel Morris',v.person).replaceAll('Daniel',first).replaceAll('Greenfield',v.town);
}
function examQuestion(q){
 const v=versions[version];
 return q.options?Object.assign({},q,{options:v.mc[q.n].options,correct:v.mc[q.n].correct}):q;
}
function examVocabulary(q){
 const v=versions[version].vocab[q.n];
 return Object.assign({},q,{items:v.items,definitions:v.definitions,keys:v.keys});
}
function modelFor(q){
 if(!q.options)return vt(q.model);
 const letter=String.fromCharCode(97+versions[version].mc[q.n].correct);
 return letter+' — '+vt(q.model.replace(/^[a-d]\s+[—–-]\s+/i,''));
}
function trapsFor(q){
 return q.trap.map(x=>String(x).replace(/^[a-d]:\s*/i,''));
}

const E=id=>document.getElementById(id);const stage=E('stage');const slides=[];
const tr=x=>String(x||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
slides.push({type:'intro'}, {type:'map'});
d.paras.forEach((p,i)=>{
 slides.push({type:'read',p:i},{type:'focus',p:i});
 d.questions.filter(q=>q.p===i).forEach(q=>{
   slides.push({type:'grammar',q:q.n},{type:'question',q:q.n});
   if(q.type==='open')slides.push({type:'build',q:q.n});
 });
 d.vocabulary.filter(q=>q.p===i).forEach(v=>slides.push({type:'vocab',q:v.n}));
});
slides.push({type:'summary'}, {type:'exit'});
let index=0,reveal=0,utt=null,spoken=false,activeWords=[],bubbleTimeout=null;
// Pedagogical phrase-by-phrase reading: one short utterance at a time.
// The whole phrase stays highlighted; a single word glows when word boundaries are supported.
let readingState=null,readingToken=0;
function stopAudio(){
 readingToken++;
 if(readingState?.timer)clearTimeout(readingState.timer);
 readingState=null;
 if('speechSynthesis' in window)window.speechSynthesis.cancel();
 utt=null;spoken=false;
 activeWords.forEach(w=>w.classList.remove('now','inChunk'));
 activeWords=[];
 if(E('pause'))E('pause').textContent='⏸ השהה';
}
function prepareWords(t){
 const re=/\S+/g;let m,html='',pos=0;
 while((m=re.exec(t))!==null){
   html+=tr(t.slice(pos,m.index));
   const token=m[0],clean=token.toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g,'');
   const tip=d.glossary[clean]||'';
   html+='<span class="word" data-offset="'+m.index+'" '+(tip?'tabindex="0" data-tip="'+tr(tip)+'"':'')+'>'+tr(token)+'</span>';
   pos=m.index+token.length;
 }
 return html+tr(t.slice(pos));
}
function showTip(text){
 if(!text)return;
 const tip=E('tip');tip.textContent=text;tip.style.display='block';
 clearTimeout(bubbleTimeout);bubbleTimeout=setTimeout(()=>tip.style.display='none',3200);
}
stage.addEventListener('click',e=>{const t=e.target.closest('[data-tip]');if(t)showTip(t.getAttribute('data-tip'))});
stage.addEventListener('focusin',e=>{const t=e.target.closest('[data-tip]');if(t)showTip(t.getAttribute('data-tip'))});
function voiceForEnglish(){
 const voices=window.speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));
 return voices.find(v=>/david|guy|ryan|male|daniel|aaron|andrew|christopher/i.test(v.name))||
        voices.find(v=>/en-US/i.test(v.lang))||voices[0]||null;
}
function splitIntoTeachingChunks(text){
 const words=[...text.matchAll(/\S+/g)].map(m=>({text:m[0],start:m.index,end:m.index+m[0].length}));
 if(!words.length)return [];
 const chunks=[];let begin=0;
 for(let i=0;i<words.length;i++){
   const count=i-begin+1,word=words[i].text,next=words[i+1]?.text||'';
   const sentenceEnd=/[.!?]["')\]]?$/.test(word);
   const clauseEnd=/[,;:]["')\]]?$/.test(word);
   const nextConnector=/^(although|however|nevertheless|because|while|whereas|but|which|who|when|if|despite|rather|therefore|before|after|on)$/i.test(next);
   const end=sentenceEnd||(count>=4&&clauseEnd)||(count>=5&&nextConnector)||count>=10||i===words.length-1;
   if(!end)continue;
   const part=words.slice(begin,i+1),start=part[0].start,finish=part[part.length-1].end;
   chunks.push({
     text:text.slice(start,finish),
     start,end:finish,
     wordStart:begin,wordEnd:i+1,
     pauseMs:sentenceEnd?1150:clauseEnd?750:600
   });
   begin=i+1;
 }
 return chunks;
}
function highlightTeachingChunk(chunk,wordIndex=-1){
 activeWords.forEach((w,i)=>{
   w.classList.toggle('inChunk',i>=chunk.wordStart&&i<chunk.wordEnd);
   w.classList.toggle('now',i===wordIndex);
 });
}
function updateReadingStatus(text){
 const el=E('chunkStatus');if(el)el.textContent=text;
}
function scheduleNextTeachingChunk(wait){
 const state=readingState;if(!state)return;
 state.waitRemaining=wait;
 if(state.paused)return;
 state.waitStarted=Date.now();
 state.timer=setTimeout(()=>{
   if(readingState!==state||state.paused)return;
   state.timer=null;state.waitRemaining=0;
   speakTeachingChunk();
 },wait);
}
function speakTeachingChunk(){
 const state=readingState;if(!state||state.paused)return;
 if(state.index>=state.chunks.length){
   updateReadingStatus('✓ ההקראה הסתיימה. אפשר לחזור על הפסקה.');
   activeWords.forEach(w=>w.classList.remove('now','inChunk'));
   spoken=false;readingState=null;return;
 }
 const chunk=state.chunks[state.index],token=readingToken;
 state.lastSpokenIndex=state.index;
 highlightTeachingChunk(chunk);
 updateReadingStatus('🔊 חלק '+(state.index+1)+' מתוך '+state.chunks.length+' · '+chunk.text);
 const utterance=new SpeechSynthesisUtterance(chunk.text);
 utt=utterance;utterance.lang='en-US';
 utterance.rate=Number(E('speed').value);utterance.pitch=.95;
 const voice=voiceForEnglish();if(voice)utterance.voice=voice;
 utterance.onstart=()=>{
   if(token!==readingToken||readingState!==state)return;
   highlightTeachingChunk(chunk);
 };
 utterance.onboundary=e=>{
   if(token!==readingToken||readingState!==state)return;
   if(e.name&&e.name!=='word')return;
   const char=e.charIndex,fullOffset=chunk.start+char;
   let found=chunk.wordStart;
   for(let j=chunk.wordStart;j<chunk.wordEnd;j++){
     if(Number(activeWords[j]?.dataset.offset)<=fullOffset)found=j;
     else break;
   }
   highlightTeachingChunk(chunk,found);
 };
 utterance.onend=()=>{
   if(token!==readingToken||readingState!==state)return;
   highlightTeachingChunk(chunk);
   state.index++;
   if(state.index>=state.chunks.length){
     updateReadingStatus('✓ סיימנו את הפסקה · '+state.chunks.length+' קטעי קריאה');
     activeWords.forEach(w=>w.classList.remove('now','inChunk'));
     spoken=false;readingState=null;return;
   }
   updateReadingStatus('⏳ הפסקה לחשיבה · החלק הבא יואר מיד');
   scheduleNextTeachingChunk(chunk.pauseMs);
 };
 utterance.onerror=e=>{
   if(token!==readingToken||readingState!==state)return;
   if(e.error==='interrupted'||e.error==='canceled')return;
   stopAudio();showTip('ההקראה אינה זמינה כרגע בדפדפן');
 };
 window.speechSynthesis.speak(utterance);
}
function playAudio(startAt=0){
 const s=slides[index];
 if(s.type!=='read'||!('speechSynthesis' in window)){
   showTip('הקראה זמינה רק בשקופית של פסקה ובדפדפן התומך בקול');return;
 }
 stopAudio();
 const text=vt(d.paras[s.p].text);
 activeWords=Array.from(stage.querySelectorAll('.word'));
 const chunks=splitIntoTeachingChunks(text);
 readingState={chunks,index:Math.max(0,Math.min(chunks.length-1,Number(startAt)||0)),paused:false,timer:null,waitRemaining:0,waitStarted:0};
 spoken=true;
 speakTeachingChunk();
}
function pauseAudio(){
 const state=readingState;if(!state||!('speechSynthesis' in window))return;
 if(!state.paused){
   state.paused=true;
   if(state.timer){
     clearTimeout(state.timer);state.timer=null;
     state.waitRemaining=Math.max(0,state.waitRemaining-(Date.now()-state.waitStarted));
   }
   if(window.speechSynthesis.speaking)window.speechSynthesis.pause();
   E('pause').textContent='▶ המשך';
   updateReadingStatus('⏸ מושהה · לחצו להמשך. החלק המואר נשאר על המסך.');
 }else{
   state.paused=false;
   E('pause').textContent='⏸ השהה';
   if(window.speechSynthesis.paused)window.speechSynthesis.resume();
   else if(state.waitRemaining>0)scheduleNextTeachingChunk(state.waitRemaining);
   else speakTeachingChunk();
 }
}
function repeatTeachingChunk(){
 if(slides[index].type!=='read')return;
 const state=readingState;
 const part=state?Math.max(0,state.lastSpokenIndex??state.index):0;
 playAudio(part);
}
function goto(n){stopAudio();index=Math.max(0,Math.min(slides.length-1,n));reveal=0;render();stage.scrollTop=0}
function advance(){const s=slides[index],max=s.type==='question'?3:s.type==='vocab'?2:s.type==='grammar'?3:s.type==='build'?3:0;if(reveal<max){reveal++;render();stage.scrollTop=0}else goto(index+1)}
function opening(s){return '<div class="eyebrow">MODULE E · פותרים את המבחן בכיתה</div><h1 class="enTitle">MORE THAN<br>JUST BOOKS</h1><p class="lead">פסקה אחת → הבנת הרעיון → שאלות → מלכודות → תשובה מלאה.</p><div class="grid3"><div class="card big">5 פסקאות מוקראות</div><div class="card big">7 שאלות הבנה</div><div class="card big">5 שאלות אוצר מילים</div></div><p class="medium muted">גרסה נבחרת: '+version+'. כל גרסאות A–D מופיעות עם סדר האפשרויות המדויק של המבחן. סרקו את קוד ה־QR בתחילת המצגת כדי לשלוט מהטלפון.</p>'}
function mapSlide(){return '<div class="eyebrow">SENTENCE DETECTIVE · THE METHOD</div><h2>מהשאלה — לראיה — לפתרון</h2><div class="grid3"><div class="card big">1 · קראו את השאלה וסמנו מילות מפתח</div><div class="card big">2 · מצאו משפט ראיה בפסקה</div><div class="card big">3 · מצאו את ראש הצירוף (Head Noun)</div><div class="card big">4 · זהו את הפועל המרכזי ואת מילת הקישור</div><div class="card big">5 · בדקו מסיחים והסתייגויות</div><div class="card big">6 · בנו תשובה באנגלית ורק אז חשפו פתרון</div></div><p class="medium gold">הצבעים הם כלי עזר — לא כלל דקדוקי מכני. משפטים מורכבים דורשים זיהוי של פסוקיות, לא רק של המילים בין הנושא לפועל.</p>'}
function paragraphSlide(s){const p=d.paras[s.p];return '<div class="eyebrow">'+tr(p.scope)+' · הקראה ועקיבה</div><h2 class="enTitle">'+tr(p.title)+'</h2><div class="para" lang="en">'+prepareWords(vt(p.text))+'</div><div class="chunkStatus" id="chunkStatus" aria-live="polite">🔊 ההקראה מחולקת לקטעים קצרים. לחצו ▶ להתחלה.</div><p class="readingNote">כל קטע מואר בזמן ההקראה; בין חלקי המשפט יש הפסקות ללמידה. אפשר להשהות או לחזור על הקטע. לחצו על מילה לקבלת תרגום.</p>'}
function focusSlide(s){const p=d.paras[s.p];return '<div class="eyebrow">'+tr(p.scope)+' · לפני השאלות</div><h2>מה צריך לסמן?</h2>'+p.anchors.map((x,i)=>'<div class="evidence en"><span class="gold">'+(i+1)+'.</span> '+tr(vt(x))+'</div>').join('')+'<div class="card medium">'+tr(p.explain)+'</div>'}

const grammarData={"1":{"question":"Find the subject and the passive verb. What does the phrase 'with considerable doubt' add?","segments":[["the proposal","n"],[" was met","v"],[" with considerable doubt","m"]],"explain":"the proposal = הנושא; was met = סביל (passive). with considerable doubt = אופן התגובה. המידע יוצר ציפייה לכישלון, לא מסביר מדוע כל ניסיון קודם נכשל.","head":"proposal","verb":"was met","cue":"with considerable doubt"},"2":{"question":"Two findings: identify the contrast and the verb in each clause.","segments":[["although","c"],[" nearly 60 percent","n"],[" expressed","v"],[" a desire to read more frequently","o"],[", many","n"],[" claimed","v"],[" they lacked the time","o"]],"explain":"although מסמן ניגוד: רוצים לקרוא אך טוענים שאין זמן. נתון נוסף: כ־25 דקות המתנה ביום. 250 הוא גודל המדגם, לא מספר התומכים.","head":"percent / many","verb":"expressed / claimed","cue":"although"},"3":{"question":"Which part shows approval? Which part makes it conditional?","segments":[["The council","n"],[" eventually agreed","v"],[", on the condition that","c"],[" the project's results","n"],[" would be evaluated","v"],[" before","c"],[" any additional support","n"],[" was considered","v"]],"explain":"הפועל agreed אינו שקול לאישור מלא: on the condition that + before הופכים אותו לאישור מותנה בבדיקה.","head":"council / results","verb":"agreed / would be evaluated","cue":"on the condition that / before"},"4":{"question":"What can the numbers NOT establish? Find the negation and the clause it controls.","segments":[["borrowing figures alone","n"],[" could not establish","v"],[" whether","c"],[" the project","n"],[" had actually increased","v"],[" reading","o"]],"explain":"could not establish = אי אפשר להסיק. '700 books borrowed' מתאר השאלות, לא 700 קוראים; 85% מתייחס להחזרת ספרים, לא לקריאה.","head":"figures","verb":"could not establish","cue":"whether / not"},"5":{"question":"What is the HEAD NOUN in 'the value of a public space'?","segments":[["the value","n"],[" of a public space","m"],[" could extend","v"],[" beyond its original purpose","o"]],"explain":"ראש הצירוף הוא value, לא space. could extend = עשוי לחרוג. לכן שימוש חברתי הוא תועלת נוספת, גם אם לא כולם קראו יותר.","head":"value","verb":"could extend","cue":"beyond"},"6":{"question":"Find the comparison: what was easier, and what was harder?","segments":[["obtaining donated books","n"],[" was","v"],[" easier than","c"],[" ensuring that the collection reflected the community's needs","o"]],"explain":"הנושא הוא פעולה (obtaining). ההשוואה easier than מחייבת שני צדדים: לקבל ספרים היה קל יותר מאשר להתאים אותם לצורכי הקהילה.","head":"obtaining","verb":"was","cue":"easier than"},"7":{"question":"Track the contrast: neither ... nor ... but ... What mattered MOST?","segments":[["the project's most significant achievement","n"],[" depended","v"],[" neither on its modest budget","c"],[" nor on the number of books available","c"],[", but on the willingness of residents","o"],[" to take responsibility for a shared space","m"]],"explain":"הנושא הוא achievement, לא budget. מבנה neither...nor...but מדגיש שהגורם המרכזי הוא נכונות התושבים לקחת אחריות, לא הכסף או מספר הספרים.","head":"achievement","verb":"depended","cue":"neither ... nor ... but"}};
function grammarSlide(s){
 const g=grammarData[s.q],q=d.questions.find(x=>x.n===s.q);
 const colors=g.segments.map(function(part){
   const role=part[1],paint=reveal>=2||(reveal>=1&&(role==='n'||role==='v'));
   return '<span class="part '+(paint?role:'')+'">'+tr(vt(part[0]))+'</span>';
 }).join('');
 let out='<div class="eyebrow">SENTENCE DETECTIVE · QUESTION '+s.q+' · GRAMMAR LAB</div>';
 out+='<h2>מי עושה מה — ומה הקשר בין חלקי המשפט?</h2>';
 out+='<div class="grammarSentence" lang="en">'+colors+'</div>';
 out+='<div class="diagnostic en">'+tr(g.question)+'</div>';
 if(reveal>=1)out+='<div class="legend"><span class="n">SUBJECT / HEAD NOUN</span><span class="v">MAIN VERB / VERB PHRASE</span></div><div class="card medium">ראש הצירוף: <b class="gold">'+tr(g.head)+'</b> · פועל: <b class="gold">'+tr(g.verb)+'</b></div>';
 if(reveal>=2)out+='<div class="legend"><span class="n">NOUN PHRASE</span><span class="v">VERB</span><span class="c">CONNECTOR / LOGIC</span><span class="m">MODIFIER</span><span class="o">COMPLEMENT</span></div><div class="card medium">סמן הקשר: <b class="gold">'+tr(g.cue)+'</b></div>';
 if(reveal>=3)out+='<div class="grammarTip">'+tr(g.explain)+'</div>';
 return out;
}
function buildSlide(s){
 const q=d.questions.find(x=>x.n===s.q),g=grammarData[s.q];
 let out='<div class="eyebrow">QUESTION '+q.n+' · ANSWER BUILDER · 10 POINTS</div>';
 out+='<h2 class="en" lang="en">'+tr(vt(q.stem))+'</h2>';
 out+='<div class="card big">נסו לנסח תשובה בשני חלקים: <b class="gold">ראיה מן הטקסט + מסקנה מדויקת.</b></div>';
 if(reveal>=1)out+='<div class="evidence en"><b class="gold">KEYWORDS · </b>'+tr(vt(q.evidence))+'</div>';
 if(reveal>=2)out+='<div class="answer"><div class="sectionLabel">MODEL ANSWER</div><div class="en">'+tr(vt(q.model))+'</div><p class="medium">'+tr(q.rubric)+'</p></div>';
 if(reveal>=3)out+='<div class="sectionLabel">CHECK YOUR ANSWER</div><div class="traps">'+trapsFor(q).map(x=>'<div class="trap">'+tr(vt(x))+'</div>').join('')+'</div>';
 return out;
}

function questionSlide(s){
 const raw=d.questions.find(x=>x.n===s.q),q=examQuestion(raw),correct=String.fromCharCode(97+q.correct);
 let html='<div class="eyebrow">QUESTION '+q.n+' · 10 POINTS · VERSION '+version+' · '+tr(d.paras[q.p].scope)+'</div>';
 html+='<h2 class="en" lang="en">'+tr(vt(q.stem))+'</h2><p class="medium gold">'+tr(q.he)+'</p>';
 if(q.options){
   html+='<div class="options">'+q.options.map((v,i)=>'<div class="option"><span class="letter">'+String.fromCharCode(97+i)+'.</span><span>'+tr(vt(v))+'</span></div>').join('')+'</div>';
 }else{
   html+='<div class="card big">לפני חשיפת התשובה: נסחו תשובה קצרה באנגלית. <span class="muted">האם יש שני חלקים? האם הראיה מדויקת?</span></div>';
 }
 if(reveal>=1)html+='<div class="evidence en"><b class="gold">EVIDENCE · </b>'+tr(vt(q.evidence))+'</div>';
 if(reveal>=2){
   html+='<div class="sectionLabel">מלכודות · למה תשובה חלקית אינה מספיקה?</div><div class="traps">'+trapsFor(q).map(x=>'<div class="trap">'+tr(vt(x))+'</div>').join('')+'</div>';
   html+='<p class="medium gold">'+tr(q.heTrap)+'</p>';
 }
 if(reveal>=3){
   html+='<div class="answer"><div class="sectionLabel">פתרון גרסה '+version+(q.options?' · ANSWER '+correct.toUpperCase():'')+'</div><div class="en" lang="en">'+tr(modelFor(q))+'</div><p class="medium">'+tr(q.rubric)+'</p></div>';
 }
 return html;
}
const vocabChoices={};
stage.addEventListener('change',function(event){
 const el=event.target;
 if(!el.matches('select[data-vocab-question]'))return;
 const q=Number(el.dataset.vocabQuestion),i=Number(el.dataset.def);
 if(!vocabChoices[q])vocabChoices[q]=['','',''];
 vocabChoices[q][i]=el.value;
});
function vocabSlide(s){
 const raw=d.vocabulary.find(x=>x.n===s.q),v=examVocabulary(raw),answers=vocabChoices[v.n]||['','',''];
 let html='<div class="eyebrow">LEXICAL KNOWLEDGE · QUESTION '+v.n+' · 6 POINTS · VERSION '+version+'</div>';
 html+='<h2>שש מילים · שלוש הגדרות</h2><p class="medium gold">בחרו מספר לכל הגדרה. לכל התאמה נכונה 2 נקודות. סדר המילים מתאים בדיוק לגרסה '+version+'.</p>';
 html+='<div class="vocabGrid"><div class="card"><div class="sectionLabel">WORD BANK</div>';
 html+=v.items.map((x,i)=>'<div class="vocabItem">'+(i+1)+'. '+tr(x)+'</div>').join('');
 html+='</div><div class="card"><div class="sectionLabel">DEFINITIONS</div>';
 html+=v.definitions.map((x,i)=>{
   let options='<option value="">—</option>';
   for(let n=1;n<=6;n++)options+='<option value="'+n+'" '+(String(answers[i])===String(n)?'selected':'')+'>'+n+'</option>';
   const select='<select aria-label="Definition '+(i+1)+' match" data-vocab-question="'+v.n+'" data-def="'+i+'" '+(reveal>=2?'disabled':'')+'>'+options+'</select>';
   return '<div class="definition">'+String.fromCharCode(65+i)+'. '+tr(x)+'<div class="small">'+select+(reveal>=2?' <b class="green">✓ '+v.keys[i]+'</b>':'')+'</div></div>';
 }).join('');
 html+='</div></div>';
 if(reveal>=1)html+='<div class="card big">רמז בעברית: '+tr(v.he)+'. חפשו התאמה מדויקת, לא מילה שנראית דומה.</div>';
 if(reveal>=2){
   const score=answers.filter((x,i)=>String(x)===String(v.keys[i])).length*2;
   html+='<div class="answer medium"><b>Answer key: '+v.keys.join(' · ')+'</b><p>'+tr(v.trap)+'</p><p>ההתאמות שסימנתם: '+score+' / 6 נקודות (אם סימנתם את שלושתן).</p></div>';
 }
 return html;
}

function summary(){return '<div class="eyebrow">מה למדתם?</div><h2>שש מלכודות שאסור ליפול בהן</h2><div class="grid2"><div class="card big">1 · מטרה של פסקה ≠ פרט בפסקה</div><div class="card big">2 · מדגם של 250 ≠ 250 תומכים</div><div class="card big">3 · אישור מותנה ≠ אישור מלא</div><div class="card big">4 · 700 השאלות ≠ 700 קוראים</div><div class="card big">5 · תועלת בלתי צפויה ≠ ביטול המטרה המקורית</div><div class="card big">6 · כמות תרומות ≠ התאמה לצרכים</div></div>'}
function exit(){return '<div class="eyebrow">EXIT TICKET · 3 MINUTES</div><h2>האם הייתם מקבלים 10 נקודות?</h2><div class="evidence en">The library was successful because 700 people read books and everyone agreed that the project worked.</div><p class="lead">מצאו שתי טעויות במשפט. תקנו אותו באנגלית בשני משפטים קצרים.</p>'+(reveal?'<div class="answer medium en">700 books were borrowed, but the figures do not prove that 700 different people read them. Some council members questioned whether borrowing figures showed increased reading.</div>':'<div class="card big">לתשובה — לחצו שוב על גלו רמז / פתרון.</div>')}
function render(){
 const s=slides[index];let body;
 if(s.type==='intro')body=opening(s);
 else if(s.type==='map')body=mapSlide();
 else if(s.type==='read')body=paragraphSlide(s);
 else if(s.type==='focus')body=focusSlide(s);
 else if(s.type==='grammar')body=grammarSlide(s);
 else if(s.type==='question')body=questionSlide(s);
 else if(s.type==='build')body=buildSlide(s);
 else if(s.type==='vocab')body=vocabSlide(s);
 else if(s.type==='summary')body=summary();
 else body=exit();
 stage.innerHTML='<section class="slide">'+body+'</section>';
 E('counter').textContent=(index+1)+' / '+slides.length;
 E('bar').style.width=((index+1)*100/slides.length)+'%';
 E('play').disabled=s.type!=='read';
 E('pause').disabled=s.type!=='read';
 E('repeatPart').disabled=s.type!=='read';
 E('prev').disabled=index===0;
 E('next').disabled=index===slides.length-1;
 const max=s.type==='grammar'?3:s.type==='question'?3:s.type==='build'?3:s.type==='vocab'?2:s.type==='exit'?1:0;
 E('reveal').disabled=reveal>=max;
 E('reveal').textContent=s.type==='grammar'?['1 · מי ופועל','2 · צבעי הקשרים','3 · הסבר המשפט','✓ הניתוח הושלם'][reveal]:
 s.type==='question'?['1 · גלו ראיה','2 · חשפו מלכודות','3 · פתרון מלא','✓ התשובה הוצגה'][reveal]:
 s.type==='build'?['1 · מילות מפתח','2 · תשובה לדוגמה','3 · בדיקת מלכודות','✓ סיימנו'][reveal]:
 s.type==='vocab'?['1 · רמז','2 · מפתח התשובות','✓ סיימנו'][reveal]:
 s.type==='exit'?'הראו תיקון':'גלו רמז / פתרון';
}
E('prev').onclick=()=>goto(index-1);
E('next').onclick=()=>goto(index+1);
E('reveal').onclick=()=>{
 const s=slides[index],max=s.type==='grammar'?3:s.type==='question'?3:s.type==='build'?3:s.type==='vocab'?2:s.type==='exit'?1:0;
 if(reveal<max){reveal++;render();stage.scrollTop=0}
};
E('play').onclick=()=>playAudio();E('pause').onclick=pauseAudio;E('repeatPart').onclick=repeatTeachingChunk;
E('versionSelect').onchange=e=>{
 stopAudio();version=e.target.value;reveal=0;
 Object.keys(vocabChoices).forEach(k=>delete vocabChoices[k]);
 render();stage.scrollTop=0;
 const url=new URL(location.href);
 url.searchParams.set('version',version);
 if(location.protocol!=='file:')history.replaceState(null,'',url.href);
};
const urlVersion=new URLSearchParams(location.search).get('version');
if(urlVersion&&versions[urlVersion]){version=urlVersion;E('versionSelect').value=version}
// Native vertical swipe on the slide itself, including when opened directly
// on a phone without pairing. Swipe UP advances, swipe DOWN goes back.
// The stage scroll is deliberately suppressed only for a deliberate gesture.
let slideTouch=null;
let lastSwipeAt=0;
stage.addEventListener('touchstart',e=>{
 if(e.touches.length!==1||e.target.closest('select,input,textarea,button,a')){
   slideTouch=null;return;
 }
 const t=e.touches[0];
 slideTouch={x:t.clientX,y:t.clientY};
},{passive:true});
stage.addEventListener('touchmove',e=>{
 if(!slideTouch||e.touches.length!==1)return;
 const t=e.touches[0],dx=t.clientX-slideTouch.x,dy=t.clientY-slideTouch.y;
 if(Math.abs(dy)>18&&Math.abs(dy)>Math.abs(dx)*1.15&&e.cancelable)e.preventDefault();
},{passive:false});
stage.addEventListener('touchend',e=>{
 const start=slideTouch;slideTouch=null;
 if(!start||e.changedTouches.length!==1)return;
 const t=e.changedTouches[0],dx=t.clientX-start.x,dy=t.clientY-start.y;
 if(Math.abs(dy)<48||Math.abs(dy)<Math.abs(dx)*1.2)return;
 if(Date.now()-lastSwipeAt<320)return;
 lastSwipeAt=Date.now();
 if(e.cancelable)e.preventDefault();
 goto(index+(dy<0?1:-1));
},{passive:false});
stage.addEventListener('touchcancel',()=>{slideTouch=null;},{passive:true});
document.addEventListener('keydown',e=>{
 if(e.target.closest('button,select,input,textarea,a')||e.altKey||e.ctrlKey||e.metaKey)return;
 if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();goto(index+1)}
 else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();goto(index-1)}
 else if(e.key==='Enter'||e.code==='Space'){
   e.preventDefault();
   const s=slides[index],max=s.type==='grammar'?3:s.type==='question'?3:s.type==='build'?3:s.type==='vocab'?2:s.type==='exit'?1:0;
   if(reveal<max){reveal++;render();stage.scrollTop=0}
 }
});
window.addEventListener('beforeunload',stopAudio);render();
})();
