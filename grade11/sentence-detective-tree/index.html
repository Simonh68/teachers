<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentence Detective · Grade 11</title><style>*{box-sizing:border-box}body{margin:0;background:#071324;color:#f2f7ff;font:20px Arial,sans-serif}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:clamp(34px,5vw,64px)}h2{font-size:clamp(27px,4vw,48px)}p{line-height:1.5}button,a{cursor:pointer}button{border:1px solid #4b728e;border-radius:14px;padding:14px 20px;background:#16334b;color:white;font-size:18px}button:hover{background:#245474}.top{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.branch{border:1px solid #35516b;border-radius:20px;padding:20px;background:#10243b}.branch button{width:100%;text-align:right}.muted{color:#a9bed3}.en{direction:ltr;text-align:left;font-family:Arial,sans-serif}.sentence{font-size:clamp(28px,4vw,52px);line-height:1.4;padding:28px;background:#122b46;border-radius:20px}.blue{color:#86baff}.orange{color:#ffb17d}.green{color:#8af0b0}.slide{min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:20px}.question{border-right:5px solid #ffdc79;padding:18px;background:#172e46}.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:24px}label{display:block;font-size:16px;margin-top:12px}input{width:20px;height:20px}small{font-size:15px}.hidden{display:none}.tag{color:#8edaff;font-size:15px;font-weight:bold}@media(max-width:600px){main{padding:15px}.sentence{padding:18px}}</style><main><nav class="top"><button onclick="home()">⌂ דף הבית</button><a href="../five-units/" style="color:#a9e7ff">כיתה י״א</a><button onclick="speak()">🔊 Read aloud</button></nav><div id="app"></div></main><script>const S=[["The sudden increase in energy prices has affected many families.","The sudden increase in energy prices","has affected","many families","Present perfect: a past change with present relevance.","What has affected many families?","The sudden increase in energy prices.","העלייה הפתאומית במחירי האנרגיה."],["The decision to reduce costs affected the quality of the service.","The decision to reduce costs","affected","the quality of the service","Infinitive after a noun: to reduce costs describes the decision.","What does 'to reduce costs' describe?","The decision.","את ההחלטה."],["Students who receive regular feedback often improve their performance.","Students who receive regular feedback","improve","their performance","Relative clause: who receive regular feedback describes students.","Which students often improve?","Students who receive regular feedback.","תלמידים שמקבלים משוב קבוע."],["The information collected during the study was published last month.","The information collected during the study","was published","last month","Reduced relative clause: collected during the study modifies information.","Was the information collected or published last month?","It was published last month; the collection date is unknown.","המידע פורסם בחודש שעבר; זמן איסופו אינו ידוע."],["Learning a foreign language requires patience and regular practice.","Learning a foreign language","requires","patience and regular practice","Gerund phrase as subject: learning is the head of the subject phrase.","What requires patience?","Learning a foreign language.","לימוד שפה זרה."],["Although the task seemed difficult, most students completed it successfully.","most students","completed","it successfully","Although introduces a concession clause, not the main clause.","Did the difficulty prevent completion?","No. Most students completed the task.","לא. רוב התלמידים השלימו את המשימה."],["The new policy, which was introduced last year, has improved working conditions.","The new policy","has improved","working conditions","Non-defining relative clause adds information; main verb: has improved.","What has improved working conditions?","The new policy.","המדיניות החדשה."],["The results may have been influenced by factors that researchers did not consider.","The results","may have been influenced","by factors that researchers did not consider","Modal perfect passive expresses uncertainty about a past influence.","Is the influence certain?","No. May have been expresses possibility.","לא. מדובר באפשרות ולא בוודאות."],["The more time teenagers spend online, the less time they have for physical activity.","the more time teenagers spend online","the less time they have","for physical activity","Correlative comparison: the more ... the less.","What happens when online time increases?","Time for physical activity decreases.","הזמן לפעילות גופנית פוחת."],["The measures introduced last year have reduced costs, although their long-term effects remain unclear.","The measures introduced last year","have reduced","costs","Reduced relative clause, present perfect and concession work together.","What is known and what is uncertain?","Costs have decreased; long-term effects remain unclear.","העלויות פחתו; ההשפעות ארוכות הטווח אינן ברורות."]],B=["Sentence Structure","Verb Tenses","Complex Sentences","Passive Voice","Conditionals","Logical Connections","Modal Verbs","Verb Patterns","Advanced Structures","Mixed Challenges"];let branch=-1,item=0,slide=0,reveal=false;const app=document.getElementById('app');const key='sentence-detective-progress-v1';let marks=JSON.parse(localStorage.getItem(key)||'{}');function save(){localStorage.setItem(key,JSON.stringify(marks))}function home(){branch=-1;render()}function choose(b){branch=b;item=0;slide=0;reveal=false;render()}function go(i){item=i;slide=0;reveal=false;render()}function step(n){slide=Math.max(0,Math.min(5,slide+n));reveal=false;render()}function speak(){let x=S[item];if(!x||branch!==0)return;let u=new SpeechSynthesisUtterance(x[0]);u.lang='en-US';u.rate=.75;speechSynthesis.cancel();speechSynthesis.speak(u)}function toggle(k,v){marks[branch+'-'+k]=v;save();render()}function render(){if(branch<0){app.innerHTML='<h1>Sentence Detective</h1><p>100 Sentences · 10 Branches · Grade 11 E/G</p><p class="muted">ענף 1 פעיל: 10 משפטים ו־60 שקפי למידה. יתר הענפים בפיתוח.</p><div class="grid">'+B.map((b,i)=>'<div class="branch"><div class="tag">BRANCH '+(i+1)+'</div><h3>'+b+'</h3><p class="muted">10 sentences</p><button '+(i?'disabled style="opacity:.45"':'')+' onclick="choose('+i+')">'+(i?'בקרוב':'פתח ענף ←')+'</button>'+(i===0?['קראתי','השתמשתי','למדתי'].map((k,j)=>'<label><input type="checkbox" '+(marks[i+'-'+j]?'checked':'')+' onchange="toggle('+j+',this.checked)"> '+k+'</label>').join(''):'')+'</div>').join('')+'</div>';return}let x=S[item];let content='';if(slide===0)content='<p class="muted">Read. What is the main idea? נסו להבין לפני התרגום.</p>';if(slide===1)content='<h2>Find the skeleton</h2><p>Which words form the subject? Which verb carries the main action?</p>'+(reveal?'<p class="en"><span class="blue">'+x[1]+'</span> · <span class="orange">'+x[2]+'</span> · <span class="green">'+x[3]+'</span></p>':'');if(slide===2)content='<h2>Open the sentence</h2><p>Subject → Main verb → Object / Complement</p>'+(reveal?'<div class="en"><p class="blue">Subject: '+x[1]+'</p><p class="orange">Verb: '+x[2]+'</p><p class="green">Remaining information: '+x[3]+'</p></div>':'');if(slide===3)content='<h2>Grammar Secret</h2>'+(reveal?'<p>'+x[4]+'</p>':'<p>What grammatical structure changes the meaning?</p>');if(slide===4)content='<h2>Exam Challenge</h2><div class="question"><p class="en">'+x[5]+'</p><p>ענו באנגלית והסבירו את הרמז שבמשפט.</p></div>';if(slide===5)content='<h2>Prove your answer</h2><div class="question"><p class="en">'+x[5]+'</p></div>'+(reveal?'<p class="en">'+x[6]+'</p><p>'+x[7]+'</p>':'');app.innerHTML='<p class="tag">BRANCH 1 · SENTENCE '+(item+1)+'/10 · SLIDE '+(slide+1)+'/6</p><div class="top"><button onclick="home()">חזרה לדף הבית</button><button onclick="branch=0;item=-1;render()">רשימת משפטים</button></div>'+(item===-1?'<h2>Choose a sentence</h2>'+S.map((a,i)=>'<p><button onclick="go('+i+')">'+(i+1)+'. '+a[0]+'</button></p>').join(''):'<div class="slide"><div class="sentence en">'+x[0]+'</div>'+content+'</div><div class="actions"><button onclick="step(-1)" '+(!slide?'disabled':'')+'>→ הקודם</button>'+([1,2,3,5].includes(slide)?'<button onclick="reveal=!reveal;render()">'+(reveal?'הסתר':'גלה בהדרגה')+'</button>':'')+'<button onclick="step(1)" '+(slide===5?'disabled':'')+'>הבא ←</button><button onclick="go((item+1)%10)">המשפט הבא</button></div>')}function dummy(){} }home();</script></html>
