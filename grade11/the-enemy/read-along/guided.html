const PARTS=[{"title":"The stranger on the shore","sub":"Part 1","icon":"🌊","theme":"Duty or compassion?","vocab":[["coast","חוף ים","The doctor's home stands near the coast."],["wounded","פצוע","A wounded stranger appears on the beach."],["dilemma","התלבטות קשה","Sadao faces a serious dilemma."]],"story":[["Sadao is a Japanese surgeon who lives with his wife, Hana, near the sea.","סדאו הוא מנתח יפני שמתגורר עם אשתו האנה ליד הים."],["His father taught him to work hard and to serve his country.","אביו לימד אותו לעבוד קשה ולשרת את ארצו."],["Sadao studied medicine in America, where he met Hana.","סדאו למד רפואה באמריקה, ושם פגש את האנה."],["During the war, Sadao remains in Japan because an important General needs him.","במהלך המלחמה סדאו נשאר ביפן כי גנרל חשוב זקוק לו."],["One evening, the couple sees a wounded man coming out of the sea.","ערב אחד בני הזוג רואים אדם פצוע יוצא מן הים."],["They discover that the stranger is an American sailor.","הם מגלים שהזר הוא מלח אמריקאי."],["If they hide him, the authorities may punish their whole family.","אם יסתירו אותו, הרשויות עלולות להעניש את כל משפחתם."],["They cannot leave a helpless human being to die, so they bring him home.","הם אינם מסוגלים להפקיר אדם חסר ישע למוות, ולכן הם מביאים אותו הביתה."]],"questions":[["Where did Sadao study medicine?","Think of the country where he met Hana.","He studied medicine in America."],["Why does Sadao remain in Japan during the war?","One powerful patient depends on him.","The General needs Sadao's medical skills."],["How do Sadao and Hana identify the stranger?","Look at his military identity.","They realize that he is an American sailor."],["What could happen if they hide him?","Think about the wartime authorities.","The family could be punished for helping an enemy."],["Why do they take the man home?","Compare the danger with the man's condition.","They decide that saving his life is more important than leaving him to die."],["What is the central dilemma in Part 1?","Two duties seem to disagree.","Sadao must choose between loyalty to his country and responsibility to a wounded person."]]},{"title":"The operation","sub":"Part 2","icon":"🩺","theme":"A doctor must act","vocab":[["operate","לנתח","Sadao decides to operate on the sailor."],["refuse","לסרב","Yumi refuses to wash the stranger."],["anesthetic","חומר הרדמה","Hana helps give an anesthetic during surgery."]],"story":[["Sadao and Hana carry the weak sailor into a room in their house.","סדאו והאנה נושאים את המלח החלש אל חדר בביתם."],["Yumi, the servant, refuses to wash the American prisoner.","יומי, המשרתת, מסרבת לרחוץ את השבוי האמריקאי."],["Hana washes him herself although she feels afraid and uncomfortable.","האנה רוחצת אותו בעצמה אף שהיא מפחדת וחשה אי־נוחות."],["Sadao decides to operate because the wound is dangerous.","סדאו מחליט לנתח משום שהפציעה מסוכנת."],["Hana feels sick when she sees blood and has to leave the room.","האנה חשה בחילה כשהיא רואה דם ונאלצת לצאת מן החדר."],["She returns and continues helping her husband with the operation.","היא חוזרת וממשיכה לעזור לבעלה בניתוח."],["Sadao removes the bullet and works carefully to save the young man's life.","סדאו מוציא את הקליע ופועל בזהירות כדי להציל את חייו של הצעיר."],["The operation succeeds, but the couple's danger is far from over.","הניתוח מצליח, אך הסכנה לבני הזוג רחוקה מלהסתיים."]],"questions":[["Why does Hana wash the sailor?","Yumi has already made a decision.","Yumi refuses, so Hana washes the man herself."],["Why must Sadao operate quickly?","Consider the wounded man's condition.","The wound is serious and the man may die without surgery."],["Why does Hana leave the room?","Remember how she reacts to the operation.","She feels sick when she sees the blood."],["What does Hana do after leaving the room?","Her help is not finished.","She returns to help Sadao."],["What does Sadao remove during surgery?","Something caused the wound.","He removes a bullet."],["What does Sadao's behavior reveal about him?","Compare the role of doctor and citizen.","He follows his responsibility as a doctor even when the patient is an enemy."]]},{"title":"A patient and a prisoner","sub":"Part 3","icon":"🏡","theme":"Fear inside the house","vocab":[["terrified","מבועת","Tom is terrified when he wakes up."],["servants","משרתים","The servants object to keeping the prisoner."],["authorities","רשויות","Sadao considers telling the authorities."]],"story":[["The American wakes up and realizes that he is inside a Japanese home.","האמריקאי מתעורר ומבין שהוא נמצא בבית יפני."],["He is terrified because he does not know what his hosts will do.","הוא מבועת משום שאינו יודע מה מארחיו יעשו."],["Hana brings him food and tries to comfort him.","האנה מביאה לו אוכל ומנסה להרגיע אותו."],["The young man becomes stronger, and Hana learns that his name is Tom.","הצעיר מתחזק, והאנה לומדת ששמו טום."],["The servants believe that protecting an enemy is dangerous and disloyal.","המשרתים מאמינים שהגנה על אויב מסוכנת ואינה נאמנה למדינה."],["They leave the household because they disagree with Sadao's decision.","הם עוזבים את הבית משום שהם מתנגדים להחלטתו של סדאו."],["Sadao considers reporting Tom to the authorities, but he hesitates.","סדאו שוקל לדווח על טום לרשויות, אך מהסס."],["He feels trapped between his duty to his country and his care for his patient.","הוא חש לכוד בין חובתו לארצו לבין הדאגה למטופל שלו."]],"questions":[["How does Tom feel when he wakes up?","He does not know whether he is safe.","He is terrified."],["How does Hana treat Tom?","Think of food and comfort.","She feeds him and tries to comfort him."],["Why do the servants leave?","They oppose the family's decision.","They think helping an American enemy is wrong and dangerous."],["What does Sadao consider doing?","He could inform officials.","He considers reporting Tom to the authorities."],["Why does Sadao hesitate?","His duties seem to clash.","He wants to obey the law but also feels responsible for Tom's life."],["How has Tom's role changed?","He came as a stranger.","He is still an enemy prisoner, but he has also become Sadao's patient."]]},{"title":"The General's promise","sub":"Part 4","icon":"🕯️","theme":"Power, fear and choice","vocab":[["indispensable","חיוני, שאין לו תחליף","The General believes Sadao is indispensable."],["assassins","מתנקשים","The General promises to send assassins."],["signal","לאותת","Tom will use a flashlight to send a signal."]],"story":[["Sadao tells the General that he has saved an American prisoner.","סדאו מספר לגנרל שהציל שבוי אמריקאי."],["The General depends on Sadao and does not want to lose his surgeon.","הגנרל תלוי בסדאו ואינו רוצה לאבד את המנתח שלו."],["He promises to send men to kill the prisoner secretly.","הוא מבטיח לשלוח אנשים שיהרגו את השבוי בסתר."],["Sadao waits anxiously each night, but the men never arrive.","סדאו ממתין בדאגה מדי לילה, אבל האנשים אינם מגיעים."],["He finally decides that he must help Tom escape from the house.","לבסוף הוא מחליט שעליו לעזור לטום לברוח מן הבית."],["Sadao prepares a small boat with food, water and warm clothes.","סדאו מכין סירה קטנה ובה אוכל, מים ובגדים חמים."],["He explains how Tom can reach an island and wait for a fishing boat.","הוא מסביר כיצד טום יוכל להגיע לאי ולהמתין לסירת דיג."],["He also gives Tom a flashlight and explains how to send a signal if he needs help.","הוא גם נותן לטום פנס ומסביר כיצד לאותת אם יזדקק לעזרה."]],"questions":[["Why does the General protect Sadao?","Who will treat him if Sadao disappears?","He needs Sadao as his doctor."],["What does the General promise to arrange?","He offers a secret violent solution.","He promises to send assassins to kill the prisoner."],["Do the assassins arrive?","Think of Sadao's sleepless nights.","No, they do not arrive."],["How does Sadao decide to solve the problem?","He chooses escape rather than death.","He helps Tom escape."],["What does Sadao put in the boat?","Tom must survive at sea.","He puts food, water and other supplies in the boat."],["Why does Tom receive a flashlight?","It is a way to communicate from far away.","He can signal to Sadao if he needs more help."]]},{"title":"After the escape","sub":"Part 5","icon":"🌅","theme":"Who is the enemy?","vocab":[["escape","להימלט","Tom escapes by sea."],["confess","להודות","The General admits that he forgot the plan."],["prejudice","דעה קדומה","Sadao begins to question his prejudice."]],"story":[["Tom leaves by sea, and Sadao watches the distant island.","טום יוצא אל הים, וסדאו משקיף אל האי הרחוק."],["The servants return when they believe the American is gone.","המשרתים חוזרים כשהם מאמינים שהאמריקאי איננו."],["Later, Sadao tells the General that the prisoner escaped.","מאוחר יותר סדאו מספר לגנרל שהשבוי נמלט."],["The General admits that he forgot to send the assassins.","הגנרל מודה ששכח לשלוח את המתנקשים."],["He is worried that other people may misunderstand what happened.","הוא חושש שאנשים אחרים יבינו לא נכון את מה שקרה."],["Sadao does not see a signal from the island and hopes Tom has reached safety.","סדאו אינו רואה אות מן האי ומקווה שטום הגיע למקום בטוח."],["He remembers how many reasons he once had for disliking Americans.","הוא נזכר בכמה סיבות היו לו בעבר לא לאהוב אמריקאים."],["His choice to save Tom raises a deeper question: what makes a person an enemy?","בחירתו להציל את טום מעלה שאלה עמוקה יותר: מה הופך אדם לאויב?"]],"questions":[["Why do the servants return?","The foreign sailor is no longer in the home.","They believe that the danger has ended."],["What does the General admit?","His secret plan was not carried out.","He forgot to send the assassins."],["What worries the General now?","Think about his reputation.","He fears that people may interpret his failure as helping the enemy."],["What does Sadao hope when no signal appears?","Tom should no longer need help.","He hopes that Tom has escaped safely."],["How does Sadao's view of Americans become more complicated?","Tom was both an enemy and a patient.","Sadao can no longer think of every American as simply an enemy."],["What central idea does the title invite us to question?","Think about national labels and individual people.","The story asks whether compassion can overcome wartime prejudice."]]}];
const slides=[],starts=[];
function add(p,s){slides.push({part:p,...s})}
PARTS.forEach((p,i)=>{
 starts.push(slides.length);
 add(i,{kind:'cover',category:p.sub.toUpperCase(),line:p.title,he:p.theme,read:false});
 p.vocab.forEach(v=>{
  add(i,{kind:'word',category:'VOCABULARY',line:v[0],he:'',hint:v[2],read:true});
  add(i,{kind:'word-translation',category:'VOCABULARY',line:v[0],he:v[1],hint:v[2],read:true});
 });
 p.story.forEach(v=>{
  add(i,{kind:'sentence',category:'THE STORY · ADAPTED READING',line:v[0],he:'',read:true});
  add(i,{kind:'translation',category:'THE STORY · ADAPTED READING',line:v[0],he:v[1],read:true});
 });
 p.questions.forEach(v=>{
  add(i,{kind:'question',category:'THINK ABOUT THE STORY',line:v[0],he:'',hint:v[1],read:true});
  add(i,{kind:'answer',category:'POSSIBLE ANSWER',line:v[2],he:'',read:true});
 });
});
let n=0,timer=null,utterance=null,activated=false,playing=false,wordSpans=[],wordOffsets=[],touchY=null;
const $=id=>document.getElementById(id);
const chapters=$('chapters');PARTS.forEach((p,i)=>{let op=document.createElement('option');op.textContent='Part '+(i+1)+' · '+p.title;op.value=i;chapters.append(op)});
function stop(){if(timer){clearTimeout(timer);timer=null}if('speechSynthesis'in window)speechSynthesis.cancel();utterance=null;playing=false;$('play').textContent='▶';wordSpans.forEach(el=>el.classList.remove('active'))}
function renderWords(text){const root=$('sentence');root.replaceChildren();wordOffsets=[];wordSpans=[];let m,re=/\S+/g;while((m=re.exec(text))!==null){let sp=document.createElement('span');sp.className='word';sp.textContent=m[0];root.append(sp,document.createTextNode(' '));wordSpans.push(sp);wordOffsets.push(m.index)}}
function highlight(i){wordSpans.forEach((sp,k)=>sp.classList.toggle('active',k===i))}
function indexForChar(charIndex){let ans=0;for(let k=0;k<wordOffsets.length;k++){if(wordOffsets[k]<=charIndex)ans=k;else break}return ans}
function voice(){const voices=speechSynthesis.getVoices();return voices.find(v=>/^en/i.test(v.lang)&&/Natural|Enhanced|Premium|Google US/i.test(v.name))||voices.find(v=>/^en-US$/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null}
function speak(){if(originalReady){if(originalAudio.paused)originalAudio.play().catch(()=>{});else originalAudio.pause();return;}if(!('speechSynthesis'in window))return;const s=slides[n];if(!s.read)return;stop();playing=true;$('play').textContent='Ⅱ';let u=new SpeechSynthesisUtterance(s.line);utterance=u;u.lang='en-US';u.rate=.75;u.pitch=1;u.voice=voice();u.onboundary=e=>{if(utterance!==u)return;if(e.name==='word'||typeof e.charIndex==='number')highlight(indexForChar(e.charIndex))};u.onend=()=>{if(utterance===u){playing=false;$('play').textContent='▶';highlight(-1);utterance=null}};u.onerror=()=>{if(utterance===u){playing=false;$('play').textContent='▶';utterance=null}};speechSynthesis.speak(u)}
function paint(){stop();const s=slides[n],p=PARTS[s.part];$('category').textContent=s.category;$('title').textContent=s.kind==='cover'?s.line:'';renderWords(s.kind==='cover'?'':s.line);$('he').textContent=s.he||'';$('hint').textContent='';$('star').hidden=!s.hint;$('count').textContent=(n+1)+' / '+slides.length;$('prev').disabled=n===0;$('next').disabled=n===slides.length-1;$('chapters').value=String(s.part);$('scene').textContent=p.icon;$('theme').textContent=p.theme;$('fill').style.width=((n+1)/slides.length*100)+'%';if(!originalReady&&activated&&s.read)timer=setTimeout(speak,4000)}
function move(d){activated=true;n=Math.max(0,Math.min(slides.length-1,n+d));paint()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('star').onclick=()=>{$('hint').textContent=$('hint').textContent?'':slides[n].hint};
$('chapters').onchange=e=>{activated=true;n=starts[Number(e.target.value)];paint()};
$('play').onclick=()=>{activated=true;if(playing)stop();else speak()};
window.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)&&!['SELECT','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();move(['ArrowDown','ArrowRight'].includes(e.key)?1:-1)}});
window.addEventListener('touchstart',e=>{touchY=e.changedTouches[0].clientY},{passive:true});
window.addEventListener('touchend',e=>{if(touchY===null)return;const d=touchY-e.changedTouches[0].clientY;touchY=null;if(Math.abs(d)>65)move(d>0?1:-1)},{passive:true});
window.addEventListener('pagehide',stop);
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{};
const q=new URLSearchParams(location.search),part=Number(q.get('part'));if(Number.isInteger(part)&&part>=1&&part<=5)n=starts[part-1];

let originalReady=false, originalURL=null;
const originalAudio=$('originalRecording'), originalCuts=[0,658.5265,1580.048,2176.3205,2938.238];
$('originalFile').addEventListener('change',e=>{
 const file=e.target.files&&e.target.files[0];if(!file)return;
 if(originalURL)URL.revokeObjectURL(originalURL);
 originalURL=URL.createObjectURL(file);originalAudio.pause();originalAudio.src=originalURL;
 originalReady=true;stop();activated=true;
 originalAudio.addEventListener('loadedmetadata',()=>{
  const target=originalCuts[slides[n].part]||0;
  originalAudio.currentTime=Math.min(target,Math.max(0,originalAudio.duration-1));
 },{once:true});
 $('audioStatus').textContent='Original audio loaded locally. The chapter buttons seek to the recorded transitions. These slides use adapted text.';
});
chapters.addEventListener('change',e=>{
 if(originalReady){originalAudio.currentTime=originalCuts[Number(e.target.value)]||0;}
});
originalAudio.addEventListener('play',()=>{$('play').textContent='Ⅱ'});
originalAudio.addEventListener('pause',()=>{$('play').textContent='▶'});

paint();</script></body></html>
