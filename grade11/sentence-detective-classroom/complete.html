<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentence Detective · 100 Sentences</title><style>*{box-sizing:border-box}body{margin:0;background:#071522;color:#f5f8ff;font-family:Arial,sans-serif}main{max-width:1300px;margin:auto;padding:20px}.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{cursor:pointer;background:#19364c;border:1px solid #63819c;color:white;border-radius:12px;padding:13px 18px;font:600 18px Arial}button:disabled{opacity:.3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{background:#10263a;border:1px solid #2d5168;border-radius:18px;padding:20px}.card button{width:100%}h1{font-size:clamp(34px,5vw,60px)}h2{font-size:clamp(25px,3vw,42px)}.frame{min-height:65vh;display:flex;flex-direction:column;justify-content:center;gap:22px}.sentence{direction:ltr;text-align:left;width:fit-content;max-width:100%;margin:0 auto;font-size:clamp(29px,4vw,55px);line-height:1.4;font-weight:700}.panel{padding:20px;background:#142e45;border-radius:16px;font-size:clamp(20px,2.3vw,31px)}.en{direction:ltr;text-align:left}.blue{color:#93c5fd}.orange{color:#ffad73}.green{color:#a7f3d0}.muted{color:#a9c0d2}.footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}label{display:block;margin:12px 0}input{width:22px;height:22px}.tiny{font-size:15px;color:#aac0d1}@media(max-width:600px){main{padding:12px}.frame{min-height:68vh}.sentence{font-size:30px}}</style><main><div class="nav"><button onclick="home()">⌂ דף הבית</button><button onclick="menu()">☷ משפטים בענף</button><button onclick="speak()">🔊 הקראה</button><span id="count" class="muted"></span></div><div id="app"></div><div class="footer" id="footer"></div></main><script>const DETAIL=[["What increased?","מה עלה?","Energy prices increased.","מחירי האנרגיה עלו.","sudden increase in energy prices","The sudden increase in energy prices","has affected","many families"],["What was the decision about?","במה עסקה ההחלטה?","Reducing costs; the sentence does not establish whether costs were actually reduced.","ההחלטה עסקה בהפחתת עלויות; לא נאמר שהן אכן הופחתו.","decision to reduce costs","The decision to reduce costs","affected","the quality of the service"],["Which students often improve?","אילו תלמידים משתפרים לעיתים קרובות?","Students who receive regular feedback.","תלמידים שמקבלים משוב קבוע.","who receive regular feedback","Students who receive regular feedback","often improve","their performance"],["What happened last month?","מה התרחש בחודש שעבר?","The information was published; its collection date is not specified.","המידע פורסם; מועד איסופו אינו מצוין.","was published last month","The information collected during the study","was published","last month"],["What requires patience?","מה דורש סבלנות?","Learning a foreign language, not merely knowing one.","לימוד שפה זרה, ולא עצם ידיעתה.","Learning a foreign language","Learning a foreign language","requires","patience and regular practice"],["Did the difficulty stop completion?","האם הקושי מנע השלמת המשימה?","No. Most students completed it successfully despite the difficulty.","לא. רוב התלמידים השלימו אותה למרות הקושי.","Although the task seemed difficult","most students","completed","it successfully"],["Which policy improved conditions?","איזו מדיניות שיפרה את התנאים?","The new policy, introduced last year.","המדיניות החדשה שהונהגה בשנה שעברה.","The new policy, which was introduced last year","The new policy","has improved","working conditions"],["Is the influence certain?","האם ההשפעה ודאית?","No. May have been influenced indicates a possibility about the past.","לא. המבנה מציין אפשרות לגבי העבר.","may have been influenced","The results","may have been influenced","by factors that researchers did not consider"],["What happens as online time increases?","מה קורה כאשר זמן הגלישה גדל?","Time available for physical activity decreases.","הזמן הפנוי לפעילות גופנית פוחת.","The more time ... the less time","The more time teenagers spend online","the less time they have","for physical activity"],["What is known, and what is unclear?","מה ידוע ומה עדיין לא ברור?","Costs have fallen, but the long-term effects remain unclear.","העלויות פחתו, אך ההשפעות לטווח הארוך אינן ברורות.","have reduced costs, although ... remain unclear","The measures introduced last year","have reduced","costs"]];const G=[["Sentence Structure",["The sudden increase in energy prices has affected many families.","The decision to reduce costs affected the quality of the service.","Students who receive regular feedback often improve their performance.","The information collected during the study was published last month.","Learning a foreign language requires patience and regular practice.","Although the task seemed difficult, most students completed it successfully.","The new policy, which was introduced last year, has improved working conditions.","The results may have been influenced by factors that researchers did not consider.","The more time teenagers spend online, the less time they have for physical activity.","The measures introduced last year have reduced costs, although their long-term effects remain unclear."]],["Verb Tenses",["Scientists have discovered several ways to reduce air pollution.","The company introduced a new policy last year.","Researchers have been studying the problem for several years.","By the time we arrived, the meeting had already begun.","The number of online courses is increasing rapidly.","The school usually organizes activities during the holidays.","When the alarm rang, the students were taking a test.","By next summer, the team will have completed the project.","The results will be available next week.","She had never visited the city before she moved there."]],["Complex Sentences",["People who exercise regularly often report better sleep.","The report that the committee published raised new questions.","What the researchers discovered surprised the public.","The teacher explained why the answer was incorrect.","Although the journey was long, everyone enjoyed it.","The place where the meeting took place was difficult to find.","I believe that the proposal deserves careful consideration.","The students stayed indoors because the weather became dangerous.","Whenever the system fails, users receive a warning.","The question is whether the new method will succeed."]],["Passive Voice",["The new bridge was built to reduce traffic.","Several changes have been recommended by experts.","The applications will be reviewed next month.","The missing documents were found yesterday.","Students are encouraged to ask questions.","The results are being checked carefully.","The decision had been made before the meeting began.","The instructions must be followed exactly.","The device can be operated remotely.","The information provided online should be verified."]],["Conditionals",["If water reaches zero degrees Celsius, it freezes.","If the weather improves, we will continue the trip.","If I had more time, I would learn another language.","If they had checked the figures, they would have noticed the mistake.","Unless you save the file, your changes may disappear.","Even if the price falls, demand may remain low.","Provided that everyone agrees, the plan can begin.","If she were the manager, she would change the schedule.","If the company had invested earlier, it might be more successful now.","Should you need assistance, contact the office."]],["Logical Connections",["Although the task was difficult, the team completed it.","Because demand increased, prices rose.","The road was closed; therefore, we took another route.","Despite the warning, several visitors entered the area.","The device is expensive; however, it is easy to use.","The program was designed to improve access to education.","As a result of heavy rain, the event was postponed.","While some people prefer cities, others enjoy rural life.","The instructions were clear; nevertheless, mistakes occurred.","In order to save energy, the school installed new lights."]],["Modal Verbs",["The results might indicate a serious problem.","Students must submit their work by Friday.","You should consider another solution.","The researcher may have overlooked an important detail.","They cannot have finished the project already.","The team could solve the problem with better equipment.","Visitors are not allowed to enter this area.","She must have misunderstood the instructions.","We ought to examine the evidence carefully.","The system should have warned users earlier."]],["Verb Patterns",["Many students enjoy learning through games.","The organization decided to expand its services.","He avoided answering the difficult question.","The teacher encouraged us to ask questions.","Reading regularly can improve vocabulary.","The students managed to complete the task.","She suggested changing the meeting time.","We expect the results to improve next year.","The manager refused to discuss the issue.","They are interested in developing new skills."]],["Advanced Structures",["Not only did the plan save money, but it also reduced waste.","It was the lack of evidence that caused the delay.","Rarely have researchers observed such a result.","Had the team prepared earlier, it might have succeeded.","The extent to which technology influences behavior is difficult to measure.","Only after the meeting did they understand the problem.","What matters most is the quality of the evidence.","Neither the teacher nor the students were satisfied.","So serious was the problem that the school closed temporarily.","The sooner we act, the better the results may be."]],["Mixed Challenges",["The information collected during the study has been reviewed carefully.","Although the new method was expensive, it improved accuracy.","If the policy had been introduced earlier, more people might have benefited.","The students who had completed the task were allowed to leave.","The report may have been influenced by information that was unavailable earlier.","Despite having received clear instructions, some participants made mistakes.","By the time the results were published, the researchers had changed their theory.","Not only has technology changed communication, but it has also affected learning.","The measures introduced last year have reduced costs, although their effects remain unclear.","If more evidence becomes available, the conclusion may need to be revised."]]],Q=[["Which words form the complete subject?","מהו הנושא השלם במשפט?"],["What does the verb tense tell us about time?","מה זמן הפעולה ומה משמעות הזמן?"],["Which clause adds information or explains a relationship?","איזו פסוקית מוסיפה מידע או מסבירה קשר?"],["Which action is expressed in the passive voice?","איזו פעולה מבוטאת בסביל?"],["What condition must be met, and is it real or hypothetical?","מהו התנאי, והאם הוא מציאותי או היפותטי?"],["Which logical relationship connects the ideas?","איזה קשר לוגי מחבר את הרעיונות?"],["Does the modal express certainty, possibility, advice, or obligation?","האם הפועל המודאלי מבטא ודאות, אפשרות, עצה או חובה?"],["Which verb pattern appears, and what follows the main verb?","איזה מבנה פועל מופיע ומה בא אחריו?"],["Which advanced structure changes emphasis or word order?","איזה מבנה מתקדם משנה את ההדגשה או את סדר המילים?"],["Which two grammatical structures work together here?","אילו שני מבנים דקדוקיים פועלים יחד במשפט?"]];let g=-1,n=0,s=0,visible=false;const A=document.getElementById('app'),F=document.getElementById('footer'),C=document.getElementById('count');let marks={};try{marks=JSON.parse(localStorage.getItem('sd-100-progress')||'{}')}catch{}function persist(){try{localStorage.setItem('sd-100-progress',JSON.stringify(marks))}catch{}}function home(){g=-1;render()}function openGroup(i){g=i;n=0;s=0;visible=false;render()}function openSentence(i){n=i;s=0;visible=false;render()}function menu(){if(g<0)return;A.innerHTML='<h1>'+G[g][0]+'</h1>'+G[g][1].map((t,i)=>'<p><button onclick="openSentence('+i+')">'+(i+1)+'. '+t+'</button></p>').join('');F.innerHTML='<button onclick="home()">חזרה לדף הבית</button>';C.textContent='';}function next(d){if(g<0)return;let x=s+d;if(x>5){if(n<9){n++;s=0}else{home();return}}else if(x<0){if(n>0){n--;s=5}else s=0}else s=x;visible=false;render()}function speak(){if(g<0||!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(G[g][1][n]);u.lang='en-US';u.rate=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}function mark(i,v){marks[g+'-'+i]=v;persist()}function render(){if(g<0){C.textContent='100 sentences · 10 branches';F.innerHTML='';A.innerHTML='<h1>Sentence Detective</h1><p class="muted">כיתה י״א · E / G · בחרו ענף לימודי</p><div class="grid">'+G.map((x,i)=>'<div class="card"><h2>'+(i+1)+'. '+x[0]+'</h2><p>10 sentences · 60 learning slides</p><button onclick="openGroup('+i+')">פתח ענף</button>'+['קראתי','השתמשתי','למדתי'].map((t,j)=>'<label><input type="checkbox" '+(marks[i+'-'+j]?'checked':'')+' onchange="g='+i+';mark('+j+',this.checked);g=-1"> '+t+'</label>').join('')+'</div>').join('')+'</div>';return}const t=G[g][1][n];C.textContent='ענף '+(g+1)+'/10 · משפט '+(n+1)+'/10 · שקף '+(s+1)+'/6';let h='';if(s===0)h='<h2>Read & Predict</h2><p>What is the sentence mainly about?</p><p>מהי המשמעות הכללית של המשפט?</p>';if(s===1)h='<h2>Find the main verb</h2><p>Locate the finite verb or verb phrase.</p><p>מצאו את הפועל הנטוי המרכזי.</p>'+(g===0?'<p class="en orange">'+DETAIL[n][6]+'</p>':'');if(s===2)h='<h2>Break the sentence</h2>'+(g===0?'<p class="en blue">Subject: '+DETAIL[n][5]+'</p><p class="en orange">Main verb: '+DETAIL[n][6]+'</p><p class="en green">Remaining information: '+DETAIL[n][7]+'</p>':'<p class="blue">Subject · נושא</p><p class="orange">Main verb · פועל מרכזי</p><p class="green">Complements and clauses · משלימים ופסוקיות</p>');if(s===3)h='<h2>Grammar Discovery</h2><p class="en">'+G[g][0]+'</p><p>What does this structure contribute to the meaning?</p><p>מה המבנה מוסיף למשמעות המשפט?</p>';if(s===4)h='<h2>Exam Challenge</h2><p class="en">'+(g===0?DETAIL[n][0]:Q[g][0])+'</p><p>'+(g===0?DETAIL[n][1]:Q[g][1])+'</p><p class="muted">Answer in English. Support your answer with words from the sentence.</p>';if(s===5)h='<h2>Answer & Evidence</h2>'+(g===0?'<p class="en">'+DETAIL[n][2]+'</p><p>'+DETAIL[n][3]+'</p><p class="en orange">Evidence: '+DETAIL[n][4]+'</p>':'<p class="en">'+Q[g][0]+'</p><p>'+Q[g][1]+'</p><p>Identify the exact words that support your answer.</p>');A.innerHTML='<div class="frame"><div class="sentence">'+t+'</div><div class="panel">'+h+'</div></div>';F.innerHTML='<button onclick="next(-1)">→ הקודם</button><button onclick="next(1)">הבא ←</button>'}let y=null;document.addEventListener('touchstart',e=>{if(e.target.closest('button,input'))return;y=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(y===null)return;let d=e.changedTouches[0].clientY-y;y=null;if(Math.abs(d)>65)next(d<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','PageDown'].includes(e.key))next(1);if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key))next(-1)});render();</script></html>
