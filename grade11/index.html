<style>
@import url("https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Manrope:wght@700;800&display=swap");
:root{--bg:#050b14;--text:#f5f8ff;--muted:#98a9bd;--cyan:#53e4ff;--lime:#dfff5b;--gold:#ffc857}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 8%,#0a8cae33,transparent 32%),radial-gradient(circle at 12% 90%,#8ad60018,transparent 30%),var(--bg);color:var(--text);font-family:"Heebo",Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:48px 48px}
main{position:relative;max-width:1180px;margin:auto;padding:clamp(28px,6vw,72px) 22px}.home{display:inline-grid;place-items:center;width:54px;height:54px;border:1px solid #ffffff28;border-radius:16px;color:#fff;text-decoration:none;background:#ffffff0c;font-size:25px}
header{text-align:center;margin:3vh 0 6vh}.eyebrow{color:var(--cyan);font:800 14px "Manrope";letter-spacing:.17em}h1{font-size:clamp(44px,8vw,86px);line-height:1;margin:.18em 0}.lead{color:var(--muted);font-size:clamp(18px,2.3vw,26px)}
.tracks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.track{min-height:310px;padding:34px;border-radius:30px;border:1px solid #29435d;background:linear-gradient(145deg,#11263a,#0a1625);color:inherit;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 28px 70px #0006;transition:.2s}.track:hover{transform:translateY(-5px);border-color:var(--cyan)}.track.five{background:linear-gradient(145deg,#113047,#0a1726 62%,#162919)}.track.four{background:linear-gradient(145deg,#261936,#0a1625 65%,#172336)}.tag{width:max-content;border:1px solid #53e4ff55;border-radius:999px;padding:7px 12px;color:var(--cyan);font-weight:900}.four .tag{border-color:#ffc85766;color:var(--gold)}.track h2{font-size:clamp(38px,5vw,62px);margin:22px 0 4px}.track p{color:var(--muted);font-size:19px}.arrow{align-self:flex-start;color:var(--lime);font-size:40px}
@media(max-width:700px){main{padding:22px 16px}.tracks{grid-template-columns:1fr}.track{min-height:230px}}
</style>
</head>
