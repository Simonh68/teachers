<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TO BE — The Climb</title>
<meta name="theme-color" content="#07111f">
<style>
@import url("https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Nunito:wght@600;700;800;900&display=swap");
:root{--bg:#07111f;--paper:#f7f7f2;--lime:#dfff5b;--cyan:#4ee5ff;--violet:#a98cff;--amber:#ffc857;--coral:#ff7163;--muted:#9daec0}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--bg);color:#fff;font-family:"Heebo",Arial,sans-serif}
body:before,body:after{content:"";position:fixed;width:65vw;height:65vw;border-radius:50%;filter:blur(90px);opacity:.16;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}body:before{background:var(--cyan);top:-32vw;right:-22vw}body:after{background:var(--violet);bottom:-38vw;left:-20vw;animation-delay:-6s}@keyframes drift{to{transform:translate(5vw,4vw) scale(1.1)}}
.stage{height:100%;position:relative;isolation:isolate}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 78%,transparent)}
.slide{position:absolute;inset:0;padding:clamp(68px,8vh,104px) clamp(28px,7vw,110px) 98px;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(34px) scale(.985);pointer-events:none;transition:opacity .38s ease,transform .42s cubic-bezier(.2,.8,.2,1)}.slide.active{opacity:1;transform:none;pointer-events:auto}.frame{position:relative;width:min(1260px,100%);z-index:2}.eyebrow{font-size:clamp(15px,1.5vw,22px);font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--accent,var(--cyan));margin-bottom:24px}.title{font-size:clamp(52px,8vw,118px);line-height:.96;letter-spacing:-.055em;margin:0;font-weight:900}.sub{font-size:clamp(22px,2.5vw,34px);line-height:1.5;font-weight:600;color:#d4dee8;margin:28px 0 0;max-width:1000px}.he{font-family:"Heebo",sans-serif;word-spacing:.18em}.en{font-family:"Nunito",sans-serif;direction:ltr;text-align:left;word-spacing:.2em;letter-spacing:.01em}.hero-line{font-size:clamp(48px,7vw,96px);font-weight:900;line-height:1.15;white-space:nowrap}.pair{display:grid;gap:34px}.pair>*+*{border-top:2px solid #ffffff24;padding-top:30px}.token{display:inline-block;padding:0 .14em;border-radius:.15em;color:#07111f;background:var(--accent,var(--lime));box-shadow:0 0 34px color-mix(in srgb,var(--accent,var(--lime)) 44%,transparent)}.blank{display:inline-block;min-width:2.3em;border-bottom:.12em solid var(--accent,var(--cyan));color:transparent}.question .frame:before{content:"?";position:absolute;top:-18vh;left:-2vw;font-family:"Nunito";font-size:min(42vw,560px);font-weight:900;color:#ffffff06;z-index:-1}.answer .token{animation:pop .55s cubic-bezier(.2,1.5,.4,1)}@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:38px;direction:ltr}.zone{min-height:210px;border:1px solid #ffffff24;border-radius:28px;padding:28px;background:#ffffff0b;backdrop-filter:blur(12px)}.zone strong{font:900 clamp(34px,4vw,58px) "Nunito";display:block;margin-top:28px}.zone.past{--accent:var(--violet)}.zone.present{--accent:var(--cyan)}.zone.future{--accent:var(--amber)}.zone span{color:var(--accent);font-weight:900}.stack{display:grid;gap:14px;margin-top:28px;direction:ltr}.stack div{font:800 clamp(30px,4.3vw,62px) "Nunito";border-bottom:1px solid #ffffff20;padding:9px 0}.matrix{width:100%;border-collapse:collapse;margin-top:22px;direction:ltr;font-family:"Nunito";font-size:clamp(17px,2.3vw,31px)}.matrix th,.matrix td{padding:15px 18px;border-bottom:1px solid #ffffff24;text-align:left}.matrix th{color:var(--muted)}.matrix td:not(:first-child){font-weight:900}.climb{position:absolute;left:clamp(18px,3vw,46px);top:9vh;bottom:12vh;width:5px;background:#ffffff16;border-radius:9px;z-index:4}.climb-fill{position:absolute;bottom:0;width:100%;height:0;background:linear-gradient(to top,var(--violet),var(--cyan),var(--amber));box-shadow:0 0 22px var(--cyan);border-radius:9px;transition:height .5s ease}.climber{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 22px #fff;transition:bottom .5s ease}.mountain{position:absolute;inset:auto 0 0;height:56%;opacity:.45;pointer-events:none;background:linear-gradient(145deg,transparent 0 35%,#152b42 35.2% 58%,transparent 58.2%),linear-gradient(35deg,transparent 0 38%,#20354d 38.2% 62%,transparent 62.2%);clip-path:polygon(0 100%,0 83%,14% 58%,28% 77%,46% 24%,59% 54%,73% 36%,100% 84%,100% 100%)}.summit{font-size:clamp(60px,10vw,145px);text-align:center}.nav{position:fixed;left:24px;right:24px;bottom:18px;display:flex;align-items:center;justify-content:space-between;z-index:10;direction:ltr}.nav-group{display:flex;gap:9px}.nav button{width:54px;height:54px;border:1px solid #ffffff26;background:#0c1a2add;color:#fff;border-radius:50%;font-size:24px;cursor:pointer;backdrop-filter:blur(12px)}.nav button:hover{background:#ffffff20}.nav button:disabled{opacity:.25}.progress{font:800 14px "Nunito";background:#0c1a2add;border:1px solid #ffffff20;border-radius:999px;padding:9px 14px}.home{position:fixed;top:18px;left:22px;z-index:12;color:#fff;text-decoration:none;background:#0c1a2add;border:1px solid #ffffff20;border-radius:999px;padding:9px 14px;font-weight:800;font-size:13px}.hint{position:fixed;top:20px;right:24px;color:#91a2b4;font-size:13px;font-weight:800;z-index:10}
@media(max-width:760px){.slide{padding:74px 28px 95px 44px}.hero-line{white-space:normal}.map{grid-template-columns:1fr}.zone{min-height:auto}.matrix{font-size:15px}.matrix th,.matrix td{padding:10px 6px}.climb{left:16px}.hint{display:none}.pair{gap:22px}}
</style>
</head>
<body>
<a class="home" href="../">חזרה לחומרים</a><div class="hint">← ↑ הקודם · הבא ↓ →</div>
<div class="climb"><div class="climb-fill" id="climbFill"></div><div class="climber" id="climber"></div></div>
<main class="stage" id="stage"></main>
<nav class="nav"><div class="nav-group"><button id="prev">←</button><button id="up">↑</button></div><span class="progress" id="progress"></span><div class="nav-group"><button id="down">↓</button><button id="next">→</button></div></nav>
<script>
const S=[
{a:"climb",e:"The climb begins",h:'<div class="mountain"></div><div class="pair"><div><div class="hero-line he">עולים מהקל אל המאתגר.</div><p class="sub he">מתחילים בתחתית ההר ומטפסים שלב אחר שלב.</p></div><div><div class="hero-line en">We climb from easy to challenging.</div><p class="sub en">We start at the bottom and move up, one step at a time.</p></div></div>'},
{a:"climb",e:"Our route",h:'<h1 class="title en">TO BE</h1><div class="map"><div class="zone present"><span>BASE</span><strong>am · is · are</strong></div><div class="zone past"><span>MIDDLE</span><strong>was · were</strong></div><div class="zone future"><span>SUMMIT</span><strong>will be · be + ing</strong></div></div>'},
{a:"past",e:"עבר · Past",h:'<div class="hero-line he">אני <span class="token">הייתי</span> טוב.</div>'},
{a:"past",e:"Past",h:'<div class="hero-line en">I <span class="token">was</span> good.</div>'},
{a:"future",e:"עתיד · Future",h:'<div class="hero-line he">אני <span class="token">אהיה</span> טוב.</div>'},
{a:"future",e:"Future",h:'<div class="hero-line en">I <span class="token">will be</span> good.</div>'},
{a:"present",e:"הווה · Present",h:'<div class="hero-line he">אני טוב.</div>'},
{a:"present",e:"What disappeared?",h:'<div class="hero-line he">אני <span class="token">∅</span> טוב.</div><p class="sub he">בעברית הפועל אינו מופיע בהווה.</p>'},
{a:"present",e:"English keeps the verb",h:'<div class="hero-line en">I <span class="token">am</span> good.</div>'},
{a:"present",e:"אתגר בעברית",q:1,h:'<div class="hero-line he">אני <span class="blank">___</span> מוכן.</div>'},
{a:"present",e:"הפתרון בעברית",ans:1,h:'<div class="hero-line he">אני מוכן.</div><p class="sub he">לא מוסיפים מילה.</p>'},
{a:"present",e:"English challenge",q:1,h:'<div class="hero-line en">I <span class="blank">___</span> ready.</div>'},
{a:"present",e:"English answer",ans:1,h:'<div class="hero-line en">I <span class="token">am</span> ready.</div>'},
{a:"climb",e:"Three zones",h:'<div class="map"><div class="zone past"><span>PAST</span><strong>was · were</strong></div><div class="zone present"><span>PRESENT</span><strong>am · is · are</strong></div><div class="zone future"><span>FUTURE</span><strong>will be</strong></div></div>'},
{a:"present",e:"I",h:'<div class="hero-line en">I <span class="token">am</span></div><p class="sub en">I am ready.</p>'},
{a:"present",e:"He · She · It",h:'<div class="stack"><div>He <span class="token">is</span></div><div>She <span class="token">is</span></div><div>It <span class="token">is</span></div></div>'},
{a:"present",e:"You · We · They",h:'<div class="stack"><div>You <span class="token">are</span></div><div>We <span class="token">are</span></div><div>They <span class="token">are</span></div></div>'},
{a:"present",e:"Choose",q:1,h:'<div class="hero-line en">I <span class="blank">___</span> ready.</div>'},
{a:"present",e:"Answer",ans:1,h:'<div class="hero-line en">I <span class="token">am</span> ready.</div>'},
{a:"present",e:"Choose",q:1,h:'<div class="hero-line en">She <span class="blank">___</span> ready.</div>'},
{a:"present",e:"Answer",ans:1,h:'<div class="hero-line en">She <span class="token">is</span> ready.</div>'},
{a:"present",e:"Choose",q:1,h:'<div class="hero-line en">They <span class="blank">___</span> ready.</div>'},
{a:"present",e:"Answer",ans:1,h:'<div class="hero-line en">They <span class="token">are</span> ready.</div>'},
{a:"past",e:"Was",h:'<div class="stack"><div>I <span class="token">was</span></div><div>He · She · It <span class="token">was</span></div></div>'},
{a:"past",e:"Were",h:'<div class="stack"><div>You <span class="token">were</span></div><div>We · They <span class="token">were</span></div></div>'},
{a:"past",e:"Choose",q:1,h:'<div class="hero-line en">The boy <span class="blank">___</span> tired.</div>'},
{a:"past",e:"Answer",ans:1,h:'<div class="hero-line en">The boy <span class="token">was</span> tired.</div>'},
{a:"past",e:"Choose",q:1,h:'<div class="hero-line en">The children <span class="blank">___</span> tired.</div>'},
{a:"past",e:"Answer",ans:1,h:'<div class="hero-line en">The children <span class="token">were</span> tired.</div>'},
{a:"future",e:"One form for everyone",h:'<div class="stack"><div>I · You · He · She</div><div>We · They <span class="token">will be</span></div></div>'},
{a:"climb",e:"The complete map",h:'<table class="matrix"><tr><th>Subject</th><th>Present</th><th>Past</th><th>Future</th></tr><tr><td>I</td><td>am</td><td>was</td><td>will be</td></tr><tr><td>You</td><td>are</td><td>were</td><td>will be</td></tr><tr><td>He / She / It</td><td>is</td><td>was</td><td>will be</td></tr><tr><td>We / They</td><td>are</td><td>were</td><td>will be</td></tr></table>'},
{a:"story",e:"My First Day · 1",q:1,h:'<div class="hero-line en">My name <span class="blank">___</span> Daniel.</div>'},
{a:"story",e:"My First Day · 1",ans:1,h:'<div class="hero-line en">My name <span class="token">is</span> Daniel.</div>'},
{a:"story",e:"My First Day · 2",q:1,h:'<div class="hero-line en">I <span class="blank">___</span> new at Green Hill School.</div>'},
{a:"story",e:"My First Day · 2",ans:1,h:'<div class="hero-line en">I <span class="token">am</span> new at Green Hill School.</div>'},
{a:"story",e:"My First Day · 3",q:1,h:'<div class="hero-line en">Yesterday <span class="blank">___</span> my first day.</div>'},
{a:"story",e:"My First Day · 3",ans:1,h:'<div class="hero-line en">Yesterday <span class="token">was</span> my first day.</div>'},
{a:"story",e:"My First Day · 4",q:1,h:'<div class="hero-line en">The classrooms <span class="blank">___</span> bright and modern.</div>'},
{a:"story",e:"My First Day · 4",ans:1,h:'<div class="hero-line en">The classrooms <span class="token">were</span> bright and modern.</div>'},
{a:"story",e:"My First Day · 5",q:1,h:'<div class="hero-line en">Today I <span class="blank">___</span> more relaxed.</div>'},
{a:"story",e:"My First Day · 5",ans:1,h:'<div class="hero-line en">Today I <span class="token">am</span> more relaxed.</div>'},
{a:"story",e:"My First Day · 6",q:1,h:'<div class="hero-line en">Tomorrow my friends <span class="blank">___</span> there with me.</div>'},
{a:"story",e:"My First Day · 6",ans:1,h:'<div class="hero-line en">Tomorrow my friends <span class="token">will be</span> there with me.</div>'},
{a:"action",e:"State or action?",h:'<div class="pair"><div class="hero-line en">I <span class="token">am</span> good.</div><div class="hero-line en">I <span class="token">am reading</span>.</div></div>'},
{a:"action",e:"The pattern",h:'<h1 class="title en">Subject + BE + verb<span class="token">ing</span></h1>'},
{a:"action",e:"Watch it move",h:'<div class="stack"><div>I <span class="token">am reading</span>.</div><div>She <span class="token">is writing</span>.</div><div>They <span class="token">are playing</span>.</div></div>'},
{a:"action",e:"Final challenge",q:1,h:'<div class="hero-line en">The boy <span class="blank">___</span> running.</div>'},
{a:"action",e:"The summit",ans:1,h:'<div class="summit">⛰️</div><div class="hero-line en" style="text-align:center">The boy <span class="token">is</span> running.</div><p class="sub en" style="text-align:center;margin-inline:auto">You reached the top.</p>'}
];
const colors={past:"#a98cff",present:"#4ee5ff",future:"#ffc857",action:"#ff7163",story:"#dfff5b",climb:"#4ee5ff"};
const stage=document.querySelector("#stage");
stage.innerHTML=S.map((s,i)=>'<section class="slide '+(s.q?'question ':'')+(s.ans?'answer ':'')+(i===0?'active':'')+'" style="--accent:'+colors[s.a]+'"><div class="frame"><div class="eyebrow">'+String(i+1).padStart(2,"0")+' · '+s.e+'</div>'+s.h+'</div></section>').join("");
const slides=[...document.querySelectorAll(".slide")];let current=0,wheelLock=false,touchY=0;
function show(n){current=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle("active",i===current));progress.textContent=(current+1)+" / "+slides.length;prev.disabled=up.disabled=current===0;next.disabled=down.disabled=current===slides.length-1;const pct=current/(slides.length-1)*100;climbFill.style.height=pct+"%";climber.style.bottom=pct+"%"}
prev.onclick=up.onclick=()=>show(current-1);next.onclick=down.onclick=()=>show(current+1);
addEventListener("keydown",e=>{if(["ArrowRight","ArrowDown"," ","Enter"].includes(e.key)){e.preventDefault();show(current+1)}if(["ArrowLeft","ArrowUp"].includes(e.key)){e.preventDefault();show(current-1)}});
addEventListener("wheel",e=>{if(wheelLock||Math.abs(e.deltaY)<18)return;wheelLock=true;show(current+(e.deltaY>0?1:-1));setTimeout(()=>wheelLock=false,500)},{passive:true});
addEventListener("touchstart",e=>touchY=e.touches[0].clientY,{passive:true});addEventListener("touchend",e=>{const d=touchY-e.changedTouches[0].clientY;if(Math.abs(d)>45)show(current+(d>0?1:-1))},{passive:true});show(0);
</script>
</body></html>
