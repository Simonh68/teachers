": 8, "type": "writing", "points": 30, "stem": "Describe a school activity that you enjoyed. Explain what you did and why you enjoyed it.", "instruction": "Write 70–90 words in English. The activity may be real or imaginary.", "min_words": 70, "max_words": 90, "rubric": [{"name": "Content and organization", "points": 10, "description": "Address the activity, what you did and why you enjoyed it. Develop ideas in a clear order."}, {"name": "Vocabulary", "points": 8, "description": "Use suitable words and natural phrases accurately."}, {"name": "Language use", "points": 8, "description": "Use basic tenses, sentence structures, word order, pronouns and prepositions correctly."}, {"name": "Mechanics", "points": 4, "description": "Check spelling, punctuation, capital letters and sentence boundaries."}], "model": "Last month, I took part in our school's art day. My friends and I painted a wall near the playground. First, we planned a picture of our town. Then we chose bright colours and divided the work. I painted the trees because I love nature. At first, I was worried about making mistakes, but my friends helped me. I enjoyed the activity because we worked together and created something useful. Now I feel proud whenever I walk past the wall.", "marking_note": "Human or AI-assisted review is required. The local app does not award writing points. Accept any relevant real or imagined activity. The model is one example, not a required answer. Use the linked official rubric for detailed performance levels and any length deductions."}, "sources": [{"title": "Ministry of Education, Module C, Summer 2026 A (official paper mirrored by Geva)", "url": "https://files.geva.co.il/geva_website/uploads/2026/05/שאלון-C-16382.pdf", "use": "Format: reading 70, writing 30, 70–90 words; seven reading questions, mixed formats; 90-minute practice model."}, {"title": "Ministry of Education, Module C, Summer 2026 B (official paper mirrored by Geva)", "url": "https://files.geva.co.il/geva_website  12, "paragraph": 2, "start": false, "text": "interviews. Everyone had a useful job."}, {"number": 13, "paragraph": 3, "start": true, "text": "Making a programme was harder than the team expected. During their first"}, {"number": 14, "paragraph": 3, "start": false, "text": "interview, two pupils spoke at the same time, so listeners could not"}, {"number": 15, "paragraph": 3, "start": false, "text": "understand the guest's answer. After that, the team began practising"}, {"number": 16, "paragraph": 3, "start": false, "text": "interviews before recording them. They also learnt to ask short questions and"}, {"number": 17, "paragraph": 3, "start": false, "text": "wait for the answers. Now a teacher checks each programme before it is"}, {"number": 18, "paragraph": 3, "start": false, "text": "played. However, the pupils still choose the topics themselves."}, {"number": 19, "paragraph": 4, "start": true, "text": "After three months, more pupils wanted to join the team. One of them was"}, {"number": 20, "paragraph": 4, "start": false, "text": "Maya, who had been afraid to speak in front of her class. She started by"}, {"number": 21, "paragraph": 4, "start": false, "text": "writing the news and later agreed to read it with a friend. She still feels"}, {"number": 22, "paragraph": 4, "start": false, "text": "nervous before a programme, but she no longer avoids speaking. The team"}, {"number": 23, "paragraph": 4, "start": false, "text": "now hopes to interview people from outside the school. Before doing that, the"}, {"number": 24, "paragraph": 4, "start": false, "text": "pupils need to learn how to arrange interviews with busy guests."}]</script><script id="gloss-data" type="application/json">{"units": [{"id": "gloss-1", "paragraph": 1, "en": "Every Friday,", "he": "בכל יום שישי", "start_word": 0, "end_word": 1}, {"id": "gloss-2", "paragraph": 1, "en": "pupils at Green Hill School", "he": "תלמידים בבית הספר גרין היל", "start_word": 2, "end_word": 6}, {"id": "gloss-3", "paragra document.getElementById('article-text').innerHTML=lineHTML(lines);
document.getElementById('show-article').onclick=()=>{reader.reset();dialog.showModal();reader.sync();};document.getElementById('close-article').onclick=()=>dialog.close();dialog.addEventListener('close',()=>reader.reset());
stage.addEventListener('toggle',e=>{if(e.target.matches('.excerpt')&&!e.target.open)reader.reset();else reader.sync();},true);
document.getElementById('prev').onclick=()=>show(state.slide-1);document.getElementById('next').onclick=()=>show(state.slide+1);jump.onchange=e=>show(Number(e.target.value));
document.addEventListener('keydown',e=>{if(dialog.open||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,button,a,summary,[data-gloss],[contenteditable]'))return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();show(state.slide+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(state.slide-1);}});
let touch=null;stage.addEventListener('touchstart',e=>{if(e.target.closest('input,textarea,select,button,a,summary,[data-gloss]')){touch=null;return;}touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});stage.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>80&&Math.abs(dx)>2*Math.abs(dy))show(state.slide+(dx<0?1:-1));},{passive:true});
if(!Number.isInteger(state.slide)||state.slide<0||state.slide>=deck.length||(!state.finished&&state.slide===deck.length-1))state.slide=0;
render();
})();
</script>
</body></html>
