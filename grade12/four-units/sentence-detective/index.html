f responsible students cleaned the beach after the holiday.","parts":["group","cleaned","the beach"],"core":"group cleaned the beach","vocab":"responsible=אחראי; beach=חוף; holiday=חופשה","level":"בינוני"},{"phrase":"The helpful information on the school website","head":"information","sentence":"The helpful information on the school website made the project easier.","parts":["information","made","the project easier"],"core":"information made the project easier","vocab":"information=מידע; website=אתר; easier=קל יותר","level":"מאתגר במסגרת שאלון C"}];const slides=units.flatMap((u,i)=>Array.from({length:6},(_,j)=>({unit:i,phase:j,choices:[]})));const state={index:0,stage:0,selected:{}};const $=id=>document.getElementById(id);let audioTimer;let cover=true;const E=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function render(){stopAudio();if(cover){$("page").innerHTML="<section class=\"coverNew\" lang=\"en\" dir=\"ltr\"><div class=\"eyebrow\">READ SMARTER · MODULE C</div><h1>Sentence Detective</h1><p>Discover the hidden structure of English sentences.<br>Find the nouns. Follow the verbs. Understand the meaning.</p><div class=\"subtitle\">90 slides · 15 learning cycles · Grade 12 · 4 points</div><button class=\"cta\" onclick=\"startLesson()\">🚀 Start Exploring</button></section>";$("counter").textContent="Module C";$("progress").style.width="0%";$("prev").disabled=true;$("next").disabled=false;return}const s=slides[state.index],u=units[s.unit],p=s.phase;const titles=["הצירוף השלם","מוצאים את שם העצם המרכזי","מפרקים את התיאורים","מזהים יחידות במשפט","מוצאים את השלד המרכזי","קוראים את המשפט השלם"];const wrap=t=>'<div class="card"><div class="inner"><div class="english">'+t+'</div></div></div>';let c="";

if(p===3)c=wrap('<div class="parts"><span class="part subject">'+E(u.parts[0])+'</span><span class="part verb">'+E(u.parts[1])+'</span><span class="part object">'+E(u.parts[2])+'</span></div>')+'<div class="minor">כחול: נושא · כתום: פועל · ירוק: השלמת משמעות המשפט</div>';

let touch=null;const main=$("main");main.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;const target=e.target;if(target instanceof Element&&target.closest("button,a,input,textarea,select"))return;touch={x:e.touches[0].clientX,y:e.touches[0].clientY,t:e.timeStamp,top:main.scrollTop<=12,bottom:main.scrollTop+main.clientHeight>=main.scrollHeight-12}},{passive:true});main.addEventListener("touchend",e=>{if(!touch||e.changedTouches.length!==1)return;const t=touch;touch=null;const dy=e.changedTouches[0].clientY-t.y,dx=e.changedTouches[0].clientX-t.x;if(Math.abs(dy)<55||Math.abs(dx)>Math.abs(dy)*.75||e.timeStamp-t.t>1800)return;const scrollable=main.scrollHeight>main.clientHeight+20;if(dy<0&&(!scrollable||t.bottom))go(1);else if(dy>0&&(!scrollable||t.top))go(-1)},{passive:true});main.addEventListener("touchcancel",()=>touch=null);document.addEventListener("keydown",e=>{if($("pairDialog").open)return;if(["ArrowRight","PageDown","ArrowDown"].includes(e.key)){e.preventDefault();go(1)}else if(["ArrowLeft","PageUp","ArrowUp"].includes(e.key)){e.preventDefault();go(-1)}});render();
