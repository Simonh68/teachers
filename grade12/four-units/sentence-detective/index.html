<style>
:root{color-scheme:dark;--bg:#07101d;--panel:#111f31;--panel2:#152943;--ink:#fff;--muted:#c7d7e8;--line:#354c67;--lime:#e4fa77;--n:#3388ff;--a:#ffbd45;--d:#dce4ef;--v:#ff6372;--p:#c29bff;--c:#4de3bd}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 80% -20%,#174d83 0,transparent 48%),linear-gradient(145deg,#07101d,#0e2035);color:var(--ink);font:700 21px/1.5 Arial,Helvetica,sans-serif;overflow:hidden}
button,select{font:inherit}button{cursor:pointer}a{color:var(--lime)}
:focus-visible{outline:4px solid var(--lime);outline-offset:3px}
header{height:79px;display:flex;align-items:center;gap:14px;padding:12px clamp(15px,3vw,38px);border-bottom:1px solid #42607a88}
.brand{font-size:14px;letter-spacing:.1em;color:var(--lime);font-weight:900;text-transform:uppercase;white-space:nowrap}.headMid{flex:1;display:flex;justify-content:center;min-width:0;align-items:center;gap:14px}.counter{font-size:17px;color:#d6e2ed;white-space:nowrap;font-variant-numeric:tabular-nums}.pill{border:1px solid #7da1c155;background:#17406166;border-radius:999px;padding:6px 13px;color:#d5eafa;font-size:13px;letter-spacing:.06em}
.headBtns{display:flex;gap:8px;align-items:center}.smallBtn{background:#1a3148;color:#f5faff;border:1px solid #6c8aa6;border-radius:10px;font-size:15px;padding:9px 13px;font-weight:900;text-decoration:none;white-space:nowrap}
main{height:calc(100dvh - 157px);min-height:0;overflow:auto;display:flex;justify-content:center;padding:clamp(13px,2vw,26px) clamp(15px,3vw,50px)}
.page{width:100%;max-width:1480px;display:flex;flex-direction:column;justify-content:center;min-height:100%;gap:clamp(10px,1.5vh,23px)}
.kicker{font-size:clamp(14px,1.35vw,21px);text-transform:uppercase;letter-spacing:.14em;color:var(--lime)}
h1{font-size:clamp(33px,4.15vw,71px);letter-spacing:-.035em;line-height:1.13;margin:0;font-weight:900}
.subtitle{color:#d6e7f5;font-size:clamp(17px,1.7vw,27px)}
.sentenceCard{position:relative;background:linear-gradient(125deg,#10263a,#0e1c31);border:2px solid #3d627d;border-radius:24px;padding:clamp(16px,3vw,45px);min-height:125px;box-shadow:0 14px 50px #0004;overflow:hidden}
.sentence{display:flex;direction:ltr;flex-wrap:wrap;gap:.18em .20em;align-items:baseline;font-size:clamp(29px,3.9vw,63px);line-height:1.55;font-weight:800}
.w{display:inline-block;padding:.015em .12em;border-radius:.16em;position:relative;box-shadow:inset 0 0 0 1px transparent;transition:background .4s,color .4s,box-shadow .4s;transform-origin:center;white-space:normal}
.wordGroup{white-space:nowrap}
.stage1 .w.d{box-shadow:inset 0 -5px 0 var(--d);animation:glow .6s both}.stage1 .w.c{box-shadow:inset 0 -6px 0 var(--c);color:#6fffe0;animation:glow .6s both}
.stage2 .w.d,.stage3 .w.d,.stage4 .w.d{background:#4c5b6b;color:#fff}
.stage2 .w.a,.stage3 .w.a,.stage4 .w.a{background:var(--a);color:#141b29;animation:appear .38s both;animation-delay:var(--delay)}
.stage2 .w.n,.stage3 .w.n,.stage4 .w.n{background:var(--n);color:white;box-shadow:0 0 0 3px #3388ff44;animation:pulse .8s both}
.stage2 .w.q,.stage3 .w.q,.stage4 .w.q{box-shadow:inset 0 -5px 0 #72a8ff}
.stage2 .w.c,.stage3 .w.c,.stage4 .w.c{background:#10675a;color:#baffed}
.stage3 .w.v,.stage4 .w.v{background:var(--v);color:#131c29;animation:pulse .7s both}
.stage3 .w.p,.stage4 .w.p{background:#7950b6;color:#fff}
.stage3 .w.o,.stage4 .w.o{box-shadow:inset 0 -5px 0 #a6beef}
.stage3 .w.u,.stage4 .w.u{box-shadow:inset 0 -5px 0 #c88a93}
.scanCue{display:none;position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 15%,#4de3bd14 42%,#4de3bd36 50%,#4de3bd14 58%,transparent 85%);background-size:200% 100%;animation:scan 1.8s ease-in-out infinite}
.stage1 .scanCue{display:block}.nounCue{display:none;margin-top:12px;font-size:clamp(19px,1.6vw,24px);font-weight:900;color:#aed4ff;align-items:center;gap:12px}.stage2 .nounCue,.stage3 .nounCue,.stage4 .nounCue{display:flex;animation:fadeUp .4s both}
.backArrow{font-size:36px;display:inline-block;animation:backmove 1.6s ease-in-out infinite;color:var(--a)}
.prompt{font-size:clamp(22px,2.2vw,33px);font-weight:900;color:#f7faff}

.choice{background:#162b43;color:#f7fbff;border:2px solid #54738f;text-align:left;padding:clamp(12px,1.7vw,23px);border-radius:16px;font-size:clamp(18px,1.65vw,26px);font-weight:800;line-height:1.4;min-height:76px;transition:background .15s,transform .15s}
.choice:hover{background:#204365;transform:translateY(-2px)}.choice b{color:var(--lime);margin-right:12px}.choice.correct{border-color:#73e5af;background:#14523e}.choice.wrong{border-color:#f3a4a4;background:#4e2634}.choice:disabled{cursor:default}
.feedback{min-height:35px;color:#ffe3a9;font-size:clamp(16px,1.45vw,23px)}.feedback.good{color:#86f1b3}.feedback.bad{color:#ffcbca}

.heb{direction:rtl;text-align:right;font-family:Arial,'Noto Sans Hebrew',sans-serif;font-weight:700}
.details{background:#192b40;border:1px solid #415b76;border-radius:14px;padding:14px 18px;animation:fadeUp .4s both}.details .meaning{font-size:clamp(17px,1.35vw,22px);color:#f4f6fb}.details .gloss{margin-top:9px;color:#ffe8ad;font-size:clamp(15px,1.2vw,20px)}
.diagram{display:grid;grid-template-columns:minmax(0,1fr) 85px minmax(0,1fr);gap:8px;align-items:center;direction:ltr;animation:fadeUp .55s both}
.diagram .cell{background:#173149;border:1px solid #7a98b2;border-radius:15px;min-height:75px;padding:12px 19px;text-align:center;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:3px;font-size:clamp(18px,1.5vw,24px)}
.diagram .cell strong{font-size:14px;color:var(--lime);text-transform:uppercase;letter-spacing:.08em}.diagram .arrow{font-size:49px;text-align:center;color:var(--c);animation:floatRight 1.6s infinite}
.diagram.contrast .arrow{color:#ffbe76}.diagram.condition .arrow{color:#8cc7ff}
.cover{text-align:center;align-items:center}.cover h1{font-size:clamp(51px,7vw,112px);line-height:1.05;max-width:1000px}.cover .subtitle{max-width:900px}.cover .hero{font-size:clamp(25px,3vw,46px);padding:22px;border-top:1px solid #527291;border-bottom:1px solid #527291;line-height:1.5}.cover .punch{color:var(--lime)}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.legendItem{font-size:clamp(13px,1.1vw,17px);font-weight:900;display:flex;gap:8px;align-items:center;color:#dceaf8}.dot{width:14px;height:14px;border-radius:4px;display:inline-block}
footer{height:78px;padding:10px clamp(15px,3vw,38px);border-top:1px solid #42607a88;display:flex;gap:12px;align-items:center;justify-content:space-between;background:#07101dc9}
.navBtn{border:1px solid #9fb8ce;background:#1b3349;color:#fff;padding:11px 19px;border-radius:13px;font-weight:900;font-size:clamp(15px,1.5vw,20px)}.navBtn.primary{background:var(--lime);border-color:var(--lime);color:#14200d;min-width:clamp(170px,23vw,310px)}.navBtn:disabled{opacity:.35;cursor:not-allowed}.footLeft{display:flex;gap:10px;align-items:center}.footRight{display:flex;gap:10px;align-items:center}.progress{position:absolute;bottom:78px;left:0;right:0;height:4px;background:#1d3345}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--lime));transition:width .4s}
.teacher{display:none;margin:8px 0;color:#d7e7ff;font-size:15px;border-left:3px solid var(--lime);padding-left:12px}.teacher.on{display:block}.readingBox{white-space:pre-line;font:500 clamp(19px,1.4vw,23px)/1.8 Georgia,serif;max-width:1000px;margin:auto}.readDialog{background:#0b1829;color:white;border:2px solid #78a0bb;border-radius:20px;padding:25px;max-width:960px;width:95vw;max-height:88vh;overflow:auto}.readDialog::backdrop{background:#000b}.readDialog h2{font-size:36px}.readDialog p{font:500 clamp(20px,1.5vw,24px)/1.65 Georgia,serif}.readDialog button{float:right;background:var(--lime);border:0;border-radius:10px;padding:9px 20px;color:#111;font-weight:900}.readonlyBtn{background:#1d4850;color:#cffff4;border:1px solid #63cdb9;padding:10px 15px;border-radius:10px;font-size:15px}
@media(max-width:780px){header{height:65px;gap:5px}.brand{font-size:11px}.headMid{justify-content:flex-end}.pill{display:none}.smallBtn{font-size:13px;padding:6px 8px}.counter{font-size:13px}main{height:calc(100dvh - 144px);padding:18px 12px}.page{justify-content:flex-start}.sentence{font-size:clamp(24px,6.2vw,38px);line-height:1.55}.choices{grid-template-columns:1fr;gap:7px}.choice{min-height:49px;font-size:18px;padding:10px 13px}.prompt{font-size:22px}.hintCard{font-size:15px}.diagram{grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr)}.diagram .arrow{font-size:28px}.diagram .cell{font-size:14px;min-height:65px;padding:8px}.diagram .cell strong{font-size:11px}footer{height:79px;padding:8px 10px;gap:6px}.navBtn{padding:10px 9px;font-size:14px}.navBtn.primary{min-width:140px}.footLeft{gap:4px}.footRight{gap:4px}.progress{bottom:79px}.cover h1{font-size:50px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@keyframes scan{from{background-position:150% 0}to{background-position:-60% 0}}@keyframes pulse{0%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.22)}100%{transform:scale(1);filter:brightness(1)}}@keyframes appear{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes backmove{0%,100%{transform:translateX(14px)}50%{transform:translateX(-18px)}}@keyframes glow{50%{filter:brightness(1.4)}}@keyframes floatRight{50%{transform:translateX(9px)}}

/* Mobile-viewport reliability: keep every word and response inside a scrollable slide. */
main{align-items:flex-start;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-padding-bottom:38px}
.page{height:max-content;min-height:100%;flex:0 0 auto;justify-content:safe center;padding-bottom:22px}
.page>*{flex:0 0 auto;min-width:0}
.sentenceCard{height:auto;flex-shrink:0}
@media(max-width:780px){
main{padding:14px 12px 28px}
.page{height:max-content;min-height:100%;justify-content:flex-start;gap:13px;padding-bottom:30px}
.sentenceCard{height:auto;min-height:0;padding:17px;flex-shrink:0;border-radius:19px}
.sentence{font-size:clamp(24px,6.2vw,38px);line-height:1.42}
.prompt{font-size:22px;line-height:1.33}
.feedback{min-height:0;font-size:17px;line-height:1.42}
.footRight{flex:1;min-width:0}

#reveal{white-space:nowrap;font-size:15px}

#prev:after{content:"←";font-size:24px}
#next:after{content:"→";font-size:24px}
#reset{min-width:43px;padding:9px 7px;font-size:19px}
}
@media(max-width:410px){
h1{font-size:clamp(30px,8vw,39px);line-height:1.12}
.kicker{font-size:13px;line-height:1.3;letter-spacing:.11em}
.sentence{font-size:clamp(24px,6.6vw,28px);line-height:1.4}
.sentenceCard{padding:17px}
.prompt{font-size:21px}
.choice{padding:10px 12px}
}

<script>
"use strict";
const slides=[{"section":"START","title":"Sentence Detective","markup":"","prompt":"Can you understand a sentence without knowing every word?","choices":null,"correct":null,"why":"Today: find the noun, the verb and the logic. No dictionary first.","gloss":[],"logic":null,"coach":"כיתת 4 יח״ל. שאלה בתחילת השיעור: האם אפשר להבין משפט בלי לתרגם את כל המילים?"},{"section":"NOUN","title":"The hidden noun","markup":"The~d|popular new online~a|workshop~n|attracted~v|many~d|teenagers.~o","prompt":"Which word is the head noun of the subject?","choices":["online","teenagers","workshop"],"correct":2,"why":"The describes a noun phrase. The words popular / new / online describe WORKSHOP. Teenagers is the object.","gloss":[["workshop","סדנה"],["attracted","משך / משכה"]],"logic":null,"coach":"לא מתרגמים workshop. מחפשים The, מתקדמים ימינה, ורק אז חוזרים שמאלה."},{"section":"NOUN","title":"Find the anchor","markup":"The~d|very friendly young~a|volunteer~n|helped~v|the~d|visitors.~o","prompt":"What does THE help us find?","choices":["A noun phrase","The main verb","A reason"],"correct":0,"why":"The is a clue that a noun phrase is beginning. The noun does not have to come immediately after it.","gloss":[["volunteer","מתנדב / מתנדבת"]],"logic":null,"coach":"הבהרה: The מסמן צירוף שמני, לא מבטיח ששם העצם יהיה המילה הבאה."},{"section":"NOUN","title":"Move right, read back","markup":"A~d|helpful local~a|guide~n|explained~v|the~d|new rules.~o","prompt":"Which word does helpful describe?","choices":["rules","guide","explained"],"correct":1,"why":"First find GUIDE. Then go backwards: helpful and local tell us what kind of guide.","gloss":[["guide","מדריך / מדריכה"]],"logic":null,"coach":"אנימציית חץ שמאלה אחרי גילוי שם העצם. לא להזיז את סדר המילים."},{"section":"NOUN","title":"A longer description","markup":"The~d|small local animal~a|shelter~n|needs~v|more~d|volunteers.~o","prompt":"Which noun is the head of the subject?","choices":["animal","volunteers","shelter"],"correct":2,"why":"The subject is the small local animal shelter. ANIMAL describes the type of shelter.","gloss":[["shelter","מקלט / מחסה"]],"logic":null,"coach":"animal שם עצם המשמש כאן לתיאור שם עצם אחר. הפתרון אינו רק 'תואר'."},{"section":"NOUN","title":"The final word of the description","markup":"The~d|new school science~a|club~n|meets~v|every Monday.~p","prompt":"Which is the head noun?","choices":["club","science","school"],"correct":0,"why":"Club is the main noun. 'school science' helps tell us what kind of club.","gloss":[["club","מועדון"]],"logic":null,"coach":"חייבים להדגיש שלפעמים שמות עצם נוספים מופיעים לפני שם העצם הראשי."},{"section":"NOUN","title":"Another starting signal","markup":"Several~d|helpful young~a|neighbors~n|organized~v|a~d|food sale.~o","prompt":"What did the neighbors do?","choices":["They bought food.","They organized a sale.","They visited a shop."],"correct":1,"why":"The main verb is organized. Several is also a useful noun-phrase signal.","gloss":[["neighbors","שכנים"],["organized","ארגנו"]],"logic":null,"coach":"לא רק The. אפשר להשתמש גם ב-Several, Many, Some."},{"section":"NOUN","title":"The OF trap","markup":"The~d|cost~n|of the new school trip~p|has increased.~v","prompt":"What is the head noun of the subject?","choices":["school","trip","cost"],"correct":2,"why":"The main subject is THE COST. 'Of the new school trip' adds information but does not replace the head noun.","gloss":[["cost","עלות"],["increased","עלתה"]],"logic":null,"coach":"להציג על המסך 'The cost ... has increased', תוך החלשת המקטע המתחיל ב-of."},{"section":"NOUN","title":"The NEAR trap","markup":"The~d|young teachers~n|from nearby schools~p|visited~v|the~d|center.~o","prompt":"Who visited the center?","choices":["The teachers","The schools","The center"],"correct":0,"why":"Teachers is the head noun. Nearby schools appears inside extra information.","gloss":[["nearby","בקרבת מקום"]],"logic":null,"coach":"תלמידים עלולים לבחור schools כי זו מילה מוכרת בסוף המקטע."},{"section":"SKELETON","title":"Two nouns — two jobs","markup":"The~d|friendly volunteers~n|teach~v|the~d|new students.~o","prompt":"Who teaches?","choices":["Students","Volunteers","Both groups"],"correct":1,"why":"The subject volunteers performs the action. Students receive the teaching.","gloss":[["teach","מלמדים"]],"logic":null,"coach":"להשוות: מי עושה? למי עושים?"},{"section":"SKELETON","title":"The main verb can be two words","markup":"The~d|new community center~n|has opened~v|a~d|free weekend workshop.~o","prompt":"Which is the complete main verb?","choices":["opened","center","has opened"],"correct":2,"why":"Has opened is one verb phrase. Do not ignore has.","gloss":[["community center","מרכז קהילתי"]],"logic":null,"coach":"הדגישו יחד את has opened באדום."},{"section":"SKELETON","title":"The WHO trap","markup":"The~d|students~n|who live near the library~p|use~v|the~d|computers.~o","prompt":"Which verb belongs to the main sentence?","choices":["use","live","near"],"correct":0,"why":"The basic sentence is The students USE the computers. 'Who live near the library' adds details about the students.","gloss":[["library","ספרייה"]],"logic":null,"coach":"אפשר לשאול: מה יישאר אם נמחק לרגע את who...libary?"},{"section":"SKELETON","title":"THAT can change its job","markup":"The~d|app~n|that many students use~p|is~v|free.~x","prompt":"What is the head noun of the main subject?","choices":["students","app","free"],"correct":1,"why":"The app is free. 'That many students use' describes the app. THAT is not a noun starter here.","gloss":[["app","יישומון"]],"logic":null,"coach":"להסביר בקצרה: that אינו תמיד מילת עוגן. לעיתים הוא פותח פסוקית תיאור."},{"section":"SKELETON","title":"Look for the skeleton","markup":"The~d|long carefully planned school~a|activity~n|attracted~v|many~d|visitors.~o","prompt":"Which short sentence keeps the main meaning?","choices":["School planned visitors.","Visitors attracted activity.","The activity attracted visitors."],"correct":2,"why":"Keep the core: The ACTIVITY ATTRACTED visitors. The other words add details.","gloss":[["activity","פעילות"],["attracted","משכה"]],"logic":null,"coach":"החץ חוזר שמאלה בין התיאורים אחרי ש-activity נחשפת."},{"section":"LOGIC","title":"Connectors: the secret map","markup":"","prompt":"Do you need to understand every word to see a reason, a result or a contrast?","choices":null,"correct":null,"why":"Connectors are road signs: BECAUSE → why; SO → result; BUT / ALTHOUGH → contrast; IF → condition.","gloss":[],"logic":null,"coach":"כאן מתחיל שלב ב: התלמיד מזהה מבנה לוגי לפני תרגום."},{"section":"LOGIC","title":"BECAUSE = reason","markup":"Because~c|the bus~q|was late,~u|we~n|missed~v|the first lesson.~o","prompt":"Which part tells us WHY we missed the lesson?","choices":["We missed the lesson.","Because the bus was late.","The first lesson."],"correct":1,"why":"The BECAUSE part gives the reason. The second part tells us what happened.","gloss":[],"logic":["reason","The bus was late","We missed the lesson"],"coach":"חץ מהסיבה אל התוצאה. אל תחשוף 'Because' בעברית לפני ניסיון."},{"section":"LOGIC","title":"SO = result","markup":"The bus~n|was late,~u|so~c|we~q|missed~v|the first lesson.~o","prompt":"What happened AS A RESULT?","choices":["The bus was late.","We were early.","We missed the lesson."],"correct":2,"why":"SO points toward the result: we missed the lesson.","gloss":[],"logic":["result","The bus was late","We missed the lesson"],"coach":"להדגיש שאפשר לספר אותו אירוע עם Because או So, אבל יש הבדל בכיוון."},{"section":"LOGIC","title":"BUT = contrast","markup":"It~q|rained,~u|but~c|the students~n|continued~v|the game.~o","prompt":"What is surprising?","choices":["The students continued the game.","It started to rain.","The game was canceled."],"correct":0,"why":"BUT signals a contrast between bad weather and the students continuing.","gloss":[],"logic":["contrast","It rained","The students continued"],"coach":"לא לתרגם כל מילה; מצאו שתי עובדות שאינן מתיישבות עם הציפייה."},{"section":"LOGIC","title":"ALTHOUGH = against expectation","markup":"Although~c|the task~q|was difficult,~u|Maya~n|finished~v|it.~o","prompt":"Which is the main result?","choices":["The task was easy.","Maya finished it.","Maya did not try."],"correct":1,"why":"ALTHOUGH introduces a difficulty. The main clause tells what actually happened.","gloss":[["although","למרות ש..."]],"logic":["contrast","The task was difficult","Maya finished it"],"coach":"אפשר להנפיש קו ציפייה שנשבר: קשה ⟷ בכל זאת סיימה."},{"section":"LOGIC","title":"HOWEVER = new sentence, opposite idea","markup":"The center~n|was closed.~u|However,~c|online lessons~q|continued.~v","prompt":"What does HOWEVER signal?","choices":["A time","A reason","A contrast"],"correct":2,"why":"However introduces contrasting information, often in a new sentence.","gloss":[["however","אולם / עם זאת"]],"logic":["contrast","The center was closed","Online lessons continued"],"coach":"להקפיד על נקודה לפני However, ולהראות שהוא יכול לפתוח משפט נוסף."},{"section":"LOGIC","title":"IF = condition","markup":"If~c|the weather~q|improves,~u|we~n|will visit~v|the park.~o","prompt":"Under what condition will we visit the park?","choices":["If the weather improves","If the park closes","If the bus is late"],"correct":0,"why":"IF introduces the condition. The other part tells what will happen then.","gloss":[],"logic":["condition","The weather improves","We will visit the park"],"coach":"להסביר ש-If הוא רמז לשאלה Under what condition?"},{"section":"LOGIC","title":"UNLESS = if not","markup":"Unless~c|you~q|register today,~u|you~n|cannot join~v|the trip.~o","prompt":"What must you do to join?","choices":["Come late.","Register today.","Pay for lunch."],"correct":1,"why":"UNLESS means IF NOT. If you do not register, you cannot join.","gloss":[["register","להירשם"],["unless","אלא אם כן"]],"logic":["condition","You register","You can join"],"coach":"כאן לראשונה מסבירים גם שלילה לוגית: Unless אינו בדיוק If."},{"section":"LOGIC","title":"WHEN = time","markup":"When~c|the lesson~q|ended,~u|the students~n|left~v|the room.~o","prompt":"When did the students leave?","choices":["Before school.","After lunch.","When the lesson ended."],"correct":2,"why":"WHEN gives the time of the action.","gloss":[],"logic":["time","The lesson ended","The students left"],"coach":"השאלה When מחפשת מידע של זמן ולא תמיד תאריך או שעה."},{"section":"LOGIC","title":"BEFORE and AFTER","markup":"Before~c|the visitors~q|entered,~u|the guide~n|checked~v|their tickets.~o","prompt":"Which action happened first?","choices":["The guide checked the tickets.","The visitors entered.","The guide went home."],"correct":0,"why":"BEFORE tells the order of two actions. Ticket checking happened first.","gloss":[["guide","מדריך"]],"logic":["sequence","The guide checked tickets","The visitors entered"],"coach":"להציג ציר זמן מונפש עם שני אירועים."},{"section":"LOGIC","title":"BECAUSE at the end","markup":"The students~n|stayed inside~v|because~c|the weather~q|was terrible.~u","prompt":"Why did they stay inside?","choices":["They were tired.","The weather was terrible.","They missed the bus."],"correct":1,"why":"BECAUSE can appear after the main clause. The reason still follows because.","gloss":[],"logic":["reason","The weather was terrible","The students stayed inside"],"coach":"חשוב לא ללמד כאילו Because תמיד בתחילת משפט."},{"section":"LOGIC","title":"FOR EXAMPLE = evidence","markup":"Several~d|activities~n|are free,~v|for example,~c|drawing and music classes.~o","prompt":"What does FOR EXAMPLE introduce?","choices":["A problem","A condition","Examples of activities"],"correct":2,"why":"The signal shows examples, not the main idea itself.","gloss":[],"logic":["example","Several activities are free","Drawing and music classes"],"coach":"בשאלון C שאלות על examples נוטות לבקש פרטים ולא את הרעיון המרכזי."},{"section":"MIX","title":"Two tools in one sentence","markup":"Because~c|the~d|new local~a|workshop~q|was popular,~u|the~d|school~n|opened~v|another class.~o","prompt":"Why did the school open another class?","choices":["The workshop was popular.","The school was closed.","The class was very small."],"correct":0,"why":"Find BECAUSE first for the reason. Then find the head noun WORKSHOP after the descriptions.","gloss":[["workshop","סדנה"]],"logic":["reason","The workshop was popular","The school opened another class"],"coach":"להנפיש בשתי פעימות: קודם צירוף שמני, אחר כך יחסי סיבה-תוצאה."},{"section":"MIX","title":"Noun + ALTHOUGH","markup":"Although~c|the~d|small community~a|center~q|was crowded,~u|the~d|volunteers~n|continued helping~v|visitors.~o","prompt":"What happened despite the problem?","choices":["The center closed.","The volunteers continued helping.","Nobody arrived."],"correct":1,"why":"Although = a difficulty that did not stop the action. The main verb is continued helping.","gloss":[["crowded","צפוף"]],"logic":["contrast","The center was crowded","Volunteers continued helping"],"coach":"תנו לתלמיד לסמן קודם את Although, אחר כך את center ואת volunteers."},{"section":"MIX","title":"The OF trap + SO","markup":"The~d|price~n|of the popular summer course~p|was reduced,~v|so~c|more students~q|joined.~u","prompt":"Why did more students join?","choices":["The course was longer.","The room was larger.","The price was reduced."],"correct":2,"why":"The head noun is PRICE, not course. SO connects the lower price to more students joining.","gloss":[["reduced","הופחת"]],"logic":["result","The price was reduced","More students joined"],"coach":"לזהות price לפני course, ואז להבין את יחסי הגורם והתוצאה."},{"section":"MIX","title":"IF + two noun phrases","markup":"If~c|the~d|new reading~a|program~q|attracts more students,~u|the~d|library~n|will extend~v|its hours.~o","prompt":"What must happen first?","choices":["The program attracts more students.","The library closes.","The students leave."],"correct":0,"why":"IF introduces the condition. The library's future action depends on it.","gloss":[["extend","להאריך"]],"logic":["condition","More students join the program","The library extends its hours"],"coach":"מודגמים שמות עצם שונים בשתי הפסוקיות."},{"section":"READING","title":"Module C: The Repair Workshop","markup":"","prompt":"Read the short passage. You will answer without translating every word.","choices":null,"correct":null,"why":"Read the passage, then use head nouns, main verbs and connectors to locate evidence.","gloss":[],"logic":null,"coach":"קטע מקורי בסגנון C. הפסקאות זמינות בכל שקף בשאלות הבאות."},{"section":"READING","title":"Question 1 — WHAT?","markup":"A~d|small town library~n|opened~v|a~d|weekend repair workshop~o|for teenagers.~p","prompt":"What did the library open?","choices":["A new computer store","A weekend repair workshop","A large sports center"],"correct":1,"why":"Find the verb OPENED. Ask: opened WHAT? The object is a weekend repair workshop.","gloss":[["repair","לתקן"],["workshop","סדנה"]],"logic":null,"coach":"מילת השאלה WHAT → הפועל opened → צירוף המושא."},{"section":"READING","title":"Question 2 — WHY?","markup":"Because~c|the first lessons~q|were popular,~u|the library~n|added~v|another group.~o","prompt":"Why did the library add another group?","choices":["The lessons were too long.","The volunteers were absent.","The first lessons were popular."],"correct":2,"why":"BECAUSE marks the reason. The answer is in the reason clause, not in the action clause.","gloss":[],"logic":["reason","The first lessons were popular","The library added another group"],"coach":"נדרש לזהות סיבה ולא רק להעתיק את שם הפעולה."},{"section":"READING","title":"Question 3 — RESULT","markup":"However,~c|the volunteers~n|explained~v|each step slowly.~o|As a result,~c|most students~q|completed their first project.~u","prompt":"What happened after the volunteers explained the steps?","choices":["Most students completed a project.","Students stopped coming.","The library closed."],"correct":0,"why":"AS A RESULT leads to the outcome. Most students completed their first project.","gloss":[],"logic":["result","Volunteers explained each step","Students completed a project"],"coach":"שני משפטים באותה פסקה. לחבר ביניהם לפי As a result."},{"section":"READING","title":"Question 4 — CONDITION","markup":"If~c|more people~q|join,~u|the library~n|will organize~v|classes in a larger room.~o","prompt":"When will the library open classes in a larger room?","choices":["Every Saturday.","If more people join.","When the weather improves."],"correct":1,"why":"The condition appears immediately after IF.","gloss":[["organize","לארגן"]],"logic":["condition","More people join","Classes move to a larger room"],"coach":"לשאול Under what condition? גם כאשר השאלה מנוסחת When?"},{"section":"READING","title":"Question 5 — MAIN IDEA","markup":"The~d|repair workshop~n|helps~v|young people save money and create less waste.~o","prompt":"What is the main idea of the passage?","choices":["Libraries should sell tools.","Online games are useful.","A library project helps students repair things and reduce waste."],"correct":2,"why":"The whole text is about a useful repair workshop: repair instead of throw away, save money and reduce waste.","gloss":[["waste","פסולת"]],"logic":null,"coach":"שאלה גלובלית – לא מספיק מילה אחת. יש לחזור לשתי הפסקאות האחרונות."},{"section":"FINISH","title":"Final Mission — no hints","markup":"Although~c|the~d|new community~a|program~q|was difficult to organize,~u|the staff~n|continued~v|because~c|many families~q|needed help.~u","prompt":"Why did the staff continue?","choices":["Many families needed help.","The program was easy.","The staff wanted a holiday."],"correct":0,"why":"Find the two connectors. ALTHOUGH = the difficulty. BECAUSE = the real reason. The head noun inside 'the new community program' is PROGRAM.","gloss":[["staff","צוות"],["program","תוכנית"]],"logic":["reason","Many families needed help","The staff continued"],"coach":"סיכום טכניקות: שם עצם, פועל, מילות קישור, הבחנה בין קושי לסיבה."},{"section":"FINISH","title":"You are a Sentence Detective!","markup":"","prompt":"Find the anchor → Find the head noun → Find the main verb → Follow the connector → Answer the question.","choices":null,"correct":null,"why":"You can understand a difficult-looking sentence without translating every word first.","gloss":[],"logic":null,"coach":"התלמידים מסיימים במיומנות שניתנת ליישום בשאלון C."}];
const passage=["Last year, a small town library opened a weekend repair workshop for teenagers. Local volunteers taught students how to repair simple objects instead of buying new ones. Because the first lessons were popular, the library added another group.","At first, several students were worried because they had no experience. However, the volunteers explained each step slowly. As a result, most students completed their first project and felt more confident.","Today, the workshop is free, but students must register online. If more people join, the library will organize classes in a larger room next month. The manager hopes the project will help people save money and create less waste."];
const $=id=>document.getElementById(id);
const stageHints={
NOUN:["Find an anchor: THE, A, SEVERAL...","Move right to the head noun. Read the descriptions backwards.","Find the main verb; separate extra information.","Now check the meaning — only after finding the structure."],
SKELETON:["Look for the starting noun phrase.","Find its head noun: who or what?","Find the MAIN verb; ignore extra details for a moment.","Read the short skeleton. Check unfamiliar words last."],
LOGIC:["Look for the linking word — it is your road sign.","Separate the two parts of the message.","Follow the logic: reason, result, contrast, time or condition.","Use the connector to answer the question."],
MIX:["Find the connector and the start of each noun phrase.","Find the head noun after its descriptions.","Find the verb and connect the two ideas logically.","Now answer the question, not just translate the words."],
READING:["Find the key word in the QUESTION.","Locate its matching sentence in the passage.","Mark the noun, verb and connector to find evidence.","Only now check meaning, and answer in simple English."],
FINISH:["Locate the anchor or connector.","Find the head nouns and their descriptions.","Find the main verb and the logical relationship.","Explain your answer without translating every word."]
};
const state={index:0,stage:0,selected:{},teacher:false};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function tokens(str){if(!str)return "";const chunks=[];str.split("|").forEach(entry=>{const p=entry.lastIndexOf("~"),word=p<0?entry:entry.slice(0,p),role=p<0?"x":entry.slice(p+1);if(role==="a"){word.split(/ +/).forEach(w=>chunks.push({word:w,role}));}else{chunks.push({word,role});}});return chunks.map((item,i)=>{const near=chunks.findIndex((x,j)=>j>i&&["n","q","o"].includes(x.role));const delay=item.role==="a"&&near>=0?Math.min((near-i)*170,1300):Math.min(i*65,900);return '<span class="w '+esc(item.role)+'" style="--delay:'+delay+'ms">'+esc(item.word)+'</span>';}).join("");}
function getStageHint(slide){return (stageHints[slide.section]||stageHints.NOUN)[Math.max(0,Math.min(3,state.stage-1))];}
function diagram(info){if(!info||state.stage<3)return "";const t=info[0],label={reason:["REASON","WHAT HAPPENED"],result:["CAUSE","RESULT"],contrast:["ONE FACT","SURPRISING FACT"],condition:["IF / CONDITION","THEN / ACTION"],time:["TIME CLUE","MAIN EVENT"],sequence:["FIRST","NEXT"],example:["GENERAL IDEA","EXAMPLE"]}[t]||["PART 1","PART 2"];const symbol=t==="contrast"?"⇄":"➜";return '<div class="diagram '+t+'"><div class="cell"><strong>'+label[0]+'</strong>'+esc(info[1])+'</div><div class="arrow">'+symbol+'</div><div class="cell"><strong>'+label[1]+'</strong>'+esc(info[2])+'</div></div>';}
function legend(){return '<div class="legend"><span class="legendItem"><i class="dot" style="background:var(--d)"></i>Anchor</span><span class="legendItem"><i class="dot" style="background:var(--a)"></i>Descriptions</span><span class="legendItem"><i class="dot" style="background:var(--n)"></i>Head noun</span><span class="legendItem"><i class="dot" style="background:var(--v)"></i>Main verb</span><span class="legendItem"><i class="dot" style="background:var(--c)"></i>Connector</span></div>';}
function intro(s){return '<div class="page cover"><div class="kicker">'+esc(s.section==="START"?"MODULE C · 4 UNITS":s.section==="FINISH"?"MISSION ACCOMPLISHED":"THE NEXT SUPERPOWER")+'</div><h1>'+esc(s.title)+'</h1><div class="hero">'+(s.section==="START"?'<span class="punch">Find the noun.</span> Find the verb.<br><span class="punch">Follow the connector.</span>':s.section==="FINISH"?'<span class="punch">You found the structure.</span><br>Now you can find the answer.':'<span class="punch">BECAUSE</span> → WHY &nbsp; · &nbsp; <span class="punch">SO</span> → RESULT<br><span class="punch">BUT</span> → CONTRAST &nbsp; · &nbsp; <span class="punch">IF</span> → CONDITION')+'</div><div class="subtitle">'+esc(s.prompt||"")+'</div>'+legend()+(state.stage>=4?'<div class="details">'+esc(s.why)+'</div>':'')+'<div class="teacher '+(state.teacher?'on':'')+' heb">'+esc(s.coach)+'</div></div>';}
function questionHtml(s){if(!s.choices)return "";const value=state.selected[state.index];let fb="";if(value!==undefined){fb=value===s.correct?'<div class="feedback good" role="status">✓ Correct! Explain HOW you found it — before revealing the colors.</div>':'<div class="feedback bad" role="status">Not yet. Look at the structure and try a different answer.</div>';}return '<div class="choices" role="group" aria-label="Answer choices">'+s.choices.map((v,i)=>'<button type="button" class="choice '+(value===i?(i===s.correct?'correct':'wrong'):'')+'" data-choice="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b>'+esc(v)+'</button>').join("")+'</div>'+fb;}
function meaningHtml(s){if(state.stage<4)return "";let gloss=(s.gloss||[]).map(x=>'<span><b>'+esc(x[0])+'</b> = '+esc(x[1])+'</span>').join(' &nbsp; · &nbsp; ');return '<div class="details"><div class="meaning">'+esc(s.why||"")+'</div>'+(gloss?'<div class="gloss heb" lang="he" dir="rtl">'+gloss+'</div>':'')+'</div>';}
function render(opts={}){const savedScroll=$("main").scrollTop;const s=slides[state.index],isCover=!s.markup;const page=$("page");$("pill").textContent=s.section==="NOUN"?"01 · HEAD NOUN":s.section==="SKELETON"?"02 · SENTENCE SKELETON":s.section==="LOGIC"?"03 · CONNECTOR LOGIC":s.section==="MIX"?"04 · TWO STRATEGIES":s.section==="READING"?"05 · MODULE C PRACTICE":s.section==="FINISH"?"06 · FINAL MISSION":"SENTENCE DETECTIVE";$("counter").textContent=(state.index+1)+" / "+slides.length;$("progress").style.width=((state.index+1)/slides.length*100)+"%";page.className="page stage"+state.stage;
if(isCover){page.outerHTML=intro(s).replace('class="page cover"','id="page" class="page cover stage'+state.stage+'"');}
else{page.innerHTML='<div class="kicker">'+esc(s.section==="READING"?"MODULE C · READING CHALLENGE":s.section==="MIX"?"USE BOTH TOOLS":s.section==="FINISH"?"YOUR FINAL MISSION":"SENTENCE DETECTIVE · PRACTICE")+'</div><h1>'+esc(s.title)+'</h1><div class="sentenceCard"><div class="scanCue"></div><div class="sentence stage'+state.stage+'" lang="en" dir="ltr">'+tokens(s.markup)+'</div><div class="nounCue"><span class="backArrow">←</span> Find the head noun first. Then read back through the descriptions.</div></div><div class="prompt">'+esc(s.prompt)+'</div>'+questionHtml(s)+(state.stage>0?'<div class="hintCard"><span class="hintNumber">'+state.stage+'</span><div class="heb" lang="he" dir="rtl">'+esc(getStageHint(s))+'</div></div>':'')+diagram(s.logic)+meaningHtml(s)+'<div class="teacher '+(state.teacher?'on':'')+' heb">'+esc(s.coach)+'</div>';page.querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click",()=>{state.selected[state.index]=Number(b.dataset.choice);render({preserveScroll:true,focusFeedback:true});}));}
$("prev").disabled=state.index===0;$("next").disabled=state.index===slides.length-1;$("reset").disabled=state.stage===0&&state.selected[state.index]===undefined;$("reveal").textContent=isCover?(state.index===slides.length-1?"Restart the lesson ↺":"Start this section →"):state.stage===4?(state.index===slides.length-1?"Review the first slide ↺":"Next slide →"):(state.stage===0?"Show clue →":"Next clue →");$("reading").hidden=s.section!=="READING";$("main").scrollTop=opts.preserveScroll?savedScroll:0;if(opts.focusFeedback)requestAnimationFrame(()=>{$("page").querySelector(".feedback")?.scrollIntoView({block:"nearest",behavior:"smooth"});});}
function go(delta){let x=state.index+delta;if(x<0||x>=slides.length)return;state.index=x;state.stage=0;render();}
function clue(){if(!slides[state.index].markup){if(state.index===slides.length-1){state.index=0;state.stage=0;render();}else{go(1);}return;}if(state.stage<4){state.stage++;render({preserveScroll:true});}else if(state.index===slides.length-1){state.index=0;state.stage=0;render();}else{go(1);}}
$("prev").addEventListener("click",()=>go(-1));$("next").addEventListener("click",()=>go(1));$("reveal").addEventListener("click",clue);$("reset").addEventListener("click",()=>{state.stage=0;delete state.selected[state.index];render();});$("teacherToggle").addEventListener("click",()=>{state.teacher=!state.teacher;render({preserveScroll:true});});$("full").addEventListener("click",()=>{if(document.fullscreenElement){document.exitFullscreen();}else{document.documentElement.requestFullscreen?.();}});$("reading").addEventListener("click",()=>{$("readerText").innerHTML=passage.map(x=>'<p>'+esc(x)+'</p>').join("");$("reader").showModal();});$("closeReader").addEventListener("click",()=>$("reader").close());
document.addEventListener("keydown",e=>{if($("reader").open)return;if(["ArrowRight","PageDown"].includes(e.key)){e.preventDefault();go(1);}else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(-1);}else if(e.key===" "&&!(e.target instanceof HTMLButtonElement)){e.preventDefault();clue();}else if(e.key.toLowerCase()==="r"){state.stage=0;delete state.selected[state.index];render();}else if(e.key.toLowerCase()==="t"){state.teacher=!state.teacher;render({preserveScroll:true});}});
render();
