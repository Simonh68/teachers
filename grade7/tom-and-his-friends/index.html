const synth=window.speechSynthesis;
let idx=-1,delay,words=[],parts=[],part=0,current=null,paused=false;
const voices=document.querySelector('#voices');
const message=document.querySelector('#message');
function voiceList(){
 if(!synth)return [];
 return synth.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)).sort((a,b)=>score(b)-score(a));
}
function score(v){return 20*/natural|neural|premium|enhanced/i.test(v.name)+8*/google|samantha|aria|jenny|guy/i.test(v.name)+2*Number(!v.localService)+Number(v.lang==='en-US')}
function refresh(){
 const old=voices.value;voices.replaceChildren(new Option('English voice',''));
 for(const v of voiceList())voices.add(new Option(v.name,v.voiceURI));
 if([...voices.options].some(o=>o.value===old))voices.value=old;
}
refresh();synth?.addEventListener('voiceschanged',refresh);
function paint(first,last){words.forEach((w,i)=>w.classList.toggle('hot',i>=first&&i<=last))}
function cancel(){current=null;clearTimeout(delay);synth?.cancel();paint(-1,-1);play.textContent='▶'}
function read(){
 if(!synth){message.textContent='הקראה קולית אינה זמינה בדפדפן הזה.';return}
 paused=false;message.textContent='';
 const p=parts[part],u=new SpeechSynthesisUtterance(p.text);
 current=u;const list=voiceList();u.voice=list.find(v=>v.voiceURI===voices.value)||list[0]||null;
 u.lang=u.voice?.lang||'en-US';u.rate=Number(rate.value);
 u.pitch=p.text.includes('?')?1.07:1;
 u.onstart=()=>{if(current===u){play.textContent='Ⅱ';paint(p.first,p.last)}};
 u.onboundary=e=>{if(current!==u||e.name!=='word')return;const n=p.text.slice(0,e.charIndex).trim().split(/\s+/).filter(Boolean).length;paint(p.first+n,p.first+n)};
 u.onend=()=>{if(current!==u)return;current=null;paint(-1,-1);if(++part<parts.length){delay=setTimeout(read,150)}else{part=0;play.textContent='▶'}};
 u.onerror=()=>{if(current!==u)return;current=null;paint(-1,-1);play.textContent='▶';message.textContent='בחרו קול אנגלי אחר ולחצו שוב על הפעלה.'};
 synth.speak(u);
}
function show(j){
 if(j<0||j>=slides.length)return;cancel();idx=j;part=0;paused=false;message.textContent='';
 cover.hidden=true;page.hidden=false;document.querySelector('footer').hidden=false;
 const [s,h,k]=slides[j];draw(k);en.replaceChildren();parts=[];let first=0;
 const tokens=s.split(' ');words=tokens.map((w,i)=>{
 const b=document.createElement('span');b.textContent=w;if(i)en.append(' ');en.append(b);
 if(w.endsWith(',')||i===tokens.length-1){parts.push({first,last:i,text:tokens.slice(first,i+1).join(' ')});first=i+1}return b});
 he.textContent=h;num.textContent=(j+1)+' / '+slides.length;prev.disabled=!j;next.disabled=j===slides.length-1;delay=setTimeout(read,4000);
}
start.onclick=()=>show(0);prev.onclick=()=>show(idx-1);next.onclick=()=>show(idx+1);
play.onclick=()=>{clearTimeout(delay);if(current&&!paused){synth.pause();paused=true;play.textContent='▶'}else if(current&&paused){synth.resume();paused=false;play.textContent='Ⅱ'}else read()};
rate.onchange=voices.onchange=()=>{if(idx>=0){cancel();part=0;read()}};
document.onkeydown=e=>{if(idx<0||e.target.tagName==='SELECT')return;if(['ArrowDown','ArrowRight','PageDown','ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx+(['ArrowDown','ArrowRight','PageDown'].includes(e.key)?1:-1))}};
let sy,sx;document.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;sx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(idx>=0&&Math.abs(d)>40&&Math.abs(d)>Math.abs(sx-e.changedTouches[0].clientX))show(idx+Math.sign(d))},{passive:true});
