const voice=new Audio();let idx=-1,delay,frame,last=-1,ends=[],words=[];
function mark(n){if(last===n)return;words[last]?.classList.remove('hot');words[n]?.classList.add('hot');last=n}
function tick(){let j=ends.findIndex(t=>t>voice.currentTime);mark(j);if(!voice.paused)frame=requestAnimationFrame(tick)}
voice.onplay=()=>{play.textContent='Ⅱ';tick()};voice.onpause=()=>{play.textContent='▶';cancelAnimationFrame(frame)};voice.onended=()=>mark(-1);
function read(){voice.playbackRate=Number(rate.value);voice.play().catch(()=>{play.textContent='▶'})}
function show(j){if(j<0||j>=slides.length)return;clearTimeout(delay);voice.pause();mark(-1);idx=j;cover.hidden=true;page.hidden=false;document.querySelector('footer').hidden=false;let [s,h,k]=slides[j];draw(k);en.replaceChildren();words=s.split(' ').map((w,i)=>{let b=document.createElement('span');b.textContent=w;if(i)en.append(' ');en.append(b);return b});he.textContent=h;num.textContent=(j+1)+' / '+slides.length;prev.disabled=!j;next.disabled=j===slides.length-1;ends=recordings[s][0];voice.src='data:audio/mpeg;base64,'+recordings[s][1];voice.load();play.textContent='▶';delay=setTimeout(read,4000)}
start.onclick=()=>{voice.src='data:audio/mpeg;base64,'+recordings[slides[0][0]][1];voice.muted=true;voice.play().then(()=>{voice.pause();voice.muted=false;show(0)}).catch(()=>{voice.muted=false;show(0)})};
prev.onclick=()=>show(idx-1);next.onclick=()=>show(idx+1);play.onclick=()=>{clearTimeout(delay);if(voice.paused)read();else voice.pause()};rate.onchange=()=>voice.playbackRate=Number(rate.value);
document.onkeydown=e=>{if(idx<0||e.target.tagName==='SELECT')return;if(['ArrowDown','ArrowRight','PageDown','ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx+(['ArrowDown','ArrowRight','PageDown'].includes(e.key)?1:-1))}};
let sy,sx;document.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;sx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(idx>=0&&Math.abs(d)>40&&Math.abs(d)>Math.abs(sx-e.changedTouches[0].clientX))show(idx+Math.sign(d))},{passive:true});
