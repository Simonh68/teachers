<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>כיתה ז׳ · Band II · Groups 01–02 · Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Manrope:wght@700;800;900&display=swap');
:root{--bg:#06111e;--text:#f7fbff;--muted:#a9bbca;--cyan:#55e6ff;--lime:#dfff62;--line:#29445e}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Heebo,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 8%,#148cae35,transparent 34%),radial-gradient(circle at 10% 88%,#86d61d18,transparent 28%),linear-gradient(#ffffff04 1px,transparent 1px),linear-gradient(90deg,#ffffff04 1px,transparent 1px);background-size:auto,auto,50px 50px,50px 50px}.stage{position:relative;width:100vw;height:100vh}.slide{position:absolute;inset:0;display:none;place-items:center;padding:70px 8vw 88px}.slide.active{display:grid}.frame{width:min(1180px,100%);height:min(680px,78vh);display:flex;flex-direction:column;justify-content:center;position:relative}.eyebrow{font:900 13px Manrope,Arial,sans-serif;letter-spacing:.15em;color:var(--cyan);margin:0 0 18px;text-transform:uppercase;direction:ltr;text-align:left}.title{font:900 clamp(54px,8vw,102px)/.92 Manrope,Arial,sans-serif;letter-spacing:-3px;margin:0;direction:ltr;text-align:left}.sub{font-size:clamp(24px,3vw,38px);color:var(--muted);font-weight:800;margin:20px 0 0;direction:ltr;text-align:left}.word{font:900 clamp(68px,11vw,132px)/.9 Manrope,Arial,sans-serif;margin:0;direction:ltr;text-align:left}.pos{font:900 16px Manrope,Arial,sans-serif;color:var(--cyan);letter-spacing:.1em;margin-bottom:18px;direction:ltr;text-align:left}.meaning{font-size:clamp(34px,4vw,52px);font-weight:900;color:var(--lime);margin-top:30px}.example{font-size:clamp(30px,4vw,54px);font-weight:800;line-height:1.28;margin:0;direction:ltr;text-align:left}.translation{font-size:clamp(24px,3vw,40px);font-weight:800;color:var(--lime);margin-top:30px}.note{font-size:18px;color:var(--muted);margin-top:22px}.nav{position:fixed;z-index:20;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#071726e8;border:1px solid #ffffff20;border-radius:18px;padding:8px 11px;backdrop-filter:blur(12px)}.nav button{width:50px;height:42px;border:0;border-radius:12px;background:#ffffff0b;color:#fff;font-size:23px;cursor:pointer}.counter{min-width:84px;text-align:center;color:var(--muted);font:800 13px Manrope,Arial,sans-serif;direction:ltr}.progress{position:fixed;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--cyan),var(--lime));z-index:25}.badge{display:inline-flex;width:max-content;padding:8px 14px;border-radius:999px;border:1px solid #55e6ff55;color:var(--cyan);font-weight:900;margin-bottom:18px}.same{min-height:250px;display:flex;flex-direction:column;justify-content:center}.hint{position:fixed;top:18px;left:50%;transform:translateX(-50%);font-size:12px;color:#91a6bb;background:#071726cc;border:1px solid #ffffff18;padding:7px 12px;border-radius:999px;z-index:20}
</style>
</head>
<body>
<div class="hint">Swipe ← / ↑ next · Swipe → / ↓ previous</div>
<main id="stage" class="stage"></main>
<div class="nav"><button id="prev">←</button><span id="counter" class="counter"></span><button id="next">→</button></div><div id="progress" class="progress"></div>
<script>
const slides=[
{t:'cover',html:`<p class="eyebrow">GRADE 7 · BAND II · CORE I</p><h1 class="title">Groups 01–02</h1><p class="sub">Vocabulary · examples · reveal · translation</p><p class="note">Experimental opening sequence</p>`},
{t:'intro',html:`<span class="badge">העיקרון</span><h1 class="title" style="font-size:clamp(44px,6vw,78px)">See it → Hear it → Use it</h1><p class="sub">Word first. Meaning second. Example third. Translation only on the next slide.</p>`},
{t:'word',html:`<p class="eyebrow">GROUP 01 · WORD</p><div class="same"><p class="pos">VERB</p><h1 class="word">lift</h1></div>`},
{t:'wordReveal',html:`<p class="eyebrow">GROUP 01 · REVEAL</p><div class="same"><p class="pos">VERB</p><h1 class="word">lift</h1></div><p class="meaning">להרים</p>`},
{t:'example',html:`<p class="eyebrow">GROUP 01 · EXAMPLE</p><div class="same"><p class="example">Help me lift this chair.</p></div>`},
{t:'exampleReveal',html:`<p class="eyebrow">GROUP 01 · EXAMPLE</p><div class="same"><p class="example">Help me lift this chair.</p></div><p class="translation">עזור לי להרים את הכיסא הזה.</p>`},
{t:'word',html:`<p class="eyebrow">GROUP 01 · WORD</p><div class="same"><p class="pos">VERB</p><h1 class="word">remove</h1></div>`},
{t:'wordReveal',html:`<p class="eyebrow">GROUP 01 · REVEAL</p><div class="same"><p class="pos">VERB</p><h1 class="word">remove</h1></div><p class="meaning">להסיר; להוציא</p>`},
{t:'example',html:`<p class="eyebrow">GROUP 01 · EXAMPLE</p><div class="same"><p class="example">Could you please remove your glasses?</p></div>`},
{t:'exampleReveal',html:`<p class="eyebrow">GROUP 01 · EXAMPLE</p><div class="same"><p class="example">Could you please remove your glasses?</p></div><p class="translation">אתה יכול להסיר את המשקפיים בבקשה?</p>`},
{t:'word',html:`<p class="eyebrow">GROUP 02 · WORD</p><div class="same"><p class="pos">VERB</p><h1 class="word">achieve</h1></div>`},
{t:'wordReveal',html:`<p class="eyebrow">GROUP 02 · REVEAL</p><div class="same"><p class="pos">VERB</p><h1 class="word">achieve</h1></div><p class="meaning">להשיג</p>`},
{t:'example',html:`<p class="eyebrow">GROUP 02 · EXAMPLE</p><div class="same"><p class="example">She worked hard to achieve her goal.</p></div>`},
{t:'exampleReveal',html:`<p class="eyebrow">GROUP 02 · EXAMPLE</p><div class="same"><p class="example">She worked hard to achieve her goal.</p></div><p class="translation">היא עבדה קשה כדי להשיג את מטרתה.</p>`},
{t:'end',html:`<span class="badge">DEMO END</span><h1 class="title" style="font-size:clamp(46px,7vw,84px)">This is the pattern.</h1><p class="sub">If approved, the full deck will use Groups 01–02 with the same reveal logic.</p>`}
];
const stage=document.getElementById('stage');stage.innerHTML=slides.map((s,i)=>`<section class="slide"><div class="frame">${s.html}</div></section>`).join('');
const nodes=[...document.querySelectorAll('.slide')],counter=document.getElementById('counter'),progress=document.getElementById('progress');let i=0;
function show(n){i=Math.max(0,Math.min(nodes.length-1,n));nodes.forEach((x,j)=>x.classList.toggle('active',j===i));counter.textContent=`${i+1} / ${nodes.length}`;progress.style.width=`${((i+1)/nodes.length)*100}%`}
document.getElementById('next').onclick=()=>show(i+1);document.getElementById('prev').onclick=()=>show(i-1);window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}});
let sx=0,sy=0;const threshold=45;stage.addEventListener('touchstart',e=>{if(!e.touches.length)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<threshold)return;if(Math.abs(dx)>Math.abs(dy)){dx<0?show(i+1):show(i-1)}else{dy<0?show(i+1):show(i-1)}},{passive:true});show(0);
</script>
</body></html>
