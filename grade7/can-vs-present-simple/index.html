<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 7 — CAN & Subject Pronouns · 70 minutes</title><style>*{box-sizing:border-box}body{margin:0;background:#071627;color:#f6faff;font:22px Arial,sans-serif}header,footer{height:70px;background:#102a41;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:12px}button{font:700 18px Arial;color:white;background:#214663;border:1px solid #729bb4;border-radius:12px;padding:12px;cursor:pointer}button:disabled{opacity:.3}main{height:calc(100dvh - 140px);display:flex;flex-direction:column;justify-content:center;gap:25px;padding:clamp(18px,5vw,65px);overflow:auto;touch-action:pan-y}.tag{color:#8ddcff;font-weight:700}.en{direction:ltr;text-align:left;align-self:center;width:fit-content;max-width:100%;font-size:clamp(34px,5.5vw,78px);font-weight:800;line-height:1.38}.answer .en{color:#a9f5c3}.he{font-size:clamp(24px,3.3vw,44px);text-align:center;direction:rtl}.tip{text-align:center;color:#ffe4a0;font-size:clamp(20px,2.4vw,31px)}a{color:#9ee3ff}@media(max-width:650px){button{font-size:15px;padding:9px}.en{font-size:clamp(30px,7vw,47px)}header{font-size:15px}}</style><header><a href="../">⌂ כיתה ז׳</a><button onclick="speak()">🔊 Read aloud</button><span>CAN · 70 MIN</span></header><main id="stage"></main><footer><button id="prev" onclick="step(-1)">→ הקודם</button><span id="count"></span><button id="next" onclick="step(1)">הבא ←</button></footer><script>const slides=[{"kind":"start","en":"CAN YOU DO IT?","he":"כיתה ז׳ · שיעור 70 דקות","tip":"Pronouns · can · can't · questions"},{"kind":"pronoun","en":"I","he":"אני","tip":"Subject pronoun · כינוי גוף כנושא"},{"kind":"pronoun","en":"you","he":"אתה · את · אתם · אתן","tip":"Subject pronoun · כינוי גוף כנושא"},{"kind":"pronoun","en":"he","he":"הוא — בן אדם ממין זכר","tip":"For people (male) · כלל בסיסי לכיתה ז׳"},{"kind":"pronoun","en":"she","he":"היא — בת אדם ממין נקבה","tip":"For people (female) · כלל בסיסי לכיתה ז׳"},{"kind":"pronoun","en":"it","he":"זה / זאת — דברים שאינם בני אדם","tip":"Objects, animals, plants, weather · כלל בסיסי; חיות מחמד עשויות לקבל he/she"},{"kind":"pronoun","en":"we","he":"אנחנו","tip":"Subject pronoun · כינוי גוף כנושא"},{"kind":"pronoun","en":"they","he":"הם · הן","tip":"Subject pronoun · כינוי גוף כנושא"},{"kind":"warmup","en":"Can you swim?","he":"האם אתה יודע לשחות?","tip":"Answer: Yes, I can. / No, I can't."},{"kind":"warmup","en":"Can you read?","he":"האם את יודעת לקרוא?","tip":"Answer: Yes, I can. / No, I can't."},{"kind":"warmup","en":"Can you run?","he":"האם אתם יודעים לרוץ?","tip":"Answer: Yes, I can. / No, I can't."},{"kind":"warmup","en":"Can you sing?","he":"האם אתן יודעות לשיר?","tip":"Answer: Yes, I can. / No, I can't."},{"kind":"rule","en":"I can read.","he":"אני יודע לקרוא.","tip":"CAN + base verb"},{"kind":"rule","en":"She can read.","he":"היא יודעת לקרוא.","tip":"No -s after can!"},{"kind":"rule","en":"They can play.","he":"הם יודעים לשחק.","tip":"CAN does not change."},{"kind":"question","en":"I ___ swim.","he":"אני יודע לשחות.","tip":"Complete the sentence."},{"kind":"answer","en":"I can swim.","he":"אני יודע לשחות.","tip":"CAN + base verb"},{"kind":"question","en":"She can ___.","he":"היא יודעת לרוץ.","tip":"Complete the sentence."},{"kind":"answer","en":"She can run.","he":"היא יודעת לרוץ.","tip":"CAN + base verb"},{"kind":"question","en":"We ___ speak English.","he":"אנחנו יודעים לדבר אנגלית.","tip":"Complete the sentence."},{"kind":"answer","en":"We can speak English.","he":"אנחנו יודעים לדבר אנגלית.","tip":"CAN + base verb"},{"kind":"question","en":"He can ___ a book.","he":"הוא יודע לקרוא ספר.","tip":"Complete the sentence."},{"kind":"answer","en":"He can read a book.","he":"הוא יודע לקרוא ספר.","tip":"CAN + base verb"},{"kind":"question","en":"They ___ play.","he":"הם יודעים לשחק.","tip":"Complete the sentence."},{"kind":"answer","en":"They can play.","he":"הם יודעים לשחק.","tip":"CAN + base verb"},{"kind":"rule","en":"I can't swim.","he":"אני לא יודע לשחות.","tip":"can't = cannot"},{"kind":"rule","en":"She can't fly.","he":"היא לא יודעת לעוף.","tip":"can't + base verb"},{"kind":"question","en":"I ___ sing.","he":"אני לא יודע לשיר.","tip":"Choose can or can't."},{"kind":"answer","en":"I can't sing.","he":"אני לא יודע לשיר.","tip":"Negative ability: can't."},{"kind":"question","en":"He ___ drive.","he":"הוא לא יודע לנהוג.","tip":"Choose can or can't."},{"kind":"answer","en":"He can't drive.","he":"הוא לא יודע לנהוג.","tip":"Negative ability: can't."},{"kind":"question","en":"They ___ fly.","he":"הם לא יודעים לעוף.","tip":"Choose can or can't."},{"kind":"answer","en":"They can't fly.","he":"הם לא יודעים לעוף.","tip":"Negative ability: can't."},{"kind":"rule","en":"Can you swim?","he":"האם אתה / את יודע/ת לשחות?","tip":"Can + subject + base verb?"},{"kind":"rule","en":"Yes, I can. · No, I can't.","he":"כן, אני יודע · לא, איני יודע.","tip":"Short answers"},{"kind":"rule","en":"Can she sing?","he":"האם היא יודעת לשיר?","tip":"Yes, she can. / No, she can't."},{"kind":"question","en":"___ he read?","he":"האם הוא יודע לקרוא?","tip":"Answer aloud."},{"kind":"answer","en":"Can he read?","he":"האם הוא יודע לקרוא?","tip":"Check the subject and base verb."},{"kind":"question","en":"Can they ___?","he":"האם הם יודעים לרוץ?","tip":"Answer aloud."},{"kind":"answer","en":"Can they run?","he":"האם הם יודעים לרוץ?","tip":"Check the subject and base verb."},{"kind":"question","en":"Can you swim?","he":"ענו בשלילה.","tip":"Answer aloud."},{"kind":"answer","en":"No, I can't.","he":"ענו בשלילה.","tip":"Check the subject and base verb."},{"kind":"question","en":"Can she write?","he":"ענו בחיוב.","tip":"Answer aloud."},{"kind":"answer","en":"Yes, she can.","he":"ענו בחיוב.","tip":"Check the subject and base verb."},{"kind":"activity","en":"Ask your partner: Can you ...?","he":"שאלו חבר או חברה שלוש שאלות.","tip":"Use swim, read, write, run, sing."},{"kind":"activity","en":"My friend can ...","he":"ספרו על חבר או חברה.","tip":"Say one sentence with can and one with can't."},{"kind":"question","en":"She cans swim.","he":"מצאו ותקנו את הטעות.","tip":"Find the mistake."},{"kind":"answer","en":"She can swim.","he":"זה המשפט הנכון.","tip":"CAN + base verb."},{"kind":"question","en":"Can he runs?","he":"מצאו ותקנו את הטעות.","tip":"Find the mistake."},{"kind":"answer","en":"Can he run?","he":"זה המשפט הנכון.","tip":"CAN + base verb."},{"kind":"question","en":"I can to read.","he":"מצאו ותקנו את הטעות.","tip":"Find the mistake."},{"kind":"answer","en":"I can read.","he":"זה המשפט הנכון.","tip":"CAN + base verb."},{"kind":"question","en":"He don't can sing.","he":"מצאו ותקנו את הטעות.","tip":"Find the mistake."},{"kind":"answer","en":"He can't sing.","he":"זה המשפט הנכון.","tip":"CAN + base verb."},{"kind":"compare","en":"I can swim. · I swim every Sunday.","he":"אני יודע לשחות · אני שוחה בכל יום ראשון.","tip":"Ability ≠ habit; a preview only."},{"kind":"compare","en":"I can go. · I went yesterday.","he":"אני יכול ללכת · הלכתי אתמול.","tip":"Ability ≠ completed past; a preview only."},{"kind":"exit","en":"I can ... · I can't ... · Can you ...?","he":"כרטיס יציאה: כתבו שלושה משפטים.","tip":"One positive, one negative, one question."},{"kind":"end","en":"I CAN DO IT!","he":"כל הכבוד!","tip":"You can ask and answer about abilities."}];const sourceSlides=slides.slice();slides.length=0;for(const d of sourceSlides){const translated=['warmup','learn','rule','compare'].includes(d.kind)&&/[.!?]/.test(d.en)&&!d.en.includes('___')&&!/^(לא אומרים|שלילת|שאלת)/.test(d.he);if(translated){slides.push({...d,kind:'challenge-translation',showTranslation:false});slides.push({...d,showTranslation:true})}else slides.push(d)}let i=0;let audioTimer=null;function completeEnglishSentence(d){const t=d.en.trim();return !['start','end','pronoun','exit'].includes(d.kind)&&!t.includes('___')&&!t.includes('...')&&!t.includes(' · ')&&/^[A-Z][^\n]*[.?!]$/.test(t)&&t.split(/\s+/).length>=3}function stopAudio(){if(audioTimer!==null){clearTimeout(audioTimer);audioTimer=null}if('speechSynthesis'in window)speechSynthesis.cancel()}function esc(x){return x.replaceAll('&','&amp;').replaceAll('<','&lt;')}function render(){stopAudio();let d=slides[i],e=document.getElementById('stage');e.className=d.kind;e.innerHTML='<div class="tag">'+(d.kind==='challenge-translation'?'נסו לתרגם':d.kind.toUpperCase())+'</div><div class="en">'+esc(d.en)+'</div><div class="he" style="visibility:'+(d.showTranslation===false?'hidden':'visible')+'">'+esc(d.he)+'</div><div class="tip" style="visibility:'+(d.showTranslation===false?'hidden':'visible')+'">'+esc(d.tip)+'</div>';document.getElementById('count').textContent=(i+1)+' / '+slides.length;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1;history.replaceState(null,'','#slide-'+(i+1));if(completeEnglishSentence(d))audioTimer=setTimeout(()=>{audioTimer=null;speak()},4000)}function step(n){i=Math.max(0,Math.min(slides.length-1,i+n));render()}function speak(){if(!('speechSynthesis'in window)||!completeEnglishSentence(slides[i]))return;if(audioTimer!==null){clearTimeout(audioTimer);audioTimer=null}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(slides[i].en);u.lang='en-US';u.rate=.7;speechSynthesis.speak(u)}document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','PageDown'].includes(e.key))step(1);if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key))step(-1)});let y=null;const stage=document.getElementById('stage');stage.addEventListener('touchstart',e=>{y=e.touches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{if(y===null)return;const d=e.changedTouches[0].clientY-y;y=null;if(Math.abs(d)>55)step(d<0?1:-1)},{passive:true});window.addEventListener('pagehide',stopAudio);i=Math.max(0,Math.min(slides.length-1,Number(location.hash.match(/slide-(\d+)/)?.[1]||1)-1));render();</script></html>
