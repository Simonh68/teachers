<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 7 · CAN vs Present Simple · 20 Slides</title><style>*{box-sizing:border-box}body{margin:0;background:#071728;color:#f5faff;font-family:Arial,sans-serif}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:#10283c;border-bottom:1px solid #35546a}button{background:#1b405b;color:white;border:1px solid #5888a4;border-radius:12px;padding:12px 18px;font:700 19px Arial;cursor:pointer}button:disabled{opacity:.35}#stage{height:calc(100dvh - 145px);display:flex;flex-direction:column;justify-content:center;gap:25px;padding:clamp(20px,5vw,65px);overflow:auto}.tag{color:#8ddcff;font-weight:bold;font-size:clamp(17px,2vw,25px)}h1{font-size:clamp(36px,5.4vw,78px);margin:0;line-height:1.25}h2{font-size:clamp(25px,3.5vw,49px);margin:0}.english{direction:ltr;text-align:left;align-self:center;width:fit-content;max-width:100%;font-size:clamp(35px,5.3vw,75px);line-height:1.35;font-weight:800;color:#9ed0ff}.answer .english{color:#a9f5c3}.hebrew{text-align:center;font-size:clamp(23px,3vw,42px)}.detail{font-size:clamp(22px,2.7vw,38px);color:#ffe4a0;line-height:1.5;text-align:center;direction:auto}footer{height:79px;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-top:1px solid #35546a}#counter{font-size:20px;color:#b2c8db}a{color:#9adfff}#stage{touch-action:pan-y}@media(max-width:650px){header{height:64px}button{font-size:17px;padding:10px}#stage{height:calc(100dvh - 138px);gap:23px}.english{font-size:clamp(31px,7vw,48px)}}</style><header><a href="../">⌂ כיתה ז׳</a><button onclick="speak()">🔊 Read aloud</button><span>CAN vs Present Simple</span></header><main id="stage"></main><footer><button id="prev" onclick="move(-1)">→ הקודם</button><span id="counter"></span><button id="next" onclick="move(1)">הבא ←</button></footer><script>const slides=[["title","CAN or PRESENT SIMPLE?","יכולות והרגלים באנגלית","Today we learn to choose the right form."],["read","I can swim.","אני יודע לשחות.","CAN = ability · יכולת"],["read","I swim every Sunday.","אני שוחה בכל יום ראשון.","Present Simple = habit · הרגל"],["compare","I can swim. | I swim every Sunday.","מה ההבדל?","CAN = יכולת · Present Simple = הרגל"],["rule","CAN + base verb","I can play. · She can play.","אחרי can אין s בפועל — גם עם he / she / it"],["rule","PRESENT SIMPLE","I play. · She plays.","במשפט חיובי מוסיפים בדרך כלל s עם he / she / it"],["challenge","She ___ ride a bike.","השלימו: היא יודעת לרכוב על אופניים.","A. can  ·  B. cans  ·  C. rides"],["answer","She can ride a bike.","Correct: can","אחרי can משתמשים בצורת הבסיס ride."],["challenge","He ___ football every Friday.","השלימו: הוא משחק כדורגל בכל יום שישי.","A. play  ·  B. plays  ·  C. can plays"],["answer","He plays football every Friday.","Correct: plays","he + Present Simple → plays"],["rule","CAN'T = CANNOT","I can't fly. · She can't drive.","שלילת יכולת: can't + base verb"],["rule","DON'T / DOESN'T","I don't play tennis. · He doesn't play tennis.","שלילת הרגל: don't / doesn't + base verb"],["challenge","She doesn't ___ coffee.","איזו מילה נכונה?","A. drinks  ·  B. drink  ·  C. can drinks"],["answer","She doesn't drink coffee.","Correct: drink","אחרי doesn't הפועל בצורת בסיס ללא s."],["rule","CAN YOU ...?","Can you swim? — Yes, I can.","שאלת יכולת: Can + subject + base verb?"],["rule","DO / DOES ...?","Does she swim every day? — Yes, she does.","שאלת הרגל: Does + subject + base verb?"],["challenge","___ he speak English?","שאלת יכולת: האם הוא יודע לדבר אנגלית?","A. Does  ·  B. Can  ·  C. Cans"],["answer","Can he speak English?","Correct: Can","השאלה היא על יכולת, לא על הרגל."],["challenge","Choose the sentence about a habit.","איזה משפט מתאר הרגל?","A. She can sing.  ·  B. She sings every day."],["answer","She sings every day.","Correct: B","every day מסמן הרגל; can sing מתאר יכולת."]];let index=0;function render(){const d=slides[index],s=document.getElementById('stage');s.className=d[0]==='answer'?'answer':'';s.innerHTML='<div class="tag">GRADE 7 · '+(d[0]==='challenge'?'YOUR TURN':d[0]==='answer'?'CHECK YOUR ANSWER':d[0]==='rule'?'GRAMMAR RULE':d[0]==='compare'?'COMPARE':'READ & LEARN')+'</div><div class="english">'+escapeHtml(d[1])+'</div><h2 class="hebrew">'+escapeHtml(d[2])+'</h2><div class="detail">'+escapeHtml(d[3])+'</div>';document.getElementById('counter').textContent=(index+1)+' / 20';document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;location.hash='slide-'+(index+1)}function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function move(d){index=Math.max(0,Math.min(slides.length-1,index+d));render()}function speak(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(slides[index][1].replaceAll(' | ','. '));u.lang='en-US';u.rate=.75;speechSynthesis.speak(u)}document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','PageDown'].includes(e.key))move(1);if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key))move(-1)});let touchY=null;document.getElementById('stage').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{if(touchY===null)return;const dy=e.changedTouches[0].clientY-touchY;touchY=null;if(Math.abs(dy)>55)move(dy<0?1:-1)},{passive:true});index=Math.max(0,Math.min(19,Number(location.hash.match(/slide-(\d+)/)?.[1]||1)-1));render();</script></html>
