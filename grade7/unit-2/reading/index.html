<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071526"><title>School Days Around the World | Unit 2</title><link rel="stylesheet" href="reader.css"></head><body>
<header><a href="../../" aria-label="Grade 7 home">⌂</a><a href="../">UNIT 2</a><strong>Read & Listen</strong><button id="menuButton">Texts</button></header>
